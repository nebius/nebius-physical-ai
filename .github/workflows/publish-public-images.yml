# Build immutable PUBLIC development images and promote validated digests to supported
# PUBLIC release tags. Development and release tags share one GHCR package namespace.
# Restricted/build-your-own artifacts never enter this workflow.

name: Publish public images

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Official public GHCR namespace"
        required: false
        default: "ghcr.io/nebius/nebius-physical-ai"
      dry_run:
        description: "Plan/preflight only; do not apply release tags"
        type: boolean
        default: true
      skip_missing:
        description: "Skip absent dev tags; denials and gate failures still block"
        type: boolean
        default: false
      development_sha:
        description: "Full Git SHA for immutable dev-<sha> tags (defaults to dispatched SHA)"
        required: false
        default: ""
      tool:
        description: "Comma/space-separated tools to preflight or promote"
        required: false
        default: ""
      release_tag:
        description: "Optional new immutable release tag; requires exactly one tool and accepted digest"
        required: false
        default: ""
      expected_source_digest:
        description: "Exact public dev digest already accepted on a real GPU; required with release_tag"
        required: false
        default: ""
      build_development_tools:
        description: "Comma/space-separated public tools to build and push as dev-<sha>"
        required: false
        default: ""
      build_runner_label:
        description: "Runner label for public development image builds"
        required: false
        default: "ubuntu-latest"
      lerobot_version:
        description: "Optional supported LeRobot package version for a lerobot development build"
        required: false
        default: ""
      cleanup_development_tools:
        description: "Exact failed/superseded dev tags to delete without promotion"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  # Serialize every public-registry mutation under one canonical lock. Raw
  # caller spelling must not split the lock before target normalization.
  group: public-image-registry-mutation
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.plan.outputs.target }}
      development_sha: ${{ steps.plan.outputs.development_sha }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      cleanup_matrix: ${{ steps.plan.outputs.cleanup_matrix }}
      cleanup_count: ${{ steps.plan.outputs.cleanup_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Keep LIBERO public disclosure quarantined
        env:
          REQUESTED_TOOLS: ${{ inputs.tool }}
          BUILD_TOOLS: ${{ inputs.build_development_tools }}
          CLEANUP_TOOLS: ${{ inputs.cleanup_development_tools }}
        run: |
          set -euo pipefail
          set -f
          contains_libero() {
            local value="${1//,/ }"
            local tool
            for tool in $value; do
              if [ "$tool" = libero ]; then
                return 0
              fi
            done
            return 1
          }
          if contains_libero "$REQUESTED_TOOLS" || \
            contains_libero "$BUILD_TOOLS" || \
            contains_libero "$CLEANUP_TOOLS"; then
            echo "::error::LIBERO public disclosure remains blocked until a separate exact-digest live-B200 authorization is implemented and accepted."
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install NPA validation environment
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/pip install -c npa/requirements-lock.txt -e "npa[dev]"
          npa/.venv/bin/python -c 'import cryptography; assert cryptography.__version__ == "50.0.0"'

      - name: Materialize owner-private LIBERO control-plane trust roots
        if: ${{ inputs.tool == 'libero' || contains(inputs.build_development_tools, 'libero') || contains(inputs.cleanup_development_tools, 'libero') }}
        env:
          NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64: ${{ secrets.NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64 }}
          NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64: ${{ secrets.NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/libero-customer-authorization-public-key.b64"
          printf '%s' "$NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64" > "$key_file"
          test "$(base64 -d "$key_file" | wc -c)" = 32
          chmod 0600 "$key_file"
          echo "NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          storage_key_file="$RUNNER_TEMP/libero-output-storage-authorization-public-key.b64"
          printf '%s' "$NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64" > "$storage_key_file"
          test "$(base64 -d "$storage_key_file" | wc -c)" = 32
          test "$(cat "$key_file")" != "$(cat "$storage_key_file")"
          chmod 0600 "$storage_key_file"
          echo "NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_FILE=$storage_key_file" >> "$GITHUB_ENV"

      - name: Resolve immutable public development plan
        id: plan
        env:
          TARGET: ${{ inputs.target || 'ghcr.io/nebius/nebius-physical-ai' }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha || github.sha }}
          BUILD_TOOLS: ${{ inputs.build_development_tools }}
          CLEANUP_TOOLS: ${{ inputs.cleanup_development_tools }}
          LEROBOT_VERSION: ${{ inputs.lerobot_version }}
        run: |
          NPA_PUBLIC_REGISTRY="$TARGET" npa/.venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml

          from npa.deploy.images import (
              development_image_for_tool,
              development_tag,
              libero_qualified_image_manifest,
              libero_publication_lineage_values,
          )

          target = os.environ["TARGET"].strip().rstrip("/")
          sha = os.environ["DEVELOPMENT_SHA"].strip().lower()
          development_tag(sha)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def tools(name: str) -> list[str]:
              values = [v for v in re.split(r"[\s,]+", os.environ.get(name, "").strip()) if v]
              if len(values) != len(set(values)):
                  raise SystemExit(f"duplicate tool in {name}")
              return values

          contract = yaml.safe_load(Path("npa/docker/workbench/packaging-contract.yaml").read_text())
          entries = contract["images"]
          build_tools = tools("BUILD_TOOLS")
          cleanup_tools = tools("CLEANUP_TOOLS")
          libero_qualification = None
          if "libero" in {*build_tools, *cleanup_tools}:
              if target != "ghcr.io/nebius/nebius-physical-ai":
                  raise SystemExit("libero: publication target must be the official GHCR namespace")
              libero_qualification = libero_qualified_image_manifest()
              key_bytes = base64.b64decode(
                  Path(
                      os.environ["NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_FILE"]
                  ).read_bytes(),
                  validate=True,
              )
              if (
                  len(key_bytes) != 32
                  or hashlib.sha256(key_bytes).hexdigest()
                  != libero_qualification[
                      "customer_authorization_public_key_sha256"
                  ]
              ):
                  raise SystemExit(
                      "libero: customer-authorization trust root differs from qualification"
                  )
              storage_key_bytes = base64.b64decode(
                  Path(
                      os.environ[
                          "NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_FILE"
                      ]
                  ).read_bytes(),
                  validate=True,
              )
              if (
                  len(storage_key_bytes) != 32
                  or hashlib.sha256(storage_key_bytes).hexdigest()
                  != libero_qualification[
                      "output_storage_authorization_public_key_sha256"
                  ]
                  or storage_key_bytes == key_bytes
              ):
                  raise SystemExit(
                      "libero: output-storage trust root differs or is not independent"
                  )
              if libero_qualification["development_sha"] != sha:
                  raise SystemExit(
                      "libero: checked-in qualification development SHA does not match "
                      "the exact development SHA"
                  )
              if subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, head], check=False
              ).returncode:
                  raise SystemExit(
                      "libero: qualified development SHA is not an ancestor of HEAD"
                  )
              qualification_delta = subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "--diff-filter=ACDMRTUXB",
                      f"{sha}..{head}",
                      "--",
                  ],
                  text=True,
              ).splitlines()
              if qualification_delta != ["npa/src/npa/deploy/libero_image_manifest.json"]:
                  raise SystemExit(
                      "libero: only the checked-in qualification manifest may differ "
                      "from the qualified development SHA"
                  )
              try:
                  libero_publication_lineage_values(
                      libero_qualification, Path.cwd(), development_sha=sha
                  )
              except RuntimeError as exc:
                  raise SystemExit(f"libero: {exc}") from exc
          lerobot_version = os.environ.get("LEROBOT_VERSION", "").strip()
          if lerobot_version:
              manifest = json.loads(Path("npa/src/npa/deploy/lerobot_version_manifest.json").read_text())
              if "lerobot" not in build_tools:
                  raise SystemExit("lerobot_version requires a lerobot development build")
              if lerobot_version not in manifest["supported_versions"]:
                  raise SystemExit("lerobot_version is not supported by the packaged manifest")
          matrix = []
          for tool in build_tools:
              key = tool if tool in entries else f"sim2real-{tool}"
              entry = entries.get(key)
              if not isinstance(entry, dict) or entry.get("redistribution") != "public":
                  raise SystemExit(f"{tool}: redistribution is not public")
              dockerfile = Path("npa/docker/workbench") / entry["dockerfile"]
              if not dockerfile.is_file():
                  raise SystemExit(f"{tool}: missing canonical Dockerfile {dockerfile}")
              image = development_image_for_tool(tool, git_sha=sha, registry=target)
              matrix.append({
                  "tool": tool,
                  "contract_key": key,
                  "dockerfile": str(dockerfile),
                  "image": image,
                  "lerobot_version": lerobot_version if tool == "lerobot" else "",
                  "libero_private_image_inventory_sha256": (
                      libero_qualification["complete_image_inventory_sha256"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_private_config_digest": (
                      libero_qualification["config_digest"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_candidate_image": (
                      libero_qualification["candidate_image"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_oci_digest": (
                      libero_qualification["oci_digest"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_platform_manifest_digest": (
                      libero_qualification["platform_manifest_digest"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_attestation_manifest_digest": (
                      libero_qualification["attestation_manifest_digest"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_attestation_config_digest": (
                      libero_qualification["attestation_config_digest"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_attestation_layers": (
                      json.dumps(libero_qualification["attestation_layers"], separators=(",", ":"))
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_package_version_digests": (
                      json.dumps(libero_qualification["package_version_digests"], separators=(",", ":"))
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_package_writer_repository": (
                      libero_qualification["package_writer_repository"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_canonical_build_metadata_sha256": (
                      libero_qualification["canonical_build_metadata_sha256"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_base_provenance_sha256": (
                      libero_qualification["base_provenance_sha256"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_publication_bundle_sha256": (
                      libero_qualification["publication_bundle_sha256"]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_customer_authorization_public_key_sha256": (
                      libero_qualification[
                          "customer_authorization_public_key_sha256"
                      ]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
                  "libero_qualified_output_storage_authorization_public_key_sha256": (
                      libero_qualification[
                          "output_storage_authorization_public_key_sha256"
                      ]
                      if tool == "libero" and libero_qualification is not None
                      else ""
                  ),
              })

          cleanup = []
          for tool in cleanup_tools:
              item = {
                  "tool": tool,
                  "image": development_image_for_tool(tool, git_sha=sha, registry=target),
              }
              if tool == "libero" and libero_qualification is not None:
                  item.update({
                      "libero_qualified_oci_digest": libero_qualification["oci_digest"],
                      "libero_qualified_package_version_digests": json.dumps(
                          libero_qualification["package_version_digests"],
                          separators=(",", ":"),
                      ),
                      "libero_package_writer_repository": libero_qualification[
                          "package_writer_repository"
                      ],
                  })
              cleanup.append(item)

          # Builds must describe the exact checked-out source. A later promotion may
          # deliberately name an older dev SHA after GPU evidence is committed.
          if matrix and head != sha and build_tools != ["libero"]:
              raise SystemExit(f"development SHA {sha} does not match checked-out HEAD {head}")
          print(f"target={target}")
          print(f"development_sha={sha}")
          print(f"build_matrix={json.dumps(matrix, separators=(',', ':'))}")
          print(f"build_count={len(matrix)}")
          print(f"cleanup_matrix={json.dumps(cleanup, separators=(',', ':'))}")
          print(f"cleanup_count={len(cleanup)}")
          PY

      - name: Validate additive release selection without changing defaults
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha }}
          SELECTED_TOOLS: ${{ inputs.tool }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          BUILD_COUNT: ${{ steps.plan.outputs.build_count }}
          CLEANUP_COUNT: ${{ steps.plan.outputs.cleanup_count }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ] || [ -n "$EXPECTED_SOURCE_DIGEST" ]; then
            test "$BUILD_COUNT" = 0 && test "$CLEANUP_COUNT" = 0 || {
              echo "::error::Additive release selection cannot build or clean development images"
              exit 1
            }
            npa/.venv/bin/python .github/scripts/publish_selected_public_image.py \
              --target "$TARGET" --development-sha "$DEVELOPMENT_SHA" \
              --tool "$SELECTED_TOOLS" --release-tag "$RELEASE_TAG" \
              --expected-source-digest "$EXPECTED_SOURCE_DIGEST" --mode plan
          fi

  build-development:
    needs: resolve
    if: ${{ needs.resolve.outputs.build_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    runs-on: ${{ inputs.build_runner_label || 'ubuntu-latest' }}
    env:
      IMAGE: ${{ matrix.image }}
      TOOL: ${{ matrix.tool }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      DEVELOPMENT_SHA: ${{ needs.resolve.outputs.development_sha }}
      LEROBOT_VERSION: ${{ matrix.lerobot_version }}
      NPA_PUBLIC_REGISTRY: ${{ needs.resolve.outputs.target }}
      LIBERO_PRIVATE_IMAGE_INVENTORY_SHA256: ${{ matrix.libero_private_image_inventory_sha256 }}
      LIBERO_PRIVATE_CONFIG_DIGEST: ${{ matrix.libero_private_config_digest }}
      LIBERO_QUALIFIED_CANDIDATE_IMAGE: ${{ matrix.libero_qualified_candidate_image }}
      LIBERO_QUALIFIED_OCI_DIGEST: ${{ matrix.libero_qualified_oci_digest }}
      LIBERO_QUALIFIED_PLATFORM_MANIFEST_DIGEST: ${{ matrix.libero_qualified_platform_manifest_digest }}
      LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST: ${{ matrix.libero_qualified_attestation_manifest_digest }}
      LIBERO_QUALIFIED_ATTESTATION_CONFIG_DIGEST: ${{ matrix.libero_qualified_attestation_config_digest }}
      LIBERO_QUALIFIED_ATTESTATION_LAYERS: ${{ matrix.libero_qualified_attestation_layers }}
      LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS: ${{ matrix.libero_qualified_package_version_digests }}
      LIBERO_PACKAGE_WRITER_REPOSITORY: ${{ matrix.libero_package_writer_repository }}
      LIBERO_QUALIFIED_CANONICAL_BUILD_METADATA_SHA256: ${{ matrix.libero_qualified_canonical_build_metadata_sha256 }}
      LIBERO_QUALIFIED_BASE_PROVENANCE_SHA256: ${{ matrix.libero_qualified_base_provenance_sha256 }}
      LIBERO_QUALIFIED_PUBLICATION_BUNDLE_SHA256: ${{ matrix.libero_qualified_publication_bundle_sha256 }}
      LIBERO_QUALIFIED_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_SHA256: ${{ matrix.libero_qualified_customer_authorization_public_key_sha256 }}
      LIBERO_QUALIFIED_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_SHA256: ${{ matrix.libero_qualified_output_storage_authorization_public_key_sha256 }}
      # Updated only after independent review of the exact public content proofs.
      CUROBO_PUBLIC_NATIVE_POLICY_SHA256: 1b4d078637ae99cbc3191244c8338d006ac7df0ca9d0436693f4bca6485030ab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Complete-byte paths require the verified CPython 3.12 wheel.
          python-version: ${{ (matrix.tool == 'curobo' || matrix.tool == 'ncore' || matrix.tool == 'libero') && '3.12' || '3.11' }}

      - name: Install NPA validation environment
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/pip install -c npa/requirements-lock.txt -e "npa[dev]"
          npa/.venv/bin/python -c 'import cryptography; assert cryptography.__version__ == "50.0.0"'

      - name: Materialize owner-private LIBERO control-plane trust roots
        if: matrix.tool == 'libero'
        env:
          NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64: ${{ secrets.NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64 }}
          NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64: ${{ secrets.NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/libero-customer-authorization-public-key.b64"
          printf '%s' "$NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64" > "$key_file"
          test "$(base64 -d "$key_file" | wc -c)" = 32
          test "$(base64 -d "$key_file" | sha256sum | cut -d' ' -f1)" = \
            "$LIBERO_QUALIFIED_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_SHA256"
          chmod 0600 "$key_file"
          echo "NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          storage_key_file="$RUNNER_TEMP/libero-output-storage-authorization-public-key.b64"
          printf '%s' "$NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64" > "$storage_key_file"
          test "$(base64 -d "$storage_key_file" | wc -c)" = 32
          test "$(base64 -d "$storage_key_file" | sha256sum | cut -d' ' -f1)" = \
            "$LIBERO_QUALIFIED_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_SHA256"
          test "$(cat "$key_file")" != "$(cat "$storage_key_file")"
          chmod 0600 "$storage_key_file"
          echo "NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_FILE=$storage_key_file" >> "$GITHUB_ENV"

      - name: Refuse source, license, packaging, or skill guard drift
        run: |
          if [ "$TOOL" = libero ]; then
            git merge-base --is-ancestor "$DEVELOPMENT_SHA" HEAD
            test "$(git diff --name-only --diff-filter=ACDMRTUXB \
              "$DEVELOPMENT_SHA..HEAD" --)" = \
              "npa/src/npa/deploy/libero_image_manifest.json"
          else
            test "$(git rev-parse HEAD)" = "$DEVELOPMENT_SHA"
          fi
          npa/.venv/bin/python -m pytest \
            npa/tests/docker/test_packaging_contract.py \
            npa/tests/docker/test_image_payload_scan.py \
            npa/tests/docker/test_isaac_bootstrap.py \
            npa/tests/docker/test_ltx_runtime_bootstrap.py \
            npa/tests/docker/test_ltx_image_payload_scan.py \
            npa/tests/docker/test_libero_runtime_bootstrap.py \
            npa/tests/docker/test_libero_image_contract.py \
            npa/tests/docker/test_libero_image_payload_scan.py \
            npa/tests/workflows/test_byof_container_verify.py \
            npa/tests/workflows/test_byof_libero.py \
            npa/tests/workflows/test_byof_repo.py \
            npa/tests/workflows/test_byof_solution_smokes.py \
            npa/tests/workflows/test_byof_source_auth.py \
            npa/tests/docker/test_cosmos3_serving_image_contract.py \
            npa/tests/docker/test_cosmos3_ray_serve_image_contract.py \
            npa/tests/docker/test_sonic_mujoco_public_image_contract.py \
            npa/tests/docker/test_fiftyone_image_validation.py \
            npa/tests/docker/test_fiftyone_source_delivery.py \
            npa/tests/deploy/test_public_publish.py \
            npa/tests/guardrails/test_secure_image_build_skill.py \
            -q
          git diff origin/main...HEAD --no-ext-diff | \
            npa/.venv/bin/python -m npa.guardrails.confidentiality \
              --built-in-nebius-infra --stdin-source publication-diff --stdin-is-diff

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="origin/main..HEAD"

      - name: Validate required cuRobo confidentiality policy before building
        if: matrix.tool == 'curobo'
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
          INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
        run: |
          npa/.venv/bin/python npa/scripts/image_byte_scan/prepare.py check-policy \
            --policy-mode ci-regex

      - name: Prepare and test the cuRobo complete-byte scanner
        if: matrix.tool == 'curobo'
        run: |
          set -euo pipefail
          umask 077
          scan_root="$(mktemp -d "$RUNNER_TEMP/curobo-byte-gate.XXXXXXXX")"
          echo "CUROBO_BYTE_GATE_ROOT=$scan_root" >> "$GITHUB_ENV"
          npa/.venv/bin/python npa/scripts/image_byte_scan/go_helper/build.py \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --output-dir "$scan_root/tools"
          npa/.venv/bin/python npa/scripts/image_byte_scan/prepare.py dependencies \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --output-dir "$scan_root/native"
          npa/.venv/bin/python npa/scripts/image_byte_scan/real_helper_checks.py \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --tools-receipt "$scan_root/tools/dependency-receipt.json" \
            --native-receipt "$scan_root/native/dependencies.json" \
            --output-dir "$scan_root/integration-checks"

      - name: Prepare NCore native scanners and separate source inputs
        if: matrix.tool == 'ncore'
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
          INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
        run: |
          set -euo pipefail
          umask 077
          test "$IMAGE" = "ghcr.io/nebius/nebius-physical-ai/npa-ncore:dev-$DEVELOPMENT_SHA"
          root="$(mktemp -d "$RUNNER_TEMP/ncore-oci.XXXXXXXX")"
          echo "NCORE_OCI_ROOT=$root" >> "$GITHUB_ENV"
          npa/.venv/bin/python npa/scripts/publish_ncore_oci.py prepare \
            --source-sha "$DEVELOPMENT_SHA" --analysis-root "$root" \
            --keyring "$root/keyring/debian-archive-keyring.gpg"

      - name: Prove destination cannot expose unvalidated tagged bytes
        if: matrix.tool != 'ncore'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package_and_tag="${path#*/}"
          package="${package_and_tag%:*}"
          tag="${package_and_tag##*:}"
          repository="${IMAGE%:*}"
          encoded="${package//\//%2F}"
          response="$(mktemp)"
          status="$(gh api --silent --include "/orgs/${owner}/packages/container/${encoded}" >"$response" 2>/dev/null; printf '%s' "$?")"
          package_api="/orgs/${owner}/packages/container/${encoded}"
          if [ "$status" = 0 ]; then
            visibility="$(gh api "$package_api" --jq .visibility)"
            if [ "$visibility" = public ]; then
              echo "NPA_FIRST_PUBLICATION_REQUIRED=0" >> "$GITHUB_ENV"
              if [ "$TOOL" = libero ]; then
                echo "::error::Qualified LIBERO candidate must remain private until this gate completes"
                exit 1
              fi
              echo "Existing package is already public." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$visibility" = private ]; then
              echo "NPA_FIRST_PUBLICATION_REQUIRED=1" >> "$GITHUB_ENV"
              # Visibility is package-wide. Untagged images and OCI referrers are
              # reachable by digest after this package becomes public, so no private
              # version of any media type may survive the first-publication gate.
              versions="$(mktemp)"
              gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$versions"
              tagged_count="$(jq '[.[] | select((.metadata.container.tags // []) | length > 0)] | length' "$versions")"
              version_count="$(jq 'length' "$versions")"
              if [ "$TOOL" = libero ]; then
                test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
                  "$LIBERO_PACKAGE_WRITER_REPOSITORY"
                test "$LIBERO_PACKAGE_WRITER_REPOSITORY" = "$GITHUB_REPOSITORY"
                jq -e --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
                  ([.[].name] | sort) == $expected and
                  all(.[]; (.metadata.container.tags // []) == [])
                ' "$versions" >/dev/null || {
                  echo "::error::Private LIBERO package versions differ from the qualified untagged OCI graph"
                  exit 1
                }
                echo "Private destination is repository-bound and contains exactly the qualified untagged OCI graph (${version_count} versions)." >> "$GITHUB_STEP_SUMMARY"
              else
                if [ "$version_count" != 0 ]; then
                  validate_retained_graph() {
                    npa/.venv/bin/python - "$repository" "$tag" "$1" <<'PY'
          import json
          import re
          import subprocess
          import sys

          repository, tag, versions_path = sys.argv[1:]
          versions = json.load(open(versions_path, encoding="utf-8"))
          if not isinstance(versions, list) or not versions:
              raise SystemExit("retained package graph is empty or malformed")
          identities = [str(item.get("id") or "") for item in versions if isinstance(item, dict)]
          if len(identities) != len(versions) or len(set(identities)) != len(versions) or any(re.fullmatch(r"[1-9][0-9]*", item) is None for item in identities):
              raise SystemExit("retained package version identities are ambiguous")
          tagged = [item for item in versions if (item.get("metadata", {}).get("container", {}).get("tags") or [])]
          if len(tagged) != 1 or (tagged[0].get("metadata", {}).get("container", {}).get("tags") or []) != [tag]:
              raise SystemExit("retained package does not have exactly the expected candidate tag")
          root = str(tagged[0].get("name") or "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", root) is None:
              raise SystemExit("retained candidate digest is invalid")
          observed = subprocess.check_output(["crane", "digest", f"{repository}@{root}"], text=True).strip()
          if observed != root:
              raise SystemExit("retained candidate digest cannot be revalidated")
          for item in versions:
              if item is tagged[0]:
                  continue
              tags = item.get("metadata", {}).get("container", {}).get("tags") or []
              digest = str(item.get("name") or "")
              if tags or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("retained package contains an unrelated version")
              manifest = json.loads(subprocess.check_output(["crane", "manifest", f"{repository}@{digest}"]))
              annotations = manifest.get("annotations") or {}
              subject = manifest.get("subject") or {}
              if (
                  manifest.get("schemaVersion") != 2
                  or manifest.get("mediaType") != "application/vnd.oci.image.manifest.v1+json"
                  or not isinstance(manifest.get("layers"), list)
                  or not manifest["layers"]
                  or (
                      subject.get("digest") != root
                      and annotations.get("vnd.docker.reference.digest") != root
                  )
              ):
                  raise SystemExit("retained referrer is not bound to the candidate")
          print(root)
          PY
                  }
                  test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
                    "$GITHUB_REPOSITORY"
                  retained_digest="$(validate_retained_graph "$versions")" || {
                    echo "::error::Private destination is not a closed repository-bound retained candidate graph"
                    exit 1
                  }
                  retained_snapshot="$(mktemp)"
                  jq '[.[] | {id:(.id | tostring), name, tags:(.metadata.container.tags // [])}] | sort_by(.id)' \
                    "$versions" > "$retained_snapshot"
                  current_versions="$(mktemp)"
                  gh api --paginate --slurp "${package_api}/versions?per_page=100" |
                    jq 'add' > "$current_versions"
                  test "$(validate_retained_graph "$current_versions")" = "$retained_digest"
                  jq -e --slurpfile before "$retained_snapshot" '
                    ([.[] | {id:(.id | tostring), name,
                      tags:(.metadata.container.tags // [])}] | sort_by(.id)) == $before[0]
                  ' "$current_versions" >/dev/null
                  test "$(gh api "$package_api" --jq .visibility)" = private
                  test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
                    "$GITHUB_REPOSITORY"
                  gh api --method DELETE "$package_api"
                  if gh api -i "$package_api" >"$response" 2>&1; then
                    echo "::error::Retained unpublished candidate package still exists after reconciliation"
                    exit 1
                  elif ! grep -q '^HTTP/.* 404 ' "$response"; then
                    echo "::error::Retained unpublished candidate package absence is unverified"
                    exit 1
                  fi
                  echo "Reconciled one exact closed unpublished candidate/referrer graph before retry." >> "$GITHUB_STEP_SUMMARY"
                elif [ "$tagged_count" != 0 ]; then
                  echo "::error::Empty private destination unexpectedly contains tagged versions"
                  exit 1
                fi
                echo "Private destination is genuinely empty; exact pushed-byte gates and visibility verification apply." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::error::Unsupported destination visibility: $visibility"
              exit 1
            fi
          elif grep -q '^HTTP/.* 404 ' "$response"; then
            echo "NPA_FIRST_PUBLICATION_REQUIRED=1" >> "$GITHUB_ENV"
            # A new package is created only after every local byte-level gate below
            # passes. The pushed digest is scanned again before the package visibility
            # changes, and any failure triggers exact run-owned version cleanup.
            if [ "$TOOL" = libero ]; then
              echo "::error::Qualified LIBERO candidate package is absent"
              exit 1
            fi
            echo "New package; exact pushed-byte gates and post-push anonymous verification apply." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not prove destination package state"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Fetch immutable LIBERO base provenance metadata
        if: matrix.tool == 'libero'
        run: |
          set -euo pipefail
          # Metadata only: this fetches Docker Official Images' published in-toto
          # provenance blob, not an image layer or a runtime payload.
          crane blob \
            index.docker.io/library/python sha256:0d66ce85e6ecad0d044a1d4bae712afe24ff2eb0a5d89eb224944df3895f226b \
            > "$RUNNER_TEMP/libero-base-provenance.intoto.json"
          echo \
            '0d66ce85e6ecad0d044a1d4bae712afe24ff2eb0a5d89eb224944df3895f226b  '"$RUNNER_TEMP/libero-base-provenance.intoto.json" | \
            sha256sum --check --strict
          crane blob \
            index.docker.io/library/python sha256:b290dbd3087fc5d2cf4af106f1d253c417a26080b70bdcf440ff96314a12c2bb \
            > "$RUNNER_TEMP/libero-base-sbom.intoto.json"
          echo \
            'b290dbd3087fc5d2cf4af106f1d253c417a26080b70bdcf440ff96314a12c2bb  '"$RUNNER_TEMP/libero-base-sbom.intoto.json" | \
            sha256sum --check --strict

      # Some public workbench Dockerfiles inherit other immutable public NPA
      # packages. Authenticate pulls here because setup-crane installs an
      # intentionally invalid placeholder credential; no registry write occurs
      # until the separately gated push step below.
      - name: Authenticate immutable public base pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact qualified private LIBERO candidate lineage
        if: matrix.tool == 'libero'
        run: |
          set -euo pipefail
          npa/.venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          def read(command):
              return subprocess.check_output(command)

          candidate = os.environ["LIBERO_QUALIFIED_CANDIDATE_IMAGE"]
          repository = candidate.rsplit("@", 1)[0]
          platform_digest = os.environ["LIBERO_QUALIFIED_PLATFORM_MANIFEST_DIGEST"]
          attestation_digest = os.environ["LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST"]
          if read(["crane", "digest", candidate]).decode().strip() != os.environ["LIBERO_QUALIFIED_OCI_DIGEST"]:
              raise SystemExit("qualified OCI index digest differs")
          root_bytes = read(["crane", "manifest", candidate])
          root = json.loads(root_bytes)
          descriptors = root.get("manifests")
          if root.get("mediaType") != "application/vnd.oci.image.index.v1+json" or not isinstance(descriptors, list) or len(descriptors) != 2:
              raise SystemExit("qualified OCI index must contain exactly runtime and attestation manifests")
          runtime = [item for item in descriptors if item.get("digest") == platform_digest]
          attest = [item for item in descriptors if item.get("digest") == attestation_digest]
          if len(runtime) != 1 or runtime[0].get("platform") != {"architecture": "amd64", "os": "linux"}:
              raise SystemExit("qualified runtime platform descriptor differs")
          if len(attest) != 1:
              raise SystemExit("qualified attestation descriptor is absent")
          annotations = attest[0].get("annotations") or {}
          if annotations.get("vnd.docker.reference.digest") != platform_digest or annotations.get("vnd.docker.reference.type") != "attestation-manifest":
              raise SystemExit("qualified attestation descriptor does not bind the runtime manifest")
          attestation_ref = f"{repository}@{attestation_digest}"
          if read(["crane", "digest", attestation_ref]).decode().strip() != attestation_digest:
              raise SystemExit("qualified attestation manifest digest differs")
          manifest_bytes = read(["crane", "manifest", attestation_ref])
          manifest = json.loads(manifest_bytes)
          config = manifest.get("config") or {}
          if config.get("digest") != os.environ["LIBERO_QUALIFIED_ATTESTATION_CONFIG_DIGEST"]:
              raise SystemExit("qualified attestation config descriptor differs")
          config_bytes = read(["crane", "blob", repository, config["digest"]])
          if "sha256:" + hashlib.sha256(config_bytes).hexdigest() != config["digest"] or len(config_bytes) != config.get("size"):
              raise SystemExit("qualified attestation config bytes differ")
          expected_layers = json.loads(os.environ["LIBERO_QUALIFIED_ATTESTATION_LAYERS"])
          layers = manifest.get("layers")
          if not isinstance(layers, list) or len(layers) != len(expected_layers):
              raise SystemExit("qualified attestation layer set is incomplete")
          for layer, expected in zip(layers, expected_layers, strict=True):
              if {"predicate_type": (layer.get("annotations") or {}).get("in-toto.io/predicate-type"), "digest": layer.get("digest"), "size_bytes": layer.get("size")} != expected:
                  raise SystemExit("qualified attestation layer descriptor differs")
              payload = read(["crane", "blob", repository, expected["digest"]])
              if len(payload) != expected["size_bytes"] or "sha256:" + hashlib.sha256(payload).hexdigest() != expected["digest"]:
                  raise SystemExit("qualified attestation layer bytes differ")
              statement = json.loads(payload)
              if statement.get("predicateType") != expected["predicate_type"]:
                  raise SystemExit("qualified attestation predicate type differs")
              subjects = statement.get("subject")
              if not isinstance(subjects, list) or not any((subject.get("digest") or {}).get("sha256") == platform_digest.removeprefix("sha256:") for subject in subjects if isinstance(subject, dict)):
                  raise SystemExit("qualified attestation subject does not bind the runtime manifest")
          platform = json.loads(read(["crane", "manifest", "--platform", "linux/amd64", candidate]))
          if platform.get("config", {}).get("digest") != os.environ["LIBERO_PRIVATE_CONFIG_DIGEST"]:
              raise SystemExit("qualified OCI config differs")
          PY

      - name: Stage supported workflow catalog in the package build context
        if: matrix.tool != 'ncore'
        run: npa/.venv/bin/python npa/src/npa/workflow_build.py --stage-catalog --package-root npa

      - name: Build NCore committed attested OCI archive
        if: matrix.tool == 'ncore'
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
          INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
        run: |
          set -euo pipefail
          npa/.venv/bin/python npa/scripts/publish_ncore_oci.py build \
            --source-sha "$DEVELOPMENT_SHA" --analysis-root "$NCORE_OCI_ROOT" \
            --keyring "$NCORE_OCI_ROOT/keyring/debian-archive-keyring.gpg"

      # Build locally first. Every gate below inspects these exact bytes; no registry write
      # occurs until the final explicit docker push.
      - name: Build immutable development image locally
        if: matrix.tool != 'ncore'
        run: |
          set -euo pipefail
          build_args=(--build-arg "NPA_SOURCE_SHA=$DEVELOPMENT_SHA")
          if [[ -n "${LEROBOT_VERSION:-}" ]]; then
            [[ "$TOOL" == lerobot && "$LEROBOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid scoped LeRobot version" >&2
              exit 1
            }
            build_args+=(--build-arg "LEROBOT_VERSION=$LEROBOT_VERSION")
          fi
          if [[ "$TOOL" == curobo || "$TOOL" == libero ]]; then
            source_epoch="$(git show -s --format=%ct "$DEVELOPMENT_SHA")"
            [[ "$source_epoch" =~ ^[1-9][0-9]*$ ]] || { echo "Positive source commit epoch is required" >&2; exit 1; }
            build_args+=(--build-arg "SOURCE_DATE_EPOCH=$source_epoch")
          fi
          metadata_args=()
          export_args=(--load)
          secret_args=()
          if [[ "$TOOL" == libero ]]; then
            NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64="$(tr -d '\r\n' < "$NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_FILE")"
            NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64="$(tr -d '\r\n' < "$NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_FILE")"
            export NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64
            export NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64
            test "$(printf '%s' "$NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64" | base64 -d | wc -c)" = 32
            test "$(printf '%s' "$NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64" | base64 -d | wc -c)" = 32
            test "$NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64" != "$NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64"
            metadata_args+=(
              --metadata-file "$RUNNER_TEMP/libero-build-metadata.json"
              --provenance=mode=max
              --sbom=true
            )
            export_args=(
              --output "type=oci,dest=$RUNNER_TEMP/libero-build.oci.tar,tar=true,rewrite-timestamp=true"
            )
            secret_args+=(
              --secret id=npa_libero_customer_authorization_public_key_b64,env=NPA_LIBERO_CUSTOMER_AUTHORIZATION_PUBLIC_KEY_B64
              --secret id=npa_libero_output_storage_authorization_public_key_b64,env=NPA_LIBERO_OUTPUT_STORAGE_AUTHORIZATION_PUBLIC_KEY_B64
            )
            export BUILDX_METADATA_PROVENANCE=max
          fi
          docker buildx build \
            --file "$DOCKERFILE" \
            "${build_args[@]}" \
            "${metadata_args[@]}" \
            "${export_args[@]}" \
            "${secret_args[@]}" \
            --label "org.opencontainers.image.revision=$DEVELOPMENT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            npa
          if [[ "$TOOL" == libero ]]; then
            test -s "$RUNNER_TEMP/libero-build-metadata.json"
            test -s "$RUNNER_TEMP/libero-build.oci.tar"
            npa/.venv/bin/python npa/scripts/scan_image_libero_payload.py \
              --verify-build-oci "$RUNNER_TEMP/libero-build.oci.tar" \
              --build-metadata "$RUNNER_TEMP/libero-build-metadata.json" \
              --output "$RUNNER_TEMP/libero-build-attestations.json"
            echo "::error::LIBERO archive import remains disabled while public disclosure is quarantined."
            exit 1
          fi

      - name: Enforce runtime, revision, bootstrap, config, and history contracts
        if: matrix.tool != 'ncore'
        env:
          CUSTOMER_DENYLIST: ${{ matrix.tool == 'curobo' && secrets.CUSTOMER_DENYLIST || '' }}
          INFRA_DENYLIST: ${{ matrix.tool == 'curobo' && secrets.INFRA_DENYLIST || '' }}
        run: |
          set -euo pipefail
          libero_export_container=""
          cleanup_libero_export() {
            primary_status=$?
            trap - EXIT
            cleanup_status=0
            if [ -n "$libero_export_container" ] && \
              ! docker container rm "$libero_export_container" >/dev/null; then
              cleanup_status=1
              echo "::error::LIBERO export-container cleanup failed"
            fi
            if [ "$primary_status" -ne 0 ]; then
              exit "$primary_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_libero_export EXIT
          npa/.venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from npa.deploy.images import SKYPILOT_BOOTSTRAP_ATTESTED_TOOLS
          from npa.orchestration.skypilot.image_bootstrap_contract import ATTESTATION_LABEL, CONTRACT_VERSION

          image = os.environ["IMAGE"]
          tool = os.environ["TOOL"]
          sha = os.environ["DEVELOPMENT_SHA"]
          config = json.loads(subprocess.check_output(["docker", "inspect", image], text=True))[0]["Config"]
          user = str(config.get("User") or "").strip().lower()
          if user in {"", "0", "root", "0:0", "root:root"}:
              raise SystemExit(f"non-root runtime required; found User={user!r}")
          labels = config.get("Labels") or {}
          if labels.get("org.opencontainers.image.revision") != sha:
              raise SystemExit("OCI revision does not match the exact source commit")
          if tool in SKYPILOT_BOOTSTRAP_ATTESTED_TOOLS and labels.get(ATTESTATION_LABEL) != CONTRACT_VERSION:
              raise SystemExit("required SkyPilot bootstrap attestation is absent or stale")
          serialized = json.dumps(config, sort_keys=True)
          forbidden = ("OMNI_KIT_ACCEPT_EULA=YES", "ISAACSIM_ACCEPT_EULA=YES")
          if any(value in serialized for value in forbidden):
              raise SystemExit("cached EULA acceptance found in OCI config")
          history = subprocess.check_output(
              ["docker", "history", "--no-trunc", image], text=True
          )
          if any(value in history for value in forbidden):
              raise SystemExit("cached EULA acceptance found in layer history")
          PY
          # The loaded runtime image remains in Docker's image store. BuildKit's
          # disposable construction cache can be larger than the image itself and
          # otherwise leaves insufficient space to serialize large GPU images for
          # the mandatory layer-by-layer payload scan.
          docker buildx prune --all --force
          docker save --output "$RUNNER_TEMP/${TOOL}.tar" "$IMAGE"
          npa/.venv/bin/python npa/scripts/scan_image_omniverse_payload.py \
            --tarball "$RUNNER_TEMP/${TOOL}.tar" \
            --json "$RUNNER_TEMP/${TOOL}-payload.json"
          if [ "$TOOL" = libero ]; then
            libero_export_container="$(docker create "$IMAGE")"
            docker export --output "$RUNNER_TEMP/${TOOL}-rootfs.tar" \
              "$libero_export_container"
            docker container rm "$libero_export_container" >/dev/null
            libero_export_container=""
            npa/.venv/bin/python npa/scripts/scan_image_libero_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}.tar" \
              --exported-rootfs "$RUNNER_TEMP/${TOOL}-rootfs.tar" \
              --build-metadata "$RUNNER_TEMP/libero-build-metadata.json" \
              --base-provenance "$RUNNER_TEMP/libero-base-provenance.intoto.json" \
              --expected-image-inventory-sha256 "$LIBERO_PRIVATE_IMAGE_INVENTORY_SHA256" \
              --expected-config-digest "$LIBERO_PRIVATE_CONFIG_DIGEST" \
              --expected-canonical-build-metadata-sha256 "$LIBERO_QUALIFIED_CANONICAL_BUILD_METADATA_SHA256" \
              --expected-base-provenance-sha256 "$LIBERO_QUALIFIED_BASE_PROVENANCE_SHA256" \
              --image-inventory-output "$RUNNER_TEMP/${TOOL}-image-inventory.json" \
              --output "$RUNNER_TEMP/${TOOL}-libero-payload.json"
            rm -f "$RUNNER_TEMP/${TOOL}-rootfs.tar"
          fi
          if [ "$TOOL" = curobo ]; then
            npa/.venv/bin/python npa/docker/workbench/curobo/verify_image.py \
              --docker-save "$RUNNER_TEMP/${TOOL}.tar" \
              --expected-image-id "$(docker image inspect --format '{{.Id}}' "$IMAGE")" \
              --json "$RUNNER_TEMP/${TOOL}-curobo-payload.json"
            umask 077
            phase="$CUROBO_BYTE_GATE_ROOT/pre"
            mkdir -m 0700 "$phase"
            mv "$RUNNER_TEMP/${TOOL}.tar" "$phase/image.tar"
            mv "$RUNNER_TEMP/${TOOL}-curobo-payload.json" "$phase/graph.json"
            chmod 0600 "$phase/image.tar" "$phase/graph.json"
            expected_image_id="$(jq -er '.expected_image_id' "$phase/graph.json")"
            npa/.venv/bin/python npa/scripts/image_byte_scan/prepare.py authorize \
              --analysis-root "$CUROBO_BYTE_GATE_ROOT" --trusted-root "$GITHUB_WORKSPACE" \
              --tools-receipt "$CUROBO_BYTE_GATE_ROOT/tools/dependency-receipt.json" \
              --native-receipt "$CUROBO_BYTE_GATE_ROOT/native/dependencies.json" \
              --archive "$phase/image.tar" --verification-report "$phase/graph.json" \
              --expected-image-id "$expected_image_id" \
              --output-dir "$phase/authorization" --policy-mode ci-regex
            npa/.venv/bin/python npa/scripts/scan_image_bytes.py \
              --analysis-root "$CUROBO_BYTE_GATE_ROOT" --trusted-root "$GITHUB_WORKSPACE" \
              --authorization "$phase/authorization/authorization.json" \
              --output-dir "$phase/scan" \
              --public-native-policy "$GITHUB_WORKSPACE/npa/scripts/image_byte_scan/public_policies/curobo-v2.json" \
              --public-native-policy-sha256 "$CUROBO_PUBLIC_NATIVE_POLICY_SHA256"
            rm -f "$phase/image.tar"
          fi
          if [ "$TOOL" = ltx2 ]; then
            npa/.venv/bin/python npa/scripts/scan_image_ltx_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}.tar" \
              --output "$RUNNER_TEMP/${TOOL}-ltx-payload.json"
          fi
          if [ "$TOOL" = wan2-2 ]; then
            npa/.venv/bin/python npa/scripts/scan_image_wan_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}.tar" \
              --output "$RUNNER_TEMP/${TOOL}-wan-payload.json"
          fi
          if [ "$TOOL" = alpamayo2-super ]; then
            npa/.venv/bin/python npa/scripts/scan_image_alpamayo2_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}.tar"
          fi
          if [ "$TOOL" = cosmos3-serving ]; then
            npa/.venv/bin/python npa/scripts/scan_image_cosmos3_serving_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}.tar" \
              --json "$RUNNER_TEMP/${TOOL}-cosmos3-serving-payload.json"
          fi
          if [ "$TOOL" = cosmos3-ray-serve ]; then
            npa/.venv/bin/python npa/scripts/scan_image_cosmos3_ray_serve_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}.tar" \
              --json "$RUNNER_TEMP/${TOOL}-cosmos3-ray-serve-payload.json"
          fi
          if [ "$TOOL" = sonic-mujoco ]; then
            docker run --rm --entrypoint /opt/npa/venv/bin/python "$IMAGE" \
              /opt/npa/docker/workbench/sonic/verify_mujoco_image.py
          fi
          rm -f "$RUNNER_TEMP/${TOOL}.tar"

      # CUDA/AI images can exceed 25 GB. Once the exact loaded image passes its
      # contract, BuildKit's duplicate cache is no longer evidence and can be
      # discarded. Trivy's export goes on the hosted runner's large temp disk so
      # the unchanged vulnerability/secret/license gates inspect every layer.
      - name: Prepare capacity for full-image security scans
        if: matrix.tool != 'ncore'
        run: |
          docker buildx prune --all --force
          sudo install -d -m 0777 /mnt/npa-trivy

      - name: Pre-publication vulnerability, secret, and license scan
        if: matrix.tool != 'ncore'
        env:
          TRIVY_TEMP_DIR: /mnt/npa-trivy
        shell: bash
        run: |
          set -euo pipefail
          # Trivy 0.70 always wraps scans in context.WithTimeout and a zero
          # duration expires immediately. Go's largest whole-second duration
          # gives this mandatory gate no practical analysis deadline.
          docker run --rm \
            -e TMPDIR=/tmp/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_TEMP_DIR:/tmp/trivy" \
            -v "$GITHUB_WORKSPACE/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --cache-dir /tmp/trivy/cache \
              --timeout 2562047h47m16s \
              --scanners vuln,secret,license \
              --severity CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --ignorefile /.trivyignore \
              --format table \
              "$IMAGE"

      - name: Generate pre-publication SBOM
        if: matrix.tool != 'ncore'
        env:
          TRIVY_TEMP_DIR: /mnt/npa-trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e TMPDIR=/tmp/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_TEMP_DIR:/tmp/trivy" \
            -v "$RUNNER_TEMP:/output" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --cache-dir /tmp/trivy/cache \
              --timeout 2562047h47m16s \
              --scanners vuln \
              --format spdx-json \
              --output "/output/${TOOL}-sbom.spdx.json" \
              "$IMAGE"

      - name: Validate exact FiftyOne runtime before publication
        if: matrix.tool == 'fiftyone'
        id: fiftyone-validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          npa/.venv/bin/python npa/docker/workbench/fiftyone/validate_image.py \
            --image-id "$image_id" --revision "$DEVELOPMENT_SHA" \
            --source-root "$GITHUB_WORKSPACE" \
            --output-path "$RUNNER_TEMP/fiftyone-validation"

      - name: Retain only the public FiftyOne validation summary
        if: always() && matrix.tool == 'fiftyone' && steps.fiftyone-validation.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fiftyone-validation-summary
          path: ${{ runner.temp }}/fiftyone-validation/public-summary.json
          if-no-files-found: error
          # Original logs and raw receipts stay on the runner and are not public artifacts.

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate and publish the exact NCore OCI graph
        if: matrix.tool == 'ncore'
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
          INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update
          sudo apt-get install -y skopeo
          cp "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "$NCORE_OCI_ROOT/registry-auth.json"
          chmod 0600 "$NCORE_OCI_ROOT/registry-auth.json"
          npa/.venv/bin/python npa/scripts/publish_ncore_oci.py publish \
            --source-sha "$DEVELOPMENT_SHA" --analysis-root "$NCORE_OCI_ROOT" \
            --output-dir "$NCORE_OCI_ROOT/prepublication" \
            --annex "$NCORE_OCI_ROOT/sources" --native-source "$NCORE_OCI_ROOT/sources" \
            --metadata "$NCORE_OCI_ROOT/metadata" --bootstrap-source "$NCORE_OCI_ROOT/bootstrap-source" \
            --keyring "$NCORE_OCI_ROOT/keyring/debian-archive-keyring.gpg" \
            --authfile "$NCORE_OCI_ROOT/registry-auth.json"
          echo "NCore exact OCI development publication verified anonymously; RTX acceptance remains required." >> "$GITHUB_STEP_SUMMARY"
          # Raw scanner output, denylist inputs and auth remain private. Never
          # upload the analysis root as a public Actions artifact.

      - name: Push only after every pre-publication gate passes
        if: matrix.tool != 'ncore'
        id: push
        run: |
          set -euo pipefail
          if [ "$TOOL" = libero ]; then
            # Publish the already qualified OCI index. Its embedded, byte-bound
            # provenance/SBOM graph remains identical to image qualification. Do
            # not add the public tag yet: every fallible byte and graph gate runs
            # against the immutable digest first, leaving a failed private gate
            # with the qualified untagged graph completely unchanged.
            digest="$(crane digest "$LIBERO_QUALIFIED_CANDIDATE_IMAGE")"
            test "$digest" = "$LIBERO_QUALIFIED_OCI_DIGEST"
            test "$(crane digest --platform linux/amd64 "$LIBERO_QUALIFIED_CANDIDATE_IMAGE")" = \
              "$LIBERO_QUALIFIED_PLATFORM_MANIFEST_DIGEST"
          else
            docker push "$IMAGE"
            digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$digest" = "$(crane digest "$IMAGE")"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "repository=${IMAGE%:*}" >> "$GITHUB_OUTPUT"

      - name: Attest exact pushed digest provenance
        if: matrix.tool != 'ncore'
        id: provenance-attestation
        # Current-main compatibility marker: attest-build-provenance@v3.
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # LIBERO preserves its separately qualified embedded OCI graph. Its
          # immutable-action workflow attestation is not another GHCR version.
          push-to-registry: ${{ matrix.tool != 'libero' && env.NPA_FIRST_PUBLICATION_REQUIRED != '1' }}

      - name: Attest exact pushed digest SBOM
        if: matrix.tool != 'ncore'
        id: sbom-attestation
        # Current-main compatibility marker: attest-sbom@v3.
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.tool }}-sbom.spdx.json
          push-to-registry: ${{ matrix.tool != 'libero' && env.NPA_FIRST_PUBLICATION_REQUIRED != '1' }}

      - name: Require both digest-bound attestation results
        if: matrix.tool != 'ncore'
        env:
          PROVENANCE_URL: ${{ steps.provenance-attestation.outputs.attestation-url }}
          PROVENANCE_BUNDLE: ${{ steps.provenance-attestation.outputs.bundle-path }}
          SBOM_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          if [ "$TOOL" != libero ]; then
            test -n "$PROVENANCE_URL" && test -n "$SBOM_URL"
          fi

      - name: Revalidate qualified LIBERO repository and OCI lineage
        if: matrix.tool == 'libero'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          npa/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          from npa.deploy.images import libero_publication_lineage_values, libero_qualified_image_manifest

          qualification = libero_qualified_image_manifest()
          lineage = libero_publication_lineage_values(
              qualification,
              Path.cwd(),
              development_sha=os.environ["DEVELOPMENT_SHA"],
          )
          expected = {
              "publication_bundle_sha256": os.environ[
                  "LIBERO_QUALIFIED_PUBLICATION_BUNDLE_SHA256"
              ],
          }
          if any(lineage[name] != value for name, value in expected.items()):
              raise SystemExit("checked-in LIBERO lineage bundle changed after resolution")
          if os.environ["DIGEST"] != lineage["oci_digest"]:
              raise SystemExit("published LIBERO OCI index differs from qualification")
          if lineage["package_writer_repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("LIBERO package writer repository differs")
          PY

      - name: Verify pushed bytes, revision, payload, visibility, and anonymous pull
        if: matrix.tool != 'ncore'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOMER_DENYLIST: ${{ matrix.tool == 'curobo' && secrets.CUSTOMER_DENYLIST || '' }}
          INFRA_DENYLIST: ${{ matrix.tool == 'curobo' && secrets.INFRA_DENYLIST || '' }}
        run: |
          set -euo pipefail
          libero_export_container=""
          cleanup_libero_export() {
            primary_status=$?
            trap - EXIT
            cleanup_status=0
            if [ -n "$libero_export_container" ] && \
              ! docker container rm "$libero_export_container" >/dev/null; then
              cleanup_status=1
              echo "::error::LIBERO export-container cleanup failed"
            fi
            if [ "$primary_status" -ne 0 ]; then
              exit "$primary_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_libero_export EXIT
          repository="${IMAGE%:*}"
          exact="${repository}@${DIGEST}"
          if [ "$TOOL" = libero ]; then
            test "$(crane digest "$exact")" = "$DIGEST"
          else
            test "$(crane digest "$IMAGE")" = "$DIGEST"
          fi
          test "$(crane config "$exact" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')" = "$DEVELOPMENT_SHA"
          # Bind the remote digest back to the exact local image whose complete
          # filesystem tar was scanned before publication. Pulling immediately after
          # push reuses local layers and avoids a second multi-GB `crane export`, which
          # GHCR can rate-limit even for authenticated callers. Matching image IDs binds
          # the remote manifest's config/rootfs diff IDs to that scanned tar.
          payload_attempt=1
          while true; do
            payload_log="$RUNNER_TEMP/${TOOL}-pushed-payload-attempt-${payload_attempt}.log"
            if {
              docker pull "$exact" &&
              test "$(docker image inspect --format '{{.Id}}' "$exact")" = \
                "$(docker image inspect --format '{{.Id}}' "$IMAGE")" &&
              docker save --output "$RUNNER_TEMP/${TOOL}-pushed.tar" "$exact" &&
              npa/.venv/bin/python npa/scripts/scan_image_omniverse_payload.py \
                --tarball "$RUNNER_TEMP/${TOOL}-pushed.tar" \
                --json "$RUNNER_TEMP/${TOOL}-pushed-payload.json"
            } >"$payload_log" 2>&1; then
              cat "$payload_log"
              break
            fi
            cat "$payload_log" >&2
            if ! grep -Eq 'TOOMANYREQUESTS|429 Too Many Requests' "$payload_log"; then
              exit 1
            fi
            echo "GHCR throttled pushed-byte payload scan attempt ${payload_attempt}; retrying" >&2
            payload_attempt=$((payload_attempt + 1))
            sleep 5
          done
          if [ "$TOOL" = curobo ]; then
            npa/.venv/bin/python npa/docker/workbench/curobo/verify_image.py \
              --docker-save "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --expected-image-id "$(docker image inspect --format '{{.Id}}' "$exact")" \
              --json "$RUNNER_TEMP/${TOOL}-pushed-curobo-payload.json"
            umask 077
            phase="$CUROBO_BYTE_GATE_ROOT/post"
            mkdir -m 0700 "$phase"
            mv "$RUNNER_TEMP/${TOOL}-pushed.tar" "$phase/image.tar"
            mv "$RUNNER_TEMP/${TOOL}-pushed-curobo-payload.json" "$phase/graph.json"
            chmod 0600 "$phase/image.tar" "$phase/graph.json"
            expected_image_id="$(jq -er '.expected_image_id' "$phase/graph.json")"
            npa/.venv/bin/python npa/scripts/image_byte_scan/prepare.py authorize \
              --analysis-root "$CUROBO_BYTE_GATE_ROOT" --trusted-root "$GITHUB_WORKSPACE" \
              --tools-receipt "$CUROBO_BYTE_GATE_ROOT/tools/dependency-receipt.json" \
              --native-receipt "$CUROBO_BYTE_GATE_ROOT/native/dependencies.json" \
              --archive "$phase/image.tar" --verification-report "$phase/graph.json" \
              --expected-image-id "$expected_image_id" \
              --output-dir "$phase/authorization" --policy-mode ci-regex
            npa/.venv/bin/python npa/scripts/scan_image_bytes.py \
              --analysis-root "$CUROBO_BYTE_GATE_ROOT" --trusted-root "$GITHUB_WORKSPACE" \
              --authorization "$phase/authorization/authorization.json" \
              --output-dir "$phase/scan" \
              --public-native-policy "$GITHUB_WORKSPACE/npa/scripts/image_byte_scan/public_policies/curobo-v2.json" \
              --public-native-policy-sha256 "$CUROBO_PUBLIC_NATIVE_POLICY_SHA256"
            rm -f "$phase/image.tar"
          fi
          if [ "$TOOL" = ltx2 ]; then
            npa/.venv/bin/python npa/scripts/scan_image_ltx_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --output "$RUNNER_TEMP/${TOOL}-pushed-ltx-payload.json"
          fi
          if [ "$TOOL" = wan2-2 ]; then
            npa/.venv/bin/python npa/scripts/scan_image_wan_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --output "$RUNNER_TEMP/${TOOL}-pushed-wan-payload.json"
          fi
          if [ "$TOOL" = alpamayo2-super ]; then
            npa/.venv/bin/python npa/scripts/scan_image_alpamayo2_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}-pushed.tar"
          fi
          if [ "$TOOL" = libero ]; then
            libero_export_container="$(docker create "$exact")"
            docker export --output "$RUNNER_TEMP/${TOOL}-pushed-rootfs.tar" \
              "$libero_export_container"
            docker container rm "$libero_export_container" >/dev/null
            libero_export_container=""
            npa/.venv/bin/python npa/scripts/scan_image_libero_payload.py \
              --docker-save "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --exported-rootfs "$RUNNER_TEMP/${TOOL}-pushed-rootfs.tar" \
              --build-metadata "$RUNNER_TEMP/libero-build-metadata.json" \
              --base-provenance "$RUNNER_TEMP/libero-base-provenance.intoto.json" \
              --expected-image-inventory-sha256 "$LIBERO_PRIVATE_IMAGE_INVENTORY_SHA256" \
              --expected-config-digest "$LIBERO_PRIVATE_CONFIG_DIGEST" \
              --expected-canonical-build-metadata-sha256 "$LIBERO_QUALIFIED_CANONICAL_BUILD_METADATA_SHA256" \
              --expected-base-provenance-sha256 "$LIBERO_QUALIFIED_BASE_PROVENANCE_SHA256" \
              --image-inventory-output "$RUNNER_TEMP/${TOOL}-pushed-image-inventory.json" \
              --output "$RUNNER_TEMP/${TOOL}-pushed-libero-payload.json"
            rm -f "$RUNNER_TEMP/${TOOL}-pushed-rootfs.tar"
          fi
          if [ "$TOOL" = cosmos3-serving ]; then
            npa/.venv/bin/python npa/scripts/scan_image_cosmos3_serving_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --json "$RUNNER_TEMP/${TOOL}-pushed-cosmos3-serving-payload.json"
          fi
          if [ "$TOOL" = cosmos3-ray-serve ]; then
            npa/.venv/bin/python npa/scripts/scan_image_cosmos3_ray_serve_payload.py \
              --tarball "$RUNNER_TEMP/${TOOL}-pushed.tar" \
              --json "$RUNNER_TEMP/${TOOL}-pushed-cosmos3-ray-serve-payload.json"
          fi
          if [ "$TOOL" = sonic-mujoco ]; then
            docker pull "$exact"
            docker run --rm --entrypoint /opt/npa/venv/bin/python "$exact" \
              /opt/npa/docker/workbench/sonic/verify_mujoco_image.py
          fi
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package_and_tag="${path#*/}"
          package="${package_and_tag%:*}"
          encoded="${package//\//%2F}"
          package_api="/orgs/${owner}/packages/container/${encoded}"
          if [ "$TOOL" = libero ]; then
            # This is the last operation before the package-wide visibility
            # transition. Re-read the complete version set and qualified OCI
            # graph so no tag, version, or embedded attestation can be injected.
            test "$(gh api "$package_api" --jq .visibility)" = private
            test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
              "$LIBERO_PACKAGE_WRITER_REPOSITORY"
            test "$LIBERO_PACKAGE_WRITER_REPOSITORY" = "$GITHUB_REPOSITORY"
            versions="$RUNNER_TEMP/libero-final-package-versions.json"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$versions"
            jq -e --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              ([.[].name] | sort) == $expected and
              ([.[] | select(.name == $root)] | length) == 1 and
              all(.[]; (.metadata.container.tags // []) == [])
            ' "$versions" >/dev/null

            root_manifest="$RUNNER_TEMP/libero-final-index.json"
            crane manifest "$exact" > "$root_manifest"
            test "$(crane digest "$exact")" = "$LIBERO_QUALIFIED_OCI_DIGEST"
            jq -e --arg runtime "$LIBERO_QUALIFIED_PLATFORM_MANIFEST_DIGEST" \
              --arg attestation "$LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST" '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length) == 2 and
              ([.manifests[] | select(.digest == $runtime and .platform == {"architecture":"amd64","os":"linux"})] | length) == 1 and
              ([.manifests[] | select(.digest == $attestation and .annotations["vnd.docker.reference.digest"] == $runtime and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 1
            ' "$root_manifest" >/dev/null
            attestation_manifest="$RUNNER_TEMP/libero-final-attestation-manifest.json"
            test "$(crane digest "${repository}@${LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST}")" = \
              "$LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST"
            crane manifest "${repository}@${LIBERO_QUALIFIED_ATTESTATION_MANIFEST_DIGEST}" > "$attestation_manifest"
            test "$(jq -r '.config.digest' "$attestation_manifest")" = \
              "$LIBERO_QUALIFIED_ATTESTATION_CONFIG_DIGEST"
            config_blob="$RUNNER_TEMP/libero-final-attestation-config.json"
            crane blob "$repository" "$LIBERO_QUALIFIED_ATTESTATION_CONFIG_DIGEST" > "$config_blob"
            test "sha256:$(sha256sum "$config_blob" | cut -d ' ' -f 1)" = \
              "$LIBERO_QUALIFIED_ATTESTATION_CONFIG_DIGEST"
            expected_layers="$RUNNER_TEMP/libero-final-expected-layers.json"
            printf '%s' "$LIBERO_QUALIFIED_ATTESTATION_LAYERS" > "$expected_layers"
            test "$(jq '.layers | length' "$attestation_manifest")" = \
              "$(jq 'length' "$expected_layers")"
            while IFS= read -r index; do
              expected="$(jq -c ".[$index]" "$expected_layers")"
              jq -e --argjson expected "$expected" \
                ".layers[$index] | {predicate_type:.annotations[\"in-toto.io/predicate-type\"],digest,size_bytes:.size} == \$expected" \
                "$attestation_manifest" >/dev/null
              layer_digest="$(jq -r '.digest' <<<"$expected")"
              layer_size="$(jq -r '.size_bytes' <<<"$expected")"
              predicate_type="$(jq -r '.predicate_type' <<<"$expected")"
              layer="$RUNNER_TEMP/libero-final-attestation-layer-$index.json"
              crane blob "$repository" "$layer_digest" > "$layer"
              test "$(wc -c < "$layer")" = "$layer_size"
              test "sha256:$(sha256sum "$layer" | cut -d ' ' -f 1)" = "$layer_digest"
              jq -e --arg predicate "$predicate_type" \
                --arg subject "${LIBERO_QUALIFIED_PLATFORM_MANIFEST_DIGEST#sha256:}" '
                .predicateType == $predicate and
                any(.subject[]; .digest.sha256 == $subject)
              ' "$layer" >/dev/null
            done < <(jq -r 'keys[]' "$expected_layers")
          elif [ "$NPA_FIRST_PUBLICATION_REQUIRED" = 1 ]; then
            # The serialized preflight proved this package absent or empty.
            # Re-enumerate its complete post-push graph immediately before the
            # package-wide visibility change and reject every unexpected tag.
            versions="$RUNNER_TEMP/${TOOL}-final-package-versions.json"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$versions"
            jq -e --arg root "$DIGEST" --arg tag "dev-$DEVELOPMENT_SHA" '
              length == 1 and
              all(.[]; (.name | test("^sha256:[0-9a-f]{64}$"))) and
              ([.[] | select(.name == $root)] | length) == 1 and
              all(.[]; .name == $root and (.metadata.container.tags // []) == [$tag])
            ' "$versions" >/dev/null
          fi
          if [ "$(gh api "$package_api" --jq .visibility)" != public ]; then
            test "$(gh api "$package_api" --jq .visibility)" = private
            test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
              "$GITHUB_REPOSITORY"
            adjacent_versions="$RUNNER_TEMP/${TOOL}-adjacent-package-versions.json"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$adjacent_versions"
            test "$(jq -Sc '[.[] | {id:(.id|tostring),name,tags:(.metadata.container.tags // [])}] | sort_by(.id)' "$versions")" = \
              "$(jq -Sc '[.[] | {id:(.id|tostring),name,tags:(.metadata.container.tags // [])}] | sort_by(.id)' "$adjacent_versions")"
            gh api --method PATCH "$package_api" -f visibility=public >/dev/null
          fi
          test "$(gh api "$package_api" --jq .visibility)" = public
          if [ "$TOOL" = libero ] || [ "$NPA_FIRST_PUBLICATION_REQUIRED" = 1 ]; then
            post_versions="$RUNNER_TEMP/${TOOL}-public-package-versions.json"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$post_versions"
            test "$(jq -Sc '[.[] | {name, tags:(.metadata.container.tags // [])}] | sort_by(.name)' "$versions")" = \
              "$(jq -Sc '[.[] | {name, tags:(.metadata.container.tags // [])}] | sort_by(.name)' "$post_versions")"
          fi
          if [ "$TOOL" = libero ]; then
            test "$(crane digest "$exact")" = "$LIBERO_QUALIFIED_OCI_DIGEST"
          fi
          anonymous_config="$(mktemp -d)"
          anonymous_reference="$IMAGE"
          if [ "$TOOL" = libero ]; then
            anonymous_reference="$exact"
          fi
          anonymous_attempt=1
          while true; do
            anonymous_log="$RUNNER_TEMP/${TOOL}-anonymous-manifest-attempt-${anonymous_attempt}.log"
            if anonymous_digest="$(DOCKER_CONFIG="$anonymous_config" crane digest "$anonymous_reference" \
              2>"$anonymous_log")" && \
              DOCKER_CONFIG="$anonymous_config" crane manifest "$anonymous_reference" \
                >/dev/null 2>>"$anonymous_log"; then
              break
            fi
            cat "$anonymous_log" >&2
            if ! grep -Eq 'TOOMANYREQUESTS|429 Too Many Requests' "$anonymous_log"; then
              exit 1
            fi
            echo "GHCR throttled anonymous manifest attempt ${anonymous_attempt}; retrying" >&2
            anonymous_attempt=$((anonymous_attempt + 1))
            sleep 5
          done
          test "$anonymous_digest" = "$DIGEST"
          if [ "$TOOL" = libero ]; then
            # Tagging is the final registry mutation. If it partially succeeds,
            # the failure cleanup deletes the whole previously verified public
            # package graph, including every untagged platform/referrer version.
            crane tag "$exact" "dev-$DEVELOPMENT_SHA"
            test "$(crane digest "$IMAGE")" = "$LIBERO_QUALIFIED_OCI_DIGEST"
            tagged_versions="$RUNNER_TEMP/libero-tagged-package-versions.json"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$tagged_versions"
            jq -e --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
              --arg tag "dev-$DEVELOPMENT_SHA" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              ([.[].name] | sort) == $expected and
              all(.[];
                if .name == $root
                then (.metadata.container.tags // []) == [$tag]
                else (.metadata.container.tags // []) == []
                end)
            ' "$tagged_versions" >/dev/null
            test "$(DOCKER_CONFIG="$anonymous_config" crane digest "$IMAGE")" = \
              "$LIBERO_QUALIFIED_OCI_DIGEST"
            DOCKER_CONFIG="$anonymous_config" crane manifest "$IMAGE" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/${TOOL}-pushed.tar"
          echo "Validated public development digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "The dev tag is public; later deletion cannot revoke prior downloads." >> "$GITHUB_STEP_SUMMARY"

  cleanup-requested:
    needs: resolve
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.cleanup_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.cleanup_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete only the exact unpromoted development version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          TOOL: ${{ matrix.tool }}
          LIBERO_QUALIFIED_OCI_DIGEST: ${{ matrix.libero_qualified_oci_digest }}
          LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS: ${{ matrix.libero_qualified_package_version_digests }}
          LIBERO_PACKAGE_WRITER_REPOSITORY: ${{ matrix.libero_package_writer_repository }}
        run: |
          set -euo pipefail
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package_and_tag="${path#*/}"
          package="${package_and_tag%:*}"
          tag="${package_and_tag##*:}"
          encoded="${package//\//%2F}"
          package_api="/orgs/${owner}/packages/container/${encoded}"
          versions="$(mktemp)"
          if ! gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$versions"; then
            response="$(mktemp)"
            if gh api -i "$package_api" >"$response" 2>&1; then
              echo "::error::Package exists but its versions could not be verified"
              exit 1
            elif grep -q '^HTTP/.* 404 ' "$response"; then
              echo "No package exists for requested cleanup." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Requested-cleanup package absence is unverified"
            exit 1
          fi
          if [ "$TOOL" = libero ]; then
            visibility="$(gh api "$package_api" --jq .visibility)"
            test "$visibility" = public || {
              echo "::error::Refusing requested cleanup of retained private LIBERO evidence"
              exit 1
            }
            test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
              "$LIBERO_PACKAGE_WRITER_REPOSITORY"
            test "$LIBERO_PACKAGE_WRITER_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$(crane digest "$IMAGE")" = "$LIBERO_QUALIFIED_OCI_DIGEST"
            jq -e --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
              --arg tag "$tag" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              ([.[].name] | sort) == $expected and
              ([.[] | select(.name == $root)] | length) == 1 and
              all(.[];
                if .name == $root
                then (.metadata.container.tags // []) == [$tag]
                else (.metadata.container.tags // []) == []
                end)
            ' "$versions" >/dev/null
            # LIBERO's platform and attestation versions are deliberately
            # untagged. Package-wide deletion is the only complete public
            # cleanup once exact signed ownership and graph equality hold.
            gh api --method DELETE "$package_api"
            response="$(mktemp)"
            if gh api -i "$package_api" >"$response" 2>&1; then
              echo "::error::Requested LIBERO package still exists after deletion"
              exit 1
            elif ! grep -q '^HTTP/.* 404 ' "$response"; then
              echo "::error::Requested LIBERO package absence is unverified"
              exit 1
            fi
            echo "Deleted the complete exact requested public LIBERO OCI graph." >> "$GITHUB_STEP_SUMMARY"
            echo "Deletion does not revoke downloads made while the package was public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          matches="$(jq --arg tag "$tag" '[.[] | select((.metadata.container.tags // []) | index($tag))]' "$versions")"
          count="$(jq length <<<"$matches")"
          if [ "$count" = 0 ]; then
            echo "Requested development tag is already absent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$count" = 1
          tags="$(jq -c '.[0].metadata.container.tags // []' <<<"$matches")"
          test "$tags" = "[\"$tag\"]" || {
            echo "::error::Refusing cleanup: digest also carries tags $tags"
            exit 1
          }
          version_id="$(jq -r '.[0].id' <<<"$matches")"
          digest="$(jq -r '.[0].name' <<<"$matches")"
          test "$digest" = "$(crane digest "$IMAGE")"
          if [ "$(jq length "$versions")" = 1 ]; then
            # GHCR refuses deletion of a package's last tagged version. The
            # package itself is exact and run-owned only after proving it has
            # this one version and this one dev tag.
            gh api --method DELETE "$package_api"
          else
            gh api --method DELETE "${package_api}/versions/${version_id}"
          fi
          echo "Deleted exact development tag $tag at $digest." >> "$GITHUB_STEP_SUMMARY"
          echo "Deletion does not revoke downloads made while the public tag existed." >> "$GITHUB_STEP_SUMMARY"

  cleanup-failed-build:
    needs: [resolve, build-development]
    # This separate-runner reconciliation survives a build runner SIGKILL and
    # covers both failure and cancellation after package visibility changed.
    if: ${{ always() && needs.resolve.outputs.build_count != '0' && contains(fromJSON('["failure","cancelled"]'), needs.build-development.result) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove an exact run-owned dev tag after a failed build batch
        if: matrix.tool != 'ncore'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          TOOL: ${{ matrix.tool }}
          LIBERO_QUALIFIED_OCI_DIGEST: ${{ matrix.libero_qualified_oci_digest }}
          LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS: ${{ matrix.libero_qualified_package_version_digests }}
          LIBERO_PACKAGE_WRITER_REPOSITORY: ${{ matrix.libero_package_writer_repository }}
        run: |
          set -euo pipefail
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package_and_tag="${path#*/}"
          package="${package_and_tag%:*}"
          tag="${package_and_tag##*:}"
          repository="${IMAGE%:*}"
          encoded="${package//\//%2F}"
          package_api="/orgs/${owner}/packages/container/${encoded}"
          versions="$(mktemp)"
          if ! gh api --paginate --slurp "${package_api}/versions?per_page=100" | jq 'add' > "$versions"; then
            response="$(mktemp)"
            if gh api -i "$package_api" >"$response" 2>&1; then
              echo "::error::Failed-build package exists but its versions could not be verified"
              exit 1
            elif grep -q '^HTTP/.* 404 ' "$response"; then
              echo "No package exists for failed-build cleanup." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Failed-build package absence is unverified"
            exit 1
          fi
          if [ "$TOOL" = libero ]; then
            visibility="$(gh api "$package_api" --jq .visibility)"
            test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
              "$LIBERO_PACKAGE_WRITER_REPOSITORY"
            test "$LIBERO_PACKAGE_WRITER_REPOSITORY" = "$GITHUB_REPOSITORY"
            qualified_rows="$(mktemp)"
            if ! jq -e --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
              --arg tag "$tag" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              ($expected | length > 0 and length == (unique | length) and
                all(.[]; test("^sha256:[0-9a-f]{64}$")) and
                index($root) != null) and
              ([.[] | select(.name as $name | $expected | index($name))] |
                (length == ($expected | length)) and
                ([.[].name] | sort) == ($expected | sort) and
                (map(.id) | length == (unique | length)) and
                all(.[];
                  (.id | tostring | test("^[1-9][0-9]*$")) and
                  if .name == $root
                  then ((.metadata.container.tags // []) == [] or
                        (.metadata.container.tags // []) == [$tag])
                  else (.metadata.container.tags // []) == []
                  end))
            ' "$versions" >/dev/null; then
              echo "::error::Failed LIBERO cleanup cannot isolate every qualified ownership-bound version"
              echo "WARNING: unresolved failed LIBERO candidate state was preserved for recovery." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            jq --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              [.[] | select(.name as $name | $expected | index($name)) |
                {id:(.id | tostring), name,
                 tags:(.metadata.container.tags // [])}] |
              sort_by(.name == $root)
            ' "$versions" > "$qualified_rows"
            if [ "$visibility" = private ]; then
              echo "Retained the private qualified LIBERO versions; no public mutation occurred." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            test "$visibility" = public || {
              echo "::error::Unsupported failed LIBERO package visibility: $visibility"
              exit 1
            }
            unrelated_before="$(mktemp)"
            jq --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              [.[] | select(.name as $name | $expected | index($name) | not) |
                {id:(.id | tostring), name,
                 tags:(.metadata.container.tags // [])}] | sort_by(.id)
            ' "$versions" > "$unrelated_before"
            if jq -e 'length == 0' "$unrelated_before" >/dev/null; then
              # The package-wide fallback is lawful only for the complete signed
              # graph, with no unrelated version, after access is private again.
              gh api --method PATCH "$package_api" -f visibility=private >/dev/null
              test "$(gh api "$package_api" --jq .visibility)" = private
              test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
                "$LIBERO_PACKAGE_WRITER_REPOSITORY"
              current_versions="$(mktemp)"
              gh api --paginate --slurp "${package_api}/versions?per_page=100" |
                jq 'add' > "$current_versions"
              jq -e --arg root "$LIBERO_QUALIFIED_OCI_DIGEST" \
                --arg tag "$tag" \
                --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
                ([.[].name] | sort) == $expected and
                ([.[] | select(.name == $root)] | length) == 1 and
                all(.[];
                  if .name == $root
                  then ((.metadata.container.tags // []) == [] or
                        (.metadata.container.tags // []) == [$tag])
                  else (.metadata.container.tags // []) == []
                  end)
              ' "$current_versions" >/dev/null
              gh api --method DELETE "$package_api"
              response="$(mktemp)"
              if gh api -i "$package_api" >"$response" 2>&1; then
                echo "::error::Failed LIBERO candidate package still exists after cleanup"
                exit 1
              elif ! grep -q '^HTTP/.* 404 ' "$response"; then
                echo "::error::Failed LIBERO candidate package absence is unverified"
                exit 1
              fi
              echo "Deleted the complete exact failed public LIBERO OCI graph after restoring private visibility." >> "$GITHUB_STEP_SUMMARY"
              echo "Deletion does not revoke downloads made while the package was public." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            while IFS=$'\t' read -r version_id digest expected_tags; do
              current_versions="$(mktemp)"
              gh api --paginate --slurp "${package_api}/versions?per_page=100" |
                jq 'add' > "$current_versions"
              jq -e --arg id "$version_id" --arg digest "$digest" \
                --argjson tags "$expected_tags" '
                [.[] | select((.id | tostring) == $id and .name == $digest and
                  (.metadata.container.tags // []) == $tags)] | length == 1
              ' "$current_versions" >/dev/null || {
                echo "::error::Qualified LIBERO version identity changed during cleanup"
                exit 1
              }
              gh api --method DELETE "${package_api}/versions/${version_id}"
            done < <(jq -r '.[] | [.id, .name, (.tags | tojson)] | @tsv' "$qualified_rows")
            post_versions="$(mktemp)"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" |
              jq 'add' > "$post_versions"
            jq -e --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              all(.[]; (.name as $name | $expected | index($name) | not))
            ' "$post_versions" >/dev/null || {
              echo "::error::Failed LIBERO candidate versions remain after cleanup"
              exit 1
            }
            jq -e --slurpfile before "$unrelated_before" \
              --argjson expected "$LIBERO_QUALIFIED_PACKAGE_VERSION_DIGESTS" '
              ([.[] | select(.name as $name | $expected | index($name) | not) |
                {id:(.id | tostring), name,
                 tags:(.metadata.container.tags // [])}] | . as $after |
                all($before[0][]; . as $prior |
                  any($after[]; . == $prior)))
            ' "$post_versions" >/dev/null || {
              echo "::error::Unrelated LIBERO package versions changed during cleanup"
              exit 1
            }
            echo "Deleted only the exact qualified failed public LIBERO OCI versions." >> "$GITHUB_STEP_SUMMARY"
            echo "Deletion does not revoke downloads made while the package was public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          matches="$(jq --arg tag "$tag" '[.[] | select((.metadata.container.tags // []) | index($tag))]' "$versions")"
          count="$(jq length <<<"$matches")"
          if [ "$count" = 0 ]; then
            echo "No pushed run-owned dev tag exists for cleanup." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$count" = 1
          tags="$(jq -c '.[0].metadata.container.tags // []' <<<"$matches")"
          test "$tags" = "[\"$tag\"]" || {
            echo "::error::Refusing cleanup: digest also carries tags $tags"
            exit 1
          }
          version_id="$(jq -r '.[0].id' <<<"$matches")"
          digest="$(jq -r '.[0].name' <<<"$matches")"
          test "$digest" = "$(crane digest "$IMAGE")"
          visibility="$(gh api "$package_api" --jq .visibility)"
          if [ "$visibility" != private ] && [ "$visibility" != public ]; then
            echo "::error::Unsupported failed-build package visibility: $visibility"
            exit 1
          fi
          test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
            "$GITHUB_REPOSITORY"
          current_versions="$(mktemp)"
          gh api --paginate --slurp "${package_api}/versions?per_page=100" |
            jq 'add' > "$current_versions"
          jq -e --arg id "$version_id" --arg digest "$digest" --arg tag "$tag" '
            [.[] | select(
              (.id | tostring) == $id and .name == $digest and
              (.metadata.container.tags // []) == [$tag]
            )] | length == 1
          ' "$current_versions" >/dev/null || {
            echo "::error::Refusing cleanup: exact run-owned version identity changed"
            exit 1
          }
          classified="$(mktemp)"
          python - "$repository" "$digest" "$version_id" \
            "$tag" "$current_versions" "$classified" <<'PY'
          import json
          import re
          import subprocess
          import sys

          repository, root, root_id, tag, versions_path, output_path = sys.argv[1:]
          versions = json.load(open(versions_path, encoding="utf-8"))
          if not isinstance(versions, list) or not versions:
              raise SystemExit("failed-build package version graph is malformed")
          identities = [str(item.get("id") or "") for item in versions if isinstance(item, dict)]
          if len(identities) != len(versions) or len(set(identities)) != len(versions) or any(re.fullmatch(r"[1-9][0-9]*", item) is None for item in identities):
              raise SystemExit("failed-build package version identities are ambiguous")
          owned = []
          unrelated = []
          for item in versions:
              row = {
                  "id": str(item["id"]),
                  "name": str(item.get("name") or ""),
                  "tags": item.get("metadata", {}).get("container", {}).get("tags") or [],
              }
              if re.fullmatch(r"sha256:[0-9a-f]{64}", row["name"]) is None or not isinstance(row["tags"], list):
                  raise SystemExit("failed-build package version record is malformed")
              if row["id"] == root_id:
                  if row["name"] != root or row["tags"] != [tag]:
                      raise SystemExit("failed-build root candidate identity changed")
                  owned.append(row)
                  continue
              # A subject relationship is not proof that this run created a
              # version. Preserve every identity except the exact root id,
              # digest, and singleton tag captured from this run's push.
              unrelated.append(row)
          owned.sort(key=lambda row: (row["name"] == root, row["id"]))
          unrelated.sort(key=lambda row: row["id"])
          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump({"owned": owned, "unrelated": unrelated}, stream, sort_keys=True)
              stream.write("\n")
          PY
          if jq -e '.unrelated | length == 0' "$classified" >/dev/null; then
            # Revoke public reachability first, then re-read the complete closed
            # graph and package identity immediately before final-version cleanup.
            if [ "$visibility" = public ]; then
              gh api --method PATCH "$package_api" -f visibility=private >/dev/null
            fi
            test "$(gh api "$package_api" --jq .visibility)" = private
            test "$(gh api "$package_api" --jq '.repository.full_name // ""')" = \
              "$GITHUB_REPOSITORY"
            final_versions="$(mktemp)"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" |
              jq 'add' > "$final_versions"
            jq -e --slurpfile classified "$classified" '
              ([.[] | {id:(.id | tostring), name,
                tags:(.metadata.container.tags // [])}] |
                sort_by([.name == $classified[0].owned[-1].name, .id])) ==
              $classified[0].owned
            ' "$final_versions" >/dev/null
            gh api --method DELETE "$package_api"
            response="$(mktemp)"
            if gh api -i "$package_api" >"$response" 2>&1; then
              echo "::error::Failed-build candidate package still exists after cleanup"
              exit 1
            elif ! grep -q '^HTTP/.* 404 ' "$response"; then
              echo "::error::Failed-build candidate package absence is unverified"
              exit 1
            fi
            echo "Deleted the complete exact failed candidate/referrer graph after restoring private visibility." >> "$GITHUB_STEP_SUMMARY"
            echo "Deletion does not revoke downloads made while the package was public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$visibility" = private ]; then
            echo "::error::Refusing package fallback: unpublished candidate graph contains unrelated versions"
            exit 1
          fi
          unrelated_before="$(mktemp)"
          jq '.unrelated' "$classified" > "$unrelated_before"
          while IFS=$'\t' read -r owned_id owned_digest owned_tags; do
            latest="$(mktemp)"
            gh api --paginate --slurp "${package_api}/versions?per_page=100" |
              jq 'add' > "$latest"
            jq -e --arg id "$owned_id" --arg digest "$owned_digest" \
              --argjson tags "$owned_tags" '
              [.[] | select((.id | tostring) == $id and .name == $digest and
                (.metadata.container.tags // []) == $tags)] | length == 1
            ' "$latest" >/dev/null
            gh api --method DELETE "${package_api}/versions/${owned_id}"
          done < <(jq -r '.owned[] | [.id, .name, (.tags | tojson)] | @tsv' "$classified")
          post_versions="$(mktemp)"
          gh api --paginate --slurp "${package_api}/versions?per_page=100" |
            jq 'add' > "$post_versions"
          jq -e --slurpfile classified "$classified" --slurpfile before "$unrelated_before" '
            all(.[]; (.name as $name | [$classified[0].owned[].name] | index($name) | not)) and
            ([.[] | {id:(.id | tostring), name,
              tags:(.metadata.container.tags // [])}] | sort_by(.id)) == $before[0]
          ' "$post_versions" >/dev/null
          echo "Deleted the exact failed candidate and bound referrers while preserving unrelated versions." >> "$GITHUB_STEP_SUMMARY"
          echo "Deletion does not revoke downloads made while the public tag existed." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [resolve, build-development]
    # Promotion is deliberately a separate dispatch after exact-digest GPU
    # acceptance. A build or cleanup dispatch must never fall through into an
    # unrelated all-image release preflight (or a release write when dry_run is
    # false).
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.build_count == '0' && needs.resolve.outputs.cleanup_count == '0' && (needs.build-development.result == 'success' || needs.build-development.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
      DEVELOPMENT_SHA: ${{ needs.resolve.outputs.development_sha }}
      SELECTED_TOOLS: ${{ inputs.tool }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
      NPA_PUBLIC_REGISTRY: ${{ needs.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install NPA
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/pip install -e npa

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan and preflight immutable public development digests
        run: |
          args=(--target "$TARGET" --development-sha "$DEVELOPMENT_SHA")
          if [ -n "$SELECTED_TOOLS" ]; then
            args+=(--release-tag "$RELEASE_TAG" --expected-source-digest "$EXPECTED_SOURCE_DIGEST")
            npa/.venv/bin/python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode plan
            npa/.venv/bin/python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode preflight
          else
            npa/.venv/bin/python -m npa.deploy.publish_public "${args[@]}" --dry-run
            npa/.venv/bin/python -m npa.deploy.publish_public \
              "${args[@]}" ${{ inputs.skip_missing && '--skip-missing' || '' }} --preflight
          fi

      - name: Promote exact validated digests and verify public parity
        if: ${{ inputs.dry_run == false }}
        run: |
          args=(--target "$TARGET" --development-sha "$DEVELOPMENT_SHA")
          if [ -n "$SELECTED_TOOLS" ]; then
            args+=(--release-tag "$RELEASE_TAG" --expected-source-digest "$EXPECTED_SOURCE_DIGEST")
            npa/.venv/bin/python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode publish
          else
            npa/.venv/bin/python -m npa.deploy.publish_public \
              "${args[@]}" ${{ inputs.skip_missing && '--skip-missing' || '' }}
          fi
          # Dev and release tags share one GHCR version after promotion. Retain the dev
          # tag deliberately: GHCR version deletion would also remove the supported tag.
          echo "Retained immutable dev tags as release provenance because they share the promoted digest." >> "$GITHUB_STEP_SUMMARY"
