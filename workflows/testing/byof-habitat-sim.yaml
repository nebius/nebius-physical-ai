apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: byof-habitat-sim
  description: >
    Registry-candidate BYOF workflow for Habitat-Sim. Builds the pinned MIT
    source with headless EGL and Bullet, fetches only the immutable official
    Skokloster Castle test scene at run time, and records a real RGB/depth
    agent traversal on one RTX PRO 6000 Blackwell.
config:
  bucket: example-bucket
  repo_url: "https://github.com/facebookresearch/habitat-sim.git"
  repo_ref: "57ee4941dc4765240f0f91f70b2c97a919bf9038"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: ubuntu
  base_image: "ubuntu:22.04@sha256:281c5745f657873d78e5531fc5ba8575f46ab7769b94550ac99543f122679986"
  apt_snapshot: "20260903T121500Z"
  build_command: >
    apt-get update &&
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    build-essential ca-certificates curl git libegl1
    libegl1-mesa-dev libgl1 libgl1-mesa-dev libglm-dev libglvnd-dev
    libjpeg-dev libomp-dev mesa-utils pkg-config python3-dev &&
    rm -rf /var/lib/apt/lists/* &&
    printf '%s\n'
    'attrs==26.1.0 --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309'
    'boto3==1.43.91 --hash=sha256:5ff948cfac8bff72227930e0894a8542731e1998634d1ffd8a074c20a90af919'
    'botocore==1.43.91 --hash=sha256:f96363d4caf50bce45fe2fdc2d4d86b3bea7f5cd805169d53c1371c2dd4772b6'
    'cmake==3.28.3 --hash=sha256:d3bc42bf54ea3d64e5d81eb31275076817507cf4a6aa07a49ffc01985cae1f09'
    'contourpy==1.3.2 --hash=sha256:ad687a04bc802cbe8b9c399c07162a3c35e227e2daccf1668eb1f278cb698631'
    'cycler==0.12.1 --hash=sha256:85cef7cff222d8644161529808465972e51340599459b8ac3ccbac5a854e0d30'
    'exceptiongroup==1.3.1 --hash=sha256:a7a39a3bd276781e98394987d3a5701d0c4edffb633bb7a5144577f82c773598'
    'fonttools==4.64.0 --hash=sha256:d16102cbcd4615b09c64e6022733faccc93200785f1ab0d4493afb8b0261edde'
    'gitdb==4.0.12 --hash=sha256:67073e15955400952c6565cc3e707c554a4eea2e428946f7a4c162fab9bd9bcf'
    'gitpython==3.1.62 --hash=sha256:7002251225e10e29d2e1f49e6532613fe5d5d9f0b6f1f02997a52b38fe56899e'
    'imageio==2.37.4 --hash=sha256:1ab2e22c8debf700f24c3ac43e8f95f3b3a8110c83b93411e97b4b0b2cd1c7e6'
    'imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282'
    'jmespath==1.1.0 --hash=sha256:a5663118de4908c91729bea0acadca56526eb2698e83de10cd116ae0f4e97c64'
    'kiwisolver==1.5.1 --hash=sha256:e05c2f7925f1d88778e53cb44f14e0223204a3bdd09a41664750363acfb1f2ef'
    'llvmlite==0.49.0 --hash=sha256:854941c2267fd4fc5b2ce02b8af8ecdffa79fb7784591d3a89370322039ea09f'
    'matplotlib==3.10.9 --hash=sha256:1aa972116abb4c9d201bf245620b433726cb6856f3bef6a78f776a00f5c92d37'
    'ninja==1.13.2 --hash=sha256:65a24341b5ac09fcadcc37082660be40a94174e51a937fabf6e2cae26225fa2c'
    'numba==0.67.0 --hash=sha256:d6c8e9ba3f9602471e8c6f563ffcce8db8046741f0bafb782a052e41dc6b6861'
    'numpy==2.2.6 --hash=sha256:fc7b73d02efb0e18c000e9ad8b83480dfcd5dfd11065997ed4c6747470ae8915'
    'numpy-quaternion==2024.0.13 --hash=sha256:e4da767ba9f44c9427ed244c7e9bb8c75f98f6efb32ed1b297b00e2fa8ee4202'
    'packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c'
    'pathspec==1.1.1 --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189'
    'pillow==10.4.0 --hash=sha256:e4d49b85c4348ea0b31ea63bc75a9f3857869174e2bf17e7aba02945cd218e6f'
    'pybind11==3.1.0 --hash=sha256:b8488090f8acffbcb6b5d6a85571a6827a0a2981ffb75e5a0b27b87c4a6b7dd0'
    'pyparsing==3.3.2 --hash=sha256:850ba148bd908d7e2411587e247a1e4f0327839c40e2e5e6d05a007ecc69911d'
    'python-dateutil==2.9.0.post0 --hash=sha256:a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427'
    's3transfer==0.19.2 --hash=sha256:d8168eccca828cbb2cd573675333f3bddd254313a9c42494b84c76b539e8ba25'
    'scikit-build-core==0.12.2 --hash=sha256:6ea4730da400f9a998ec3287bd3ebc1d751fe45ad0a93451bead8618adbc02b1'
    'scipy==1.15.3 --hash=sha256:9e2abc762b0811e09a0d3258abee2d98e0c703eee49464ce0069590846f31d40'
    'six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274'
    'smmap==5.0.3 --hash=sha256:c106e05d5a61449cf6ba9a1e650227ecfb141590d2a98412103ff35d89fc7b2f'
    'tomli==2.4.1 --hash=sha256:0d85819802132122da43cb86656f8d1f8c6587d54ae7dcaf30e90533028b49fe'
    'tqdm==4.70.0 --hash=sha256:7f585706bfddbdebf89daac705b2dfcc16890130727d3197ca62c732b4310953'
    'typing-extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8'
    'urllib3==2.7.0 --hash=sha256:9fb4c81ebbb1ce9531cce37674bbc6f1360472bc18ca9a553ede278ef7276897'
    > /opt/byof/npa_habitat_requirements.lock &&
    PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --no-cache-dir
    --only-binary=:all: --no-deps --require-hashes
    -r /opt/byof/npa_habitat_requirements.lock &&
    git submodule update --init --jobs 8
    src/deps/assimp src/deps/bullet3 src/deps/corrade src/deps/magnum
    src/deps/magnum-bindings src/deps/magnum-integration
    src/deps/magnum-plugins src/deps/openexr src/deps/pybind11
    src/deps/rapidjson src/deps/recastnavigation src/deps/tinyobjloader
    src/deps/zstd &&
    HABITAT_BUILD_GUI_VIEWERS=OFF HABITAT_WITH_BULLET=ON HABITAT_WITH_CUDA=OFF
    SKBUILD_CMAKE_BUILD_TYPE=Release
    PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --no-cache-dir .
    --no-build-isolation --no-deps &&
    python3 -m pip check &&
    python3 -m pip freeze --all | LC_ALL=C sort > /opt/byof/npa_python_packages.txt &&
    dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort
    > /opt/byof/npa_debian_packages.txt
  workload: solution-smoke
  smoke_command: |
    export MAGNUM_LOG="verbose"
    export HABITAT_SIM_LOG="verbose"
    export NVIDIA_DRIVER_CAPABILITIES="${NVIDIA_DRIVER_CAPABILITIES:-compute,graphics,utility}"
    unset DISPLAY
    python3 - <<'PY'
    import ctypes
    import hashlib
    import json
    import math
    import os
    import re
    import subprocess
    import time
    import urllib.request
    import zipfile
    from pathlib import Path

    import numpy as np
    from PIL import Image

    import habitat_sim
    from habitat_sim.utils.settings import default_sim_settings, make_cfg


    SOURCE_REVISION = "57ee4941dc4765240f0f91f70b2c97a919bf9038"
    ARCHIVE_URL = "http://dl.fbaipublicfiles.com/habitat/habitat-test-scenes.zip"
    ARCHIVE_SHA256 = "1231420c6482e79e25beea7ab25121e0421a5fd67b68dd9502145442c288db06"
    ARCHIVE_BYTES = 94590970
    SCENE_NAME = "skokloster-castle.glb"
    NAVMESH_NAME = "skokloster-castle.navmesh"
    SCENE_SHA256 = "b14e29e17f5e31d86a1002eefd77b7d345b265006481739ae480a847e6623f56"
    NAVMESH_SHA256 = "1a9a5bd123af8001f0ea2c5c8d326cb3fd39808ca771fc766856af8f0772391d"
    ASSET_LICENSE_URL = "https://creativecommons.org/licenses/by/4.0/legalcode.en"
    ORIGINAL_ASSET_URL = (
        "https://sketchfab.com/3d-models/"
        "the-kings-hall-d18155613363445b9b68c0c67196d98d"
    )
    MEMBER_SPECS = {
        SCENE_NAME: {
            "archive_member": (
                "data/scene_datasets/habitat-test-scenes/skokloster-castle.glb"
            ),
            "bytes": 38295764,
            "crc32": "7a0ced74",
            "sha256": SCENE_SHA256,
        },
        NAVMESH_NAME: {
            "archive_member": (
                "data/scene_datasets/habitat-test-scenes/skokloster-castle.navmesh"
            ),
            "bytes": 28192,
            "crc32": "a694cab0",
            "sha256": NAVMESH_SHA256,
        },
    }
    PYTHON_LOCK_SHA256 = "14408a8959a829803f45d8978ff3d02c9debd9ed1d2f166687924fd61a052225"
    EXPECTED_RGB_SHAPE = [240, 320, 4]
    EXPECTED_DEPTH_SHAPE = [240, 320]
    CAPABILITY = "skokloster_castle_rgb_depth_bullet_traversal"

    output_dir = Path(os.environ["NPA_SMOKE_OUTPUT_DIR"])
    output_dir.mkdir(parents=True, exist_ok=True)
    frames_dir = output_dir / "habitat-sim-observations"
    frames_dir.mkdir(parents=True, exist_ok=True)


    def sha256_file(path):
        digest = hashlib.sha256()
        with path.open("rb") as stream:
            for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                digest.update(chunk)
        return digest.hexdigest()


    def download_exact_archive(destination, opener=urllib.request.urlopen):
        request = urllib.request.Request(
            ARCHIVE_URL, headers={"User-Agent": "npa-habitat-sim-smoke/1"}
        )
        digest = hashlib.sha256()
        size = 0
        try:
            with (
                opener(request, timeout=120) as response,
                destination.open("wb") as stream,
            ):
                for chunk in iter(lambda: response.read(1024 * 1024), b""):
                    digest.update(chunk)
                    stream.write(chunk)
                    size += len(chunk)
            os.chmod(destination, 0o600)
            actual = digest.hexdigest()
            if size != ARCHIVE_BYTES or actual != ARCHIVE_SHA256:
                raise RuntimeError(
                    f"official archive identity mismatch: bytes={size}, sha256={actual}"
                )
        except Exception:
            destination.unlink(missing_ok=True)
            raise
        return {"url": ARCHIVE_URL, "bytes": size, "sha256": actual}


    def extract_exact_member(bundle, root, output_name, spec):
        matches = [
            item
            for item in bundle.infolist()
            if item.filename == spec["archive_member"]
        ]
        if len(matches) != 1:
            raise RuntimeError(
                f"official archive member count for {output_name}: {len(matches)}"
            )
        member = matches[0]
        if (
            member.file_size != spec["bytes"]
            or f"{member.CRC:08x}" != spec["crc32"]
        ):
            raise RuntimeError(f"official archive metadata mismatch for {output_name}")
        destination = root / output_name
        temporary = destination.with_suffix(destination.suffix + ".part")
        digest = hashlib.sha256()
        try:
            with bundle.open(member) as source, temporary.open("wb") as stream:
                for chunk in iter(lambda: source.read(1024 * 1024), b""):
                    digest.update(chunk)
                    stream.write(chunk)
            actual = digest.hexdigest()
            if actual != spec["sha256"]:
                raise RuntimeError(
                    f"official archive member hash mismatch for {output_name}: {actual}"
                )
            os.chmod(temporary, 0o600)
            temporary.replace(destination)
        except Exception:
            temporary.unlink(missing_ok=True)
            raise
        return destination, {
            "name": member.filename,
            "bytes": member.file_size,
            "compressed_bytes": member.compress_size,
            "crc32": f"{member.CRC:08x}",
            "sha256": actual,
        }


    def extract_exact_assets(archive_path, root):
        published = []
        try:
            with zipfile.ZipFile(archive_path) as bundle:
                bad_member = bundle.testzip()
                if bad_member is not None:
                    raise RuntimeError(
                        f"official archive ZIP integrity failure: {bad_member}"
                    )
                records = {}
                for output_name, spec in MEMBER_SPECS.items():
                    destination, record = extract_exact_member(
                        bundle, root, output_name, spec
                    )
                    published.append(destination)
                    records[output_name] = record
        except zipfile.BadZipFile as error:
            for destination in published:
                destination.unlink(missing_ok=True)
            raise RuntimeError("official archive is not a valid ZIP") from error
        except Exception:
            for destination in published:
                destination.unlink(missing_ok=True)
            raise
        return records


    def fetch_scene_assets(opener=urllib.request.urlopen, root=None):
        root = (
            Path("/tmp/npa-habitat-test-scenes") if root is None else Path(root)
        )
        root.mkdir(parents=True, exist_ok=True, mode=0o700)
        os.chmod(root, 0o700)
        archive_path = root / "habitat-test-scenes.zip.part"
        archive_path.unlink(missing_ok=True)
        try:
            archive = download_exact_archive(archive_path, opener=opener)
            records = extract_exact_assets(archive_path, root)
        finally:
            archive_path.unlink(missing_ok=True)
        archive.update(
            {
                "url_is_mutable": True,
                "zip_integrity": "pass",
                "ephemeral_copy_removed": not archive_path.exists(),
                "unrelated_members_extracted": False,
            }
        )
        return root / SCENE_NAME, root / NAVMESH_NAME, archive, records


    def query_gpu():
        completed = subprocess.run(
            [
                "nvidia-smi",
                "--query-gpu=name,compute_cap",
                "--format=csv,noheader,nounits",
            ],
            check=True,
            capture_output=True,
            text=True,
        )
        rows = []
        for line in completed.stdout.splitlines():
            if not line.strip():
                continue
            name, compute_capability = [part.strip() for part in line.rsplit(",", 1)]
            rows.append(
                {
                    "model": name,
                    "compute_capability": compute_capability,
                }
            )
        if len(rows) != 1:
            raise RuntimeError(f"Habitat-Sim requires exactly one visible GPU, observed {len(rows)}")
        gpu = rows[0]
        normalized_name = re.sub(r"[^A-Z0-9]+", "", gpu["model"].upper())
        if "RTXPRO6000BLACKWELL" not in normalized_name:
            raise RuntimeError(f"expected RTX PRO 6000 Blackwell, observed {gpu['model']!r}")
        if gpu["compute_capability"] != "12.0":
            raise RuntimeError(
                "expected Blackwell compute capability 12.0, observed "
                f"{gpu['compute_capability']!r}"
            )
        return {
            "count": 1,
            "model": gpu["model"],
            "architecture": "Blackwell",
            "compute_capability": gpu["compute_capability"],
            "observation_source": "nvidia-smi inside the workload pod",
        }


    def current_gl_strings(sim):
        sim.renderer.acquire_gl_context()
        gl = ctypes.CDLL("libGL.so.1")
        gl.glGetString.argtypes = [ctypes.c_uint]
        gl.glGetString.restype = ctypes.c_char_p

        def read_string(enum):
            value = gl.glGetString(enum)
            return value.decode("utf-8", errors="replace") if value else ""

        values = {
            "vendor": read_string(0x1F00),
            "renderer": read_string(0x1F01),
            "version": read_string(0x1F02),
        }
        if "nvidia" not in values["vendor"].lower():
            raise RuntimeError(f"headless renderer is not NVIDIA: {values}")
        return values


    def loaded_egl_libraries():
        maps = Path("/proc/self/maps").read_text(encoding="utf-8", errors="replace")
        libraries = sorted(
            {
                line.rsplit(None, 1)[-1]
                for line in maps.splitlines()
                if "/" in line and ("libEGL" in line or "libGLX_nvidia" in line)
            }
        )
        if not any("libEGL.so" in item for item in libraries):
            raise RuntimeError(f"EGL dispatch library is not loaded: {libraries}")
        if not any("libEGL_nvidia.so" in item for item in libraries):
            raise RuntimeError(f"NVIDIA EGL implementation is not loaded: {libraries}")
        return libraries


    source_metadata = json.loads(
        (Path(os.environ["BYOF_REPO_ROOT"]) / "npa_source_metadata.json").read_text(
            encoding="utf-8"
        )
    )
    observed_source_revision = subprocess.run(
        ["git", "rev-parse", "HEAD"],
        cwd=os.environ["BYOF_REPO_ROOT"],
        check=True,
        capture_output=True,
        text=True,
    ).stdout.strip()
    if source_metadata.get("ref") != SOURCE_REVISION or observed_source_revision != SOURCE_REVISION:
        raise RuntimeError(
            "Habitat-Sim source provenance is not bound to the required immutable revision"
        )

    pod_image = os.environ.get("BYOF_IMAGE", "").removeprefix("docker:").strip()
    image_match = re.fullmatch(r".+@(?P<digest>sha256:[0-9a-f]{64})", pod_image)
    if image_match is None:
        raise RuntimeError(f"workload pod image is not immutable: {pod_image!r}")

    inventory_paths = {
        "python_lock": Path(os.environ["BYOF_REPO_ROOT"])
        / "npa_habitat_requirements.lock",
        "python_packages": Path(os.environ["BYOF_REPO_ROOT"])
        / "npa_python_packages.txt",
        "debian_packages": Path(os.environ["BYOF_REPO_ROOT"])
        / "npa_debian_packages.txt",
    }
    if sha256_file(inventory_paths["python_lock"]) != PYTHON_LOCK_SHA256:
        raise RuntimeError("the image's Habitat-Sim Python lock does not match the reviewed lock")
    runtime_package_inventory = {}
    for name, path in inventory_paths.items():
        if not path.is_file() or path.stat().st_size == 0:
            raise RuntimeError(f"missing image package inventory: {name}")
        runtime_package_inventory[name] = {
            "path": path.name,
            "bytes": path.stat().st_size,
            "sha256": sha256_file(path),
        }

    scene_path, navmesh_path, archive_provenance, asset_records = fetch_scene_assets()
    scene_record = asset_records[SCENE_NAME]
    navmesh_record = asset_records[NAVMESH_NAME]
    if scene_path.with_suffix(".navmesh") != navmesh_path:
        raise RuntimeError("scene and navmesh do not share the basename required for auto-loading")

    gpu = query_gpu()
    if os.environ.get("DISPLAY"):
        raise RuntimeError("headless EGL gate refuses a workload with DISPLAY set")
    if not habitat_sim.bindings.built_with_bullet:
        raise RuntimeError("Habitat-Sim was not built with Bullet physics")

    settings = default_sim_settings.copy()
    settings.update(
        {
            "scene": str(scene_path),
            "width": EXPECTED_RGB_SHAPE[1],
            "height": EXPECTED_RGB_SHAPE[0],
            "color_sensor": True,
            "depth_sensor": True,
            "semantic_sensor": False,
            "enable_physics": True,
            "physics_config_file": str(
                Path(os.environ["BYOF_REPO_ROOT"]) / "data/default.physics_config.json"
            ),
            "seed": 7,
        }
    )
    configuration = make_cfg(settings)
    configuration.sim_cfg.random_seed = 7
    configuration.sim_cfg.gpu_device_id = 0

    rgb_hash = hashlib.sha256()
    depth_hash = hashlib.sha256()
    frame_records = []
    finite_depth_chunks = []
    action_trace = []
    collisions = 0

    with habitat_sim.Simulator(configuration) as sim:
        if not sim.pathfinder.is_loaded:
            raise RuntimeError("the immutable Skokloster Castle navmesh did not load")

        agent = sim.initialize_agent(0)
        start = None
        goal = None
        geodesic_distance = None
        actions = None
        for _ in range(64):
            candidate_start = sim.pathfinder.get_random_navigable_point()
            candidate_goal = sim.pathfinder.get_random_navigable_point_near(
                candidate_start, 3.0, max_tries=100
            )
            shortest_path = habitat_sim.ShortestPath()
            shortest_path.requested_start = candidate_start
            shortest_path.requested_end = candidate_goal
            if not sim.pathfinder.find_path(shortest_path):
                continue
            if not math.isfinite(shortest_path.geodesic_distance):
                continue
            if shortest_path.geodesic_distance < 1.0:
                continue
            state = agent.get_state()
            state.position = candidate_start
            agent.set_state(state, reset_sensors=True)
            follower = sim.make_greedy_follower(agent_id=0, goal_radius=0.2)
            try:
                candidate_actions = follower.find_path(candidate_goal)
            except habitat_sim.errors.GreedyFollowerError:
                continue
            candidate_actions = [action for action in candidate_actions if action is not None]
            if "move_forward" not in candidate_actions:
                continue
            start = np.asarray(candidate_start, dtype=np.float64)
            goal = np.asarray(candidate_goal, dtype=np.float64)
            geodesic_distance = float(shortest_path.geodesic_distance)
            actions = candidate_actions
            break
        if start is None or goal is None or actions is None:
            raise RuntimeError("could not construct a real navigable Skokloster traversal")

        start_state = np.asarray(agent.get_state().position, dtype=np.float64)
        physics_time_start = float(sim.get_world_time())
        render_started = time.perf_counter()
        for index, action in enumerate(actions):
            observations = sim.step(action, dt=1.0 / 60.0)
            action_trace.append(str(action))
            collisions += int(bool(observations.get("collided", False)))
            rgb = np.ascontiguousarray(observations["color_sensor"])
            depth = np.ascontiguousarray(observations["depth_sensor"], dtype=np.float32)
            if list(rgb.shape) != EXPECTED_RGB_SHAPE:
                raise RuntimeError(f"unexpected RGB shape: {rgb.shape}")
            if list(depth.shape) != EXPECTED_DEPTH_SHAPE:
                raise RuntimeError(f"unexpected depth shape: {depth.shape}")
            finite = depth[np.isfinite(depth)]
            if finite.size == 0:
                raise RuntimeError(f"depth frame {index} has no finite samples")
            finite_depth_chunks.append(finite.astype(np.float64, copy=False))

            rgb_bytes = rgb.tobytes(order="C")
            depth_bytes = depth.tobytes(order="C")
            rgb_hash.update(rgb_bytes)
            depth_hash.update(depth_bytes)
            rgb_path = frames_dir / f"rgb-{index:04d}.png"
            depth_path = frames_dir / f"depth-{index:04d}.npy"
            depth_preview_path = frames_dir / f"depth-{index:04d}.png"
            Image.fromarray(rgb, mode="RGBA").save(rgb_path)
            np.save(depth_path, depth, allow_pickle=False)
            depth_scale = max(float(np.percentile(finite, 99)), 1.0e-6)
            depth_preview = np.clip(depth / depth_scale, 0.0, 1.0)
            depth_preview[~np.isfinite(depth_preview)] = 0.0
            Image.fromarray((depth_preview * 255.0).astype(np.uint8), mode="L").save(
                depth_preview_path
            )
            frame_records.append(
                {
                    "index": index,
                    "action": str(action),
                    "rgb_shape": list(rgb.shape),
                    "rgb_raw_sha256": hashlib.sha256(rgb_bytes).hexdigest(),
                    "rgb_png_path": str(rgb_path.relative_to(output_dir)),
                    "rgb_png_bytes": rgb_path.stat().st_size,
                    "rgb_png_sha256": sha256_file(rgb_path),
                    "depth_shape": list(depth.shape),
                    "depth_raw_sha256": hashlib.sha256(depth_bytes).hexdigest(),
                    "depth_npy_path": str(depth_path.relative_to(output_dir)),
                    "depth_npy_bytes": depth_path.stat().st_size,
                    "depth_npy_sha256": sha256_file(depth_path),
                    "depth_preview_png_path": str(
                        depth_preview_path.relative_to(output_dir)
                    ),
                    "depth_preview_png_bytes": depth_preview_path.stat().st_size,
                    "depth_preview_png_sha256": sha256_file(depth_preview_path),
                }
            )
        render_elapsed = time.perf_counter() - render_started
        end_state = np.asarray(agent.get_state().position, dtype=np.float64)
        physics_time_end = float(sim.get_world_time())
        gl_strings = current_gl_strings(sim)
        egl_libraries = loaded_egl_libraries()

    frame_count = len(frame_records)
    if frame_count == 0:
        raise RuntimeError("agent traversal produced no rendered frames")
    displacement = float(np.linalg.norm(end_state - start_state))
    if displacement <= 0.1:
        raise RuntimeError(f"agent traversal displacement is not nonzero enough: {displacement}")
    if len({item["rgb_raw_sha256"] for item in frame_records}) < 2:
        raise RuntimeError("RGB traversal observations did not change")
    if len({item["depth_raw_sha256"] for item in frame_records}) < 2:
        raise RuntimeError("depth traversal observations did not change")
    if physics_time_end <= physics_time_start:
        raise RuntimeError("Bullet world time did not advance")

    finite_depth = np.concatenate(finite_depth_chunks)
    if render_elapsed <= 0.0:
        raise RuntimeError(f"invalid render duration: {render_elapsed}")
    measured_fps = frame_count / render_elapsed
    if not math.isfinite(measured_fps) or measured_fps <= 0.0:
        raise RuntimeError(f"invalid measured renderer FPS: {measured_fps}")
    proof = {
        "solution": "habitat-sim",
        "capability": CAPABILITY,
        "capabilities_exercised": [
            CAPABILITY,
            "headless_nvidia_egl_rgb_depth_render",
            "bullet_physics_world_step",
            "greedy_geodesic_agent_traversal",
        ],
        "source_revision": SOURCE_REVISION,
        "source": {
            "repository": "https://github.com/facebookresearch/habitat-sim",
            "requested_revision": source_metadata.get("ref"),
            "observed_revision": observed_source_revision,
            "license": "MIT",
        },
        "scene_id": "habitat_test_scenes/skokloster-castle.glb",
        "scene_sha256": SCENE_SHA256,
        "scene_license": "CC BY 4.0",
        "scene": {
            "source": "official Meta Habitat test-scene archive",
            "archive": archive_provenance,
            "id": "habitat_test_scenes/skokloster-castle.glb",
            "sha256": SCENE_SHA256,
            "bytes": scene_record["bytes"],
            "archive_member": scene_record,
            "license": "CC BY 4.0",
            "license_url": ASSET_LICENSE_URL,
            "attribution": "The King's Hall, Skokloster Castle; scan by Erik Lernestål",
            "original_asset": {
                "name": "The King's Hall",
                "creator": "Skokloster Castle",
                "scan_credit": "Erik Lernestål",
                "url": ORIGINAL_ASSET_URL,
            },
            "modification_notice": (
                "Official Habitat-ready processed GLB and navmesh derived from the "
                "original scan; NPA copies the selected members byte-for-byte."
            ),
            "immutability_boundary": (
                "The source URL is mutable; the complete archive and both selected "
                "members must match their pinned SHA-256 values."
            ),
            "navmesh_sha256": NAVMESH_SHA256,
            "navmesh_bytes": navmesh_record["bytes"],
            "navmesh_archive_member": navmesh_record,
        },
        "rendered_rgb_frame_count": frame_count,
        "rendered_depth_frame_count": frame_count,
        "rendered_observations": {
            "rgb": {
                "frame_count": frame_count,
                "shape": EXPECTED_RGB_SHAPE,
                "dtype": "uint8",
                "aggregate_raw_sha256": rgb_hash.hexdigest(),
            },
            "depth": {
                "frame_count": frame_count,
                "shape": EXPECTED_DEPTH_SHAPE,
                "dtype": "float32",
                "aggregate_raw_sha256": depth_hash.hexdigest(),
            },
            "frames": frame_records,
            "saved_directory": frames_dir.name,
        },
        "finite_depth_statistics": {
            "count": int(finite_depth.size),
            "minimum": float(np.min(finite_depth)),
            "maximum": float(np.max(finite_depth)),
            "mean": float(np.mean(finite_depth)),
            "standard_deviation": float(np.std(finite_depth)),
        },
        "agent": {
            "start": start_state.tolist(),
            "end": end_state.tolist(),
            "goal": goal.tolist(),
            "displacement": displacement,
            "planned_geodesic_distance": geodesic_distance,
            "actions": action_trace,
            "collision_count": collisions,
        },
        "agent_start": start_state.tolist(),
        "agent_end": end_state.tolist(),
        "agent_displacement": displacement,
        "bullet": {
            "built_with_bullet": True,
            "enabled": True,
            "step_count": frame_count,
            "world_time_start": physics_time_start,
            "world_time_end": physics_time_end,
        },
        "bullet_step_count": frame_count,
        "measured_fps": measured_fps,
        "renderer_egl_evidence": {
            "backend": "EGL",
            "display_unset": True,
            "gl": gl_strings,
            "process_loaded_libraries": egl_libraries,
        },
        "observed_gpu": gpu,
        "observed_rtx_gpu_model": gpu["model"],
        "observed_rtx_gpu_architecture": gpu["architecture"],
        "observed_rtx_gpu_count": gpu["count"],
        "pod_observed_immutable_image": pod_image,
        "pod_observed_image_digest": image_match.group("digest"),
        "image_observation_source": (
            "BYOF_IMAGE injected by the digest-resolving runner; live acceptance "
            "independently verifies Kubernetes containerStatuses[].imageID"
        ),
        "runtime_package_inventory": runtime_package_inventory,
        "exit_status": 0,
    }
    proof_path = output_dir / "habitat-sim-smoke.json"
    proof_path.write_text(json.dumps(proof, indent=2, sort_keys=True), encoding="utf-8")
    print(json.dumps(proof, indent=2, sort_keys=True), flush=True)
    print(
        "NPA_CAPABILITY_RESULT "
        + json.dumps(
            {
                "solution": proof["solution"],
                "capability": proof["capability"],
                "frames": frame_count,
                "displacement": displacement,
                "bullet_steps": frame_count,
                "fps": measured_fps,
                "gpu_model": gpu["model"],
                "gpu_architecture": gpu["architecture"],
                "gpu_count": gpu["count"],
                "image_digest": image_match.group("digest"),
                "exit_status": 0,
            },
            separators=(",", ":"),
        ),
        flush=True,
    )
    PY
  solution_name: "habitat-sim"
  capability_name: "skokloster_castle_rgb_depth_bullet_traversal"
  smoke_artifact_name: "habitat-sim-smoke.json"
  resource_profile_yaml: "byof-solution-smoke-habitat-sim-rtxpro-gpu"
  task: "skokloster-castle-agent-traversal"
  iterations: 1
  num_envs: 1
  num_demos: 1
  wait_timeout: -1
  poll_interval: 60
  output_root: s3://{{config.bucket}}/oss-solutions/habitat-sim
