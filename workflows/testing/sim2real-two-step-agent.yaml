# DEMO ONLY — agent-generated two-state DSL fixture, not the 14-stage engine.
apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sim2real-two-step
  description: >
    DEMO ONLY: agent-generated Cosmos Transfer and raw-env fixture; it does not
    run the canonical 14-stage Sim2Real engine.

config:
  bucket: example-bucket
  prefix: "sim2real/{{run.id}}"
  env_count: "1000"

  trigger_uri: "s3://{{config.bucket}}/sim2real-triggers/{{run.id}}/lerobot-pusht/"
  augment_uri: "s3://{{config.bucket}}/{{config.prefix}}/augment/"
  augment_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/augment/manifest.json"
  raw_envs_uri: "s3://{{config.bucket}}/{{config.prefix}}/envs/raw/"
  # `npa.workflows.sim2real_envgen` takes the RUN ROOT and derives envs/raw,
  # envs/train, envs/heldout and envs/manifest under it; passing the raw prefix would
  # nest a second envs/raw inside it.
  envgen_root_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  shard_index: "0"
  shard_count: "1"
  train_fraction: "0.8"
  envgen_seed: "42"
  # Envgen resolves this transfer manifest and cycles over its exact frames[].uri list.
  augmented_frames_uri: "{{config.augment_manifest_uri}}"

resources:
  gpu:
    cloud: kubernetes
    accelerators: RTXPRO6000:1

initial: augment

states:
  augment:
    description: Real Cosmos Transfer augmentation conditioned on the seeded input video.
    toolRef: workbench.cosmos2.transfer_conditioned_execute
    resources: gpu
    inputs:
      - uri: "{{config.trigger_uri}}"
        schema: npa.sim2real.trigger_dataset.v1
    outputs:
      - uri: "{{config.augment_manifest_uri}}"
        schema: npa.cosmos2.transfer.v1
    next: envgen

  envgen:
    description: Generate raw envs using only frame URIs declared by transfer.
    needs: [augment]
    toolRef: workbench.sim2real_envgen.raw_shard
    resources: gpu
    inputs:
      - uri: "{{config.augment_manifest_uri}}"
        schema: npa.cosmos2.transfer.v1
    outputs:
      - uri: "{{config.raw_envs_uri}}raw-shard-00-summary.json"
        schema: npa.sim2real.raw_env_shard_summary.v1
    terminal: true
