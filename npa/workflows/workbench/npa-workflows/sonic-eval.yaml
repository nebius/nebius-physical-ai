apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sonic-eval
  description: Evaluate an exported SONIC ONNX locomotion policy.
  skypilotTwin: npa/src/npa/workflows/skypilot/sonic-eval.yaml

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/sonic-eval"
  episodes: "8"
  env: locomotion-smoke

  # Consume-only twin: point onnx_uri at an ONNX a previous `sonic export`
  # wrote. sonic-export-eval runs the whole train -> export -> eval chain when
  # there is nothing to consume yet.
  onnx_uri: "s3://{{config.bucket}}/{{config.prefix}}/sonic_policy.onnx"
  eval_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval.json"

resources:
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 8
    memory: 32Gi

initial: eval-onnx

states:
  eval-onnx:
    description: Evaluate an exported SONIC ONNX locomotion policy.
    toolRef: workbench.sonic.eval
    resources: gpu
    inputs:
      - uri: "{{config.onnx_uri}}"
        schema: npa.workbench.sonic.onnx.v1
    outputs:
      - uri: "{{config.eval_uri}}"
        schema: npa.workbench.sonic.eval.v1
    terminal: true
