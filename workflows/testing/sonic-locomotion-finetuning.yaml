apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: sonic-locomotion-finetuning
  description: Retarget motion, train SONIC, export and evaluate its native ONNX policy.
config:
  bucket: example-bucket
  prefix: runs/{{run.id}}/sonic-locomotion
  embodiment: unitree-g1
  source_format: auto
  sonic_runtime: local
  train_iterations: '40'
  episodes: '8'
  checkpoint_uri: '{{config.training_uri}}checkpoint.pt'
  data_uri: s3://{{config.bucket}}/{{config.prefix}}/data/
  motion_uri: s3://{{config.bucket}}/{{config.prefix}}/source/
  retargeted_uri: s3://{{config.bucket}}/{{config.prefix}}/retargeted/
  training_uri: s3://{{config.bucket}}/{{config.prefix}}/training/
  env: flat
  onnx_uri: '{{config.training_uri}}policy.onnx'
  eval_uri: s3://{{config.bucket}}/{{config.prefix}}/eval.json
resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 16
    memory: 80Gi
initial: retarget
states:
  retarget:
    description: Retarget source motion into the SONIC embodiment schema.
    toolRef: workbench.retargeting.run
    resources: cpu
    outputs:
    - uri: '{{config.retargeted_uri}}retargeting_result.json'
    next: train
  train:
    description: Train or smoke-validate a SONIC locomotion policy.
    needs:
    - retarget
    toolRef: workbench.sonic.train
    resources: gpu
    outputs:
    - uri: '{{config.checkpoint_uri}}'
    next: export
  export:
    description: Export the native SONIC policy to ONNX.
    needs:
    - train
    toolRef: workbench.sonic.export
    resources: gpu
    outputs:
    - uri: '{{config.onnx_uri}}'
    next: evaluate
  evaluate:
    description: Evaluate the native SONIC ONNX policy.
    needs:
    - export
    toolRef: workbench.sonic.eval
    resources: gpu
    outputs:
    - uri: '{{config.eval_uri}}'
    terminal: true
