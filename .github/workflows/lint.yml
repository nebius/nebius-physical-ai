name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # An open PR already receives pull_request runs, so feature-branch pushes do
  # not need a second copy. Cancel older lint work when that PR advances.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Ruff check (blocking)
        # Same scope as `make lint`. A narrower CI scope let unused imports sit
        # in npa/scripts, npa/examples and npa/docker while the documented
        # contributor command was red.
        run: cd npa && ruff check .

  docs-drift:
    # Fail when docs/cli/ is out of date relative to `npa --help`.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install npa
        run: cd npa && pip install -e .

      - name: Check CLI reference drift
        run: bash scripts/build_docs.sh --check
