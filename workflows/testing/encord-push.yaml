apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: encord-push
  description: Register S3 media with Encord SaaS and publish a durable receipt.

config:
  bucket: example-bucket
  prefix: "encord/{{run.id}}"
  encord_media_uri: "s3://{{config.bucket}}/raw-media/"
  encord_integration: "<encord-cloud-integration>"
  encord_folder: "npa-{{run.id}}"
  encord_dataset: "npa-{{run.id}}"
  encord_media_filter: "videos-images"
  encord_transfer: "register"
  encord_poll_timeout_seconds: "1800"
  encord_identity_sidecar_uri: ""
  encord_receipt_uri: "s3://{{config.bucket}}/{{config.prefix}}/push/push_receipt.json"

resources:
  cpu:
    cloud: kubernetes
    cpus: 2
    memory: 8Gi

initial: push

states:
  push:
    description: Register media in place and checkpoint exact Encord identity.
    toolRef: workbench.encord.push
    resources: cpu
    outputs:
      - uri: "{{config.encord_receipt_uri}}"
        schema: npa.encord.push_receipt.v1
    terminal: true
