apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: groot-1-7-finetune
  description: >
    Prove the exact canonical PushT task contract, execute immutable baseline
    and trained GR00T N1.7 checkpoints in paired closed-loop gym-pusht physics,
    require statistically supported task-outcome improvement, and publish
    synchronized real rollout video, MCAP, and Rerun artifacts. The platform is
    simulation; this workflow makes no physical-robot claim.

config:
  bucket: example-bucket
  prefix: "groot-1-7-task-performance/{{run.id}}"
  source_data_uri: "s3://{{config.bucket}}/groot-1-7-finetune/source/data/"
  baseline_checkpoint_uri: "s3://{{config.bucket}}/groot-1-7-finetune/checkpoints/baseline/"
  baseline_checkpoint_sha256: ae0edc5d0b8e8e13b7c892e18dd126d16feb9f1fb90a8dc64e7f4f55847143fb
  trained_checkpoint_uri: "s3://{{config.bucket}}/groot-1-7-finetune/checkpoints/posttrain/"
  trained_checkpoint_sha256: 7b7e91c989cdcc25611cab296b406de1a9cff81ab922120d3ecd8b099b5a4603
  gpu_type: RTXPRO6000
  paired_episodes: "24"
  horizon: "300"
  policy_batch_size: "4"
  final_seed_namespace: "groot17-pusht-final-v1-20260808"

  task_contract_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/task-contract.json"
  baseline_eval_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval/baseline/evaluation.json"
  baseline_rollout_prefix_uri: "s3://{{config.bucket}}/{{config.prefix}}/rollouts/baseline/"
  trained_eval_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval/trained/evaluation.json"
  trained_rollout_prefix_uri: "s3://{{config.bucket}}/{{config.prefix}}/rollouts/trained/"
  task_performance_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/task-performance-report.json"
  comparison_video_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/paired-task-performance.mp4"
  render_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/task-rollouts.json"
  mcap_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/task-performance.mcap"
  rrd_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/task-performance.rrd"
  publish_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/publish-manifest.json"
  workflow_uri: "s3://{{config.bucket}}/{{config.prefix}}/workflow.yaml"

resources:
  evaluator-gpu:
    cloud: kubernetes
    accelerators: "{{config.gpu_type}}:1"
    cpus: 16
    memory: 96Gi
    kubernetes:
      pod_config:
        spec:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
  artifact-cpu:
    cloud: kubernetes
    cpus: 8
    memory: 32Gi

initial: resolve_task_contract

states:
  resolve_task_contract:
    description: >
      Compare every converted logical data row with immutable lerobot/pusht,
      prove task text, shapes, action meaning, and current simulator frames,
      and pin gym-pusht package and source revisions.
    toolRef: workflow.groot.resolve_task_contract
    resources: artifact-cpu
    inputs:
      - uri: "{{config.source_data_uri}}"
        schema: nvidia.groot.lerobot.v2
    outputs:
      - uri: "{{config.task_contract_uri}}"
        schema: npa.groot.task_contract.v1
    next: evaluate_baseline_closed_loop

  evaluate_baseline_closed_loop:
    description: >
      Load and identity-check the immutable zero-update GR00T checkpoint, then
      use its actual forward outputs for every transition in live PushT physics
      on the reserved deterministic seed set.
    toolRef: workbench.groot.evaluate_baseline_closed_loop
    resources: evaluator-gpu
    inputs:
      - uri: "{{config.task_contract_uri}}"
        schema: npa.groot.task_contract.v1
      - uri: "{{config.baseline_checkpoint_uri}}"
        schema: nvidia.groot.n1.7.custom-embodiment-checkpoint
    outputs:
      - uri: "{{config.baseline_eval_uri}}"
        schema: npa.groot.closed_loop_eval.v1
      - uri: "{{config.baseline_rollout_prefix_uri}}"
        schema: npa.groot.live_rollouts.v1
    next: evaluate_trained_closed_loop

  evaluate_trained_closed_loop:
    description: >
      Load and identity-check the immutable trained GR00T checkpoint and repeat
      the identical model-controlled benchmark with the same initial states,
      horizon, observations, action postprocessing, and success predicate.
    toolRef: workbench.groot.evaluate_trained_closed_loop
    resources: evaluator-gpu
    inputs:
      - uri: "{{config.task_contract_uri}}"
        schema: npa.groot.task_contract.v1
      - uri: "{{config.trained_checkpoint_uri}}"
        schema: nvidia.groot.n1.7.finetuned-checkpoint
    outputs:
      - uri: "{{config.trained_eval_uri}}"
        schema: npa.groot.closed_loop_eval.v1
      - uri: "{{config.trained_rollout_prefix_uri}}"
        schema: npa.groot.live_rollouts.v1
    next: analyze_paired_outcomes

  analyze_paired_outcomes:
    description: >
      Verify pairing and execution truth, calculate per-episode task outcomes,
      paired percentile-bootstrap confidence intervals and a one-sided paired
      sign-randomization test, and fail unless actual outcomes improve.
    toolRef: workflow.groot.analyze_paired_outcomes
    resources: artifact-cpu
    inputs:
      - uri: "{{config.baseline_eval_uri}}"
        schema: npa.groot.closed_loop_eval.v1
      - uri: "{{config.trained_eval_uri}}"
        schema: npa.groot.closed_loop_eval.v1
    outputs:
      - uri: "{{config.task_performance_report_uri}}"
        schema: npa.groot.task_performance.v1
    next: render_task_rollouts

  render_task_rollouts:
    description: >
      Decode actual paired environment recordings and burn task, simulation,
      seed, step, score, outcome, and termination labels into synchronized
      baseline/trained comparisons containing successes and failures.
    toolRef: workflow.groot.render_task_rollouts
    resources: artifact-cpu
    inputs:
      - uri: "{{config.task_performance_report_uri}}"
        schema: npa.groot.task_performance.v1
    outputs:
      - uri: "{{config.comparison_video_uri}}"
        schema: video.mp4.closed-loop-paired-comparison
      - uri: "{{config.render_manifest_uri}}"
        schema: npa.groot.task_rollouts.v1
    next: emit_mcap

  emit_mcap:
    description: >
      Package actual rollout frames, model actions, object and goal poses,
      progress, success, paired deltas, rates, and logs into named Lichtblick
      topics with a common rollout clock.
    toolRef: workflow.groot.emit_task_mcap
    resources: artifact-cpu
    inputs:
      - uri: "{{config.task_performance_report_uri}}"
        schema: npa.groot.task_performance.v1
      - uri: "{{config.render_manifest_uri}}"
        schema: npa.groot.task_rollouts.v1
    outputs:
      - uri: "{{config.mcap_uri}}"
        schema: mcap.v1
    next: emit_rrd

  emit_rrd:
    description: >
      Emit a native Rerun task-performance blueprint with synchronized paired
      cameras, object/goal trajectories, coverage, success state, aggregate
      rates, paired-delta distribution, confidence interval, and outcome log.
    toolRef: workflow.groot.emit_task_rrd
    resources: artifact-cpu
    inputs:
      - uri: "{{config.task_performance_report_uri}}"
        schema: npa.groot.task_performance.v1
      - uri: "{{config.render_manifest_uri}}"
        schema: npa.groot.task_rollouts.v1
    outputs:
      - uri: "{{config.rrd_uri}}"
        schema: rerun.rrd.v1
    next: publish

  publish:
    description: >
      Independently decode and inspect the report, paired video, exact MCAP
      topics, Rerun entities/blueprint, and submitted workflow; publish only
      after every closed-loop truth, performance, and visualization gate passes.
    toolRef: workflow.groot.publish_task_performance
    resources: artifact-cpu
    inputs:
      - uri: "{{config.task_performance_report_uri}}"
        schema: npa.groot.task_performance.v1
      - uri: "{{config.comparison_video_uri}}"
        schema: video.mp4.closed-loop-paired-comparison
      - uri: "{{config.mcap_uri}}"
        schema: mcap.v1
      - uri: "{{config.rrd_uri}}"
        schema: rerun.rrd.v1
      - uri: "{{config.workflow_uri}}"
        schema: npa.workflow.v0.0.1
    outputs:
      - uri: "{{config.publish_manifest_uri}}"
        schema: npa.groot.task_performance_publish.v1
    terminal: true
