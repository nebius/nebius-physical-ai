name: confidentiality scan

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: confidentiality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
      INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install npa guardrail module
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e npa

      - name: Run confidentiality scans
        env:
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          scan_range=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scan_range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            scan_range="${MERGE_BASE}..HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            scan_range="${{ github.event.before }}..HEAD"
          fi

          args=(--repo-root . --tree)
          if [ -n "${scan_range}" ]; then
            args+=(--diff-range "${scan_range}")
          fi

          run_scan() {
            local pattern_env="$1"
            local label="$2"
            local required="$3"
            shift 3

            if [ "${required}" != "true" ] && [ -z "${!pattern_env:-}" ]; then
              echo "::warning::${label} confidentiality scan is not configured; populate the ${pattern_env} secret to enable supplemental denylist enforcement"
              return 0
            fi

            echo "Running ${label} confidentiality scan"
            if [ "${pattern_env}" = "CUSTOMER_DENYLIST" ]; then
              proof_directory="${RUNNER_TEMP}/ncore-source-attribution-proof"
              install -d -m 0700 "${proof_directory}"
              set -- "$@" --ncore-attribution-proof-directory "${proof_directory}"
            fi
            npa/.venv/bin/python -m npa.guardrails.confidentiality "${args[@]}" --pattern-env "${pattern_env}" "$@"
          }

          run_scan CUSTOMER_DENYLIST customer true
          run_scan INFRA_DENYLIST operator-private false --ignore-case
