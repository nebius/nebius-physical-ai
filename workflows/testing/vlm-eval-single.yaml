apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: vlm-eval-single
  description: Score a rollout prefix with the workbench VLM eval tool.

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/vlm-eval"
  vlm_backend: self-hosted
  # A 7B VLM's cold start (wheel resolution + ~16 GB of weights + first load)
  # does not fit a bounded run. The 2B Qwen2-VL is the same architecture and
  # the same self-hosted code path at roughly a quarter of the download.
  vlm_model: Qwen/Qwen2-VL-2B-Instruct
  vlm_ready_timeout_s: "1500"

  rollouts_uri: "s3://{{config.bucket}}/{{config.prefix}}/rollouts/"
  scores_uri: "s3://{{config.bucket}}/{{config.prefix}}/scores/"

resources:
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 16
    memory: 80Gi

initial: score-rollouts

states:
  score-rollouts:
    description: Evaluate rollouts and write a gating report.
    toolRef: workbench.vlm_eval.run
    resources: gpu
    outputs:
      # vlm_eval_stub.json is the tool's (legacy-named) result file; it holds a
      # real score whenever backend != stub.
      - uri: "{{config.scores_uri}}vlm_eval_stub.json"
        schema: npa.workbench.vlm_eval.report.v1
    terminal: true
