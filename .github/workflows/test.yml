name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # An open PR already receives pull_request runs, so feature-branch pushes do
  # not need a second copy. Cancel older tests when that PR advances.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-mocked:
    name: browser-and-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npa/tests/browser/package-lock.json
      - name: Install browser test dependencies
        run: npm ci --prefix npa/tests/browser
      - name: Set up Python for the production UI renderer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the production UI renderer
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e npa
      - name: Run mocked agent Cypress coverage
        run: npm run --prefix npa/tests/browser cy:mock

      - name: Set up Python 3.10 compatibility
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Python 3.10 compatibility environment
        run: |
          python -m venv npa/.venv-3.10
          npa/.venv-3.10/bin/python -m pip install -e "npa[dev,adapter]"

      - name: Run Python 3.10 compatibility regressions
        run: |
          npa/.venv-3.10/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

      - name: Set up Python 3.14 compatibility
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Python 3.14 compatibility environment
        run: |
          python -m venv npa/.venv-3.14
          npa/.venv-3.14/bin/python -m pip install -e "npa[dev,adapter]"

      - name: Run Python 3.14 compatibility regressions
        run: |
          npa/.venv-3.14/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

  test:
    name: pytest-${{ matrix.python-version }}-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run the complete suite once on the primary interpreter. Main keeps
        # full-suite coverage across every supported Python version.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.12", "3.14"]') }}
        shard: [1, 2, 3, 4]
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
      NPA_E2E_PROJECT_ID: project-test-00000000
      NPA_E2E_GROOT_BUCKET: test-bucket-00000000
      NPA_CI_SHARD_INDEX: ${{ matrix.shard }}
      NPA_CI_TOTAL_SHARDS: 4
      COVERAGE_FILE: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
      # The LTX-2.5 output validator decides whether a GPU run produced anything
      # worth keeping, and its tests skip themselves when ffmpeg is absent. On a
      # runner without ffmpeg that decision would go untested while the suite
      # still reported green, so require it here and fail loudly instead.
      NPA_REQUIRE_FFMPEG: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install ffmpeg
        # Runner vendor repositories (such as Chrome) can publish inconsistent
        # indexes. Media-validator prerequisites come from Ubuntu's signed sources.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install npa
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e "npa[dev,adapter]"
          echo "${GITHUB_WORKSPACE}/npa/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Python compatibility and image scan regressions
        if: matrix.shard == 1
        env:
          NPA_CI_SHARD_INDEX: 1
          NPA_CI_TOTAL_SHARDS: 1
        run: |
          npa/.venv/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

      - name: Install CPU checkpoint and export test runtime
        # Detector contract regressions exercise real tensor serialization and
        # Lance dataloaders. Installing torch also activates SONIC ONNX export
        # tests, so install their supported extra after selecting CPU wheels.
        run: |
          npa/.venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          npa/.venv/bin/python -m pip install -e "npa[sonic]"
          npa/.venv/bin/python -c "import torch, onnx, onnxscript, onnxruntime; assert torch.version.cuda is None"

      - name: Verify checked-out CLI flags
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: |
          cd npa
          git rev-parse HEAD
          .venv/bin/python - <<'PY'
          from pathlib import Path

          from click.utils import strip_ansi
          import npa
          from npa.cli.main import app
          from typer.testing import CliRunner

          module_path = Path(npa.__file__).resolve()
          print(f"npa module: {module_path}")

          runner = CliRunner()
          checks = [
              (["workbench", "fiftyone", "load-dataset", "--help"], "--format"),
              (["workbench", "lerobot", "deploy", "--help"], "--disk-size"),
              (["workbench", "genesis", "deploy", "--help"], "--disk-size"),
              (["workbench", "isaac-lab", "deploy", "--help"], "--disk-size"),
              (["workbench", "cosmos", "deploy", "--help"], "--disk-size"),
              (["workbench", "fiftyone", "deploy", "--help"], "--disk-size"),
          ]
          for args, flag in checks:
              result = runner.invoke(app, args)
              output = strip_ansi(result.output)
              if result.exit_code != 0:
                  raise SystemExit(
                      f"{' '.join(args)} failed with exit code {result.exit_code}\n{output}"
                  )
              if flag not in output:
                  raise SystemExit(
                      f"{flag} missing from {' '.join(args)} help output\n{output}"
                  )
          PY

      - name: Run pytest coverage shard
        run: |
          cd npa
          .venv/bin/python -m pytest tests/ -n auto --dist worksteal \
            --cov=src/npa --cov-report=

      - name: Upload coverage shard
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: npa/.coverage.${{ matrix.python-version }}.${{ matrix.shard }}
          include-hidden-files: true

      - name: Run CLI install test
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: cd npa && bash tests/integration/test_cli_install.sh

      - name: Check e2e shell scripts
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: |
          cd npa
          bash -n tests/e2e/test_lerobot_e2e.sh
          bash -n tests/e2e/test_genesis_e2e.sh
          bash -n tests/e2e/test_groot_e2e.sh
          bash -n tests/e2e/test_groot_composition_e2e.sh

      - name: Warn on source drift
        if: always() && matrix.python-version == '3.12' && matrix.shard == 1
        run: ./scripts/check-source-drift.sh

  coverage:
    name: coverage
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful pytest shards
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install coverage reporter
        run: python -m pip install "coverage[toml]==7.16.0"

      - name: Download coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: coverage-*
          path: npa/coverage-data
          merge-multiple: true

      - name: Enforce merged coverage floor
        # The floor sits below the current ~66% so version-dependent skips
        # don't flake the gate; raise it as coverage grows, never lower it.
        run: |
          cd npa
          python -m coverage combine coverage-data
          python -m coverage report --show-missing --fail-under=60
