apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: lyra-scene-actions
  executionMode: runtime
  description: Execute physical variations in an explicitly calibrated Lyra scene
    and publish a scene-matched offline HTML review.
config:
  bucket: example-bucket
  prefix: lyra-scene-actions/{{run.id}}
  source_overlay: '1'
  # The historical Isaac image digest is withdrawn. Supply one separately
  # qualified digest for the paired CPU and RTX action stages.
  required_immutable_images: [isaac_image]
  isaac_image: ''
  prepared_uri: s3://{{config.bucket}}/lyra-prepared/
  reconstruction_uri: s3://{{config.bucket}}/lyra-reconstruction/
  geometry_uri: s3://{{config.bucket}}/lyra-geometry/
  collection_uri: s3://{{config.bucket}}/{{config.prefix}}/collection/
  report_uri: s3://{{config.bucket}}/{{config.prefix}}/reports/
  review_uri: s3://{{config.bucket}}/{{config.prefix}}/review/
resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: '{{config.isaac_image}}'
  isaac:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
    cpus: 16
    memory: 96Gi
    image: '{{config.isaac_image}}'
initial: collect
states:
  collect:
    description: Execute fresh measured-state IK actions in each physical condition
      and capture aligned RTX transitions.
    resources: isaac
    run:
      argv:
      - python3
      - -m
      - npa.workflows.physical_augmentation
      - collect
      - --input-path
      - '{{config.prepared_uri}}'
      - --output-path
      - '{{config.collection_uri}}'
    inputs:
    - uri: '{{config.prepared_uri}}'
      schema: npa.physical-augmentation.recipe.v1
    outputs:
    - uri: '{{config.collection_uri}}collection.json'
      schema: npa.physical-augmentation.collection.v1
    next: report
  report:
    description: Recompute success, retain failure counts, and export accepted actions
      with genuine simulator video.
    resources: cpu
    run:
      argv:
      - python3
      - -m
      - npa.workflows.physical_augmentation
      - report
      - --input-path
      - '{{config.collection_uri}}'
      - --output-path
      - '{{config.report_uri}}'
    inputs:
    - uri: '{{config.collection_uri}}'
      schema: npa.physical-augmentation.collection.v1
    outputs:
    - uri: '{{config.report_uri}}report.json'
      schema: npa.physical-augmentation.report.v1
    - uri: '{{config.report_uri}}lerobot/meta/info.json'
      schema: lerobot.dataset.v3
    - uri: '{{config.report_uri}}demonstrations.rrd'
      schema: application/vnd.rerun.rrd
    - uri: '{{config.report_uri}}demo.html'
      schema: text/html
    - uri: '{{config.report_uri}}demo.mp4'
      schema: video/mp4
    - uri: '{{config.report_uri}}demo-validation.json'
      schema: npa.physical-augmentation.demo.v1
    next: review
  review:
    description: Bind native robot replay to the exact reconstruction and show source,
      Gaussian video, mesh, wrist view and measured action outcomes.
    resources: cpu
    run:
      argv:
      - python3
      - -m
      - npa.workflows.lyra_review_stage
      - --reconstruction-path
      - '{{config.reconstruction_uri}}'
      - --geometry-path
      - '{{config.geometry_uri}}'
      - --actions-path
      - '{{config.report_uri}}'
      - --output-path
      - '{{config.review_uri}}'
    inputs:
    - uri: '{{config.reconstruction_uri}}checksums.json'
    - uri: '{{config.geometry_uri}}checksums.json'
    - uri: '{{config.report_uri}}checksums.json'
    outputs:
    - uri: '{{config.review_uri}}index.html'
      schema: text/html
    terminal: true
