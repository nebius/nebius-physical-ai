name: harness guardrails

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  guardrails:
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_TEST_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image provenance guards verify source ancestry against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Create repository venv
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e "npa[dev]"

      - name: Install verified gitleaks release
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL --retry 5 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run guardrail tests
        run: npa/.venv/bin/python -m pytest npa/tests/guardrails -n auto --dist worksteal -q

      - name: Assert standard test collection is non-zero
        run: |
          cd npa
          .venv/bin/python -m pytest tests --ignore=tests/e2e --collect-only -q
