# Cosmos 3 generation (text2image / image2image / text2video / image2video /
# video2video).
#
# Runs the containerized runtime: `npa workbench cosmos3 generate` inside the
# npa-cosmos3 image, which ships the pinned cosmos-framework plus its cu130
# inference venv and NO model weights. The gated Cosmos3 checkpoint downloads on
# the node with the operator's own Hugging Face token, so pass HF_TOKEN as a
# secret env (and NGC_API_KEY when NPA_COSMOS3_REQUIRE_NGC=1). Render concrete
# values before submitting; secrets are never committed here.
#
# Guardrails are ON by default: NPA_COSMOS3_NO_GUARDRAILS stays empty so the
# --no-guardrails flag is not expanded. Only set it on an explicit opt-out.
name: cosmos3-generate
resources:
  cloud: kubernetes
  accelerators: H100:1
  cpus: 16+
  memory: 128+
  image_id: "docker:${NPA_COSMOS3_IMAGE}"
  # No disk_size: SkyPilot rejects it on Kubernetes. The pod uses node ephemeral
  # storage for the checkpoint cache; attach a volume if the node is too small.
envs:
  NPA_RUN_ID: ""
  NPA_COSMOS3_IMAGE: ""
  NPA_COSMOS3_MODE: "text2image"
  NPA_COSMOS3_PROMPT: "a robot arm sorting colored blocks on a white workbench in a bright robotics lab"
  NPA_COSMOS3_NAME: "npa-generate"
  NPA_COSMOS3_CHECKPOINT: "Cosmos3-Nano"
  NPA_COSMOS3_SEED: "0"
  NPA_COSMOS3_NUM_STEPS: ""
  NPA_COSMOS3_NEGATIVE_PROMPT: ""
  # Conditioning asset for image2video / video2video (local path, http(s), s3://).
  NPA_COSMOS3_INPUT_URI: ""
  # s3:// prefix for the published artifact; local-only when empty.
  NPA_COSMOS3_OUTPUT_URI: ""
  NPA_COSMOS3_OUTPUT_DIR: "/tmp/npa-cosmos3-generate"
  NPA_COSMOS3_NO_GUARDRAILS: ""
  NPA_COSMOS3_REQUIRE_NGC: "0"
  AWS_ENDPOINT_URL: "https://storage.eu-north1.nebius.cloud"
run: |
  set -euo pipefail

  test -n "${NPA_COSMOS3_PROMPT}"
  # No weights ship in the image. The checkpoint download needs the operator's
  # token, and so do the gated guardrail models whenever guardrails are on.
  if [ -z "${HF_TOKEN:-}${HUGGING_FACE_HUB_TOKEN:-}" ]; then
    echo "HF_TOKEN is required: npa-cosmos3 bakes no weights, so the gated" >&2
    echo "Cosmos3 checkpoint downloads at runtime under your own HF license" >&2
    echo "acceptance. Pass it as a secret env." >&2
    exit 1
  fi

  mkdir -p "${NPA_COSMOS3_OUTPUT_DIR}"

  npa workbench cosmos3 generate \
    --mode "${NPA_COSMOS3_MODE}" \
    --prompt "${NPA_COSMOS3_PROMPT}" \
    --name "${NPA_COSMOS3_NAME}" \
    --checkpoint "${NPA_COSMOS3_CHECKPOINT}" \
    --seed "${NPA_COSMOS3_SEED}" \
    --output-path "${NPA_COSMOS3_OUTPUT_URI:-${NPA_COSMOS3_OUTPUT_DIR}}" \
    --run-id "${NPA_RUN_ID:-}" \
    --output-json "${NPA_COSMOS3_OUTPUT_DIR}/generate.json" \
    ${NPA_COSMOS3_INPUT_URI:+--input-path "${NPA_COSMOS3_INPUT_URI}"} \
    ${NPA_COSMOS3_NEGATIVE_PROMPT:+--negative-prompt "${NPA_COSMOS3_NEGATIVE_PROMPT}"} \
    ${NPA_COSMOS3_NUM_STEPS:+--num-steps "${NPA_COSMOS3_NUM_STEPS}"} \
    ${NPA_COSMOS3_NO_GUARDRAILS:+--no-guardrails}

  cat "${NPA_COSMOS3_OUTPUT_DIR}/generate.json"
