# DEPRECATED compatibility-only Sim2Real DAG (pre-standard-runtime artifacts).
#
# The only canonical spec is ../npa-workflows/sim2real.yaml. This older
# npa.workflow/v1 document remains solely so archived callers can replay their
# pre-standard-runtime inputs through npa.workflows.sim2real.scheduler during the
# finite compatibility window (target removal: 0.5.0, no earlier than 2027-02-01).
# It is not a supported authoring or submission surface.
#
# Run it with:
#   python -m npa.workflows.sim2real run --dag <this-file> [--upload-artifacts ...]
#
# The legacy scheduler maps nodes to archived Sim2RealWorkflow methods. New work
# must use workflow_stage adapters under the ordinary npa.workflow runtime.
#
# Loop bounds resolve from config fields (config.<attr>) or integer literals.
# The `until` condition is a named predicate (no eval); currently only
# `promote_checkpoint` is supported, mapping to WorkflowState.should_promote().
apiVersion: npa.workflow/v1
name: sim2real-staged-loop

nodes:
  # ---- legacy preamble compatibility: stages 1-6 ----
  - id: preamble
    executor: preamble
    stages:                       # descriptive — implemented inside run_preamble()
      - stage_01_trigger
      - stage_02_assets
      - stage_03_augment
      - stage_04_envs_raw
      - stage_05_envs_train
      - stage_06_tokens

  # ---- legacy outer-loop compatibility: stages 7-11 ----
  - id: outer_loop
    executor: outer_iteration
    needs: [preamble]
    loop:
      max_iterations: config.outer_iterations
      until: promote_checkpoint
    body:                         # descriptive — implemented inside run_outer_iteration()
      inner_loop:
        repeat: config.inner_iterations
        stages:
          - stage_07_actions_train
          - stage_08_vlm_eval_train
          - stage_09_training_signal
      stages:
        - stage_10_eval_heldout
        - stage_11_outer_loop_decision

  # ---- legacy finalize compatibility: stages 12-14 ----
  - id: finalize
    executor: finalize
    needs: [outer_loop]
    stages:                       # descriptive — implemented inside run_finalize()
      - stage_12_external_validation
      - stage_13_retrigger
      - stage_14_rerun_viz
