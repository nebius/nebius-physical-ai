    'MAp0aWZmZmlsZT09MjAyNS41LjEwCnRvbWxpPT0yLjQuMQp0b3BwcmE9PTAuNi4zCnRvcmNoPT0yLjcuMStjdTEyOAp0b3Jj'
    'aHZpc2lvbj09MC4yMi4xK2N1MTI4CnRxZG09PTQuNjcuMQp0cmFpdGxldHM9PTUuMTYuMQp0cmFuc2Zvcm1zM2Q9PTAuNC4y'
    'CnRyaW1lc2g9PTQuNC4zCnRyaXRvbj09My4zLjEKdHlwaW5nLWV4dGVuc2lvbnM9PTQuMTYuMAp0eXBpbmctaW5zcGVjdGlv'
    'bj09MC40LjQKdHpkYXRhPT0yMDI2LjMKdXJsbGliMz09Mi43LjAKdmhhY2R4PT0wLjAuMTAKd2FycC1sYW5nPT0xLjEyLjAK'
    'd2N3aWR0aD09MC44LjMKd2Vya3pldWc9PTMuMS44CndoZWVsPT0wLjQ1LjEKd2lkZ2V0c25iZXh0ZW5zaW9uPT00LjAuMTYK'
    'eGF0bGFzPT0wLjAuMTEKeHhoYXNoPT00LjAuMQp5b3VyZGZweT09MC4wLjU4CnppcHA9PTQuMS4wCg=='
    | base64 -d > /tmp/robotwin-requirements.lock &&
    echo '5a2b78949b5be3e30089b930e2dfd2197a505f89a3b66cf26def2572306af5b8  /tmp/robotwin-requirements.lock'
    | sha256sum -c - &&
    python3 -m pip install --no-cache-dir
    --index-url https://pypi.org/simple
    --extra-index-url https://download.pytorch.org/whl/cu128
    -r /tmp/robotwin-requirements.lock &&
    git clone --no-checkout --filter=blob:none https://github.com/NVlabs/curobo.git /opt/curobo &&
    git -C /opt/curobo fetch --depth 1 origin d64c4b005459db10c5dd867d8b30a87d5bda9bdb &&
    git -C /opt/curobo checkout --detach d64c4b005459db10c5dd867d8b30a87d5bda9bdb &&
    TORCH_CUDA_ARCH_LIST=12.0 CMAKE_CUDA_ARCHITECTURES=120
    python3 -m pip install --no-cache-dir --no-deps --no-build-isolation /opt/curobo &&
    SAPIEN_LOCATION=$(python3 -m pip show sapien | awk '/^Location:/{print $2}') &&
    sed -i -E 's/("r")(\))( as)/\1, encoding="utf-8"\2\3/g'
    "${SAPIEN_LOCATION}/sapien/wrapper/urdf_loader.py" &&
    MPLIB_LOCATION=$(python3 -m pip show mplib | awk '/^Location:/{print $2}') &&
    sed -i -E 's/(if np.linalg.norm\(delta_twist\) < 1e-4 )(or collide )(or not within_joint_limit:)/\1\3/g'
    "${MPLIB_LOCATION}/mplib/planner.py" &&
    python3 -c "import cv2,h5py,mplib,numpy,sapien,torch,trimesh; import curobo; assert torch.version.cuda == '12.8'"
  workload: solution-smoke
  smoke_command: |
    export NVIDIA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:-all}"
    export NVIDIA_DRIVER_CAPABILITIES="${NVIDIA_DRIVER_CAPABILITIES:-all}"
    export VK_ICD_FILENAMES="${VK_ICD_FILENAMES:-/usr/share/vulkan/icd.d/nvidia_icd.json}"
    export VK_DRIVER_FILES="${VK_ICD_FILENAMES}"
    python3 - <<'PY'
    import hashlib
    import json
    import os
    import re
    import socket
    import subprocess
    import sys
    import traceback
    from pathlib import Path
    from zipfile import ZipFile

    import cv2
    import h5py
    import torch
    import yaml
    from huggingface_hub import hf_hub_download

    SOLUTION = "robotwin"
    CAPABILITY = "beat_block_hammer_successful_seed_replay_collection"
    SOURCE_REVISION = "96c1feab536306b50c26af200044fcdf126e8904"
    ASSET_REPO = "TianxingChen/RoboTwin2.0"
    ASSET_REVISION = "785feb15aa4a4f532395ad2b1d2be5f28cb561ad"
    CUROBO_REVISION = "d64c4b005459db10c5dd867d8b30a87d5bda9bdb"
    PYTHON_LOCK_SHA256 = "5a2b78949b5be3e30089b930e2dfd2197a505f89a3b66cf26def2572306af5b8"
    TASK = "beat_block_hammer"
    TASK_CONFIG = "demo_clean"
    ASSET_ARCHIVES = {
        "embodiments.zip": {
            "size_bytes": 219859313,
            "sha256": "6b87d7d55e106d8ff25917e0538eb1e177fc549280e8a742a8cec3cb9f953fc6",
        },
        "objects.zip": {
            "size_bytes": 3737778549,
            "sha256": "6aa56b3cf1e1064f7c809308144da36b00815f8b137fef2d7e4de856f8becf27",
        },
    }

    output_dir = Path(os.environ["NPA_SMOKE_OUTPUT_DIR"]).resolve()
    output_dir.mkdir(parents=True, exist_ok=True)
    artifact_path = output_dir / "robotwin-smoke.json"
    payload = {
        "solution": SOLUTION,
        "capability": CAPABILITY,
        "capabilities_exercised": [],
        "source_revision": SOURCE_REVISION,
        "asset_repository": ASSET_REPO,
        "asset_revision": ASSET_REVISION,
        "curobo_revision": CUROBO_REVISION,
        "python_dependency_lock_sha256": PYTHON_LOCK_SHA256,
        "task": TASK,
        "task_config": TASK_CONFIG,
        "task_success": False,
        "action_count": 0,
        "rendered_frame_count": 0,
        "hdf5": {"sha256": "", "size_bytes": 0},
        "video": {"sha256": "", "size_bytes": 0},
        "vulkan_renderer": {"available": False},
        "observed_gpu": {"count": 0, "model": "", "architecture": ""},
        "strict_reservation": {"policy": "", "manager_runtime_context_sha256": ""},
        "built_image_payload_scan": {
            "format": "npa_robotwin_image_byte_scan_v1",
            "report_sha256": "",
            "archives_scanned": 0,
            "status": "failed",
        },
        "pod_observed_immutable_image_digest": "",
        "exit_status": 1,
    }

    def sha256_file(path: Path) -> str:
        digest = hashlib.sha256()
        with path.open("rb") as stream:
            for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                digest.update(chunk)
        return digest.hexdigest()

    def checked_archive(filename: str, asset_root: Path) -> tuple[Path, dict]:
        expected = ASSET_ARCHIVES[filename]
        downloaded = Path(
            hf_hub_download(
                repo_id=ASSET_REPO,
                repo_type="dataset",
                filename=filename,
                revision=ASSET_REVISION,
                local_dir=asset_root,
                local_dir_use_symlinks=False,
            )
        )
        observed = {
            "filename": filename,
            "size_bytes": downloaded.stat().st_size,
            "sha256": sha256_file(downloaded),
        }
        if observed["size_bytes"] != expected["size_bytes"]:
            raise RuntimeError(f"{filename} size mismatch: {observed['size_bytes']}")
        if observed["sha256"] != expected["sha256"]:
            raise RuntimeError(f"{filename} sha256 mismatch: {observed['sha256']}")
        return downloaded, observed

    def safe_extract(archive: Path, destination: Path) -> None:
        root = destination.resolve()
        with ZipFile(archive) as package:
            for member in package.infolist():
                resolved = (root / member.filename).resolve()
                if resolved != root and root not in resolved.parents:
                    raise RuntimeError(f"unsafe archive member: {member.filename}")
            package.extractall(root)

    try:
        source_metadata = json.loads(Path("npa_source_metadata.json").read_text(encoding="utf-8"))
        if source_metadata.get("ref") != SOURCE_REVISION:
            raise RuntimeError(f"unexpected source metadata: {source_metadata}")

        image_ref = os.environ.get("BYOF_IMAGE", "").removeprefix("docker:")
        image_match = re.fullmatch(r"(.+)@(sha256:[0-9a-f]{64})", image_ref)
        if image_match is None:
            raise RuntimeError("BYOF_IMAGE is not an immutable sha256 image reference")
        payload["pod_observed_immutable_image_ref"] = image_ref
        payload["pod_observed_immutable_image_digest"] = image_match.group(2)
        payload["pod_observation"] = {
            "hostname": socket.gethostname(),
            "image_ref_source": "SkyPilot materialized pod resource exposed as BYOF_IMAGE",
        }

        reservation_evidence = os.environ.get(
            "NPA_BYOF_ROBOTWIN_RESERVATION_EVIDENCE_SHA256", ""
        ).strip()
        if re.fullmatch(r"[0-9a-f]{64}", reservation_evidence) is None:
            raise RuntimeError("missing manager-owned STRICT reservation evidence hash")
        payload["strict_reservation"] = {
            "policy": "STRICT",
            "manager_runtime_context_sha256": reservation_evidence,
        }

        image_scan_sha256 = os.environ.get(
            "NPA_BYOF_ROBOTWIN_IMAGE_SCAN_SHA256", ""
        ).strip()
        image_scan_archives_raw = os.environ.get(
            "NPA_BYOF_ROBOTWIN_IMAGE_SCAN_ARCHIVES", ""
        ).strip()
        if re.fullmatch(r"[0-9a-f]{64}", image_scan_sha256) is None:
            raise RuntimeError("missing exact-digest image payload-scan report hash")
        if not image_scan_archives_raw.isdecimal():
            raise RuntimeError("missing image payload-scan archive count")
        image_scan_archives = int(image_scan_archives_raw)
        if image_scan_archives < 2:
            raise RuntimeError("image payload scan did not inspect rootfs and layers")
        payload["built_image_payload_scan"] = {
            "format": "npa_robotwin_image_byte_scan_v1",
            "report_sha256": image_scan_sha256,
            "archives_scanned": image_scan_archives,
            "status": "pass",
        }
        payload["capabilities_exercised"].append(
            "built_image_asset_cache_output_absence"
        )

        smi = subprocess.run(
            [
                "nvidia-smi",
                "--query-gpu=name,compute_cap",
                "--format=csv,noheader,nounits",
            ],
            check=True,
            capture_output=True,
            text=True,
        )
        gpu_rows = [row.strip() for row in smi.stdout.splitlines() if row.strip()]
        if len(gpu_rows) != 1:
            raise RuntimeError(f"expected exactly one visible GPU, observed {gpu_rows}")
        gpu_name, compute_capability = [part.strip() for part in gpu_rows[0].rsplit(",", 1)]
        torch_capability = tuple(int(value) for value in torch.cuda.get_device_capability(0))
        if "RTX PRO 6000" not in gpu_name.upper() or compute_capability != "12.0":
            raise RuntimeError(f"wrong GPU target: {gpu_rows[0]}")
        if torch.cuda.device_count() != 1 or torch_capability != (12, 0):
            raise RuntimeError(
                f"torch observed count={torch.cuda.device_count()} capability={torch_capability}"
            )
        payload["observed_gpu"] = {
            "count": 1,
            "model": gpu_name,
            "architecture": "sm_120",
            "compute_capability": compute_capability,
            "torch_compute_capability": list(torch_capability),
        }
        payload["capabilities_exercised"].append("strict_rtx_pro_6000_placement")

        vulkan = subprocess.run(
            ["vulkaninfo", "--summary"],
            check=False,
            capture_output=True,
            text=True,
        )
        vulkan_text = (vulkan.stdout or "") + (vulkan.stderr or "")
        (output_dir / "robotwin-vulkaninfo.txt").write_text(vulkan_text, encoding="utf-8")
        if vulkan.returncode != 0 or "RTX PRO 6000" not in vulkan_text.upper():
            raise RuntimeError(f"Vulkan did not expose the allocated RTX GPU (exit {vulkan.returncode})")
        import sapien

        sapien_summary = str(sapien.render.get_device_summary())
        payload["vulkan_renderer"] = {
            "available": True,
            "vk_icd_filenames": os.environ.get("VK_ICD_FILENAMES", ""),
            "vulkaninfo_exit_status": vulkan.returncode,
            "vulkaninfo_mentions_rtx_pro_6000": True,
            "sapien_version": getattr(sapien, "__version__", ""),
            "sapien_device_summary": sapien_summary,
            "camera_shader": "rt",
            "backend": "SAPIEN SapienRenderer over Vulkan",
        }
        payload["capabilities_exercised"].append("sapien_vulkan_rt_renderer")

        asset_root = Path("assets").resolve()
        asset_root.mkdir(parents=True, exist_ok=True)
        archive_evidence = []
        for filename in ("embodiments.zip", "objects.zip"):
            archive, observed = checked_archive(filename, asset_root)
            safe_extract(archive, asset_root)
            archive_evidence.append(observed)
        payload["asset_archives"] = archive_evidence

        configure_assets = subprocess.run(
            [sys.executable, "scripts/update_embodiment_config_path.py"],
            check=False,
            capture_output=True,
            text=True,
            env=os.environ.copy(),
        )
        (output_dir / "robotwin-configure-assets-stdout.log").write_text(
            configure_assets.stdout or "", encoding="utf-8"
        )
        (output_dir / "robotwin-configure-assets-stderr.log").write_text(
            configure_assets.stderr or "", encoding="utf-8"
        )
        payload["asset_path_configuration_exit_status"] = configure_assets.returncode
        if configure_assets.returncode != 0:
            raise RuntimeError(
                "official update_embodiment_config_path.py exited "
                f"{configure_assets.returncode}"
            )

        expected_paths = (
            asset_root / "embodiments" / "aloha-agilex" / "config.yml",
            asset_root / "objects" / "020_hammer" / "base0",
        )
        missing = [str(path) for path in expected_paths if not path.exists()]
        if missing:
            raise RuntimeError(f"required official assets were not extracted: {missing}")
        payload["capabilities_exercised"].append("pinned_official_runtime_assets")
        payload["capabilities_exercised"].append("official_embodiment_path_configuration")

        config_path = Path("env_cfg/task_config/demo_clean.yml")
        source_config = config_path.read_bytes()
        task_config = yaml.safe_load(source_config)
        if task_config["domain_randomization"] != {
            "random_background": False,
            "cluttered_table": False,
            "clean_background_rate": 1,
            "random_head_camera_dis": 0,
            "random_table_height": 0,
            "random_light": False,
            "crazy_random_light_rate": 0,
        }:
            raise RuntimeError("pinned demo_clean domain-randomization contract changed")
        task_config["episode_num"] = 1
        task_config["save_path"] = str(output_dir / "robotwin-native")
        config_path.write_text(yaml.safe_dump(task_config, sort_keys=False), encoding="utf-8")
        payload["config_evidence"] = {
            "official_config": TASK_CONFIG,
            "official_config_sha256": hashlib.sha256(source_config).hexdigest(),
            "runtime_episode_num": 1,
            "runtime_save_path": task_config["save_path"],
            "domain_randomization": task_config["domain_randomization"],
        }

        collect = subprocess.run(
            [sys.executable, "scripts/collect_data.py", TASK, TASK_CONFIG],
            check=False,
            capture_output=True,
            text=True,
            env=os.environ.copy(),
        )
        (output_dir / "robotwin-collect-stdout.log").write_text(
            collect.stdout or "", encoding="utf-8"
        )
        (output_dir / "robotwin-collect-stderr.log").write_text(
            collect.stderr or "", encoding="utf-8"
        )
        payload["collector_exit_status"] = collect.returncode
        if collect.returncode != 0:
            raise RuntimeError(f"official collect_data.py exited {collect.returncode}")

        episode_root = (
            output_dir
            / "robotwin-native"
            / TASK_CONFIG
            / TASK
            / "aloha_agilex"
        )
        seed_values = [int(value) for value in (episode_root / "seed.txt").read_text().split()]
        if len(seed_values) != 1:
            raise RuntimeError(f"expected one successful seed, observed {seed_values}")
        seed = seed_values[0]
        hdf5_path = episode_root / "data" / "episode_0000000.hdf5"
        video_path = episode_root / "video" / "episode_0000000.mp4"
        if not hdf5_path.is_file() or not video_path.is_file():
            raise RuntimeError("official collector did not produce both HDF5 and MP4")

        with h5py.File(hdf5_path, "r") as episode:
            if episode.attrs.get("source_format") != "RoboTwin":
                raise RuntimeError("HDF5 source_format is not RoboTwin")
            if episode.attrs.get("source_path") != "native_collection":
                raise RuntimeError("HDF5 source_path is not native_collection")
            required_groups = {"action", "state", "vision"}
            if not required_groups.issubset(episode.keys()):
                raise RuntimeError(f"HDF5 missing groups: {required_groups - set(episode.keys())}")
            action_lengths = {
                name: int(dataset.shape[0])
                for name, dataset in episode["action"].items()
                if hasattr(dataset, "shape") and dataset.shape
            }
            if not action_lengths or len(set(action_lengths.values())) != 1:
                raise RuntimeError(f"invalid action datasets: {action_lengths}")
            action_count = next(iter(action_lengths.values()))
            if action_count <= 0:
                raise RuntimeError("HDF5 has no recorded actions")
            vision_cameras = sorted(episode["vision"].keys())
            if "cam_head" not in vision_cameras:
                raise RuntimeError(f"HDF5 has no head camera: {vision_cameras}")

        capture = cv2.VideoCapture(str(video_path))
        decoded_frames = 0
        width = int(capture.get(cv2.CAP_PROP_FRAME_WIDTH))
        height = int(capture.get(cv2.CAP_PROP_FRAME_HEIGHT))
        while True:
            ok, frame = capture.read()
            if not ok:
                break
            if frame is None or frame.size == 0:
                raise RuntimeError("decoded an empty MP4 frame")
            decoded_frames += 1
        capture.release()
        if decoded_frames != action_count + 1 or width <= 0 or height <= 0:
            raise RuntimeError(
                f"video/HDF5 mismatch: frames={decoded_frames}, actions={action_count}, "
                f"size={width}x{height}"
            )

        payload.update(
            {
                "task_success": True,
                "seed": seed,
                "seed_search_attempt_count": seed + 1,
                "action_count": action_count,
                "rendered_frame_count": decoded_frames,
                "hdf5": {
                    "path": str(hdf5_path.relative_to(output_dir)),
                    "sha256": sha256_file(hdf5_path),
                    "size_bytes": hdf5_path.stat().st_size,
                    "action_datasets": action_lengths,
                    "vision_cameras": vision_cameras,
                },
                "video": {
                    "path": str(video_path.relative_to(output_dir)),
                    "sha256": sha256_file(video_path),
                    "size_bytes": video_path.stat().st_size,
                    "decoded_frames": decoded_frames,
                    "width": width,
                    "height": height,
                },
                "exit_status": 0,
            }
        )
        payload["capabilities_exercised"].extend(
            [
                "beat_block_hammer_successful_seed_search",
                "beat_block_hammer_successful_seed_replay",
                "robotwin_native_hdf5_collection",
                "robotwin_rendered_mp4",
            ]
        )
    except Exception as exc:
        payload["error"] = f"{type(exc).__name__}: {exc}"
        payload["traceback"] = traceback.format_exc(limit=12)
    finally:
        artifact_path.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
        print(json.dumps(payload, indent=2, sort_keys=True), flush=True)

    if payload["exit_status"] != 0:
        raise SystemExit(payload["exit_status"])
    PY
  solution_name: "robotwin"
  capability_name: "beat_block_hammer_successful_seed_replay_collection"
  smoke_artifact_name: "robotwin-smoke.json"
  resource_profile_yaml: "byof-solution-smoke-robotwin-rtxpro-gpu"
  task: "beat_block_hammer"
  iterations: 1
  num_envs: 1
  num_demos: 1
  # Seed search, replay, asset download, and native media production run to a
  # terminal result; the operator monitors them instead of imposing a deadline.
  wait_timeout: -1
  poll_interval: 60

  # The BYOF runner appends its run ID exactly once to this root.
  output_root: s3://{{config.bucket}}/oss-solutions/robotwin
  summary_uri: "{{config.output_root}}/{{run.id}}/npa_byof_summary.json"
resources:
  rtxpro:
    cloud: kubernetes
    image: "{{config.base_image}}"
    accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
initial: byof-run
states:
  byof-run:
    description: >
      Build and push the restricted RoboTwin source image, fetch pinned assets
      in the pod, and require a successful beat_block_hammer seed search plus
      replay with native HDF5 and MP4 output on exactly one RTX PRO 6000.
    toolRef: workbench.byof.repo
    resources: rtxpro
    outputs:
      - uri: "{{config.summary_uri}}"
        schema: npa.workbench.byof.summary.v1
    terminal: true
