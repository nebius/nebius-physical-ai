# npa fleet example: 1 identical k8s-training cluster in 2 on-demand projects.
#
# Each project gets one cluster with 1 GPU RTX PRO 6000 node + 1 48-vCPU node.
# The two projects are created under the tenant on demand (name = project_prefix
# + the entry name), so this yields projects "fleet1-test-a" and "fleet1-test-b".
#
#   npa fleet plan   --spec examples/fleet/fleet1-test.yaml
#   npa fleet deploy --spec examples/fleet/fleet1-test.yaml
#   npa fleet destroy --spec examples/fleet/fleet1-test.yaml --force
apiVersion: npa.fleet/v0.0.1
name: fleet1-test

# tenant_id / region resolve from ~/.nebius + ~/.npa when left empty.
tenant_id: ""
region: us-central1
project_prefix: "fleet1-test-"

# ~/.nebius profile every nebius call authenticates as; empty = the machine's
# active profile. Set it (or pass --profile) to deploy into a tenant other than
# the active profile's -- a service account belongs to exactly one tenant.
profile: ""

# Shared cluster profile merged under every cluster below. Because both projects
# omit `clusters`, they each deploy exactly this profile (an "identical" fleet).
defaults:
  # Safe default for every GPU platform. Alternate recipe sources must expose a
  # compatible managed-image input or Fleet fails before Terraform apply.
  gpu_driver_mode: auto # auto | managed-image | operator
  managed_driver_preset: cuda13.0
  allow_unsafe_nvswitch_operator: false

  # A GPU cluster becomes `deployed` only after this stable-health window and a
  # CUDA vectorAdd on every requested GPU node. The overall health timeout is
  # independent of Terraform's apply timeout.
  gpu_health_stabilization_seconds: 120
  gpu_health_timeout_minutes: 60
  gpu_cuda_smoke: true

  cpu_nodes:
    count: 1
    platform: cpu-d3
    preset: 48vcpu-192gb
  gpu_nodes:
    count: 1
    platform: gpu-rtx6000
    preset: 1gpu-24vcpu-218gb
    # Optional runtime-only capacity block group ID. When set, fleet renders a
    # STRICT reservation policy and will not fall back to on-demand GPU capacity.
    # capacity_block_group: "<capacity-block-group-id>"
  # Shared filesystem is off by default (each one is a 1 TiB NETWORK_SSD and
  # consumes tenant compute.filesystem quota). Uncomment to attach one + the
  # CSI default StorageClass:
  # enable_filestore: true
  # filestore_disk_size_gibibytes: 1024
  # filestore_mount_path: /mnt/data
  # filestore_mount_tag: npa-shared-fs

projects:
  - name: a   # -> project "fleet1-test-a"
  - name: b   # -> project "fleet1-test-b"

# --- Mixing identical + custom clusters (reference) --------------------------
