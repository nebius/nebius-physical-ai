  rerun-viewer:
    image: npa-rerun-viewer
    dockerfile: npa/docker/workbench/rerun-viewer/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Generic Rerun log viewer server used by Sim2Real and agent visualization paths.
    safety:
      runs_as: nobody
      base_image: python:3.11-slim-bookworm
      network: internal (viewer port 9090)
      external_fetch: [pypi]
      notes: >-
        Minimal rerun-sdk image; no persistent storage or outbound calls at
        runtime beyond the viewer bind.
    golden_eval:
      kind: build-import
      command: 'python -c "import rerun; assert rerun.__version__"'
      gpu: none
      timeout_seconds: 60
      status: ready

  foxglove-embed:
    image: npa-foxglove-embed
    dockerfile: npa/docker/workbench/foxglove-embed/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Serves the @foxglove/embed TypeScript SDK, the shared NPA glue module, and
        MCAP/bag recordings so robotics runs can be replayed in an embedded Foxglove
        viewer (agent UI viewer pane and standalone host page).
    safety:
      runs_as: nobody
      base_image: caddy:2.11-alpine (digest-pinned)
      network: internal (static host port 8099)
      external_fetch: [npm registry at build time only]
      notes: >-
        Build-time fetch of @foxglove/embed is sha512-verified against the pinned
        npm dist.integrity digest. No admin API, no ACME, no runtime outbound calls.
        /data is served without auth (the cross-origin Foxglove iframe cannot send
        credentials) — keep the port cluster-internal or behind an auth proxy.
    golden_eval:
      kind: server-smoke
      command: sh /usr/local/bin/npa-foxglove-smoke.sh
      gpu: none
      timeout_seconds: 120
      status: ready

  lichtblick:
    image: npa-lichtblick
    dockerfile: npa/docker/workbench/lichtblick/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Lichtblick — an open-source (MPL-2.0), Foxglove-compatible web viewer for
        MCAP / ROS-bag / robotics log artifacts; the browser-based analog of the
        Rerun viewer for inspecting Physical AI recordings staged from S3.
    safety:
      runs_as: nobody
      base_image: caddy:2.11.4-alpine
      network: internal (static viewer port 8080)
      external_fetch: [github, npm]
      notes: >-
        Static web bundle built from the pinned Lichtblick OSS tag and served by
        caddy; no account, proprietary component, persistent storage, or runtime
        outbound calls beyond the viewer bind. Source fetch happens at build time.
    golden_eval:
      kind: build-import
      command: 'sh -c "test -s /srv/index.html && grep -qx 1.26.0 /opt/npa/lichtblick/VERSION"'
      gpu: none
      timeout_seconds: 60
      status: ready
