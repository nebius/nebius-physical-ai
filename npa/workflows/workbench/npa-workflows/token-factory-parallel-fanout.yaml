apiVersion: npa.workflow/v0.0.1
kind: Workflow

# Zero-GPU reference for REAL parallel execution.
#
# `caption-shards` is a `parallel:` group: its three members are rendered into a
# single SkyPilot JobGroup (`execution: parallel`) and launched concurrently, each
# on its own cluster, bounded by `maxConcurrency`. `aggregate` declares
# `needs: [caption-shards]`, so the runtime tier only submits it after every shard
# reached a terminal state — the barrier.
#
# Submit with the runtime orchestrator:
#   npa workbench workflow submit token-factory-parallel-fanout.yaml \
#     --run-id <id> --runtime --secret-env NEBIUS_TOKEN_FACTORY_KEY \
#     --secret-env AWS_ACCESS_KEY_ID --secret-env AWS_SECRET_ACCESS_KEY
# Without --runtime the spec still renders as today's flat serial pipeline.

metadata:
  name: token-factory-parallel-fanout
  description: >
    Parallel fan-out reference (zero GPU) — three Token Factory caption shards run
    concurrently as one SkyPilot JobGroup, then a barrier stage ingests every
    shard's report into the insights store and renders a rollup dashboard.

config:
  bucket: example-bucket
  prefix: "token-factory-fanout/{{run.id}}"
  workflow_name: token-factory-parallel-fanout

  max_concurrency: "3"
  caption_model: "Qwen/Qwen2.5-VL-72B-Instruct"
  max_images: "4"
  max_tokens: "128"

  images_uri: "s3://{{config.bucket}}/{{config.prefix}}/images/"
  captions_uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/"
  shards: "shard-a,shard-b,shard-c"
  run_prefix_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  join_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/join_report.json"

resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi

initial: caption-shards

states:
  caption-shards:
    description: Fan out three caption shards and run them concurrently.
    parallel:
      - caption-shard-a
      - caption-shard-b
      - caption-shard-c
    maxConcurrency: "{{config.max_concurrency}}"
    next: aggregate

  caption-shard-a:
    description: Caption shard A with the hosted Token Factory vision model.
    toolRef: workbench.token_factory.caption
    resources: cpu
    params:
      images_uri: "s3://{{config.bucket}}/{{config.prefix}}/images/shard-a/"
      captions_uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-a/"
    outputs:
      - uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-a/captions.json"
        schema: npa.token_factory.captions.v1

  caption-shard-b:
    description: Caption shard B with the hosted Token Factory vision model.
    toolRef: workbench.token_factory.caption
    resources: cpu
    params:
      images_uri: "s3://{{config.bucket}}/{{config.prefix}}/images/shard-b/"
      captions_uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-b/"
    outputs:
      - uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-b/captions.json"
        schema: npa.token_factory.captions.v1

  caption-shard-c:
    description: Caption shard C with the hosted Token Factory vision model.
    toolRef: workbench.token_factory.caption
    resources: cpu
    params:
      images_uri: "s3://{{config.bucket}}/{{config.prefix}}/images/shard-c/"
      captions_uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-c/"
    outputs:
      - uri: "s3://{{config.bucket}}/{{config.prefix}}/captions/shard-c/captions.json"
        schema: npa.token_factory.captions.v1

  aggregate:
    description: >
      Barrier — merge every shard's captions manifest into one report. Runs only
      after all three shards reached a terminal state, and fails loudly if any
      shard's artifact is missing.
    needs: [caption-shards]
    resources: cpu
    run:
      shell: >
        python3 -c "from npa.workflows.fanout_join import join_shards;
        join_shards(shards_uri='{{config.captions_uri}}',
        report_uri='{{config.join_report_uri}}', shards='{{config.shards}}',
        run_id='{{run.id}}')"
    inputs:
      - uri: "{{config.captions_uri}}"
        schema: npa.token_factory.captions.v1
    outputs:
      - uri: "{{config.join_report_uri}}"
        schema: npa.fanout.join_report.v1
    terminal: true
