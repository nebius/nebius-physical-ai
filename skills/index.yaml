    path: skills/tools/foxglove/SKILL.md
    smoke:
      - type: cli_help
        args: ["workbench", "foxglove", "convert-run", "--help"]
        contains: "input-path"
      - type: cli_help
        args: ["workbench", "foxglove", "install-sdk", "--help"]
        contains: "integrity"
      - type: file_exists
        path: npa/docker/workbench/foxglove-embed/Dockerfile
      - type: file_exists
        path: npa/src/npa/cli/assets/foxglove/npa-foxglove-host.js
