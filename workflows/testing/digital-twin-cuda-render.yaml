apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: digital-twin-cuda-render
  executionMode: runtime
  description: Render an authored industrial reference scene with native Blender Cycles CUDA and publish offline HTML, OpenUSD, and glTF after current-runtime qualification.
config:
  bucket: example-bucket
  prefix: digital-twin-cuda-render/{{run.id}}
  output_uri: s3://{{config.bucket}}/{{config.prefix}}/rendered
  source_overlay: true
  required_immutable_images: [runtime_image]
  runtime_image: ''
  accelerator: B200:1
  views: 24
  samples: 64
resources:
  renderer:
    cloud: kubernetes
    accelerators: '{{config.accelerator}}'
    cpus: 8
    memory: 32Gi
    disk_size: 100
    image: '{{config.runtime_image}}'
initial: render
states:
  render:
    description: Require an operator-supplied immutable NPA runtime with the source overlay, fetch hash-pinned Blender, require CUDA devices, and bind scene/media hashes before publication.
    resources: renderer
    run:
      argv:
        - /opt/npa/venv/bin/python
        - -m
        - npa.workflows.digital_twin_render
        - --output-path
        - '{{config.output_uri}}'
        - --views
        - '{{config.views}}'
        - --samples
        - '{{config.samples}}'
    outputs:
      - uri: '{{config.output_uri}}/completion.json'
        schema: npa.navigation.publication.v1
    terminal: true
