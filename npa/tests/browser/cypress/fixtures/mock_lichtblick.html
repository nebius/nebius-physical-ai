<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Lichtblick</title>
    <style>
      html, body { margin: 0; background: #0b1220; color: #e2e8f0; font: 14px sans-serif; }
      #panel { padding: 16px; }
      canvas { display: block; width: 100%; height: 70vh; background: #000; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1 data-testid="mock-lichtblick-title">Lichtblick (mock)</h1>
      <p id="dsInfo">data source: <code id="dsUrl"></code></p>
      <p id="topics" data-testid="mock-lichtblick-topics">loading…</p>
      <p id="mcapStats" data-testid="mock-lichtblick-stats"></p>
    </div>
    <canvas data-testid="mock-lichtblick-canvas" id="mockCanvas"></canvas>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const dsUrl = String(params.get("ds.url") || "");
        const el = document.getElementById("dsUrl");
        if (el) el.textContent = dsUrl;
        const canvas = document.getElementById("mockCanvas");
        const w = 640;
        const h = 400;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, w, h);

        window.__NPA_MOCK_LICHTBLICK__ = {
          dsUrl,
          loaded: false,
          mcapBytes: 0,
          cameraTopicCount: 0,
          hasHeldoutCamera: false,
          hasCompressedImage: false,
        };

        // Real Lichtblick fetches the MCAP from ds.url; emulate that so tests can
        // assert the embedded viewer received substantive camera data (the file is
        // an uncompressed MCAP, so topic/schema names appear as plaintext bytes).
        const target = dsUrl || "/lichtblick/recordings/sim2real.mcap";
        fetch(target)
          .then((resp) => resp.arrayBuffer())
          .then((buffer) => {
            const bytes = new Uint8Array(buffer);
            let text = "";
            for (let i = 0; i < bytes.length; i += 1) {
              text += String.fromCharCode(bytes[i]);
            }
            const cameraMatches = text.match(/\/camera/g) || [];
            const stats = window.__NPA_MOCK_LICHTBLICK__;
            stats.loaded = true;
            stats.mcapBytes = bytes.length;
            stats.cameraTopicCount = cameraMatches.length;
            stats.hasHeldoutCamera = text.indexOf("/heldout/camera/") >= 0;
            stats.hasCompressedImage = text.indexOf("foxglove.CompressedImage") >= 0;
            const topicsEl = document.getElementById("topics");
            if (topicsEl) {
              topicsEl.textContent = stats.hasCompressedImage
                ? "camera streams: foxglove.CompressedImage (/camera, /heldout/camera/*)"
                : "no camera streams found";
            }
            const statsEl = document.getElementById("mcapStats");
            if (statsEl) {
              statsEl.textContent = `mcap bytes: ${stats.mcapBytes}; camera topics: ${stats.cameraTopicCount}`;
            }
            // Draw a "frame" proportional to substance so a non-empty render is visible.
            ctx.fillStyle = stats.hasCompressedImage ? "#33cc99" : "#cc3333";
            ctx.fillRect(40, 40, 220, 160);
          })
          .catch((err) => {
            const statsEl = document.getElementById("mcapStats");
            if (statsEl) statsEl.textContent = `mcap fetch failed: ${String(err)}`;
          });
      })();
    </script>
  </body>
</html>
