name: Image Security Scan

on:
  # The required parent gate invokes this for PRs, merge candidates, and main.
  # Scope is decided inside its always-reporting jobs so a required workflow is
  # never left pending by a top-level path filter.
  workflow_call:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      omniverse_payload_scan_image:
        description: >-
          Image reference to scan for a baked NVIDIA Omniverse Kit payload, e.g.
          ghcr.io/nebius/nebius-physical-ai/npa-isaac-lab:dev-<full-git-sha>.
          The reference must be anonymously readable. Leave blank to skip.
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  # The caller owns candidate/main cancellation. Direct scheduled and manual
  # audits use unique run IDs and cannot cancel their required parent workflow.
  group: image-security-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  image-policy:
    name: Image policy and complete-byte security
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Create validation environment
        run: python -m venv npa/.venv

      - name: Classify image-security scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          deep=true
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            deep="$(npa/.venv/bin/python scripts/ci_image_security_scope.py \
              --repo-root . --base "$BASE_SHA" --head "$GITHUB_SHA")"
          fi
          test "$deep" = true || test "$deep" = false
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "deep image security: $deep"

      - name: Install image-policy test dependencies
        if: steps.scope.outputs.deep == 'true'
        run: npa/.venv/bin/python -m pip install -e "npa[dev]"

      - name: Check tag strategy and offline packaging policies
        if: steps.scope.outputs.deep == 'true'
        run: |
          npa/.venv/bin/python npa/docker/workbench/check_tag_consistency.py
          npa/.venv/bin/python -m pytest \
            npa/tests/docker/test_image_payload_scan.py \
            npa/tests/docker/test_packaging_contract.py \
            npa/tests/docker/test_isaac_bootstrap.py \
            -q

      - name: Exercise exact native complete-byte scanner dependencies
        if: steps.scope.outputs.deep == 'true'
        run: |
          set -euo pipefail
          umask 077
          scan_root="$(mktemp -d "$RUNNER_TEMP/image-byte-native.XXXXXXXX")"
          npa/.venv/bin/python npa/scripts/image_byte_scan/go_helper/build.py \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --output-dir "$scan_root/tools"
          npa/.venv/bin/python npa/scripts/image_byte_scan/prepare.py dependencies \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --output-dir "$scan_root/native"
          npa/.venv/bin/python npa/scripts/image_byte_scan/real_helper_checks.py \
            --analysis-root "$scan_root" --trusted-root "$GITHUB_WORKSPACE" \
            --tools-receipt "$scan_root/tools/dependency-receipt.json" \
            --native-receipt "$scan_root/native/dependencies.json" \
            --output-dir "$scan_root/integration-checks"

      - name: Trivy configuration scan
        if: steps.scope.outputs.deep == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy configuration scan (SARIF)
        if: >-
          always() && steps.scope.outputs.deep == 'true' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif

      - name: Upload configuration SARIF
        if: >-
          always() && steps.scope.outputs.deep == 'true' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:dockerfile-static-scan
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  base-image-cve-scan:
    name: Base image CVE inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Create validation environment
        run: python -m venv npa/.venv

      - name: Classify image-security scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          deep=true
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            deep="$(npa/.venv/bin/python scripts/ci_image_security_scope.py \
              --repo-root . --base "$BASE_SHA" --head "$GITHUB_SHA")"
          fi
          test "$deep" = true || test "$deep" = false
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "deep base-image security: $deep"

      - name: Install checksum-verified Trivy
        if: steps.scope.outputs.deep == 'true'
        run: |
          bash scripts/security_install.sh "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"

      - name: Scan all pinned bases with two local workers
        if: steps.scope.outputs.deep == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          report_args=()
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            report_args=(--sarif-directory "$RUNNER_TEMP/base-image-sarif")
          fi
          npa/.venv/bin/python npa/scripts/scan_base_images.py \
            --inventory npa/docker/workbench/base-image-security.json \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --workers 2 \
            "${report_args[@]}"

      - name: Upload CUDA 12.4 SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-12-4-1-devel-ubuntu22-04.sarif
          category: trivy-image-nvidia-cuda-12-4-1-devel-ubuntu22-04

      - name: Upload CUDA 12.6 SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-12-6-3-devel-ubuntu22-04.sarif
          category: trivy-image-nvidia-cuda-12-6-3-devel-ubuntu22-04

      - name: Upload CUDA 12.8 Ubuntu 22.04 SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-12-8-1-cudnn-devel-ubuntu22-04.sarif
          category: trivy-image-nvidia-cuda-12-8-1-cudnn-devel-ubuntu22-04

      - name: Upload CUDA 12.8 Ubuntu 24.04 SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-12-8-1-cudnn-devel-ubuntu24-04.sarif
          category: trivy-image-nvidia-cuda-12-8-1-cudnn-devel-ubuntu24-04

      - name: Upload CUDA 13 cuDNN SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-13-0-2-cudnn-devel-ubuntu24-04.sarif
          category: trivy-image-nvidia-cuda-13-0-2-cudnn-devel-ubuntu24-04

      - name: Upload CUDA 13 base SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-nvidia-cuda-13-0-2-base-ubuntu24-04.sarif
          category: trivy-image-nvidia-cuda-13-0-2-base-ubuntu24-04

      - name: Upload Python base SARIF
        if: always() && steps.scope.outputs.deep == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/image-security-scan.yml:base-image-cve-scan
        with:
          sarif_file: ${{ runner.temp }}/base-image-sarif/trivy-python-3-11-slim-trixie.sarif
          category: trivy-image-python-3-11-slim-trixie

  omniverse-payload-scan:
    name: Omniverse payload scan (built image)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.omniverse_payload_scan_image != ''
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Scan the public development image for a baked Omniverse Kit payload
        env:
          SCAN_IMAGE: ${{ inputs.omniverse_payload_scan_image }}
        run: |
          python npa/scripts/scan_image_omniverse_payload.py \
            "$SCAN_IMAGE" \
            --json omniverse-payload-report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: omniverse-payload-report
          path: omniverse-payload-report.json
