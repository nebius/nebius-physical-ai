name: Lint

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Ruff check (blocking)
        # Same scope as `make lint`. A narrower CI scope let unused imports sit
        # in npa/scripts, npa/examples and npa/docker while the documented
        # contributor command was red.
        run: cd npa && ruff check .

  docs-drift:
    # Fail when docs/cli/ is out of date relative to `npa --help`.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install npa
        run: cd npa && pip install -e .

      - name: Check CLI reference drift
        run: bash scripts/build_docs.sh --check
