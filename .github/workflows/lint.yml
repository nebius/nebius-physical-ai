name: Lint

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install ruff
        # Pinned: a floating ruff can change format/check behavior with no
        # repo change and turn CI red repo-wide. Bump deliberately.
        run: pip install "ruff==0.16.8"

      - name: Ruff check (blocking)
        # Same scope as `make lint`. A narrower CI scope let unused imports sit
        # in npa/scripts, npa/examples and npa/docker while the documented
        # contributor command was red.
        run: cd npa && ruff check .
      - name: Ruff format check (blocking)
        # Same scope as `make format`. The tree was bulk-formatted once; keep it
        # that way so formatting drift is caught on PRs.
        run: cd npa && ruff format --check .

  docs-drift:
    # Fail when docs/cli/ is out of date relative to `npa --help`.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up cached uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: docs
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in

      - name: Install the constrained docs environment
        run: |
          python -m venv npa/.venv
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e npa

      - name: Check CLI reference drift
        env:
          NPA_BIN: ${{ github.workspace }}/npa/.venv/bin/npa
        run: bash scripts/build_docs.sh --check
