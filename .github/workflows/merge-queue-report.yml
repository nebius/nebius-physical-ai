name: Merge queue feedback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to diagnose
        type: number
        required: true
      publish:
        description: Publish the report as a PR comment
        type: boolean
        default: false

permissions: {}

concurrency:
  # A pending refresh replaces an older pending refresh; each reads current state.
  group: merge-queue-feedback
  cancel-in-progress: false

jobs:
  report:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Explain the exact rejected merge candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PR: ${{ inputs.pr }}
          REPORT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python -m venv npa/.venv
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args=(--pr "$REPORT_PR")
            if [ "$REPORT_PUBLISH" = true ]; then args+=(--publish); fi
          else
            args=(--scan-open --publish)
          fi
          npa/.venv/bin/python -I npa/scripts/merge_queue_report.py "${args[@]}"
