apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: byof-robomimic
  description: >
    Registry-candidate BYOF workflow for robomimic. On exactly one B200, it
    downloads the immutable official Lift PH low-dimensional dataset, creates a
    disjoint train/validation split, runs nonzero upstream BC optimization,
    reloads the saved checkpoint, and infers one held-out action without a
    simulator or renderer.
config:
  # Normal workflow submission is deliberately plan-only. The dedicated live
  # gate consumes this immutable configuration only after validating the
  # manager-issued target and owning its temporary RBAC lifecycle.
  execution_policy: dedicated-live-gate-only
  bucket: example-bucket
  repo_url: "https://github.com/ARISE-Initiative/robomimic.git"
  repo_ref: "d309eaecc18acf4152a830a895a6984b8ac71b05"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: ubuntu
  base_image: "pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2"
  build_command: |
    set -eu
    ROBOMIMIC_LOCK=/opt/byof/npa_robomimic_requirements.lock
    printf '%s\n' \
      'absl-py==2.3.0 --hash=sha256:9824a48b654a306168f63e0d97714665f8490b8d89ec7bf2efc24bf67cf579b3' \
      'boto3==1.38.33 --hash=sha256:25d0717489c658f7ae6c3c7f0f7e1b4d611b30b2f08f0fcef6455ac6864a8768' \
      'botocore==1.38.33 --hash=sha256:ad25233e93dcebe95809b1f9393c1f11a639696327793d166295fb78dd7bc597' \
      'certifi==2025.4.26 --hash=sha256:30350364dfe371162649852c63336a15c70c6510c2ad5015b21c2345311805f3' \
      'charset-normalizer==3.4.2 --hash=sha256:fdb20a30fe1175ecabed17cbf7812f7b804b8a315a25f24678bcdf120a90077f' \
      'contourpy==1.3.2 --hash=sha256:3859783aefa2b8355697f16642695a5b9792e7a46ab86da1118a4a23a51a33d7' \
      'cycler==0.12.1 --hash=sha256:85cef7cff222d8644161529808465972e51340599459b8ac3ccbac5a854e0d30' \
      'diffusers==0.11.1 --hash=sha256:5b3f0d113d369cb675d292c3dffb35d0bac96af095727b5380ca3d48eb0e3e94' \
      'filelock==3.18.0 --hash=sha256:c401f4f8377c4464e6db25fff06205fd89bdd83b65eb0488ed1b160f780e21de' \
      'fonttools==4.58.2 --hash=sha256:12fbc6e0bf0c75ce475ef170f2c065be6abc9e06ad19a13b56b02ec2acf02427' \
      'fsspec==2025.5.1 --hash=sha256:24d3a2e663d5fc735ab256263c4075f374a174c3410c0b25e5bd1970bceaa462' \
      'grpcio==1.73.0 --hash=sha256:859f70c8e435e8e1fa060e04297c6818ffc81ca9ebd4940e180490958229a45a' \
      'h5py==3.14.0 --hash=sha256:723a40ee6505bd354bfd26385f2dae7bbfa87655f4e61bab175a49d72ebfc06b' \
      'huggingface-hub==0.23.4 --hash=sha256:3a0b957aa87150addf0cc7bd71b4d954b78e749850e1e7fb29ebbd2db64ca037' \
      'idna==3.10 --hash=sha256:946d195a0d259cbba61165e88e65941f16e9b36ea6ddb97f00452bae8b1287d3' \
      'imageio==2.37.0 --hash=sha256:11efa15b87bc7871b61590326b2d635439acc321cf7f8ce996f812543ce10eed' \
      'importlib-metadata==8.7.0 --hash=sha256:e5dd1551894c77868a30651cef00984d50e1002d06942a7101d34870c5f02afd' \
      'jmespath==1.0.1 --hash=sha256:02e2e4cc71b5bcab88332eebf907519190dd9e6e82107fa7f83b1003a6252980' \
      'kiwisolver==1.4.8 --hash=sha256:3a96c0e790ee875d65e340ab383700e2b4891677b7fcd30a699146f9384a2bb0' \
      'markdown==3.8 --hash=sha256:794a929b79c5af141ef5ab0f2f642d0f7b1872981250230e72682346f7cc90dc' \
      'markupsafe==3.0.2 --hash=sha256:a123e330ef0853c6e822384873bef7507557d8e4a082961e1defa947aa59ba84' \
      'matplotlib==3.10.3 --hash=sha256:fdfa07c0ec58035242bc8b2c8aae37037c9a886370eef6850703d7583e19964b' \
      'numpy==1.26.4 --hash=sha256:666dbfb6ec68962c033a450943ded891bed2d54e6755e35e5835d63f4f6931d5' \
      'packaging==25.0 --hash=sha256:29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484' \
      'pillow==11.2.1 --hash=sha256:8f4f3724c068be008c08257207210c138d5f3731af6c155a81c2b09a9eb3a788' \
      'protobuf==6.31.1 --hash=sha256:4ee898bf66f7a8b0bd21bce523814e6fbd8c6add948045ce958b73af7e8878c6' \
      'psutil==7.0.0 --hash=sha256:4b1388a4f6875d7e2aff5c4ca1cc16c545ed41dd8bb596cefea80111db353a34' \
      'pyparsing==3.2.3 --hash=sha256:a749938e02d6fd0b59b356ca504a24982314bb090c383e3cf201c95ef7e2bfcf' \
      'python-dateutil==2.9.0.post0 --hash=sha256:a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427' \
      'pyyaml==6.0.2 --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85' \
      'regex==2024.11.6 --hash=sha256:f2a19f302cd1ce5dd01a9099aaa19cae6173306d1302a43b627f62e21cf18ac0' \
      'requests==2.32.4 --hash=sha256:27babd3cda2a6d50b30443204ee89830707d396671944c998b5975b031ac2b2c' \
      's3transfer==0.13.0 --hash=sha256:0148ef34d6dd964d0d8cf4311b2b21c474693e57c2e069ec708ce043d2b527be' \
      'safetensors==0.5.3 --hash=sha256:cead1fa41fc54b1e61089fa57452e8834f798cb1dc7a09ba3524f1eb08e0317a' \
      'setuptools==80.9.0 --hash=sha256:062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922' \
      'six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274' \
      'tensorboard==2.19.0 --hash=sha256:5e71b98663a641a7ce8a6e70b0be8e1a4c0c45d48760b076383ac4755c35b9a0' \
      'tensorboard-data-server==0.7.2 --hash=sha256:ef687163c24185ae9754ed5650eb5bc4d84ff257aabdc33f0cc6f74d8ba54530' \
      'tensorboardx==2.6.2.2 --hash=sha256:160025acbf759ede23fd3526ae9d9bfbfd8b68eb16c38a010ebe326dc6395db8' \
      'termcolor==3.1.0 --hash=sha256:591dd26b5c2ce03b9e43f391264626557873ce1d379019786f99b0c2bee140aa' \
      'tokenizers==0.19.1 --hash=sha256:d16ff18907f4909dca9b076b9c2d899114dd6abceeb074eca0c93e2353f943aa' \
      'tqdm==4.67.1 --hash=sha256:26445eca388f82e72884e0d580d5464cd801a3ea01e63e5601bdff9ba6a48de2' \
      'transformers==4.41.2 --hash=sha256:05555d20e43f808de1ef211ab64803cdb513170cef70d29a888b589caebefc67' \
      'typing-extensions==4.14.0 --hash=sha256:a1514509136dd0b477638fc68d6a91497af5076466ad0fa6c338e44e359944af' \
      'urllib3==2.4.0 --hash=sha256:4e16665048960a0900c702d4a66415956a584919c03361cac9f1df5c5dd7e813' \
      'werkzeug==3.1.3 --hash=sha256:54b78bf3716d19a65be4fceccc0d1d7b89e608834989dfae50ea87564639213e' \
      'wheel==0.45.1 --hash=sha256:708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248' \
      'zipp==3.23.0 --hash=sha256:071652d6115ed432f5ce1d34c336c0adfd6a884660d1e9712a256d3d3bd4b14e' \
      > "${ROBOMIMIC_LOCK}"
    python3 -m pip install --no-cache-dir --only-binary=:all: --no-deps --require-hashes -r "${ROBOMIMIC_LOCK}"
    python3 -m pip install --no-cache-dir --no-deps --no-build-isolation -e .
    python3 -c "import robomimic, torch, torchvision; assert robomimic.__version__ == '0.5.0'; assert torch.__version__.split('+')[0] == '2.7.1'; assert torchvision.__version__.split('+')[0] == '0.22.1'; assert torch.version.cuda == '12.8'"
  workload: solution-smoke
  smoke_command: |
    python3 - <<'PY'
    import hashlib
    import json
    import math
    import os
    import re
    import ssl
    import subprocess
    import sys
    import urllib.request
    from pathlib import Path

    import h5py
    import numpy as np
    import torch
    from robomimic.config import config_factory
    from robomimic.utils.file_utils import policy_from_checkpoint

    SOURCE_REVISION = "d309eaecc18acf4152a830a895a6984b8ac71b05"
    DATASET_REVISION = "74fa018461f479cd9fd15b924a16103012096203"
    DATASET_PATH = "v1.5/lift/ph/low_dim_v15.hdf5"
    DATASET_SHA256 = "2067777cb8b532e9263dd09fd6448c41cc31224bb27be4a3b734010ae13eb540"
    DATASET_BYTES = 21084088
    EXPECTED_BUILD_COMMAND_SHA256 = "40934ad75e79127e2b494adf73c59e0cd2164dda71dac2a142891cdda7a43bf6"
    DEPENDENCY_LOCK_SHA256 = "910b762eb9fa6bb31bfb05d339845d8c68c81f0b3e85ab95ec3eefbca29cad71"
    DEPENDENCY_ARTIFACT_COUNT = 48
    TRAIN_STEPS = 4
    VALIDATION_STEPS = 2
    CAPABILITIES = [
        "lift_ph_lowdim_bc_train",
        "lift_ph_lowdim_heldout_validate",
        "lift_ph_lowdim_checkpoint_reload_action",
    ]

    output_dir = Path(os.environ["NPA_SMOKE_OUTPUT_DIR"])
    output_dir.mkdir(parents=True, exist_ok=True)
    if os.environ.get("NPA_ROBOMIMIC_STRICT_B200_ATTESTED") != "1":
        raise RuntimeError(
            "the operator must attest this target is STRICT reserved B200 capacity"
        )
    runtime_image = os.environ.get("BYOF_IMAGE", "")
    image_match = re.fullmatch(r".+@(sha256:[0-9a-f]{64})", runtime_image)
    if image_match is None:
        raise RuntimeError(f"robomimic workload image must be digest-pinned, got {runtime_image!r}")

    repo_root = Path(os.environ["BYOF_REPO_ROOT"])
    source_metadata = json.loads((repo_root / "npa_source_metadata.json").read_text(encoding="utf-8"))
    build_metadata = json.loads((repo_root / "npa_build_metadata.json").read_text(encoding="utf-8"))
    source_head = subprocess.run(
        ["git", "-C", str(repo_root), "rev-parse", "HEAD"],
        check=True,
        capture_output=True,
        text=True,
    ).stdout.strip()
    if source_metadata.get("ref") != SOURCE_REVISION or source_head != SOURCE_REVISION:
        raise RuntimeError(
            f"unexpected source revision: metadata={source_metadata} observed_head={source_head}"
        )
    if (
        build_metadata.get("schema") != "npa.byof.build.v1"
        or build_metadata.get("build_command_executed") is not True
        or build_metadata.get("build_command_sha256") != EXPECTED_BUILD_COMMAND_SHA256
    ):
        raise RuntimeError(f"invalid BYOF build metadata: {build_metadata}")
    dependency_lock = repo_root / "npa_robomimic_requirements.lock"
    dependency_lock_bytes = dependency_lock.read_bytes()
    dependency_lock_hash = hashlib.sha256(dependency_lock_bytes).hexdigest()
    dependency_artifact_count = len(dependency_lock_bytes.splitlines())
    if (
        dependency_lock_hash != DEPENDENCY_LOCK_SHA256
        or dependency_artifact_count != DEPENDENCY_ARTIFACT_COUNT
    ):
        raise RuntimeError(
            "dependency lock mismatch: "
            f"sha256={dependency_lock_hash} entries={dependency_artifact_count}"
        )

    service_account_root = Path("/var/run/secrets/kubernetes.io/serviceaccount")
    pod_name = os.environ.get("HOSTNAME", "").strip()
    namespace = (service_account_root / "namespace").read_text(encoding="utf-8").strip()
    bearer_token = (service_account_root / "token").read_text(encoding="utf-8").strip()
    pod_request = urllib.request.Request(
        f"https://kubernetes.default.svc/api/v1/namespaces/{namespace}/pods/{pod_name}",
        headers={"Authorization": f"Bearer {bearer_token}"},
    )
    pod_ssl = ssl.create_default_context(cafile=str(service_account_root / "ca.crt"))
    with urllib.request.urlopen(pod_request, context=pod_ssl) as response:
        pod_status = json.load(response)
    expected_image_digest = image_match.group(1)
    matching_statuses = [
        status
        for status in pod_status.get("status", {}).get("containerStatuses", [])
        if expected_image_digest in str(status.get("imageID", ""))
    ]
    if len(matching_statuses) != 1:
        raise RuntimeError(
            "Kubernetes Pod status did not prove the executing immutable image: "
            f"expected_digest={expected_image_digest} matches={matching_statuses!r}"
        )
    pod_image_id = str(matching_statuses[0]["imageID"])

    gpu_count = torch.cuda.device_count()
    if gpu_count != 1:
        raise RuntimeError(f"expected exactly one visible GPU, got {gpu_count}")
    gpu_name = torch.cuda.get_device_name(0)
    compute_capability = list(torch.cuda.get_device_capability(0))
    architecture = f"sm_{compute_capability[0]}{compute_capability[1]}"
    if "B200" not in gpu_name.upper() or architecture != "sm_100":
        raise RuntimeError(f"expected one B200 sm_100, got {gpu_name!r} {architecture!r}")
    smi_rows = subprocess.run(
        ["nvidia-smi", "--query-gpu=index,name", "--format=csv,noheader"],
        check=True,
        capture_output=True,
        text=True,
    ).stdout.strip().splitlines()
    if len(smi_rows) != 1 or "B200" not in smi_rows[0].upper():
        raise RuntimeError(f"nvidia-smi did not prove exactly one B200: {smi_rows!r}")

    input_dir = Path("/workspace/byof-inputs") / output_dir.name
    input_dir.mkdir(parents=True, exist_ok=False)
    raw_dataset = input_dir / "lift_ph_lowdim_v15.download"
    dataset = input_dir / "lift_ph_lowdim_v15.hdf5"
    dataset_url = (
        "https://huggingface.co/datasets/robomimic/robomimic_datasets/resolve/"
        f"{DATASET_REVISION}/{DATASET_PATH}?download=true"
    )
    request = urllib.request.Request(dataset_url, headers={"User-Agent": "npa-robomimic-smoke/1"})
    digest = hashlib.sha256()
    byte_count = 0
    with urllib.request.urlopen(request) as response, raw_dataset.open("wb") as handle:
        while chunk := response.read(1024 * 1024):
            handle.write(chunk)
            digest.update(chunk)
            byte_count += len(chunk)
    raw_hash = digest.hexdigest()
    if raw_hash != DATASET_SHA256 or byte_count != DATASET_BYTES:
        raise RuntimeError(
            f"dataset identity mismatch: sha256={raw_hash} bytes={byte_count}"
        )
    with h5py.File(raw_dataset, "r") as handle:
        demo_keys = sorted(handle["data"].keys())
        sample_counts = {
            key: int(handle[f"data/{key}"].attrs["num_samples"])
            for key in demo_keys
        }
        action_min = min(float(np.min(handle[f"data/{key}/actions"][:])) for key in demo_keys)
        action_max = max(float(np.max(handle[f"data/{key}/actions"][:])) for key in demo_keys)
    if len(demo_keys) != 200 or sum(sample_counts.values()) <= 0:
        raise RuntimeError(
            f"official Lift PH inventory mismatch: demos={len(demo_keys)} samples={sum(sample_counts.values())}"
        )
    raw_dataset.replace(dataset)

    split_script = repo_root / "robomimic" / "scripts" / "split_train_val.py"
    split_program = "\n".join(
        [
            "import numpy as np, runpy, sys",
            "script, dataset = sys.argv[1:3]",
            "np.random.seed(0)",
            "sys.argv = [script, '--dataset', dataset, '--ratio', '0.1']",
            "runpy.run_path(script, run_name='__main__')",
        ]
    )
    split = subprocess.run(
        [
            sys.executable,
            "-c",
            split_program,
            str(split_script),
            str(dataset),
        ],
        check=True,
        capture_output=True,
        text=True,
    )
    (output_dir / "split_stdout.log").write_text(split.stdout + split.stderr, encoding="utf-8")
    with h5py.File(dataset, "r") as handle:
        train_keys = [value.decode("utf-8") for value in handle["mask/train"][:]]
        valid_keys = [value.decode("utf-8") for value in handle["mask/valid"][:]]
    overlap = sorted(set(train_keys).intersection(valid_keys))
    if (
        overlap
        or not train_keys
        or not valid_keys
        or len(train_keys) + len(valid_keys) != len(demo_keys)
        or set(train_keys + valid_keys) != set(demo_keys)
    ):
        raise RuntimeError(
            f"invalid held-out split: train={len(train_keys)} valid={len(valid_keys)} overlap={overlap}"
        )

    train_root = output_dir / "training"
    config_path = output_dir / "bc_config.json"
    config = config_factory("bc")
    with config.values_unlocked():
        config.experiment.name = "lift_ph_lowdim_bc_smoke"
        config.experiment.validate = True
        config.experiment.logging.terminal_output_to_txt = False
        config.experiment.logging.log_tb = False
        config.experiment.logging.log_wandb = False
        config.experiment.save.enabled = True
        config.experiment.save.every_n_epochs = 1
        config.experiment.save.on_best_validation = False
        config.experiment.render = False
        config.experiment.render_video = False
        config.experiment.rollout.enabled = False
        config.experiment.epoch_every_n_steps = TRAIN_STEPS
        config.experiment.validation_epoch_every_n_steps = VALIDATION_STEPS
        config.train.data = [{"path": str(dataset), "eval": False}]
        config.train.output_dir = str(train_root)
        config.train.num_data_workers = 0
        config.train.hdf5_cache_mode = "all"
        config.train.hdf5_filter_key = "train"
        config.train.hdf5_validation_filter_key = "valid"
        config.train.batch_size = 32
        config.train.num_epochs = 1
        config.train.cuda = True
    config_path.write_text(config.dump() + "\n", encoding="utf-8")

    training = subprocess.run(
        [sys.executable, str(repo_root / "robomimic" / "scripts" / "train.py"), "--config", str(config_path)],
        check=True,
        capture_output=True,
        text=True,
    )
    training_text = training.stdout + "\n" + training.stderr
    (output_dir / "training.log").write_text(training_text, encoding="utf-8")
    if "finished run successfully!" not in training_text or "run failed with error:" in training_text:
        raise RuntimeError("upstream robomimic training entrypoint did not finish successfully")

    decoder = json.JSONDecoder()
    def metrics_after(marker):
        marker_pos = training_text.index(marker)
        json_pos = training_text.index("{", marker_pos)
        metrics, _ = decoder.raw_decode(training_text, json_pos)
        return metrics

    train_metrics = metrics_after("Train Epoch 1")
    valid_metrics = metrics_after("Validation Epoch 1")
    train_loss = float(train_metrics["Loss"])
    validation_loss = float(valid_metrics["Loss"])
    if not math.isfinite(train_loss) or not math.isfinite(validation_loss):
        raise RuntimeError(f"non-finite losses: train={train_loss} validation={validation_loss}")

    checkpoints = list(train_root.glob("lift_ph_lowdim_bc_smoke/*/last.pth"))
    if len(checkpoints) != 1:
        raise RuntimeError(
            "expected exactly one pinned-upstream checkpoint at "
            f"<output>/lift_ph_lowdim_bc_smoke/<timestamp>/last.pth, got {checkpoints!r}"
        )
    checkpoint_path = checkpoints[0]
    checkpoint_hash = hashlib.sha256(checkpoint_path.read_bytes()).hexdigest()
    policy, checkpoint = policy_from_checkpoint(
        device=torch.device("cuda:0"), ckpt_path=str(checkpoint_path), verbose=False
    )
    optimizer_state = checkpoint["model"]["optimizers"]["policy"]["state"]
    serialized_steps = []
    for state in optimizer_state.values():
        value = state.get("step")
        if value is not None:
            serialized_steps.append(int(value.item() if hasattr(value, "item") else value))
    optimizer_step_count = max(serialized_steps, default=0)
    if optimizer_step_count != TRAIN_STEPS:
        raise RuntimeError(
            f"serialized Adam state proves {optimizer_step_count} steps, expected {TRAIN_STEPS}"
        )

    heldout_demo = valid_keys[0]
    with h5py.File(dataset, "r") as handle:
        heldout_observation = {
            key: np.asarray(handle[f"data/{heldout_demo}/obs/{key}"][0])
            for key in policy.policy.global_config.all_obs_keys
        }
    policy.start_episode()
    action = np.asarray(policy(heldout_observation))
    finite = bool(np.isfinite(action).all())
    within_range = bool((action >= -1.0).all() and (action <= 1.0).all())
    if action.shape != (7,) or not finite or not within_range:
        raise RuntimeError(
            f"invalid reloaded action: shape={action.shape} finite={finite} range=({action.min()}, {action.max()})"
        )

    split_proof = {
        "algorithm": "robomimic.scripts.split_train_val seed=0 ratio=0.1",
        "train_trajectory_count": len(train_keys),
        "validation_trajectory_count": len(valid_keys),
        "train_sample_count": sum(sample_counts[key] for key in train_keys),
        "validation_sample_count": sum(sample_counts[key] for key in valid_keys),
        "overlap_count": len(overlap),
        "train_keys_sha256": hashlib.sha256("\n".join(sorted(train_keys)).encode()).hexdigest(),
        "validation_keys_sha256": hashlib.sha256("\n".join(sorted(valid_keys)).encode()).hexdigest(),
        "heldout_demo": heldout_demo,
    }
    result = {
        "schema": "npa.workbench.robomimic.smoke.v1",
        "solution": "robomimic",
        "capability": "lift_ph_lowdim_checkpoint_reload_action",
        "capabilities_exercised": CAPABILITIES,
        "source": {
            "repository": "ARISE-Initiative/robomimic",
            "revision": SOURCE_REVISION,
            "observed_head": source_head,
            "version": "0.5.0",
