apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: rgbd-scan-to-policy-demo
  executionMode: runtime
  description: Download the full hash-pinned public TUM office sample; reconstruct measured collision
    geometry; derive supported, disjoint resets; train and evaluate a native Isaac range-based navigation
    policy; publish offline HTML evidence.
config:
  bucket: example-bucket
  prefix: rgbd-scan-to-policy-demo/{{run.id}}
  source_overlay: true
  # Select qualified CPU and Isaac runtimes explicitly; provenance needs exact bytes.
  required_immutable_images: [assembly_image, reconstruction_image, isaac_image]
  assembly_image: ''
  isaac_image: ''
  run_uri: s3://{{config.bucket}}/{{config.prefix}}
  assembled_uri: '{{config.run_uri}}/assembled'
  reports_uri: '{{config.run_uri}}/reports'
  reconstruction_image: '{{config.assembly_image}}'
  reconstructed_uri: '{{config.run_uri}}/reconstructed'
  num_envs: 4000
  iterations: 500
  episode_steps: 300
  sample_uri: '{{config.run_uri}}/sample'
  cases_uri: '{{config.run_uri}}/cases'
  prepared_uri: '{{config.run_uri}}/prepared'
  training_uri: '{{config.run_uri}}/training'
  evaluation_uri: '{{config.run_uri}}/evaluation'
  physics_uri: '{{config.run_uri}}/physics'
resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: '{{config.assembly_image}}'
  rtx:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
    cpus: 16
    memory: 64Gi
    image: '{{config.isaac_image}}'
    kubernetes:
      pod_config:
        spec:
          runtimeClassName: nvidia
          containers:
          - name: ray-node
            env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
  reconstruction:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: '{{config.reconstruction_image}}'
initial: sample
states:
  sample:
    description: Fetch and hash-check the complete public sample; calibrate all associated RGB-D
      frames.
    resources: cpu
    run:
      argv:
      - /opt/npa/venv/bin/python
      - -m
      - npa.workbench.nurec.navigation_sample
      - --output-path
      - '{{config.sample_uri}}'
    outputs:
    - uri: '{{config.sample_uri}}/completion.json'
    next: reconstruct
  reconstruct:
    description: Reconstruct observed surfaces with Open3D and enforce withheld depth quality before
      immutable publication.
    resources: reconstruction
    run:
      argv:
      - /opt/npa/venv/bin/python
      - -m
      - npa.workbench.nurec.navigation_sample_stages
      - reconstruct
      - --input-path
      - '{{config.sample_uri}}'
      - --output-path
      - '{{config.reconstructed_uri}}'
    inputs:
    - uri: '{{config.sample_uri}}/completion.json'
    outputs:
    - uri: '{{config.reconstructed_uri}}/reconstruction.json'
    - uri: '{{config.reconstructed_uri}}/surface.npz'
    next: prepare
  prepare:
    description: Use the same measured surface for colored visual geometry and exact static triangle
      colliders.
    resources: cpu
    run:
      argv:
      - /bin/bash
      - -euc
      - 'usd_site="$(mktemp -d)"

        trap ''rm -rf "$usd_site"'' EXIT

        /opt/npa/venv/bin/python -m pip install --no-deps --target "$usd_site" usd-core==26.8

        export PYTHONPATH="${PYTHONPATH:+${PYTHONPATH}:}${usd_site}"

        /opt/npa/venv/bin/python -c ''from pxr import Usd; assert Usd.GetVersion() == (0, 26, 8);
        print("OpenUSD:", Usd.GetVersion())''

        /opt/npa/venv/bin/python "$@"

        '
      - scan-assemble
      - -m
      - npa.workbench.nurec.navigation_scene
      - --input-path
      - '{{config.reconstructed_uri}}'
      - --output-path
      - '{{config.assembled_uri}}'
    inputs:
    - uri: '{{config.reconstructed_uri}}/reconstruction.json'
    - uri: '{{config.reconstructed_uri}}/surface.npz'
    outputs:
    - uri: '{{config.assembled_uri}}/scene.usdz'
    - uri: '{{config.assembled_uri}}/provenance.json'
    next: cases
    needs:
    - reconstruct
  cases:
    description: Derive disjoint reset cases from measured floor support and obstacle clearance.
    resources: cpu
    run:
      argv:
      - /opt/npa/venv/bin/python
      - -m
      - npa.workbench.nurec.navigation_sample_stages
      - cases
      - --input-path
      - '{{config.reconstructed_uri}}'
      - --output-path
      - '{{config.cases_uri}}'
      - --num-envs
      - '{{config.num_envs}}'
    outputs:
    - uri: '{{config.cases_uri}}/cases.json'
    - uri: '{{config.cases_uri}}/support.json'
    next: physics
  physics:
    description: Open the packaged scene in Isaac Sim and require actual PhysX ray hits at measured
      distances.
    needs:
    - prepare
    resources: rtx
    run:
      argv:
      - /isaac-sim/python.sh
      - -m
      - npa.workbench.nurec.navigation_probe
      - --runtime-image
      - '{{config.isaac_image}}'
      - --input-path
      - '{{config.assembled_uri}}'
      - --output-path
      - '{{config.physics_uri}}'
    inputs:
    - uri: '{{config.assembled_uri}}/scene.usdz'
    - uri: '{{config.assembled_uri}}/provenance.json'
    outputs:
    - uri: '{{config.physics_uri}}/physics_validation.json'
    next: policy
  policy:
    description: Bind native PhysX scan validation and measured cases into one sealed training recipe.
    resources: cpu
    run:
      argv:
      - /opt/npa/venv/bin/python
      - -m
      - npa.workbench.nurec.navigation_sample_stages
      - policy
      - --input-path
      - '{{config.assembled_uri}}'
      - --physics-path
      - '{{config.physics_uri}}'
      - --cases-path
      - '{{config.cases_uri}}'
      - --output-path
      - '{{config.prepared_uri}}'
      - --image
      - '{{config.isaac_image}}'
      - --num-envs
      - '{{config.num_envs}}'
      - --iterations
      - '{{config.iterations}}'
      - --episode-steps
      - '{{config.episode_steps}}'
    outputs:
    - uri: '{{config.prepared_uri}}/completion.json'
    next: train
  train:
    description: Train real native RSL-RL on supported scan routes with independent held-out goals.
    resources: rtx
    run:
      argv:
      - /opt/npa/sim/venv/bin/python
      - -c
      - import sys; from npa.workflows.navigation.stages import run_stage; run_stage(*sys.argv[1:])
      - train
      - '{{config.prepared_uri}}'
      - '{{config.training_uri}}'
    outputs:
    - uri: '{{config.training_uri}}/completion.json'
    next: evaluate
  evaluate:
    description: Reload the exact checkpoint, repeat native controls, evaluate every held-out case
      and publish viewable HTML; quality failures stay failures.
    resources: rtx
    run:
      argv:
      - /opt/npa/sim/venv/bin/python
      - -m
      - npa.workbench.nurec.navigation_sample_report
      - --input-path
      - '{{config.training_uri}}'
      - --output-path
      - '{{config.evaluation_uri}}'
      - --reconstruction-path
      - '{{config.reconstructed_uri}}'
      - --report-path
      - '{{config.reports_uri}}'
    outputs:
    - uri: '{{config.evaluation_uri}}/completion.json'
    - uri: '{{config.reports_uri}}/index.html'
    - uri: '{{config.reports_uri}}/summary.json'
    terminal: true
