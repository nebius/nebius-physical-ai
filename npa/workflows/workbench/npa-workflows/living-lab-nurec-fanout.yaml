        \"),\n    \"gpu_name\": os.environ.get(\"GPU_NAME\", \"\"),\n    \"node_name\": os.environ.get(\"\
        NODE_NAME\", \"\"),\n    \"pod_name\": os.environ.get(\"POD_NAME\", \"\"),\n    \"wave_id\": os.environ.get(\"\
        RUN_URI\", \"\"),\n  },\n  \"gpu_uuid\": os.environ.get(\"GPU_UUID\", \"\"),\n  \"gpu_name\":\
