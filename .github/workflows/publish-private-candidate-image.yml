name: Publish private candidate image

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Redistributable NPA workbench tool to build"
        required: true
      candidate_registry:
        description: "Private GHCR candidate namespace override"
        required: false
        default: "ghcr.io/nebius/nebius-physical-ai-private"

permissions:
  contents: read
  packages: write

concurrency:
  group: private-candidate-${{ inputs.tool }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install NPA
        run: python -m pip install -e ./npa

      - name: Resolve guarded candidate
        id: candidate
        env:
          TOOL: ${{ inputs.tool }}
          CANDIDATE_REGISTRY: ${{ inputs.candidate_registry }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from npa.deploy.images import candidate_image_for_tool

          tool = os.environ["TOOL"].strip()
          dockerfile = Path("npa/docker/workbench") / tool / "Dockerfile"
          if not dockerfile.is_file():
              raise SystemExit(f"tool has no canonical candidate Dockerfile: {tool}")
          image = candidate_image_for_tool(
              tool,
              git_sha=os.environ["SOURCE_SHA"],
              registry=os.environ["CANDIDATE_REGISTRY"],
          )
          print(f"image={image}")
          print(f"dockerfile={dockerfile}")
          print(f"owner={image.split('/', 2)[1]}")
          print(f"package={image.split('/', 2)[2].rsplit(':', 1)[0]}")
          PY

      - name: Refuse a public candidate package
        env:
          GH_TOKEN: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.candidate.outputs.owner }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
        run: |
          set -euo pipefail
          encoded="${PACKAGE//\//%2F}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            package_api="/orgs/${OWNER}/packages/container/${encoded}"
          else
            package_api="/users/${OWNER}/packages/container/${encoded}"
          fi
          error_file="$(mktemp)"
          if visibility="$(gh api "$package_api" --jq .visibility 2>"$error_file")"; then
            if [ "$visibility" != "private" ]; then
              echo "::error::Candidate package visibility is '$visibility'; refusing to push development bytes."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$error_file"; then
            echo "::error::Could not prove candidate package visibility."
            sed 's/^/::error::/' "$error_file"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: npa
          file: ${{ steps.candidate.outputs.dockerfile }}
          push: true
          tags: ${{ steps.candidate.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify digest and private package visibility
        env:
          GH_TOKEN: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.candidate.outputs.owner }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}')"
          test -n "$digest"
          encoded="${PACKAGE//\//%2F}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            package_api="/orgs/${OWNER}/packages/container/${encoded}"
          else
            package_api="/users/${OWNER}/packages/container/${encoded}"
          fi
          test "$(gh api "$package_api" --jq .visibility)" = private
          echo "Candidate digest recorded by the workflow summary: $digest" >> "$GITHUB_STEP_SUMMARY"
