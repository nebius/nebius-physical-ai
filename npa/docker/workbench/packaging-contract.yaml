# Machine-readable packaging contract for workbench containers.
# Enforced by npa/tests/docker/test_packaging_contract.py
# Human companion: docs/workbench/container-packaging.md
#
# This file says which bytes may not be BAKED, which makes them run-time
# downloads. Where those downloads land, so the operator pays for them once
# instead of once per run, is npa/src/npa/workbench/model_cache.py and
# docs/workbench/model-weight-cache.md.

version: 1

tiers:
  service:
    description: Container starts an HTTP or mode-based service by default.
    entrypoint_must_not_be_bash: true
    require_expose: true
    prefer_healthcheck: true
  job:
    description: Container runs a workflow/CLI module; CMD may be overridden by orchestrator.
    entrypoint_must_not_be_bash: true
    require_expose: false
    prefer_healthcheck: false
  interactive:
    description: Dev/job shell; CLI or SkyPilot must supply the command.
    entrypoint_must_not_be_bash: false
    require_expose: false
    prefer_healthcheck: false

security:
  require_non_root_user: true
  allowed_final_users:
    - ubuntu
    - nobody
    - "1000"
    - "10001"
  forbid_secrets_in_dockerfile: true
  # Public images may not grant passwordless root unless a narrowly scoped,
  # reviewed runtime bootstrap requirement is recorded on that image entry.
  forbid_unexplained_passwordless_root: true
  secret_patterns:
    - "(?i)(api[_-]?key|secret[_-]?key|password)\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"
    - "(?i)BEGIN (RSA |OPENSSH )?PRIVATE KEY"

# Redistribution eligibility. This classifies whether a built image may be
# distributed BEYOND the owning Nebius org (e.g. published to a public/anonymous
# registry, shipped to a customer, or served to third parties). Read access
# WITHIN the owning org is always permitted; that is not what this gates.
# Enforced by npa/tests/docker/test_packaging_contract.py.
redistribution:
  # Patterns that mean a Dockerfile BAKES NVIDIA Omniverse Kit (Isaac Sim) into the
  # image's layers, and therefore must be "restricted".
  #
  # The distinction this encodes is *baked at build time* vs. *fetched at run time*.
  # The Isaac images now fetch Isaac Sim / Isaac Lab on first run from
  # pypi.nvidia.com under the operator's own EULA acceptance (see
  # npa/docker/workbench/common/isaac_bootstrap.sh), so their Dockerfiles still
  # legitimately mention isaacsim, isaaclab and the EULA variable names - in
  # bootstrap plumbing, pins, and prose explaining what is NOT baked. A substring
  # match on those names would fire on every one of them, and weakening it to make
  # the build pass would have thrown away the guard.
  #
  # So these are regexes matched against a NORMALISED Dockerfile: comment lines
  # stripped and line continuations joined. Joining matters - the sonic Dockerfile
  # used to spread one `pip install` over 27 backslash-continued lines, so a
  # per-line matcher would have missed the real installer while still tripping on
  # a comment.
  #
  # Images that inherit a restricted parent without a pattern of their own are
  # caught separately by the parent-inheritance check in
  # npa/tests/docker/test_packaging_contract.py (this is how sonic-mujoco is
  # caught, since its own Dockerfile carries no marker).
  #
  # Both directions are mutation-tested: every historical baking form must still be
  # detected, and every legitimate runtime-fetch reference must not be.
  omniverse_bake_patterns:
    - kind: vendor_base_image
      why: >-
        Building FROM an NVIDIA Omniverse/Isaac vendor image puts Omniverse Kit in
        the layers and needs an NGC login to pull.
      pattern: '(?im)^\s*(FROM|ARG\s+\w*BASE\w*=)[^\n]*nvcr\.io/nvidia/(isaac-lab|isaac-sim|omniverse)'
    - kind: isaac_wheel_install
      why: >-
        Installing the isaacsim / isaaclab wheels at build time bakes them; both
        declare "License: NVIDIA Proprietary Software".
      pattern: '(?is)\bRUN\b[^\n]*?\bpip\b[^\n]*?install[^\n]*?(\bisaacsim\b|\bisaaclab\b|isaaclab\[[^]]*isaacsim)'
    - kind: baked_eula_acceptance
      why: >-
        Baking acceptance removes the operator from the licensing decision. The
        refusal to run without operator-supplied acceptance is the load-bearing
        legal mechanism, so pre-granting it in the image is itself the violation.
      pattern: '(?im)^\s*(ENV|ARG)\s+[^\n]*\b(OMNI_KIT_ACCEPT_EULA|ISAACSIM_ACCEPT_EULA|ACCEPT_EULA|PRIVACY_CONSENT)\s*=\s*\S'
    - kind: kit_payload_copy
      why: COPY/ADD of an Isaac Sim or Omniverse Kit tree bakes the payload.
      pattern: '(?im)^\s*(COPY|ADD)\s+[^\n]*(isaac-sim/|isaacsim/|omniverse/|/kit/)'
    # The two below are attack vectors the runtime-fetch design itself introduces. They
    # did not exist before and are easy to add by accident, which is the point of
    # encoding them here rather than trusting review.
    - kind: bootstrap_invoked_at_build
      why: >-
        Running the runtime bootstrap in a RUN layer materialises the whole Isaac
        install into the image, silently undoing the re-architecture. `status` is
        fine (it neither accepts a licence nor downloads); ensure/warm/verify are not.
      pattern: '(?im)^\s*RUN\b[^\n]*\b(isaac-bootstrap|isaac_bootstrap\.sh)\s+(ensure|warm|verify)\b'
    - kind: isaac_interpreter_invoked_at_build
      why: >-
        /isaac-sim/python.sh is the bootstrap shim: it fetches Isaac on first use, so
        invoking it from a RUN layer downloads and bakes the install. Build-time work
        must use the image's own venv python (see Dockerfile.mujoco's
        ARG NPA_IMAGE_PYTHON, which exists exactly because this was a live trap).
      pattern: '(?im)^\s*RUN\b[^\n]*(/isaac-sim/python\.sh|\bisaac-python\b)'
    - kind: ovrtx_wheel_install
      why: >-
        OVRTX declares NVIDIA Proprietary Software. Installing its reviewed
        hash lock puts the native renderer in the image and makes that complete
        image private-registry-only unless redistribution rights are separately
        established.
      pattern: '(?is)\bRUN\b[^\n]*\b(?:uv\s+)?pip\s+install\b[^\n]*pylock\.ovrtx-runtime'
    - kind: ovrtx_build_bootstrap
      why: >-
        Provisioning OVRTX during an image build bakes NVIDIA's proprietary
        runtime even if the Dockerfile never spells out pip install.
      pattern: '(?is)\bRUN\b[^\n]*render_ovrtx[^\n]*--provision-only'
  classes:
    public:
      description: >
        OSS-redistributable. Code is under OSI-approved licenses (Apache-2.0 /
        BSD-3 / MIT / MPL-2.0); the CUDA/PyTorch base images (docker.io
        nvidia/cuda, pytorch/pytorch) are freely redistributable; any gated model
        weights are downloaded at runtime by the operator (never baked in). May
        be published to a public registry.
    restricted:
      description: >
        Bakes a runtime we may not redistribute — for NVIDIA Omniverse Kit (Isaac
        Sim) that means the Kit SDK, models and textures, which are proprietary
        even though the Isaac Sim SOURCE is Apache-2.0 (both the isaacsim and
        isaaclab PyPI packages list their license as "NVIDIA Proprietary
        Software"). Such an image may be built and run by the operator who owns
        the registry (internal R&D, build-your-own), but hosting it PREBUILT on a
        public/anonymous registry would make us the third-party redistributor,
        which requires an NVIDIA AI Enterprise license.
        Membership is deliberately generic and may be empty. Historical
        Cosmos3-serving and SONIC-MuJoCo digests remain quarantined because they
        inherited restricted baked bytes; new zero-payload/independent builds do
        not alter the classification of those old artifacts. Credentials or
        runtime consent never repair already baked restricted bytes.
      reason: bakes-a-non-redistributable-runtime

# Relative to npa/docker/workbench/
images:
  lerobot:
    dockerfile: lerobot/Dockerfile
    tier: service
    ports: [8080]
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    redistribution: public
  lerobot-policy:
    dockerfile: lerobot-policy/Dockerfile
    tier: service
    ports: [8080]
    redistribution: public
  lancedb:
    dockerfile: lancedb/Dockerfile
    tier: service
    ports: [8686]
    redistribution: public
  detection-training:
    dockerfile: detection-training/Dockerfile
    tier: service
    ports: [8790]
    redistribution: public
  wan2-2:
    dockerfile: wan2-2/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; the final runtime user is non-root, no sshd service is enabled by default, and no credentials are baked into the image."
    redistribution: public
    notes: >-
      Immutable Apache-2.0 Wan source plus an OSS CPU dependency base. CUDA
      PyTorch and all nvidia-* distributions are fetched only into a non-root
      writable runtime volume under their upstream package terms; model and
      tokenizer payloads are also runtime-only. Built-image byte/layer scanning
      is mandatory before publication.
  ltx2:
    dockerfile: ltx2/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; the final runtime user is non-root, no sshd service is enabled by default, and no credentials are baked into the image."
    redistribution: public
    notes: >-
      Contains no LTX-2.5 at all. Unlike every other model image here, that
      includes the SOURCE: the LTX-2.x Community License Agreement (2026-08-11)
      covers ltx-core / ltx-pipelines as licensed material, not just the weights,
      and its Section 3 conditions (impose the use restrictions by contract,
      deliver the agreement, do not transfer to a Commercial Entity without a
      paid licence) cannot be met by an anonymous registry pull. Baking the code
      would therefore have forced `restricted`; baking nothing makes the question
      moot. Upstream source is fetched at run time at an immutable commit and
      installed by upstream's own uv resolution, and gated weights come from
      Hugging Face — both only under the operator's own token, since Section 1.9
      makes the source licensed material too and the gated repository is where
      Lightricks actually grants access. Sections 2.1 (paid Commercial Use
      Agreement above $10M revenue) and Attachment A(18) (no training other
      models on Outputs for commercial use) govern the operator's own conduct and
      artifacts, and are their responsibility rather than something this image
      certifies. Byte/layer scanning with scripts/scan_image_ltx_payload.py is
      mandatory before publication. The supported release must resolve to the
      exact zero-payload digest in ltx2_image_manifest.json, whose operator-only
      runtime fetch and real GPU generation evidence are bound to the same bytes.
  alpamayo2-super:
    dockerfile: alpamayo2-super/Dockerfile
    tier: service
    ports: [8080]
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; the final runtime user is non-root, no sshd service is enabled by default, and no credentials are baked into the image."
    redistribution: public
    notes: >-
      Bakes immutable Apache-2.0 Alpamayo 2 source and its CUDA/PyTorch
      inference runtime. The OpenMDW-1.1 checkpoint, separately restricted
      PhysicalAI-AV dataset, operator credentials, and populated caches are
      absent and fetched only at runtime. Built-image byte/layer scanning and
      real B200 plus RTX PRO 6000 inference are publication gates. Release
      0.1.0-cu128 passed the complete 26-layer payload scan and both independent
      real-inference gates on 2026-08-18; the accepted OCI index digest is
      sha256:2164450f8baf57d8798f64063ea27bf11611f5b695c467de0c2e319e3134ebd5.
  sonic:
    dockerfile: sonic/Dockerfile
    isaac_runtime_fetch: true
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    redistribution: public
  sonic-mujoco:
    dockerfile: sonic/Dockerfile.mujoco
    tier: job
    redistribution: public
    notes: >-
      Rebuilt independently on a digest-pinned official Python base from pinned
      Apache-2.0 SONIC source plus an exact public PyPI CUDA/MuJoCo closure;
      Isaac Sim, Isaac Lab, Omniverse Kit, models, credentials, and accepted terms
      remain absent. Isaac-facing inherited modes retain runtime-fetch refusal.
  sim2real-eval:
    dockerfile: sim2real-eval/Dockerfile
    tier: job
    redistribution: public
  sim2real-control:
    dockerfile: sim2real-control/Dockerfile
    tier: job
    redistribution: public
    passwordless_root_exemption: >-
      The stock SkyPilot 0.12.2 Kubernetes bootstrap invokes arbitrary sudo
      package/service and shell commands before the declared task starts, so a
      command allowlist would be equivalent to allowing its root shell and would
      provide a false boundary. This exception is limited to the CPU-only
      Sim2Real standard-workflow adapter image: its final user is uid 1000, sshd
      is not started by the image, password/root SSH login is disabled by the
      Debian defaults used here, no credentials or GPU/vendor runtime are baked,
      and the task pod/container—not the uid—is the documented trust boundary.
      Remove this grant when the pinned SkyPilot bootstrap supports rootless
      Kubernetes task setup; it is not an authorization pattern for services.
    privilege_exception:
      id: sim2real-control-skypilot-0.12.2-root-bootstrap
      expires_with: skypilot-rootless-kubernetes-bootstrap
      scope: ephemeral-standard-workflow-task-pod
      prohibited_uses: [service, public-ingress, baked-credentials]
  cosmos2-transfer:
    dockerfile: cosmos2-transfer/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    notes: >-
      Complete source build at immutable commit
      67d56b7d550a3911024a32dc23ae0bae5258e633 on digest-pinned public
      CUDA build/runtime bases. Git LFS smudging is disabled; upstream assets, example media,
      checkpoints, caches, and Git metadata are removed and build-guarded. Gated
      NVIDIA Open Model License weights are fetched only at runtime with the
      operator's HF_TOKEN into a mounted cache. Optional SAM2 removes the
      lockfile's unaffiliated PyPI repackaging and installs Meta's official
      Apache-2.0 source at immutable commit
      2b90b9f5ceec907a1c18123530e92e794ad901a4; its public Apache-2.0 checkpoint
      is runtime-fetched and never baked. PAIDF's CC-BY-4.0 RoboPro starter
      is likewise not baked into this or any image: the operator-side NPA CLI
      fetches the immutable object, enforces its SHA-256, and stages it to the
      run. The upstream Cosmos repository's ambiguously licensed example media
      remains excluded. The derived whole-container
      distribution conditions and full artifact evidence are recorded in
      cosmos2-transfer/REDISTRIBUTION.md; built-byte scans are a release gate.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  cosmos3:
    dockerfile: cosmos3/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    notes: >-
      Cosmos 3 omni-model generation, released additively as 1.2.2-cu130-r6;
      the immutable 1.2.2-cu130, r2, and unpublished r3/r4 images remain rollback
      provenance. The r6 image removes imageio-ffmpeg's redundant wheel-bundled
      executable, uses the attributed distro FFmpeg instead, and keeps a
      no-argv SkyPilot worker pod alive until bootstrap execs its setup, and
      publishes auditable source-motion-preserving PAIDF composites beside the
      unmodified Cosmos outputs. Bakes
      OpenMDW-1.1 cosmos-framework SOURCE at a pinned commit plus its cu130
      inference venv; NO model weights. Gated
      Cosmos3 checkpoints, the Wan VAE, and the guardrail models download at
      runtime with the operator's own HF token (plus their NGC key when
      NPA_COSMOS3_REQUIRE_NGC=1), so distribution never carries weight bytes. The
      build fails if a checkpoint file lands in a layer or if the known-bad
      huggingface_hub 1.23.0 / hf-xet 1.5.1 pair is resolved; the compatible
      frozen pair keeps Xet enabled. Ships sudo, rsync, and openssh-server with
      a command-passthrough entrypoint and a NOPASSWD grant for the non-root
      runtime user because the SkyPilot Kubernetes bootstrap installs its SSH runtime in-pod; see
      docs/security/container-golden-evals.md.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  cosmos3-serving:
    dockerfile: cosmos3-serving/Dockerfile
    tier: service
    ports: [8000]
    notes: >-
      Zero-payload bootstrap on a digest-pinned official Python base. The exact
      vLLM-Omni source and CUDA/PyTorch closure are fetched directly at runtime
      only after the operator explicitly accepts the NVIDIA Software License.
      It contains no NLC/NGC runtime, model or guardrail weights, credentials,
      accepted terms, or gated assets. Both gated model repositories are probed
      before the documented 8-GPU service starts.
    redistribution: public
  content-agents:
    dockerfile: content-agents/Dockerfile
    ovrtx_runtime_fetch: true
    accepted_image_manifest: npa/src/npa/deploy/content_agents_image_manifest.json
    tier: job
    passwordless_root_exemption: >-
      SkyPilot Kubernetes bootstrap only; the final task process is uid 1000,
      no service or public ingress is enabled, host keys are generated only at
      run time, and no credentials or license acceptance are baked.
    notes: >-
      NVIDIA Content Agents v0.5.2 source is Apache-2.0 and fetched at immutable
      commit 36dbf3f274f8e256637230a05a085853f65cc175. The public image contains
      only source, the NPA downloader, and the reviewed upstream OVRTX lock;
      it contains zero OVRTX wheel, runtime, or native payload bytes. On first
      render use, the operator fetches exact OVRTX 0.3.0.312915 directly from
      NVIDIA's anonymous package index into the standard runtime cache.
      Scene Optimizer Core, OvPhysX, upstream material/sample assets, model
      weights, credentials, and customer data are excluded. Hosted VLM inference
      and customer assets enter only at run time. NVIDIA driver userspace is not
      baked; OVRTX requires an RTX Kubernetes node whose GPU Operator mounts
      compute, utility, graphics, and display capabilities.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  cosmos3-reason:
    dockerfile: cosmos3-reason/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    redistribution: public
  cosmos-curate:
    dockerfile: cosmos-curate/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    notes: "Mode-based entrypoint; no model weights baked in (fetch-models mode uses HF_TOKEN)."
    # Upstream cosmos-curate is Apache-2.0 and its source is redistributable; the
    # weights it would otherwise need are fetched at run time with the operator's
    # own token, so nothing license-restricted is baked into this image.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  cosmos-evaluator:
    dockerfile: cosmos-evaluator/Dockerfile
    tier: job
    passwordless_root_exemption: "SkyPilot Kubernetes bootstrap only; non-root runtime user, no default sshd service, and no baked credentials."
    notes: "Mode-based entrypoint; the wired checks need no model weights."
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  lerobot-vlm-rl:
    dockerfile: lerobot-vlm-rl/Dockerfile
    tier: job
    redistribution: public
  genesis:
    dockerfile: genesis/Dockerfile
    tier: interactive
    redistribution: public
  isaac-lab:
    dockerfile: isaac-lab/Dockerfile
    isaac_runtime_fetch: true
    tier: interactive
    notes: >-
      Bakes OSS dependencies only and uses Debian FFmpeg at runtime. The image
      removes imageio-ffmpeg's wheel-bundled static executable in the same layer
      that installs the Python environment. Isaac Sim/Lab and task assets remain
      cryptographically verified runtime fetches after EULA preflight.
    redistribution: public
  leisaac:
    dockerfile: leisaac/Dockerfile
    isaac_runtime_fetch: true
    tier: service
    ports: [8080, 49100, 47998]
    notes: >-
      Bakes Apache-2.0 LeIsaac source at immutable commit 1651c321 and OSS
      dependencies only, including Debian FFmpeg/PyArrow/boto3 for the LeRobot
      v3 recorder. The image excludes imageio-ffmpeg's wheel-bundled static
      executable and records both FFmpeg and the LeIsaac-only optional wrapper
      in leisaac/THIRD_PARTY_NOTICES.md. Its agent-relay deployment pulls the digest-pinned
      coturn 4.6.3-r3 BSD-3-Clause sidecar. Isaac Sim/Lab, the NVIDIA WebRTC
      browser client, and task assets are cryptographically verified runtime
      fetches after the shared default/opt-out EULA preflight; see
      leisaac/REDISTRIBUTION.md.
    redistribution: public
  fiftyone:
    dockerfile: fiftyone/Dockerfile
    tier: job
    ports: [5151]
    notes: >-
      Command-passthrough entrypoint supports SkyPilot Kubernetes setup as the
      non-root ubuntu user (openssh-server, rsync, sudo, passwordless service
      restart). The service deploy path supplies the FiftyOne App command.
    passwordless_root_exemption: >-
      SkyPilot's Kubernetes bootstrap installs and starts its in-pod SSH runtime
      as the non-root ubuntu user. The image deletes all build-time SSH host keys,
      disables password and root login, and does not start sshd by default; host
      keys exist only ephemerally when the orchestrator explicitly starts SSH.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  cosmos:
    dockerfile: cosmos/Dockerfile
    tier: interactive
    ports: [8080]
    notes: "Server is built into the image; promote to service when default CMD starts it."
    redistribution: public
  groot:
    dockerfile: groot/Dockerfile
    isaac_runtime_fetch: true
    tier: interactive
    ports: [8080]
    passwordless_root_exemption:
      rationale: >-
        SkyPilot's Kubernetes bootstrap invokes package and SSH setup through
        passwordless sudo as the non-root ubuntu user. Neither source starts
        sshd by default or bakes credentials, and the container boundary remains
        the reviewed trust boundary for these ephemeral workflow task pods.
      sources:
        - groot/Dockerfile
        - common/install_isaac_runtime_base.sh
        - groot/Dockerfile.k8s-prereqs
      grants:
        - source: common/install_isaac_runtime_base.sh
          sudoers_entry: "ubuntu ALL=(ALL) NOPASSWD:ALL"
        - source: groot/Dockerfile.k8s-prereqs
          sudoers_entry: "ubuntu ALL=(ALL) NOPASSWD:ALL"
    derived_skypilot_bootstrap_contract:
      dockerfile: groot/Dockerfile.k8s-prereqs
      version: skypilot-0.12.2-v1
      verification: runtime_probe_required
    notes: >-
      EXPOSE 8080 without default server CMD. The canonical build supplies the
      ubuntu user and passwordless sudo but not the complete SkyPilot contract;
      the derived repair source supplies sshd, runtime host keys, and argument
      forwarding. Its label is never trusted by itself: submit requires an exact-
      digest runtime capability probe. Promote to service when ready.
    redistribution: public
  retargeting:
    dockerfile: retargeting/Dockerfile
    tier: interactive
    redistribution: public
  sim2real-envgen:
    dockerfile: sim2real-envgen/Dockerfile
    tier: interactive
    redistribution: public
  rerun-viewer:
    dockerfile: rerun-viewer/Dockerfile
    tier: job
    ports: [9090]
    final_user: ubuntu
    notes: >-
      Purpose-built standard-workflow Stage 14 image with exact NPA source,
      resolver-closed Rerun/MCAP dependencies, and SkyPilot Kubernetes bootstrap
      prerequisites. Its command-passthrough entrypoint preserves orchestrator
      argv, while an empty argv starts the interactive Rerun server.
    passwordless_root_exemption: >-
      SkyPilot's Kubernetes bootstrap installs and starts its in-pod SSH runtime
      as the non-root ubuntu user. The image deletes all build-time SSH host keys,
      disables password and root login, starts no SSH service by default, and
      uses the grant only inside an explicitly orchestrated ephemeral worker.
    redistribution: public
    skypilot_bootstrap_contract: skypilot-0.12.2-v1
  foxglove-embed:
    dockerfile: foxglove-embed/Dockerfile
    tier: service
    ports: [8099]
    final_user: nobody
    notes: "Static host for the @foxglove/embed SDK (MIT), the shared glue module, and MCAP data (CORS + byte ranges)."
    redistribution: public
  lichtblick:
    dockerfile: lichtblick/Dockerfile
    tier: service
    ports: [8080]
    final_user: nobody
    notes: "Lichtblick (MPL-2.0) OSS Foxglove-compatible static web viewer; caddy file-server default CMD + HEALTHCHECK."
    redistribution: public
