# npa fleet example: 1 identical k8s-training cluster in 2 on-demand projects.
#
# Each project gets one cluster with 1 GPU RTX PRO 6000 node + 1 48-vCPU node.
# The two projects are created under the tenant on demand (name = project_prefix
# + the entry name), so this yields projects "fleet1-test-a" and "fleet1-test-b".
#
#   npa fleet plan   --spec examples/fleet/fleet1-test.yaml
#   npa fleet deploy --spec examples/fleet/fleet1-test.yaml
#   npa fleet destroy --spec examples/fleet/fleet1-test.yaml --force
apiVersion: npa.fleet/v0.0.1
name: fleet1-test

# tenant_id / region resolve from ~/.nebius + ~/.npa when left empty.
tenant_id: ""
region: us-central1
project_prefix: "fleet1-test-"

# Shared cluster profile merged under every cluster below. Because both projects
# omit `clusters`, they each deploy exactly this profile (an "identical" fleet).
defaults:
  cpu_nodes:
    count: 1
    platform: cpu-d3
    preset: 48vcpu-192gb
  gpu_nodes:
    count: 1
    platform: gpu-rtx6000
    preset: 1gpu-24vcpu-218gb
  enable_filestore: true
  filestore_disk_size_gibibytes: 1024

projects:
  - name: a   # -> project "fleet1-test-a"
  - name: b   # -> project "fleet1-test-b"

