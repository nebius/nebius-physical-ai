apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: digital-twin-cuda-render
  executionMode: runtime
  description: Render an authored industrial reference scene with native Blender Cycles CUDA and publish offline HTML, OpenUSD, glTF, and measured rendering evidence.
config:
  bucket: example-bucket
  prefix: digital-twin-cuda-render/{{run.id}}
  output_uri: s3://{{config.bucket}}/{{config.prefix}}/rendered
  source_overlay: true
  runtime_image: ghcr.io/nebius/nebius-physical-ai/npa-sonic@sha256:c9ba0996b28f54b013e36da689638b386a7ef9c0c8c4413fc4b3c72ff1a808bb
  accelerator: B200:1
  views: 24
  samples: 64
resources:
  renderer:
    cloud: kubernetes
    accelerators: '{{config.accelerator}}'
    cpus: 8
    memory: 32Gi
    disk_size: 100
    image: '{{config.runtime_image}}'
initial: render
states:
  render:
    description: Fetch hash-pinned Blender, require CUDA devices, render every view, and bind the scene and media hashes before publication.
    resources: renderer
    run:
      argv:
        - /opt/npa/venv/bin/python
        - -m
        - npa.workflows.digital_twin_render
        - --output-path
        - '{{config.output_uri}}'
        - --views
        - '{{config.views}}'
        - --samples
        - '{{config.samples}}'
    outputs:
      - uri: '{{config.output_uri}}/completion.json'
        schema: npa.navigation.publication.v1
    terminal: true
