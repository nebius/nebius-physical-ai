apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sonic-export-eval
  description: Train a SONIC policy, export it to ONNX, then evaluate the export.

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/sonic-export-eval"
  episodes: "8"
  env: locomotion-smoke
  sonic_runtime: local
  # NVIDIA's Omniverse / Isaac Sim / Software licence terms. `--runtime local` runs the SONIC
  # image's own trainer when present, and that trainer refuses to download Isaac Sim / Isaac Lab
  # until this is given — without it the run falls back to the reference trainer.
  # Empty means NOT accepted; set it to `yes` to accept.
  sonic_accept_nvidia_eula: ""
  train_iterations: "40"
  data_uri: "s3://{{config.bucket}}/{{config.prefix}}/data/"
  training_uri: "s3://{{config.bucket}}/{{config.prefix}}/training/"

  # Each stage hands the next one an S3 artifact: stages run on their own
  # clusters, so the chain only holds together through object storage.
  checkpoint_uri: "{{config.training_uri}}checkpoint.pt"
  onnx_uri: "s3://{{config.bucket}}/{{config.prefix}}/sonic_policy.onnx"
  eval_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval.json"

resources:
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 8
    memory: 32Gi

initial: train

states:
  train:
    description: Train a SONIC locomotion policy in this stage's own container.
    toolRef: workbench.sonic.train
    resources: gpu
    outputs:
      - uri: "{{config.checkpoint_uri}}"
        schema: npa.workbench.sonic.checkpoint.v1
    next: export-onnx

  export-onnx:
    description: Export the trained SONIC checkpoint to ONNX.
    needs: [train]
    toolRef: workbench.sonic.export
    resources: gpu
    inputs:
      - uri: "{{config.checkpoint_uri}}"
        schema: npa.workbench.sonic.checkpoint.v1
    outputs:
      - uri: "{{config.onnx_uri}}"
        schema: npa.workbench.sonic.onnx.v1
    next: eval-onnx

  eval-onnx:
    description: Evaluate the exported ONNX policy.
    needs: [export-onnx]
    toolRef: workbench.sonic.eval
    resources: gpu
    inputs:
      - uri: "{{config.onnx_uri}}"
        schema: npa.workbench.sonic.onnx.v1
    outputs:
      - uri: "{{config.eval_uri}}"
        schema: npa.workbench.sonic.eval.v1
    terminal: true
