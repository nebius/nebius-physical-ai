# Compute-only robomimic BC smoke: exact one-B200 shape, no simulator/render stack.
name: byof-solution-smoke-robomimic-b200-gpu
execution: serial
---
name: byof-solution-smoke-robomimic-b200-gpu
resources:
  cloud: kubernetes
  accelerators: B200:1
  cpus: 8+
  memory: 32+
  disk_size: 100
  image_id: "docker:<your-registry>/<namespace>/npa-byof:<your-run-id>"
config:
  kubernetes:
    pod_config:
      spec:
        # The dedicated live gate replaces this inert checked-in name with a
        # run-scoped ServiceAccount that it creates, verifies, and removes.
        serviceAccountName: npa-robomimic-observer-placeholder
envs:
  NPA_BYOF_RUN_ID: "<your-run-id>"
  BYOF_REPO_ROOT: "/opt/byof"
  BYOF_SMOKE_COMMAND: ""
  BYOF_SOLUTION_NAME: ""
  BYOF_CAPABILITY_NAME: ""
  BYOF_SMOKE_ARTIFACT_NAME: ""
  BYOF_IMAGE: ""
  # The authorized live harness materializes this boolean in a run-local copy
  # only after checking the manager's STRICT-capacity gate. The private
  # reservation identity stays outside rendered task YAML and repo artifacts.
  NPA_ROBOMIMIC_STRICT_B200_ATTESTED: ""
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  S3_OUTPUT_PREFIX: "s3://${NPA_S3_BUCKET}/byof/${NPA_BYOF_RUN_ID}/"
  AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
setup: |
  set -euo pipefail
  test -d "${BYOF_REPO_ROOT}"
  test -f "${BYOF_REPO_ROOT}/npa_source_metadata.json"
  test -f "${BYOF_REPO_ROOT}/npa_build_metadata.json"
  python3 - <<'PY'
  import boto3
  PY
run: |
  set -euo pipefail
  OUTPUT_DIR="/workspace/byof-runs/${NPA_BYOF_RUN_ID}"
  mkdir -p "${OUTPUT_DIR}"
  export NPA_SMOKE_OUTPUT_DIR="${OUTPUT_DIR}"
  cp "${BYOF_REPO_ROOT}/npa_source_metadata.json" "${OUTPUT_DIR}/npa_source_metadata.json"
  cp "${BYOF_REPO_ROOT}/npa_build_metadata.json" "${OUTPUT_DIR}/npa_build_metadata.json"
  nvidia-smi > "${OUTPUT_DIR}/nvidia_smi.txt" 2>&1
  nvidia-smi -L > "${OUTPUT_DIR}/nvidia_smi_list.txt" 2>&1
  SMOKE_EXIT_CODE=0
  if [ -n "${BYOF_SMOKE_COMMAND}" ]; then
    set +e
    (
      cd "${BYOF_REPO_ROOT}"
      /bin/bash -lc "${BYOF_SMOKE_COMMAND}"
    ) > "${OUTPUT_DIR}/solution_smoke_stdout.log" 2> "${OUTPUT_DIR}/solution_smoke_stderr.log"
    SMOKE_EXIT_CODE=$?
    set -e
  fi
  if [ -n "${BYOF_SMOKE_COMMAND}" ] && [ -n "${BYOF_SMOKE_ARTIFACT_NAME}" ] && [ "${SMOKE_EXIT_CODE}" -eq 0 ]; then
    test -f "${OUTPUT_DIR}/${BYOF_SMOKE_ARTIFACT_NAME}"
  fi
  export SMOKE_EXIT_CODE
  python3 <<'PY'
  import json
  import os
  import time
  from pathlib import Path
  from urllib.parse import urlparse

  import boto3
  from botocore.config import Config

  run_id = os.environ["NPA_BYOF_RUN_ID"]
  root = Path(f"/workspace/byof-runs/{run_id}")
  smoke_exit_code = int(os.environ.get("SMOKE_EXIT_CODE", "0"))
  smoke_artifact_name = os.environ["BYOF_SMOKE_ARTIFACT_NAME"]
  smoke_artifact_path = root / smoke_artifact_name
  if smoke_artifact_path.is_file():
      smoke_artifact = json.loads(smoke_artifact_path.read_text(encoding="utf-8"))
      if not isinstance(smoke_artifact, dict):
          raise RuntimeError(f"smoke artifact must be a JSON object: {smoke_artifact_path}")
      # Only the wrapper can observe the completed smoke process' return code.
      smoke_artifact["exit_status"] = smoke_exit_code
      smoke_artifact_path.write_text(
          json.dumps(smoke_artifact, indent=2, sort_keys=True) + "\n", encoding="utf-8"
      )
  metadata = json.loads(
      (Path(os.environ["BYOF_REPO_ROOT"]) / "npa_source_metadata.json").read_text(encoding="utf-8")
  )
  summary = {
      "status": "success" if smoke_exit_code == 0 else "failed",
      "tool": "byof",
      "workload": "solution-smoke-robomimic-b200",
      "run_id": run_id,
      "image": os.environ.get("BYOF_IMAGE", ""),
      "repo_root": os.environ["BYOF_REPO_ROOT"],
      "metadata": metadata,
      "solution_name": os.environ.get("BYOF_SOLUTION_NAME", ""),
      "capability_name": os.environ.get("BYOF_CAPABILITY_NAME", ""),
      "smoke_artifact_name": smoke_artifact_name,
      "smoke_exit_code": smoke_exit_code,
      "created_unix": round(time.time(), 3),
  }
  (root / "npa_byof_summary.json").write_text(
      json.dumps(summary, indent=2) + "\n", encoding="utf-8"
  )
  print(json.dumps(summary, indent=2), flush=True)

  output = os.environ["S3_OUTPUT_PREFIX"].rstrip("/") + "/"
  parsed = urlparse(output)
  if parsed.scheme != "s3" or not parsed.netloc:
      raise RuntimeError(f"invalid S3 output prefix: {output!r}")
  endpoint = (
      os.environ.get("AWS_ENDPOINT_URL")
      or os.environ.get("NEBIUS_S3_ENDPOINT")
      or ""
  ).strip() or None
  client_kwargs = {
      "endpoint_url": endpoint,
      "config": Config(s3={"addressing_style": "path"}),
      "region_name": os.environ.get("AWS_DEFAULT_REGION", "us-central1"),
  }
  access_key = (os.environ.get("AWS_ACCESS_KEY_ID") or "").strip()
  secret_key = (os.environ.get("AWS_SECRET_ACCESS_KEY") or "").strip()
  session_token = (os.environ.get("AWS_SESSION_TOKEN") or "").strip()
  if access_key and secret_key:
      client_kwargs["aws_access_key_id"] = access_key
      client_kwargs["aws_secret_access_key"] = secret_key
      if session_token:
          client_kwargs["aws_session_token"] = session_token
  s3 = boto3.client("s3", **client_kwargs)
  prefix = parsed.path.lstrip("/")
  uploaded = 0
  for path in root.rglob("*"):
      if path.is_file():
          if path.suffix.lower() in {".hdf5", ".download"}:
              raise RuntimeError(f"runtime input must not be uploaded as output: {path}")
          key = prefix + str(path.relative_to(root))
          s3.put_object(Bucket=parsed.netloc, Key=key, Body=path.read_bytes(), IfNoneMatch="*")
          uploaded += 1
  s3.head_object(Bucket=parsed.netloc, Key=prefix + "npa_byof_summary.json")
  if smoke_exit_code == 0:
      s3.head_object(Bucket=parsed.netloc, Key=prefix + smoke_artifact_name)
  print(f"uploaded_file_count={uploaded}", flush=True)
  PY
  if [ "${SMOKE_EXIT_CODE}" -ne 0 ]; then
    exit "${SMOKE_EXIT_CODE}"
  fi
