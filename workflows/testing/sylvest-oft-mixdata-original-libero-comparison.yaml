apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sylvest-oft-mixdata-original-libero-comparison
  description: >-
    Source-pinned paired original-LIBERO evaluation of the official OpenVLA-OFT
    baseline and Sylvest's mixed-data checkpoint. The successful path prepares
    a hash-bound protocol, performs two upstream-native original-LIBERO
    simulator rollout passes, calculates paired differences, and emits a
    factual report plus Rerun recording. It does not treat fine-tuning as an
    improvement or claim LIBERO-Plus perturbation results.

config:
  bucket: example-bucket
  prefix: "sylvest-oft-mixdata-original-libero/{{run.id}}"
  gpu_type: RTXPRO6000
  source_overlay: true
  runtime_image: ""
  model_cache_root: "/workspace/.cache/npa/models"
  # Licensed evaluator, dependency, and benchmark sources are fetched atomically
  # to this operator-owned worker cache at their exact revisions, never baked.
  openvla_oft_root: "/workspace/.cache/npa/sources/openvla-oft"
  openvla_oft_revision: "e4287e94541f459edc4feabc4e181f537cd569a8"
  dlimp_root: "/workspace/.cache/npa/sources/dlimp"
  dlimp_revision: "92e3eca97af3b14d0b6aa15182c0dc240407698d"
  dlimp_runtime_root: "/workspace/.cache/npa/dlimp-deterministic"
  libero_root: "/workspace/.cache/npa/sources/libero"
  libero_revision: "8f1084e3132a39270c3a13ebe37270a43ece2a01"
  benchmark: original_libero
  task_suite: libero_spatial
  initial_state_indices: "0,1,2"
  comparison_scope: training_coverage_unknown
  training_task_ids_uri: ""
  seed: 7
  env_image_resolution: 256
  center_crop: true
  num_images_in_input: 2
  num_open_loop_steps: 8
  baseline_checkpoint_id: "moojink/openvla-7b-oft-finetuned-libero-spatial-object-goal-10"
  baseline_checkpoint_revision: "638918f3d1c2e43a39a8a20772bdb8b91835e4b7"
  candidate_checkpoint_id: "Sylvest/openvla-7b-oft-finetuned-libero-plus-mixdata"
  candidate_checkpoint_revision: "a85655ec941bae6644c9fbdf62db02b9726d7cf5"
  prepared_uri: "s3://{{config.bucket}}/{{config.prefix}}/prepared/"
  baseline_uri: "s3://{{config.bucket}}/{{config.prefix}}/baseline/"
  candidate_uri: "s3://{{config.bucket}}/{{config.prefix}}/candidate/"
  comparison_uri: "s3://{{config.bucket}}/{{config.prefix}}/comparison/"
  report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/"

resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: "{{config.runtime_image}}"
  gpu:
    cloud: kubernetes
    accelerators: "{{config.gpu_type}}:1"
    cpus: 16
    memory: 96Gi
    image: "{{config.runtime_image}}"

initial: prepare

states:
  prepare:
    description: Pin original MIT LIBERO task and initial-state bytes into a paired protocol.
    run:
      shell: >-
        case "{{config.runtime_image}}" in *@sha256:*) ;; *) echo "runtime_image must be an immutable digest" >&2; exit 64;; esac;
        "$NPA_CONTROL_PYTHON" -m npa.workflows.sylvest_oft_mixdata prepare
        --benchmark "{{config.benchmark}}"
        --libero-root "{{config.libero_root}}"
        --libero-revision "{{config.libero_revision}}"
        --comparison-scope "{{config.comparison_scope}}"
        --training-task-ids-uri "{{config.training_task_ids_uri}}"
        --task-suite "{{config.task_suite}}"
        --initial-state-indices "{{config.initial_state_indices}}"
        --seed "{{config.seed}}"
        --env-image-resolution "{{config.env_image_resolution}}"
        --center-crop "{{config.center_crop}}"
        --num-images-in-input "{{config.num_images_in_input}}"
        --num-open-loop-steps "{{config.num_open_loop_steps}}"
        --model-cache-root "{{config.model_cache_root}}"
        --openvla-oft-root "{{config.openvla_oft_root}}"
        --openvla-oft-revision "{{config.openvla_oft_revision}}"
        --dlimp-root "{{config.dlimp_root}}"
        --dlimp-revision "{{config.dlimp_revision}}"
        --baseline-checkpoint-id "{{config.baseline_checkpoint_id}}"
        --baseline-checkpoint-revision "{{config.baseline_checkpoint_revision}}"
        --candidate-checkpoint-id "{{config.candidate_checkpoint_id}}"
        --candidate-checkpoint-revision "{{config.candidate_checkpoint_revision}}"
        --output-path "{{config.prepared_uri}}"
    resources: cpu
    outputs:
      - uri: "{{config.prepared_uri}}protocol.json"
        schema: npa.sylvest-oft-mixdata.protocol.v1
      - uri: "{{config.prepared_uri}}provenance.json"
        schema: npa.sylvest-oft-mixdata.provenance.v1
      - uri: "{{config.prepared_uri}}notices.json"
        schema: npa.sylvest-oft-mixdata.notices.v1
    next: baseline_rollouts

  baseline_rollouts:
    description: Execute official OpenVLA-OFT original-LIBERO rollouts for every prepared case.
    run:
      shell: >-
        case "{{config.runtime_image}}" in *@sha256:*) ;; *) echo "runtime_image must be an immutable digest" >&2; exit 64;; esac;
        "$NPA_CONTROL_PYTHON" -m npa.workflows.sylvest_oft_mixdata rollout
        --protocol-uri "{{config.prepared_uri}}protocol.json"
        --checkpoint-id "{{config.baseline_checkpoint_id}}"
        --checkpoint-revision "{{config.baseline_checkpoint_revision}}"
        --model-cache-root "{{config.model_cache_root}}"
        --openvla-oft-root "{{config.openvla_oft_root}}"
        --openvla-oft-revision "{{config.openvla_oft_revision}}"
        --dlimp-root "{{config.dlimp_root}}"
        --dlimp-revision "{{config.dlimp_revision}}"
        --dlimp-runtime-root "{{config.dlimp_runtime_root}}"
        --benchmark "{{config.benchmark}}"
        --libero-root "{{config.libero_root}}"
        --libero-revision "{{config.libero_revision}}"
        --output-path "{{config.baseline_uri}}"
    resources: gpu
    inputs:
      - uri: "{{config.prepared_uri}}protocol.json"
        schema: npa.sylvest-oft-mixdata.protocol.v1
    outputs:
      - uri: "{{config.baseline_uri}}rollouts.json"
        schema: npa.sylvest-oft-mixdata.rollouts.v1
      - uri: "{{config.baseline_uri}}clips/manifest.json"
        schema: npa.sylvest-oft-mixdata.clip-manifest.v1
      - uri: "{{config.baseline_uri}}provenance.json"
        schema: npa.sylvest-oft-mixdata.provenance.v1
    next: candidate_rollouts

  candidate_rollouts:
    description: Execute the Sylvest checkpoint on the identical original-LIBERO cases and states.
    run:
      shell: >-
        case "{{config.runtime_image}}" in *@sha256:*) ;; *) echo "runtime_image must be an immutable digest" >&2; exit 64;; esac;
        "$NPA_CONTROL_PYTHON" -m npa.workflows.sylvest_oft_mixdata rollout
        --protocol-uri "{{config.prepared_uri}}protocol.json"
        --checkpoint-id "{{config.candidate_checkpoint_id}}"
        --checkpoint-revision "{{config.candidate_checkpoint_revision}}"
        --model-cache-root "{{config.model_cache_root}}"
        --openvla-oft-root "{{config.openvla_oft_root}}"
        --openvla-oft-revision "{{config.openvla_oft_revision}}"
        --dlimp-root "{{config.dlimp_root}}"
        --dlimp-revision "{{config.dlimp_revision}}"
        --dlimp-runtime-root "{{config.dlimp_runtime_root}}"
        --benchmark "{{config.benchmark}}"
        --libero-root "{{config.libero_root}}"
        --libero-revision "{{config.libero_revision}}"
        --output-path "{{config.candidate_uri}}"
    resources: gpu
    inputs:
      - uri: "{{config.prepared_uri}}protocol.json"
        schema: npa.sylvest-oft-mixdata.protocol.v1
    outputs:
      - uri: "{{config.candidate_uri}}rollouts.json"
        schema: npa.sylvest-oft-mixdata.rollouts.v1
      - uri: "{{config.candidate_uri}}clips/manifest.json"
        schema: npa.sylvest-oft-mixdata.clip-manifest.v1
      - uri: "{{config.candidate_uri}}provenance.json"
        schema: npa.sylvest-oft-mixdata.provenance.v1
    next: compare

  compare:
    description: Measure case-aligned original-LIBERO paired success and timing differences.
    run:
      shell: >-
        "$NPA_CONTROL_PYTHON" -m npa.workflows.sylvest_oft_mixdata compare
        --baseline-uri "{{config.baseline_uri}}rollouts.json"
        --candidate-uri "{{config.candidate_uri}}rollouts.json"
        --output-path "{{config.comparison_uri}}"
    resources: cpu
    inputs:
      - uri: "{{config.baseline_uri}}rollouts.json"
        schema: npa.sylvest-oft-mixdata.rollouts.v1
      - uri: "{{config.candidate_uri}}rollouts.json"
        schema: npa.sylvest-oft-mixdata.rollouts.v1
    outputs:
      - uri: "{{config.comparison_uri}}comparison.json"
        schema: npa.sylvest-oft-mixdata.comparison.v1
      - uri: "{{config.comparison_uri}}provenance.json"
        schema: npa.sylvest-oft-mixdata.provenance.v1
    next: report

  report:
    description: Emit a factual original-LIBERO comparison report and reviewable Rerun recording.
    run:
      shell: >-
        "$NPA_CONTROL_PYTHON" -m npa.workflows.sylvest_oft_mixdata report
        --comparison-uri "{{config.comparison_uri}}comparison.json"
        --protocol-uri "{{config.prepared_uri}}protocol.json"
        --notices-uri "{{config.prepared_uri}}notices.json"
        --run-id "{{run.id}}"
        --output-path "{{config.report_uri}}"
    resources: cpu
    inputs:
      - uri: "{{config.comparison_uri}}comparison.json"
        schema: npa.sylvest-oft-mixdata.comparison.v1
      - uri: "{{config.prepared_uri}}protocol.json"
        schema: npa.sylvest-oft-mixdata.protocol.v1
      - uri: "{{config.prepared_uri}}notices.json"
        schema: npa.sylvest-oft-mixdata.notices.v1
    outputs:
      - uri: "{{config.report_uri}}report.json"
        schema: npa.sylvest-oft-mixdata.report.v1
      - uri: "{{config.report_uri}}comparison.rrd"
        schema: application/vnd.rerun.rrd
      - uri: "{{config.report_uri}}checksums.json"
        schema: npa.checksums.sha256.v1
      - uri: "{{config.report_uri}}notices.json"
        schema: npa.sylvest-oft-mixdata.notices.v1
    terminal: true
