name: Type check

# Type checking runs on PRs against a committed baseline.
# New mypy errors beyond the baseline fail the check.

on:
  pull_request:
    paths:
      - 'npa/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same PR, like the other automatic PR workflows.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npa and mypy
        run: cd npa && pip install -e ".[full]" mypy

      - name: Mypy
        id: mypy
        run: |
          cd npa
          mypy src/npa --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-output.txt
          mypy_code=${PIPESTATUS[0]}
          echo "mypy exit code: ${mypy_code}"
          # mypy exit 1 means "errors found": those are judged against the
          # baseline in the next step. Exit >= 2 means mypy itself crashed
          # (bad config, OOM, ...): fail loudly instead of letting tee's
          # exit status (always 0) mask the failure.
          if [ "${mypy_code}" -ge 2 ]; then
            echo "mypy crashed; failing the step"
            exit 1
          fi

      - name: Check against baseline
        run: |
          cd npa
          grep -v "^#" mypy-baseline.txt | grep -v "^$" | sort > baseline-sorted.txt || true
          grep "error:" mypy-output.txt | sort > current-sorted.txt || true
          new_errors=$(comm -13 baseline-sorted.txt current-sorted.txt)
          if [ -n "$new_errors" ]; then
            echo "New mypy errors beyond baseline:"
            echo "$new_errors"
            exit 1
          fi
          echo "No new mypy errors."
