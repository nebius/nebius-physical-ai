# RoboTwin's native data collector needs RT cores/Vulkan, CUDA 12.8 for CuRobo
# on sm_120, enough disk for the runtime-only official asset archives, and
# exactly one RTX PRO 6000 Blackwell. The cluster supplying this profile must be
# bound to the operator's STRICT reservation; the public profile intentionally
# contains no tenant-specific capacity-block or node-group identifiers.
name: byof-solution-smoke-robotwin-rtxpro-gpu
execution: serial
---
name: byof-solution-smoke-robotwin-rtxpro
resources:
  cloud: kubernetes
  accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
  cpus: 16+
  memory: 64+
  disk_size: 100
  image_id: "docker:<your-private-registry>/<namespace>/npa-byof:<your-run-id>"
  kubernetes:
    pod_config:
      spec:
        containers:
          - name: ray-node
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
envs:
  NPA_BYOF_RUN_ID: "<your-run-id>"
  BYOF_REPO_ROOT: "/opt/byof"
  BYOF_SMOKE_COMMAND: ""
  BYOF_SOLUTION_NAME: ""
  BYOF_CAPABILITY_NAME: ""
  BYOF_SMOKE_ARTIFACT_NAME: ""
  BYOF_IMAGE: ""
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "all"
  VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/nvidia_icd.json"
  S3_OUTPUT_PREFIX: "s3://${NPA_S3_BUCKET}/byof/${NPA_BYOF_RUN_ID}/"
  AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
setup: |
  set -euo pipefail
  test -d "${BYOF_REPO_ROOT}"
  test -f "${BYOF_REPO_ROOT}/npa_source_metadata.json"
  test -f "${VK_ICD_FILENAMES}"
  python3 -c 'import boto3, cv2, h5py, sapien, torch; import curobo'
run: |
  set -euo pipefail
  export NPA_BYOF_RUN_ID="${NPA_INTERNAL_BYOF_ROBOTWIN_RUN_ID:?}"
  export S3_OUTPUT_PREFIX="${NPA_INTERNAL_BYOF_ROBOTWIN_OUTPUT_PREFIX:?}"
  export NPA_S3_BUCKET="${NPA_INTERNAL_BYOF_ROBOTWIN_BUCKET:?}"
  export BYOF_IMAGE="${NPA_INTERNAL_BYOF_ROBOTWIN_IMAGE:?}"
  OUTPUT_DIR="/workspace/byof-runs/${NPA_BYOF_RUN_ID}"
  mkdir -p "${OUTPUT_DIR}"
  export NPA_SMOKE_OUTPUT_DIR="${OUTPUT_DIR}"
  cp "${BYOF_REPO_ROOT}/npa_source_metadata.json" "${OUTPUT_DIR}/npa_source_metadata.json"
  cp "${BYOF_REPO_ROOT}/npa_build_metadata.json" "${OUTPUT_DIR}/npa_build_metadata.json"
  nvidia-smi > "${OUTPUT_DIR}/nvidia-smi.txt" 2>&1
  nvidia-smi -L > "${OUTPUT_DIR}/nvidia-smi-list.txt" 2>&1
  vulkaninfo --summary > "${OUTPUT_DIR}/vulkaninfo-summary.txt" 2>&1

  SMOKE_EXIT_CODE=0
  set +e
  (
    cd "${BYOF_REPO_ROOT}"
    /bin/bash -lc "${BYOF_SMOKE_COMMAND}"
  ) > "${OUTPUT_DIR}/solution-smoke-stdout.log" 2> "${OUTPUT_DIR}/solution-smoke-stderr.log"
  SMOKE_EXIT_CODE=$?
  set -e

  if [ -n "${BYOF_SMOKE_ARTIFACT_NAME}" ]; then
    test -f "${OUTPUT_DIR}/${BYOF_SMOKE_ARTIFACT_NAME}"
  fi
  export SMOKE_EXIT_CODE
  python3 <<'PY'
  import json
  import os
  import time
  from pathlib import Path
  from urllib.parse import urlparse

  import boto3
  from botocore.config import Config

  run_id = os.environ["NPA_BYOF_RUN_ID"]
  root = Path(f"/workspace/byof-runs/{run_id}")
  metadata = json.loads((root / "npa_source_metadata.json").read_text(encoding="utf-8"))
  smoke_exit_code = int(os.environ.get("SMOKE_EXIT_CODE", "1"))
  image = os.environ.get("BYOF_IMAGE", "")
  image_digest = image.rsplit("@", 1)[-1] if "@" in image else ""
  smoke_artifact_name = os.environ.get("BYOF_SMOKE_ARTIFACT_NAME", "")
  smoke_artifact = root / smoke_artifact_name
  smoke_payload = (
      json.loads(smoke_artifact.read_text(encoding="utf-8"))
      if smoke_artifact_name and smoke_artifact.is_file()
      else {}
  )
  summary = {
      "status": "success" if smoke_exit_code == 0 else "failed",
      "tool": "byof",
      "workload": "solution-smoke-robotwin-rtxpro",
      "run_id": run_id,
      "image_digest": image_digest,
      "repo_root": os.environ["BYOF_REPO_ROOT"],
      "metadata": metadata,
      "solution_name": os.environ.get("BYOF_SOLUTION_NAME", ""),
      "capability_name": os.environ.get("BYOF_CAPABILITY_NAME", ""),
      "smoke_artifact_name": smoke_artifact_name,
      "smoke_exit_code": smoke_exit_code,
      "smoke_task_success": smoke_payload.get("task_success", False),
      "smoke_hdf5_sha256": (smoke_payload.get("hdf5") or {}).get("sha256", ""),
      "smoke_video_sha256": (smoke_payload.get("video") or {}).get("sha256", ""),
      "created_unix": round(time.time(), 3),
  }
  (root / "npa_byof_summary.json").write_text(
      json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
  )
  print(json.dumps(summary, indent=2, sort_keys=True), flush=True)

  output = os.environ["S3_OUTPUT_PREFIX"].rstrip("/") + "/"
  parsed = urlparse(output)
  if parsed.scheme != "s3" or not parsed.netloc:
      raise RuntimeError(f"invalid S3_OUTPUT_PREFIX: {output}")
  endpoint = (
      os.environ.get("AWS_ENDPOINT_URL")
      or os.environ.get("NEBIUS_S3_ENDPOINT")
      or ""
  ).strip() or None
  kwargs = {
      "endpoint_url": endpoint,
      "config": Config(s3={"addressing_style": "path"}),
      "region_name": os.environ.get("AWS_DEFAULT_REGION", "us-central1"),
  }
  access_key = (os.environ.get("AWS_ACCESS_KEY_ID") or "").strip()
  secret_key = (os.environ.get("AWS_SECRET_ACCESS_KEY") or "").strip()
  session_token = (os.environ.get("AWS_SESSION_TOKEN") or "").strip()
  if access_key and secret_key:
      kwargs["aws_access_key_id"] = access_key
      kwargs["aws_secret_access_key"] = secret_key
      if session_token:
          kwargs["aws_session_token"] = session_token
  s3 = boto3.client("s3", **kwargs)
  prefix = parsed.path.lstrip("/")
  uploaded = 0
  for path in root.rglob("*"):
      if not path.is_file():
          continue
      key = prefix + str(path.relative_to(root))
      s3.put_object(
          Bucket=parsed.netloc,
          Key=key,
          Body=path.read_bytes(),
          IfNoneMatch="*",
      )
      uploaded += 1
  for required in ("npa_byof_summary.json", smoke_artifact_name):
      s3.head_object(Bucket=parsed.netloc, Key=prefix + required)
  print(f"uploaded_file_count={uploaded}", flush=True)
  PY
  if [ "${SMOKE_EXIT_CODE}" -ne 0 ]; then
    exit "${SMOKE_EXIT_CODE}"
  fi
