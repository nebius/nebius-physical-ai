# Promote immutable private GHCR candidates to separate PUBLIC GHCR packages.
#
# THE ISAAC IMAGES ARE NOW IN THAT SET. This comment previously said the opposite
# -- that the workflow "HARD-refuses" isaac-lab/sonic/sonic-mujoco/groot as
# NVIDIA-proprietary. That was true when they baked Omniverse Kit. They no longer
# do: they ship no NVIDIA Isaac bytes and fetch Isaac Sim / Isaac Lab at first run
# under the OPERATOR's own EULA acceptance. See docs/workbench/container-packaging.md.
#
# That reclassification rests on the canonical tags resolving to the runtime-fetch
# images. If a canonical tag still points at an old Omniverse-baked build, this
# workflow would publish proprietary content -- irreversibly, because GHCR package
# visibility cannot be undone. The "Gate" step below checks that mechanically before
# any copy happens; do not remove it.
#
# Manual dispatch only (never auto-publishes). Defaults to dry-run, and the dry run is a
# real rehearsal: it resolves the plan, proves the source credential, reads every pinned
# candidate dev-SHA tag, and runs the gate. Only the copy and public verification are skipped.
#
# Candidate tags are always dev-<full-git-sha>. Candidate and release package paths
# remain separate because GHCR visibility is package-level; a dev tag in a public
# package would be public. Restricted/build-your-own images never enter either path.

name: Publish public images

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target public registry (e.g. ghcr.io/OWNER/REPO)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (plan only, no copy)"
        type: boolean
        default: true
      skip_missing:
        description: >-
          Publish what exists, skipping images the private candidate channel does not have yet.
          The plan comes from the packaging contract (what the repo BUILDS), so a tool
          that landed before its image was built otherwise blocks every ready image.
          A denial is never skipped.
        type: boolean
        default: false
      source_registry:
        description: "Optional private GHCR candidate namespace override"
        required: false
        default: ""
      candidate_sha:
        description: "Full Git SHA for the dev-<sha> candidate (defaults to dispatched ref)"
        required: false
        default: ""
      tool:
        description: >-
          Optional comma/space-separated workbench tools to publish without touching
          unrelated images (for example: cosmos-curate,cosmos-evaluator,fiftyone,lichtblick)
        required: false
        default: ""
      build_candidate_tool:
        description: >-
          Bootstrap only: build one guarded private dev-SHA candidate before
          preflight. Prefer the dedicated candidate workflow once it exists on main.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# A target tag has no registry compare-and-swap primitive. Serialize publishers
# for this workflow so two validated releases cannot overwrite one another after
# their respective preflights. Source references are independently digest-pinned
# by publish_public before any copy.
concurrency:
  group: publish-public-images-${{ inputs.target || github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ./npa

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # Bootstrap bridge: workflow_dispatch only discovers files present on the
      # default branch. This existing workflow can therefore build the first private
      # candidate for a feature branch whose dedicated candidate workflow has not
      # reached main yet. NPA_BUILD_CANDIDATE_TOOL is a temporary repository-variable
      # fallback for GitHub's default-branch input schema and must be removed after use.
      - name: Resolve guarded private candidate build
        if: ${{ (inputs.build_candidate_tool || vars.NPA_BUILD_CANDIDATE_TOOL) != '' }}
        id: candidate
        env:
          TOOL: ${{ inputs.build_candidate_tool || vars.NPA_BUILD_CANDIDATE_TOOL }}
          SELECTED_TOOLS: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
          CANDIDATE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY || 'ghcr.io/nebius/nebius-physical-ai-private' }}
          SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from npa.deploy.images import candidate_image_for_tool

          tool = os.environ["TOOL"].strip()
          selected = {
              item.strip()
              for item in os.environ.get("SELECTED_TOOLS", "").replace(",", " ").split()
              if item.strip()
          }
          if selected and selected != {tool}:
              raise SystemExit(
                  "bootstrap candidate build must match the single selected publish tool"
              )
          dockerfile = Path("npa/docker/workbench") / tool / "Dockerfile"
          if not dockerfile.is_file():
              raise SystemExit(f"tool has no canonical candidate Dockerfile: {tool}")
          image = candidate_image_for_tool(
              tool,
              git_sha=os.environ["SOURCE_SHA"],
              registry=os.environ["CANDIDATE_REGISTRY"],
          )
          print(f"image={image}")
          print(f"dockerfile={dockerfile}")
          print(f"owner={image.split('/', 2)[1]}")
          print(f"package={image.split('/', 2)[2].rsplit(':', 1)[0]}")
          PY

      - name: Refuse a public candidate package before build
        if: ${{ steps.candidate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.candidate.outputs.owner }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
        run: |
          set -euo pipefail
          encoded="${PACKAGE//\//%2F}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            package_api="/orgs/${OWNER}/packages/container/${encoded}"
          else
            package_api="/users/${OWNER}/packages/container/${encoded}"
          fi
          error_file="$(mktemp)"
          if visibility="$(gh api "$package_api" --jq .visibility 2>"$error_file")"; then
            test "$visibility" = private || {
              echo "::error::Candidate package visibility is '$visibility'; refusing to push development bytes."
              exit 1
            }
          elif ! grep -q 'HTTP 404' "$error_file"; then
            echo "::error::Could not prove candidate package visibility."
            sed 's/^/::error::/' "$error_file"
            exit 1
          fi

      - name: Set up Buildx for candidate build
        if: ${{ steps.candidate.outcome == 'success' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to private GHCR candidate channel for build
        if: ${{ steps.candidate.outcome == 'success' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push immutable private candidate
        if: ${{ steps.candidate.outcome == 'success' }}
        id: candidate-build
        uses: docker/build-push-action@v6
        with:
          context: npa
          file: ${{ steps.candidate.outputs.dockerfile }}
          push: true
          tags: ${{ steps.candidate.outputs.image }}
          build-args: |
            NPA_SOURCE_SHA=${{ inputs.candidate_sha || github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ inputs.candidate_sha || github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify candidate digest, attestation, and private visibility
        if: ${{ steps.candidate-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.candidate.outputs.owner }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
          IMAGE: ${{ steps.candidate.outputs.image }}
          BUILD_DIGEST: ${{ steps.candidate-build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$(crane digest "$IMAGE")"
          test "$digest" = "$BUILD_DIGEST"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' \
            | jq -e '. != null and . != {}'
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' \
            | jq -e '. != null and . != {}'
          test "$(crane config "${IMAGE%@*}@${digest}" | jq -r '.config.Labels["org.nebius.npa.skypilot-bootstrap-contract"] // ""')" = "skypilot-0.12.2-v1"
          test "$(crane config "${IMAGE%@*}@${digest}" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')" = "${{ inputs.candidate_sha || github.sha }}"
          encoded="${PACKAGE//\//%2F}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            package_api="/orgs/${OWNER}/packages/container/${encoded}"
          else
            package_api="/users/${OWNER}/packages/container/${encoded}"
          fi
          test "$(gh api "$package_api" --jq .visibility)" = private
          echo "Candidate digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan candidate for critical vulnerabilities and secrets
        if: ${{ steps.candidate-build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.image }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Resolve target registry
        id: target
        shell: bash
        run: |
          target="${{ inputs.target }}"
          if [ -z "$target" ]; then
            target="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
          echo "Target: $target"

      - name: Plan (dry run — always)
        env:
          # Repository-variable fallbacks let a branch add these inputs before the
          # workflow-dispatch schema reaches the default branch. Operators must remove
          # one-off variables after the run; explicit inputs always win once available.
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOLS: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}" --candidate-sha "$CANDIDATE_SHA")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOLS" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode plan
          else
            python -m npa.deploy.publish_public "${args[@]}" --dry-run
          fi

      - name: Login to GHCR candidate and release channels
        env:
          GH_TOKEN: ${{ secrets.NPA_PRIVATE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `crane auth login` writes a config file and exits 0 for any string -- it never
      # contacts the registry -- so the step above alone proves no package permission.
      # This reads every source manifest, which fails in seconds on an expired token or a
      # pin that was never pushed, rather than partway through the copy loop with some
      # packages already created. It writes nothing, so it is safe in dry-run.
      - name: Preflight the private candidate credential and every pinned tag
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOLS: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}" --candidate-sha "$CANDIDATE_SHA")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOLS" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode preflight
          else
            python -m npa.deploy.publish_public \
              "${args[@]}" \
              ${{ inputs.skip_missing && '--skip-missing' || '' }} \
              --preflight
          fi

      # Last line of defence before an irreversible action. publish_public trusts the
      # packaging contract, which is a statement about the Dockerfiles; this checks the
      # actual images the canonical tags resolve to right now.
      #
      # History-only because a full filesystem scan streams ~69 GB across these five and
      # would not finish on a hosted runner. It is the weaker check -- it catches a build
      # that RAN an Isaac install, not payload that arrived by COPY -- so it is a gate,
      # not the proof. The full scan runs in omniverse-payload-scan (image-security-scan.yml).
      # Also runs in dry-run (it only reads), so the rehearsal exercises the whole safety
      # chain rather than leaving the gate to fire for the first time on the real run.
      - name: Gate — the Isaac canonical tags must not be Omniverse-baked
        if: ${{ (inputs.tool || vars.NPA_PUBLISH_TOOL) == '' }}
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY || 'ghcr.io/nebius/nebius-physical-ai-private' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          source_registry="${SOURCE_REGISTRY%/}"
          candidate_tag="dev-${CANDIDATE_SHA,,}"
          failed=0
          for ref in \
            "npa-isaac-lab:${candidate_tag}" \
            "npa-sonic:${candidate_tag}" \
            "npa-groot:${candidate_tag}"; do
            echo "::group::$ref"
            if ! python npa/scripts/scan_image_omniverse_payload.py --history-only \
                 "${source_registry}/${ref}"; then
              echo "::error::${ref} shows a build-time Isaac install — refusing to publish"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to publish. A canonical tag resolves to an Omniverse-baked image."
            echo "Rebuild the exact private GHCR candidate before promotion."
            exit 1
          fi

      # Pushing is not publishing. A new GHCR container package is PRIVATE, and a package
      # linked to a repository inherits that repository's access permissions but NOT its
      # visibility -- so even a public repo yields private packages. GitHub exposes no REST
      # API to change visibility for organisation-owned packages, so it cannot be automated
      # here; it is a one-time manual step per package, and it is irreversible.
      #
      # publish_public copies and then verifies inline, so this step fails when the copy
      # worked but nothing is publicly pullable. That is the expected outcome of the FIRST
      # publish; the summary below turns it into a click-through list.
      - name: Publish and verify
        id: publish
        if: ${{ inputs.dry_run == false }}
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOLS: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}" --candidate-sha "$CANDIDATE_SHA")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOLS" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode publish
          else
            python -m npa.deploy.publish_public \
              "${args[@]}" \
              ${{ inputs.skip_missing && '--skip-missing' || '' }}
          fi

      - name: Write the visibility checklist to the job summary
        if: ${{ failure() && inputs.dry_run == false && steps.publish.outputs.copy_phase_completed == 'true' }}
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOLS: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Images copied, but not yet public

          If the failing step was **Publish and verify**, the copy succeeded and the packages
          are **private** — GHCR's default for a newly created package. This cannot be
          automated: GitHub has no REST API to set visibility for organisation-owned
          packages.

          Open each link below, then **Danger Zone → Change visibility → Public**. It is
          one-time (visibility persists across later pushes to the same package).

          > **This is irreversible.** A public package cannot be made private again, and
          > deleting a tag does not undo publication. Confirm the redistribution
          > classification before doing it — see `docs/workbench/container-packaging.md`.

          MD
          # Only the packages that are still private, so the list shrinks as they are flipped.
          args=(--target "${{ steps.target.outputs.value }}")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOLS" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOLS" --mode checklist 2>/dev/null \
              | grep '^- \[ \]' >> "$GITHUB_STEP_SUMMARY" || true
          else
            python -m npa.deploy.publish_public \
              "${args[@]}" \
              ${{ inputs.skip_missing && '--skip-missing' || '' }} \
              --verify-public --checklist 2>/dev/null \
              | grep '^- \[ \]' >> "$GITHUB_STEP_SUMMARY" || true
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'

          Re-run this workflow with `dry_run=false` to re-verify, or run locally:

          ```
          npa/.venv/bin/python -m npa.deploy.publish_public --verify-public
          ```
          MD

      - name: Write pre-copy failure guidance to the job summary
        if: ${{ failure() && inputs.dry_run == false && steps.publish.outputs.copy_phase_completed != 'true' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Publication stopped before copy completion

          The job did not record completion of the registry copy phase. Do **not** infer
          that a package was created, and do not change GHCR visibility based on this run.
          In a multi-image batch, earlier images may have copied before a later copy failed;
          inspect the failing step, fix the error, and safely rerun the same batch. Already
          current digests are skipped, and visibility guidance is emitted only after every
          selected copy completes.
          MD
