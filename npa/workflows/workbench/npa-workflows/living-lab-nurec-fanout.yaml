        \ --format=csv,noheader | head -1 || echo unknown)\nGPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader\
        \ | head -1 || echo unknown)\nPOD_NAME=\"${HOSTNAME:-unknown}\"\nNODE_NAME=\"${NODE_NAME:-unknown}\"\
        \nSTART=$(date +%s)\nexport ZONE RUN_URI DATASET_ID SCENE VARIANT ZU NC RC NV INPUT RRD FINAL\
        \ MF\nexport GPU_UUID GPU_NAME POD_NAME NODE_NAME START\n\necho \"=== zone $ZONE: check (container\
        \ + dataset rights + RT-core GPU) ===\"\nnpa workbench nurec check --require-gpu --output json\n\
        \necho \"=== zone $ZONE: fetch real NCore V4 shards + derived rig pose edge ===\"\nnpa workbench\
        \ nurec fetch --dataset \"${DATASET_ID}\" --scene \"${SCENE}\" --variant \"${VARIANT}\" --output-uri\
        \ \"${NC}\" --output json >/tmp/nurec-fetch.json\n\n# ---- fail-closed provenance gate -------------------------------------------\n\
        # Provenance is validated against the *independently observed* unpacked content,\n# not merely\
