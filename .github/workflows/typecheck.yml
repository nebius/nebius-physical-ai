name: Type check

# Type checking runs as a blocking merge gate: the security-regression
# orchestrator calls this workflow on PRs and merge-queue runs, and new mypy
# errors beyond the committed baseline fail the check. Also runs on pushes to
# main as a canary, and stays available on manual dispatch.

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  mypy:
    concurrency:
      group: npa-validation-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'merge' || 'audit' }}-${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 'test-1' || 'test' }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install npa and mypy
        run: cd npa && pip install -e ".[full]" "mypy==2.3.1" "numpy==2.5.3"  # pinned: mypy-baseline.txt is seeded with these versions

      - name: Mypy
        id: mypy
        run: |
          cd npa
          mypy src/npa --ignore-missing-imports --no-error-summary --python-version=3.12 2>&1 | tee mypy-output.txt
          mypy_code=${PIPESTATUS[0]}
          echo "mypy exit code: ${mypy_code}"
          # mypy exit 1 means "errors found": those are judged against the
          # baseline in the next step. Exit >= 2 means mypy itself crashed
          # (bad config, OOM, ...): fail loudly instead of letting tee's
          # exit status (always 0) mask the failure.
          if [ "${mypy_code}" -ge 2 ]; then
            echo "mypy crashed; failing the step"
            exit 1
          fi

      - name: Check against baseline
        run: |
          cd npa
          # Line-number-insensitive comparison: strip `:line:` so unrelated
          # line shifts in files with grandfathered errors do not false-fail
          # future PRs. comm still treats duplicate signatures as a multiset,
          # so a genuinely new error of an already-seen shape is caught.
          normalize() { sed -E 's|^([^:]+\.py):[0-9]+:|\1:|'; }
          grep -v "^#" mypy-baseline.txt | grep -v "^$" | normalize | sort > baseline-sorted.txt || true
          grep "error:" mypy-output.txt | normalize | sort > current-sorted.txt || true
          new_errors=$(comm -13 baseline-sorted.txt current-sorted.txt)
          if [ -n "$new_errors" ]; then
            echo "New mypy errors beyond baseline:"
            echo "$new_errors"
            exit 1
          fi
          echo "No new mypy errors."
