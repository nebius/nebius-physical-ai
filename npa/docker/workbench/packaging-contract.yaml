# Machine-readable packaging contract for workbench containers.
# Enforced by npa/tests/docker/test_packaging_contract.py
# Human companion: docs/workbench/container-packaging.md

version: 1

tiers:
  service:
    description: Container starts an HTTP or mode-based service by default.
    entrypoint_must_not_be_bash: true
    require_expose: true
    prefer_healthcheck: true
  job:
    description: Container runs a workflow/CLI module; CMD may be overridden by orchestrator.
    entrypoint_must_not_be_bash: true
    require_expose: false
    prefer_healthcheck: false
  interactive:
    description: Dev/job shell; CLI or SkyPilot must supply the command.
    entrypoint_must_not_be_bash: false
    require_expose: false
    prefer_healthcheck: false

security:
  require_non_root_user: true
  allowed_final_users:
    - ubuntu
    - nobody
    - "1000"
    - "10001"
  forbid_secrets_in_dockerfile: true
  secret_patterns:
    - "(?i)(api[_-]?key|secret[_-]?key|password)\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"
    - "(?i)BEGIN (RSA |OPENSSH )?PRIVATE KEY"

# Redistribution eligibility. This classifies whether a built image may be
# distributed BEYOND the owning Nebius org (e.g. published to a public/anonymous
# registry, shipped to a customer, or served to third parties). Read access
# WITHIN the owning org is always permitted; that is not what this gates.
# Enforced by npa/tests/docker/test_packaging_contract.py.
redistribution:
  # Substrings that, if present in a Dockerfile's INSTRUCTIONS, mean the image
  # bakes NVIDIA Omniverse Kit (Isaac Sim) binaries and therefore must be
  # "restricted". Comment lines are stripped before matching: prose that merely
  # names Isaac Sim (e.g. isaac-lab/Dockerfile's "# Tag: nvcr.io/nvidia/isaac-lab"
  # header) does not bake anything, and must not force an image to "restricted".
  # Every real baker still matches on an instruction (FROM/ARG base, a pip
  # install, or an ENV *_ACCEPT_EULA), and images that inherit a restricted parent
  # without a marker of their own are caught by the parent-inheritance check in
  # npa/tests/docker/test_packaging_contract.py.
  omniverse_markers:
    - "isaacsim"
    - "isaaclab[isaacsim"
    - "nvcr.io/nvidia/isaac-lab"
    - "OMNI_KIT_ACCEPT_EULA"
    - "ISAACSIM_ACCEPT_EULA"
  classes:
    public:
      description: >
        OSS-redistributable. Code is under OSI-approved licenses (Apache-2.0 /
        BSD-3 / MIT / MPL-2.0); the CUDA/PyTorch base images (docker.io
        nvidia/cuda, pytorch/pytorch) are freely redistributable; any gated model
        weights are downloaded at runtime by the operator (never baked in). May
        be published to a public registry.
    restricted:
      description: >
        Bakes NVIDIA Omniverse Kit (Isaac Sim) binaries. The Isaac Sim SOURCE is
        Apache-2.0, but the shipped binary bundles the Omniverse Kit SDK + NVIDIA
        assets, which are NVIDIA-proprietary (the isaacsim PyPI package lists its
        license as "NVIDIA Proprietary Software"). Compliant distribution: each
        deployment BUILDS these into its own registry (build.sh --registry
        <your-registry> --push), pulling the nvcr.io base / isaacsim wheels with
        the operator's OWN NGC credentials + EULA acceptance (OMNI_KIT_ACCEPT_EULA)
        — so NVIDIA delivers Omniverse Kit to each operator under their own
        acceptance and we ship only the Dockerfile. Internal-org pulls are
        licensed internal-R&D use. The one thing that is NOT allowed: hosting
        these PREBUILT on a public/anonymous registry, which strips the NGC/EULA
        gate and makes us the third-party redistributor (that would require an
        NVIDIA AI Enterprise license). So: never publish these to a public
        registry.
      reason: bundles-omniverse-kit

# Relative to npa/docker/workbench/
