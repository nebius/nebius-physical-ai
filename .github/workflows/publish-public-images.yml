# Mirror the publicly-redistributable workbench images to a PUBLIC registry.
#
# Nebius Container Registry has no anonymous/public mode, so "public exposure"
# means mirroring to a public-capable registry (GHCR by default). This workflow
# runs `python -m npa.deploy.publish_public`, which copies exactly
# `images.publicly_publishable_tools()`.
#
# THE ISAAC IMAGES ARE NOW IN THAT SET. This comment previously said the opposite
# -- that the workflow "HARD-refuses" isaac-lab/sonic/sonic-mujoco/groot as
# NVIDIA-proprietary. That was true when they baked Omniverse Kit. They no longer
# do: they ship no NVIDIA Isaac bytes and fetch Isaac Sim / Isaac Lab at first run
# under the OPERATOR's own EULA acceptance. See docs/workbench/container-packaging.md.
#
# That reclassification rests on the canonical tags resolving to the runtime-fetch
# images. If a canonical tag still points at an old Omniverse-baked build, this
# workflow would publish proprietary content -- irreversibly, because GHCR package
# visibility cannot be undone. The "Gate" step below checks that mechanically before
# any copy happens; do not remove it.
#
# Manual dispatch only (never auto-publishes). Defaults to dry-run, and the dry run is a
# real rehearsal: it resolves the plan, proves the source credential, reads every pinned
# source tag, and runs the gate. Only the copy and the public verification are skipped.
#
# SOURCE REGISTRY CREDENTIAL. Nebius CR authenticates `docker login` as user "iam" with
# either kind of secret below. They differ only in how long they survive, which is the
# whole game for a workflow that is dispatched by hand months apart:
#
#   NEBIUS_SA_CREDENTIALS_JSON — preferred. An authorized-key credentials JSON for a
#                     service account holding viewer on the source registry. The job
#                     mints a fresh access token during the run, so nothing expires
#                     between dispatches and no one has to re-paste anything. Opt-in:
#                     the job falls back to NEBIUS_CR_TOKEN when this is unset.
#   NEBIUS_CR_TOKEN — a pre-issued token. This MUST be a long-lived static key
#                     (`nebius iam static-key issue --service=CONTAINER_REGISTRY`,
#                     6 months by default), NOT the output of `nebius iam
#                     get-access-token`: an access token lives 12 hours, so a stored
#                     one is already dead by the next manual dispatch. That is exactly
#                     how the first run of this workflow failed — 23 identical
#                     UNAUTHORIZED reads, nothing published.
#
# GHCR push uses the built-in GITHUB_TOKEN. A dry run with neither source secret still
# prints the plan, but says it could not check the source registry.

name: Publish public images

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target public registry (e.g. ghcr.io/OWNER/REPO)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (plan only, no copy)"
        type: boolean
        default: true
      skip_missing:
        description: >-
          Publish what exists, skipping images the source registry does not have yet.
          The plan comes from the packaging contract (what the repo BUILDS), so a tool
          that landed before its image was built otherwise blocks every ready image.
          A denial is never skipped.
        type: boolean
        default: false
      source_registry:
        description: "Optional source registry override (host/path, without image name)"
        required: false
        default: ""
      tool:
        description: "Optional single workbench tool to publish without touching unrelated images"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ./npa

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve target registry
        id: target
        shell: bash
        run: |
          target="${{ inputs.target }}"
          if [ -z "$target" ]; then
            target="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
          echo "Target: $target"

      - name: Plan (dry run — always)
        env:
          # Repository-variable fallbacks let a branch add these inputs before the
          # workflow-dispatch schema reaches the default branch. Operators must remove
          # one-off variables after the run; explicit inputs always win once available.
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOL: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOL" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOL" --mode plan
          else
            python -m npa.deploy.publish_public "${args[@]}" --dry-run
          fi

      - name: Login to GHCR
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Runs in dry-run too, so the safe rehearsal actually rehearses the credential. A dry
      # run that skipped this could only ever tell you the plan was well-formed, which was
      # never the thing that broke.
      #
      # Secrets arrive through `env:` rather than `${{ }}` interpolation, which would splice
      # them into the script text where a quote or newline changes what runs.
      - name: Authenticate to the Nebius source registry
        id: source-login
        env:
          NEBIUS_SA_CREDENTIALS_JSON: ${{ secrets.NEBIUS_SA_CREDENTIALS_JSON }}
          NEBIUS_CR_TOKEN: ${{ secrets.NEBIUS_CR_TOKEN }}
          # A maintainer may install this temporary secret for a one-off source-registry
          # override whose project is not visible to the normal mirror service account.
          # It is deliberately separate so a release never overwrites the standing CI
          # credential, and must be removed immediately after the dispatch.
          NEBIUS_OVERRIDE_CR_TOKEN: ${{ secrets.NEBIUS_OVERRIDE_CR_TOKEN }}
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          # A dry run without secrets still reports the plan and says what it could not check.
          REQUIRE_CREDENTIAL: ${{ inputs.dry_run == false }}
        run: |
          if [ -n "$SOURCE_REGISTRY" ] && [ -n "$NEBIUS_OVERRIDE_CR_TOKEN" ]; then
            export NEBIUS_SA_CREDENTIALS_JSON=""
            export NEBIUS_CR_TOKEN="$NEBIUS_OVERRIDE_CR_TOKEN"
          fi
          unset NEBIUS_OVERRIDE_CR_TOKEN
          ./npa/scripts/ci_source_registry_login.sh

      # `crane auth login` writes a config file and exits 0 for any string -- it never
      # contacts the registry -- so the step above proves nothing about NEBIUS_CR_TOKEN.
      # This reads every source manifest, which fails in seconds on an expired token or a
      # pin that was never pushed, rather than partway through the copy loop with some
      # packages already created. It writes nothing, so it is safe in dry-run.
      - name: Preflight the source registry credential and every pinned tag
        if: ${{ steps.source-login.outputs.available == 'true' }}
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOL: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOL" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOL" --mode preflight
          else
            python -m npa.deploy.publish_public \
              "${args[@]}" \
              ${{ inputs.skip_missing && '--skip-missing' || '' }} \
              --preflight
          fi

      # Last line of defence before an irreversible action. publish_public trusts the
      # packaging contract, which is a statement about the Dockerfiles; this checks the
      # actual images the canonical tags resolve to right now.
      #
      # History-only because a full filesystem scan streams ~69 GB across these five and
      # would not finish on a hosted runner. It is the weaker check -- it catches a build
      # that RAN an Isaac install, not payload that arrived by COPY -- so it is a gate,
      # not the proof. The full scan runs in omniverse-payload-scan (image-security-scan.yml).
      # Also runs in dry-run (it only reads), so the rehearsal exercises the whole safety
      # chain rather than leaving the gate to fire for the first time on the real run.
      - name: Gate — the Isaac canonical tags must not be Omniverse-baked
        if: ${{ steps.source-login.outputs.available == 'true' && (inputs.tool || vars.NPA_PUBLISH_TOOL) == '' }}
        run: |
          set -euo pipefail
          source_registry="cr.eu-north1.nebius.cloud/e00cm0vc6t09m0z5gw"
          failed=0
          for ref in \
            "npa-isaac-lab:2.3.2.post1" \
            "npa-sonic:0.1.2" \
            "npa-sonic:0.1.2-k8s-runtime" \
            "npa-sonic-mujoco:0.1.3-mvp" \
            "npa-groot:0.1.0"; do
            echo "::group::$ref"
            if ! python npa/scripts/scan_image_omniverse_payload.py --history-only \
                 "${source_registry}/${ref}"; then
              echo "::error::${ref} shows a build-time Isaac install — refusing to publish"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to publish. A canonical tag resolves to an Omniverse-baked image."
            echo "Promote the runtime-fetch builds first:"
            echo "  ./npa/scripts/promote_isaac_rtfetch_tags.sh --i-have-sign-off"
            exit 1
          fi

      # Pushing is not publishing. A new GHCR container package is PRIVATE, and a package
      # linked to a repository inherits that repository's access permissions but NOT its
      # visibility -- so even a public repo yields private packages. GitHub exposes no REST
      # API to change visibility for organisation-owned packages, so it cannot be automated
      # here; it is a one-time manual step per package, and it is irreversible.
      #
      # publish_public copies and then verifies inline, so this step fails when the copy
      # worked but nothing is publicly pullable. That is the expected outcome of the FIRST
      # publish; the summary below turns it into a click-through list.
      - name: Publish and verify
        if: ${{ inputs.dry_run == false }}
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry || vars.NPA_PUBLISH_SOURCE_REGISTRY }}
          SELECTED_TOOL: ${{ inputs.tool || vars.NPA_PUBLISH_TOOL }}
        run: |
          args=(--target "${{ steps.target.outputs.value }}")
          if [ -n "$SOURCE_REGISTRY" ]; then
            args+=(--source-registry "$SOURCE_REGISTRY")
          fi
          if [ -n "$SELECTED_TOOL" ]; then
            python .github/scripts/publish_selected_public_image.py \
              "${args[@]}" --tool "$SELECTED_TOOL" --mode publish
          else
            python -m npa.deploy.publish_public \
              "${args[@]}" \
              ${{ inputs.skip_missing && '--skip-missing' || '' }}
          fi

      - name: Write the visibility checklist to the job summary
        if: ${{ failure() && inputs.dry_run == false }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Images copied, but not yet public

          If the failing step was **Publish and verify**, the copy succeeded and the packages
          are **private** — GHCR's default for a newly created package. This cannot be
          automated: GitHub has no REST API to set visibility for organisation-owned
          packages.

          Open each link below, then **Danger Zone → Change visibility → Public**. It is
          one-time (visibility persists across later pushes to the same package).

          > **This is irreversible.** A public package cannot be made private again, and
          > deleting a tag does not undo publication. Confirm the redistribution
          > classification before doing it — see `docs/workbench/container-packaging.md`.

          MD
          # Only the packages that are still private, so the list shrinks as they are flipped.
          python -m npa.deploy.publish_public \
            --target "${{ steps.target.outputs.value }}" \
            ${{ inputs.skip_missing && '--skip-missing' || '' }} \
            --verify-public --checklist 2>/dev/null \
            | grep '^- \[ \]' >> "$GITHUB_STEP_SUMMARY" || true
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'

          Re-run this workflow with `dry_run=false` to re-verify, or run locally:

          ```
          npa/.venv/bin/python -m npa.deploy.publish_public --verify-public
          ```
          MD
