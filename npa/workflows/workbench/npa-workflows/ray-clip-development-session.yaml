apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: ray-clip-development-session
  description: Isolated application Ray on SkyPilot for the CLIP Jobs development recipe.

# This session deliberately waits for the reviewed Jobs client's finish marker.
# Use ray-clip-development/submit.py, then finish.py; cancel the exact NPA run
# on failure. Never run `ray stop` on a SkyPilot node.
config:
  runtime_setup: image
  runtime_image: docker.io/pytorch/pytorch@sha256:72f863fa1fe13d5d87a72d00db2c85fb2d43409ee08dd26bc469de4c8a28b427
  nodes: "1"
  gpus_per_node: "1"
  accelerator: RTXPRO6000:1
  bucket: example-bucket
  prefix: "runs/{{run.id}}/ray-development"
  session_uri: "s3://{{config.bucket}}/{{config.prefix}}/session/"
  stop_uri: "s3://{{config.bucket}}/{{config.prefix}}/finish.json"

resources:
  gpu:
    cloud: kubernetes
    image: "{{config.runtime_image}}"
    accelerators: "{{config.accelerator}}"
    cpus: 12
    memory: 48Gi
    num_nodes: "{{config.nodes}}"
    use_spot: false

initial: application-session
states:
  application-session:
    resources: gpu
    multiNodeMode: sharded
    run:
      shell: |
        set -euo pipefail
        umask 077
        export NPA_RAY_PREPARATION_STARTED="$(date +%s.%N)"
        # The pinned PyTorch image owns this interpreter; SkyPilot owns its own.
        /usr/bin/python3.12 -m venv --system-site-packages --without-pip /tmp/npa-ray-app
        # The image fixes Torch/CUDA; prepare Python dependencies once per session.
        /usr/bin/python3.12 -m pip --python /tmp/npa-ray-app/bin/python install \
          'ray[default]==2.46.0' 'lancedb==0.30.2' 'pyarrow==23.0.1' \
          'numpy==2.4.6' 'pillow==12.2.0' 'boto3==1.42.9' 'transformers==5.10.2'
        /tmp/npa-ray-app/bin/python - <<'PY'
        import hashlib
        import importlib.metadata
        import json
        import os
        from pathlib import Path
        import signal
        import socket
        import subprocess
        import sys
        import time
        from urllib.parse import urlparse

        import boto3
        from botocore.exceptions import ClientError
        from huggingface_hub import snapshot_download
        import psutil
        import ray
        import torch

        rank = int(os.environ["SKYPILOT_NODE_RANK"])
        ips = os.environ["SKYPILOT_NODE_IPS"].split()
        if len(ips) != int("{{config.nodes}}"):
            raise RuntimeError("SkyPilot node allocation does not match the session")
        if ray.__version__ != "2.46.0" or not torch.cuda.is_available():
            raise RuntimeError("The application requires pinned Ray and an actual CUDA GPU")
        gpu_count = int("{{config.gpus_per_node}}")
        if gpu_count < 1 or torch.cuda.device_count() != gpu_count:
            raise RuntimeError("Visible GPU count does not match gpus_per_node")
        os.environ.pop("RAY_ADDRESS", None)
        # Jobs without entrypoint resources keep driver checkpoints on the head.
        os.environ["RAY_JOB_ALLOW_DRIVER_ON_WORKER_NODES"] = "0"
        model = Path("/tmp/npa-clip-model")
        download_started = time.time()
        revision = "3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
        snapshot_download(
            "openai/clip-vit-base-patch32", revision=revision,
            local_dir=str(model), token=False,
            allow_patterns=["config.json", "preprocessor_config.json", "tokenizer_config.json",
                            "vocab.json", "merges.txt", "special_tokens_map.json", "pytorch_model.bin"],
        )
        weights = model / "pytorch_model.bin"
        digest = hashlib.sha256()
        with weights.open("rb") as stream:
            for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                digest.update(chunk)
        weight_hash = digest.hexdigest()
        if weight_hash != "a63082132ba4f97a80bea76823f544493bffa8082296d62d71581a4feff1576f":
            raise RuntimeError("Model weights differ from the verified public snapshot")
        download_seconds = time.time() - download_started
        s3 = boto3.client("s3", endpoint_url=os.environ.get("AWS_ENDPOINT_URL")
                          or os.environ.get("NEBIUS_S3_ENDPOINT"))
        destination = urlparse("{{config.session_uri}}")
        stop = urlparse("{{config.stop_uri}}")
        if destination.scheme != "s3" or stop.scheme != "s3":
            raise ValueError("Session artifacts require explicit S3 destinations")

        def publish(name, value):
            data = json.dumps(value, sort_keys=True).encode()
            key = destination.path.lstrip("/").rstrip("/") + "/" + name
            s3.put_object(Bucket=destination.netloc, Key=key, Body=data)
            readback = s3.get_object(Bucket=destination.netloc, Key=key)["Body"].read()
            if hashlib.sha256(readback).digest() != hashlib.sha256(data).digest():
                raise RuntimeError("Session artifact read-after-write verification failed")

        # Management head workers use 11002..65535; non-head workers use OS ports.
        ephemeral_ports = [int(value) for value in
                           Path("/proc/sys/net/ipv4/ip_local_port_range").read_text().split()]
        if ephemeral_ports[0] <= 10999:
            raise RuntimeError("Application ports require an OS ephemeral range above 10999")
        # Reserve application ports below both ranges and away from fixed Sky ports.
        args = ["/tmp/npa-ray-app/bin/ray", "start", "--block",
                "--node-ip-address=" + ips[rank], "--num-cpus=8", "--num-gpus=" + str(gpu_count),
                "--object-manager-port=8077", "--node-manager-port=8078",
                "--min-worker-port=10010", "--max-worker-port=10999",
                "--ray-client-server-port=10002", "--dashboard-agent-listen-port=8267",
                "--dashboard-agent-grpc-port=8268", "--runtime-env-agent-port=8269",
                "--metrics-export-port=8270",
                "--disable-usage-stats"]
        if rank == 0:
            args += ["--head", "--port=6381", "--dashboard-host=127.0.0.1",
                     "--dashboard-port=8265", "--include-dashboard=true",
                     "--temp-dir=/tmp/npa-ray-session"]
        else:
            args += ["--address=" + ips[0] + ":6381"]
            while True:
                try:
                    with socket.create_connection((ips[0], 6381), timeout=1):
                        break
                except OSError:
                    time.sleep(1)
        receipt = {
            "rank": rank, "node_count": len(ips), "hostname": socket.gethostname(),
            "gpus_per_node": gpu_count, "os_ephemeral_port_range": ephemeral_ports,
            "model_revision": revision, "weight_sha256": weight_hash,
            "model_fetch_and_verify_seconds": download_seconds,
            "preparation_seconds": time.time() - float(os.environ["NPA_RAY_PREPARATION_STARTED"]),
            "versions": {name: importlib.metadata.version(name) for name in
                         ("ray", "torch", "transformers", "lancedb", "pyarrow", "numpy")},
            "python": sys.version, "cuda": torch.version.cuda,
            "gpu": torch.cuda.get_device_name(0),
            "udf_delivery": "reviewed Workbench source through Ray Jobs working_dir",
            "dependency_freeze": subprocess.check_output(
                ["/tmp/npa-ray-app/bin/python", "-m", "pip", "freeze"], text=True).splitlines(),
        }
        process = subprocess.Popen(args)
        receipt["owned_ray_cli_pid"] = process.pid
        requested = False
        owned_children = {}

        def remember_children():
            try:
                children = psutil.Process(process.pid).children(recursive=True)
            except psutil.NoSuchProcess:
                return
            for child in children:
                try:
                    owned_children[(child.pid, child.create_time())] = child
                except psutil.NoSuchProcess:
                    continue

        def alive_owned_children():
            alive = []
            for (pid, created), child in owned_children.items():
                try:
                    # psutil also checks creation time in its signal methods.
                    if (child.pid == pid and child.is_running()
                            and child.create_time() == created
                            and child.status() != psutil.STATUS_ZOMBIE):
                        alive.append(child)
                except psutil.NoSuchProcess:
                    continue
            return alive

        def shutdown_owned_processes(grace_seconds=5):
            started = time.monotonic()
            errors = []
            signalled = {"terminate": [], "kill": []}
            phases = []

            def wait_owned_children(phase):
                before = alive_owned_children()
                wait_started = time.monotonic()
                psutil.wait_procs(before, timeout=grace_seconds)
                phases.append({"phase": phase, "before": len(before),
                               "after": len(alive_owned_children()),
                               "seconds": time.monotonic() - wait_started})

            if process.poll() is None:
                remember_children()
                # Ray 2.46's SIGTERM hook calls kill_all_processes(wait=False).
                # Waiting for its CLI alone does not wait for every descendant.
                process.send_signal(signal.SIGTERM)
                process.wait()
            cli_shutdown_seconds = time.monotonic() - started
            wait_owned_children("wait_after_cli_exit")
            for operation in ("terminate", "kill"):
                for child in alive_owned_children():
                    try:
                        getattr(child, operation)()
                        signalled[operation].append(child.pid)
                    except psutil.NoSuchProcess:
                        continue
                    except psutil.Error as error:
                        errors.append({"pid": child.pid, "operation": operation,
                                       "error_type": type(error).__name__})
                wait_owned_children(operation + "_wait")
            return {
                "surviving_owned_children": [child.pid for child in alive_owned_children()],
                "shutdown_seconds": time.monotonic() - started,
                "shutdown_signals": signalled, "shutdown_errors": errors,
                "shutdown_signal_counts": {name: len(pids) for name, pids in signalled.items()},
                "shutdown_phases": phases, "shutdown_grace_seconds": grace_seconds,
                "cli_shutdown_seconds": cli_shutdown_seconds,
            }

        def interrupted(signum, _frame):
            raise RuntimeError(f"Application session interrupted by signal {signum}")

        signal.signal(signal.SIGTERM, interrupted)
        signal.signal(signal.SIGINT, interrupted)
        try:
            publish(f"rank-{rank}-prepared.json", receipt)
            while process.poll() is None:
                remember_children()
                try:
                    response = s3.get_object(Bucket=stop.netloc, Key=stop.path.lstrip("/"))
                except ClientError as error:
                    if error.response["Error"]["Code"] not in {"NoSuchKey", "404"}:
                        raise
                else:
                    marker = json.loads(response["Body"].read())
                    if marker.get("finished") is not True or len(marker.get("manifest_sha256", "")) != 64:
                        raise RuntimeError("Invalid finish marker")
                    requested = True
                    break
                time.sleep(2)
            if not requested:
                raise RuntimeError(f"Owned application Ray CLI exited unexpectedly: {process.returncode}")
        finally:
            shutdown = shutdown_owned_processes()
            receipt.update(finish_requested=requested, ray_cli_exit_code=process.returncode,
                           **shutdown)
            publish(f"rank-{rank}-cleanup.json", receipt)
            if shutdown["surviving_owned_children"] or shutdown["shutdown_errors"]:
                raise RuntimeError("Owned application Ray child shutdown could not be verified")
        if process.returncode not in (0, 1) or not requested:
            raise RuntimeError("Application session did not finish cleanly")
        PY
    outputs:
      - uri: "{{config.session_uri}}"
        schema: npa.ray.development.session.v1
    terminal: true
