name: Security regression

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One candidate-level group cancels every child gate when a PR advances.
  # Main validation is also superseded by the newest commit on main.
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  gitleaks:
    name: ${{ github.event_name == 'push' && 'validation-plan' || 'gitleaks' }}
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_PRIORITY_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source_run: ${{ steps.plan.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify queue evidence using the trusted base policy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != merge_group ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          policy=npa/scripts/ci_queue_evidence.py
          git rev-parse --verify "${BASE_SHA}^{commit}"
          if ! git cat-file -e "$BASE_SHA:$policy"; then
            # The installing PR still receives the complete legacy queue gate.
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$BASE_SHA:$policy" > "$RUNNER_TEMP/ci_queue_evidence.py"
          git show "$BASE_SHA:scripts/ci_image_security_scope.py" > "$RUNNER_TEMP/image_scope.py"
          test -d npa && test ! -L npa
          test ! -e npa/.venv && test ! -L npa/.venv
          validation_environment="$(mktemp -d "$RUNNER_TEMP/queue-validation.XXXXXXXX")"
          python -I -m venv "$validation_environment"
          ln -s "$validation_environment" npa/.venv
          npa/.venv/bin/python -I "$RUNNER_TEMP/ci_queue_evidence.py" \
            --repository "$GITHUB_REPOSITORY" --event-path "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" --image-policy "$RUNNER_TEMP/image_scope.py"

      - name: Install verified gitleaks release
        if: github.event_name != 'push'
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL --retry 5 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Reject committed secrets
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${BASE_SHA}^{commit}"
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${BASE_SHA}..HEAD"

  pr-precheck:
    name: pr-precheck
    if: github.event_name == 'pull_request'
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_PRIORITY_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: python-3.12
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject stale dependency inputs before installing
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python npa/scripts/ci_requirements.py --check
      - name: Install the constrained precheck environment
        run: |
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"
          echo "$GITHUB_WORKSPACE/npa/.venv/bin" >> "$GITHUB_PATH"
      - name: Check lint, formatting, smoke and test collection
        run: |
          bash npa/scripts/ci_precheck.sh
      - name: Publish the early signal
        run: |
          echo '## PR precheck passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dependency inputs, lint, formatting, guardrails, smoke tests and full test collection passed. Full tests and security checks must still pass before queue admission.' >> "$GITHUB_STEP_SUMMARY"

  # Independent validation jobs use available runners without shared job locks.
  # The workflow-level group above owns cancellation of superseded PR work.
  test-gate:
    needs: [gitleaks, pr-precheck]
    if: ${{ !cancelled() && needs.gitleaks.result == 'success' && contains(fromJSON('["full", "retest"]'), needs.gitleaks.outputs.mode) && (github.event_name != 'pull_request' || needs.pr-precheck.result == 'success') && github.event_name != 'push' }}
    uses: ./.github/workflows/test.yml

  lint-gate:
    needs: [gitleaks, pr-precheck]
    if: ${{ !cancelled() && needs.gitleaks.result == 'success' && contains(fromJSON('["full", "retest"]'), needs.gitleaks.outputs.mode) && (github.event_name != 'pull_request' || needs.pr-precheck.result == 'success') && github.event_name != 'push' }}
    uses: ./.github/workflows/lint.yml

  typecheck-gate:
    needs: [gitleaks, pr-precheck]
    if: ${{ !cancelled() && needs.gitleaks.result == 'success' && contains(fromJSON('["full", "retest"]'), needs.gitleaks.outputs.mode) && (github.event_name != 'pull_request' || needs.pr-precheck.result == 'success') && github.event_name != 'push' }}
    uses: ./.github/workflows/typecheck.yml

  queue-guardrails:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.gitleaks.result == 'success' && contains(fromJSON('["full", "retest"]'), needs.gitleaks.outputs.mode) }}
    uses: ./.github/workflows/harness-guardrails.yml

  # Keep these two job names stable while their former standalone workflows
  # become main-only audits. Existing branch protection remains fail closed
  # throughout the rollout and the parent concurrency cancels them atomically.
  scan:
    if: github.event_name != 'push'
    name: scan
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_PRIORITY_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    env:
      CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
      INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install the confidentiality scanner
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e npa

      - name: Reject confidential data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${BASE_SHA}^{commit}"
          scan_args=(--repo-root . --tree --diff-range "${BASE_SHA}..HEAD")

          proof_directory="${RUNNER_TEMP}/ncore-source-attribution-proof"
          install -d -m 0700 "${proof_directory}"
          npa/.venv/bin/python -m npa.guardrails.confidentiality \
            "${scan_args[@]}" --pattern-env CUSTOMER_DENYLIST \
            --ncore-attribution-proof-directory "${proof_directory}"

          if [ -n "${INFRA_DENYLIST:-}" ]; then
            npa/.venv/bin/python -m npa.guardrails.confidentiality \
              "${scan_args[@]}" --pattern-env INFRA_DENYLIST --ignore-case
          else
            echo "::warning::operator-private denylist is not configured"
          fi

  image-security:
    needs: [gitleaks, pr-precheck]
    if: ${{ !cancelled() && needs.gitleaks.result == 'success' && needs.gitleaks.outputs.mode == 'full' && (github.event_name != 'pull_request' || needs.pr-precheck.result == 'success') }}
    uses: ./.github/workflows/image-security-scan.yml
    permissions:
      contents: read
      packages: read
      security-events: write

  security-scanners:
    name: security-scanners
    timeout-minutes: 7
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_PRIORITY_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/security-requirements.txt
      - name: Select target revision and trusted scanner policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          umask 077
          git rev-parse --verify "${BASE_SHA}^{commit}"
          echo "SECURITY_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          policy_directory="$RUNNER_TEMP/security-policy"
          mkdir -p "$policy_directory"
          policy_revision="$BASE_SHA"
          # The installing PR is the only revision whose target lacks this policy.
          if ! git cat-file -e "$BASE_SHA:scripts/security_gate.py"; then
            policy_revision="$GITHUB_SHA"
          fi
          for name in security_gate.py security_source.py security_dependencies.py security_regression_checks.py security_install.sh security-requirements.txt; do
            git show "$policy_revision:scripts/$name" > "$policy_directory/$name"
          done
          echo "SECURITY_POLICY=$policy_directory" >> "$GITHUB_ENV"
      - name: Install isolated pinned scanners
        run: |
          set -euo pipefail
          test -d npa && test ! -L npa
          test ! -e npa/.venv && test ! -L npa/.venv
          scanner_environment="$(mktemp -d "$RUNNER_TEMP/security-environment.XXXXXXXX")"
          python -I -m venv "$scanner_environment"
          ln -s "$scanner_environment" npa/.venv
          npa/.venv/bin/python -I -m pip install -r "$SECURITY_POLICY/security-requirements.txt"
          bash "$SECURITY_POLICY/security_install.sh" "$RUNNER_TEMP/security-tools"
          echo "$GITHUB_WORKSPACE/npa/.venv/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Prove real scanners reject safe vulnerable fixtures
        run: npa/.venv/bin/python "$SECURITY_POLICY/security_regression_checks.py" --output-dir "$RUNNER_TEMP/security-regressions"
      - name: Reject source, workflow and dependency regressions
        run: |
          npa/.venv/bin/python "$SECURITY_POLICY/security_gate.py" \
            --base "$SECURITY_BASE" --head "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/security-report"

  security-runtime:
    needs: [gitleaks, pr-precheck]
    if: ${{ !cancelled() && needs.gitleaks.result == 'success' && contains(fromJSON('["full", "retest"]'), needs.gitleaks.outputs.mode) && (github.event_name != 'pull_request' || needs.pr-precheck.result == 'success') }}
    name: hostile-input-runtime
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_TEST_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install the repository and real CPU checkpoint runtime
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install -e "npa[dev,adapter]"
          npa/.venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          npa/.venv/bin/python -c "import torch; assert torch.__version__.split('+')[0] == '2.14.0'; assert torch.version.cuda is None"
          echo "${GITHUB_WORKSPACE}/npa/.venv/bin" >> "$GITHUB_PATH"

      - name: Exercise hostile inputs and supported security boundaries
        run: |
          npa/.venv/bin/python -m pytest \
            npa/tests/guardrails/test_image_security_gate.py \
            npa/tests/clients/test_download_containment.py \
            npa/tests/clients/test_ssh_private_staging.py \
            npa/tests/cli/test_agent_source_archive.py \
            npa/tests/cli/test_service_credential_security.py \
            npa/tests/cli/test_fiftyone_env_security.py \
            npa/tests/cli/test_fiftyone_private_access.py \
            npa/tests/workbench/test_checkpoint_security.py \
            npa/tests/workbench/test_s3_tree_security.py \
            npa/tests/workbench/test_storage_scope.py \
            npa/tests/workbench/test_policy_container_security.py \
            npa/tests/workbench/test_alpamayo2_super_service_security.py \
            npa/tests/workbench/test_cosmos3_ray_inputs.py \
            npa/tests/workbench/test_cosmos3_ray_serve.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            npa/tests/workflows/test_paidf_download_security.py \
            npa/tests/workflows/test_openpi_gcs.py \
            npa/tests/workflows/test_rerun_serve_auth.py \
            npa/tests/orchestration/skypilot/test_controller_clone.py \
            npa/tests/orchestration/skypilot/test_local_api.py \
            npa/tests/orchestration/skypilot/test_controller_identity_transaction.py \
            -q

  security-regression:
    name: security-regression
    needs:
      - pr-precheck
      - queue-guardrails
      - test-gate
      - lint-gate
      - typecheck-gate
      - gitleaks
      - scan
      - security-scanners
      - image-security
      - security-runtime
    # Report failed dependencies, but let superseded runs release the PR queue.
    if: ${{ !cancelled() }}
    runs-on: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && (vars.NPA_CI_PRIORITY_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    steps:
      - name: Require every candidate gate and security audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.gitleaks.result }}
          VALIDATION_MODE: ${{ needs.gitleaks.outputs.mode }}
          PRECHECK_RESULT: ${{ needs.pr-precheck.result }}
          TEST_RESULT: ${{ needs.test-gate.result }}
          LINT_RESULT: ${{ needs.lint-gate.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck-gate.result }}
          GUARDRAIL_RESULT: ${{ github.event_name == 'merge_group' && needs.queue-guardrails.result || needs.pr-precheck.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CONFIDENTIALITY_RESULT: ${{ needs.scan.result }}
          SCANNER_RESULT: ${{ needs.security-scanners.result }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
          RUNTIME_RESULT: ${{ needs.security-runtime.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$SCANNER_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$PRECHECK_RESULT" = success
          fi
          if [ "$VALIDATION_MODE" = reuse ]; then
            test "$EVENT_NAME" = merge_group
            test "$GITLEAKS_RESULT" = success
            test "$CONFIDENTIALITY_RESULT" = success
            for result in "$TEST_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$GUARDRAIL_RESULT" "$IMAGE_RESULT" "$RUNTIME_RESULT"; do
              test "$result" = skipped
            done
            echo 'Exact-tree PR evidence and fresh security scans passed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$VALIDATION_MODE" = retest ]; then
            test "$EVENT_NAME" = merge_group
            test "$IMAGE_RESULT" = skipped
          else
            test "$VALIDATION_MODE" = full
            test "$IMAGE_RESULT" = success
          fi
          test "$RUNTIME_RESULT" = success
          if [ "$EVENT_NAME" != push ]; then
            test "$TEST_RESULT" = success
            test "$LINT_RESULT" = success
            test "$TYPECHECK_RESULT" = success
            test "$GUARDRAIL_RESULT" = success
            test "$GITLEAKS_RESULT" = success
            test "$CONFIDENTIALITY_RESULT" = success
          fi

      - name: Record the successfully tested PR merge commit
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/validated-candidate.txt"
      - name: Publish validation identity
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-candidate-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/validated-candidate.txt
          if-no-files-found: error

  ci-timing-report:
    name: ci-timing-report
    needs: security-regression
    # Failed validation is useful evidence; superseded runs release their runners.
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read validation metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/ci-timing-metadata"
          mkdir -p "$metadata"
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          gh api "$endpoint" > "$metadata/run.json"
          gh api --paginate --slurp "${endpoint}/jobs?per_page=100" > "$metadata/jobs.json"
      - name: Publish timing summary
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python npa/scripts/ci_timing_report.py \
            --run "${RUNNER_TEMP}/ci-timing-metadata/run.json" \
            --jobs "${RUNNER_TEMP}/ci-timing-metadata/jobs.json" \
            --output-directory "${RUNNER_TEMP}/ci-timing-report"
          cat "${RUNNER_TEMP}/ci-timing-report/timing.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload timing report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-timing-report/
