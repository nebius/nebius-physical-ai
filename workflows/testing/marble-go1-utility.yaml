apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: marble-go1-utility
  executionMode: runtime
  description: >-
    Collect service-aisle observations around pipes and pump housings for inspection-data and localization experiments.
    Generate a Marble site, collect with a simulated Unitree Go1 on one Nebius
    RTX PRO 6000, and publish a standalone HTML replay. No new policy training.

config:
  source_overlay: true
  bucket: example-bucket
  prefix: "runs/{{run.id}}/marble-go1-utility"
  world_source: generate
  world_model: marble-1.1
  world_prompt: >-
    A photorealistic utility pump room with stationary pump housings, pipe manifolds, valve wheels and electrical cabinets along the walls. A continuous dry level concrete service aisle at least ten meters long and three meters wide, open turning areas at both ends, camera centered on the aisle close to floor level. Pipes, valves and equipment remain outside the aisle. No people, robots, moving machinery, steps, trenches, puddles or floor holes. Realistic overhead service lighting.
  frames: 1000
  width: 1280
  height: 720
  sensor_hz: 25
  speed_mps: 0.5
  motion_profile: turnaround
  samples: 32

  world_uri: "s3://{{config.bucket}}/{{config.prefix}}/world/"
  results_uri: "s3://{{config.bucket}}/{{config.prefix}}/results/"
  reports_uri: "s3://{{config.bucket}}/{{config.prefix}}/report/"

resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
  gpu:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
    cpus: 8
    memory: 64Gi

initial: acquire
states:
  acquire:
    description: Generate this site through the World Labs API and publish hashed world assets.
    toolRef: workbench.marble.acquire
    resources: cpu
    outputs:
      - uri: "{{config.world_uri}}world.json"
        schema: npa.marble.world.v1
    next: collect
  collect:
    description: Run Go1 torque dynamics and the pretrained policy on CPU; collect gsplat/Warp CUDA sensors and Cycles CUDA robot rendering.
    toolRef: workbench.marble.quadruped_collect
    resources: gpu
    inputs:
      - uri: "{{config.world_uri}}world.json"
        schema: npa.marble.world.v1
    outputs:
      - uri: "{{config.results_uri}}result.json"
        schema: npa.marble.result.v1
      - uri: "{{config.results_uri}}trajectory.json"
        schema: application/json
    next: report
  report:
    description: Verify this collection and publish its standalone offline HTML replay.
    toolRef: workbench.marble.report
    resources: cpu
    inputs:
      - uri: "{{config.results_uri}}result.json"
        schema: npa.marble.result.v1
    outputs:
      - uri: "{{config.reports_uri}}index.html"
        schema: text/html
    terminal: true
