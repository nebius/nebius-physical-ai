# Opt-in config overlay for workflows/main/paidf-cosmos3.yaml.
# Apply to a copy of that workflow; this file is not a standalone workflow.
config:
  variant_count: '12'
  variant_parallelism: '1'
  augmentation_seed: '30'
  seed: '17'
  guidance: '5.0'
  steps: '35'
  control_guidance: '1.0'
  transfer_edge_threshold: low
  transfer_rgb_weight: 0.25
  transfer_first_chunk_conditional_frames: '0'
  transfer_cfg_normalization: enabled
  grade_threshold: '0.75'
  attribute_threshold: '1.0'
  alignment_mode: required
  temporal_consistency_mode: advisory
  appearance_fidelity_mode: advisory
  augment_subject: the robot task visible in the source video
  prompt: Apply the selected material and lighting only to the existing stationary work surface.
    Preserve its exact plane, outline and position. Preserve all original robot parts, movable
    objects, containers, tools, counts, identity colors, markings, transparency, trajectories,
    contacts, occlusions, camera, timing and task outcome. Do not add a work surface where none
    is visible. Treat image padding as outside the scene and retain it unchanged.
  negative_prompt: deformed robot, extra parts, duplicate objects, changed task-object colors,
    missing markings, opaque transparent objects, changed geometry, floating objects, interpenetration,
    flicker, ghosting, overexposure, cartoon, unsafe content
  caption_instruction: Describe visible robot parts, task objects and contacts in one or two
    factual sentences. Do not infer brands, customers, facilities or people. State uncertainty
    about unclear or occluded features. Do not infer motion or task completion from a single
    frame.
