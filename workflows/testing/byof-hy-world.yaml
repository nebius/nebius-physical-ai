apiVersion: npa.workflow/v0.0.1
kind: Workflow

# Candidate-only HY-World 2.0 image-to-world workflow. It is intentionally
# plan-only until a manager-held scope record confirms the Tencent territory/MAU
# condition or a Tencent grant, then an exact candidate digest completes the
# secure build and real B200 validation gates.
metadata:
  name: byof-hy-world
  description: >
    Runtime-fetch Tencent HY-World 2.0 image-conditioned world generation:
    Qwen-Image-Edit HY-Pano, WorldNav, WorldStereo, GS-data preparation and 3DGS
    composition. Emits actual generated scene assets, camera renders, provenance,
    and a verified Rerun report; it neither creates a service nor trains a policy.

config:
  bucket: example-bucket
  prefix: "oss-solutions/hy-world/{{run.id}}"
  input_image_uri: "s3://example-bucket/operator-inputs/image.png"
  prompt: "Expand the supplied image into a coherent, navigable world."
  # Supply this only from a private run configuration. It is an operator-owned
  # already-running vLLM endpoint, not a service created by this workflow.
  llm_addr: ""
  llm_port: "8000"
  llm_name: "Qwen/Qwen3-VL-8B-Instruct"

  repo_url: "https://github.com/Tencent-Hunyuan/HY-World-2.0"
  repo_ref: "df9988efb87bfc0f4947eb3889411cf957478b06"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: prebuilt
  base_image: "tool://hy-world"
  build_command: ""
  source_prune_path: ""
  workload: solution-smoke
  smoke_command: |
    set -euo pipefail
    : "${BYOF_IMAGE:?BYOF image digest is required}"
    export HY_WORLD_INPUT_IMAGE="/workspace/hy-world-input.png"
    export HY_WORLD_SCENE_DIR="${NPA_SMOKE_OUTPUT_DIR}/scene"
    export HY_WORLD_RESULT_DIR="${NPA_SMOKE_OUTPUT_DIR}/result"
    export HY_WORLD_CONTAINER_IMAGE="${BYOF_IMAGE}"
    export HY_WORLD_PROMPT_B64="{{config.prompt|base64}}"
    export HY_WORLD_INPUT_IMAGE_URI_B64="{{config.input_image_uri|base64}}"
    export HY_WORLD_LLM_ADDR_B64="{{config.llm_addr|base64}}"
    export HY_WORLD_LLM_PORT_B64="{{config.llm_port|base64}}"
    export HY_WORLD_LLM_NAME_B64="{{config.llm_name|base64}}"
    python3 - "${HY_WORLD_INPUT_IMAGE_URI_B64}" "${HY_WORLD_INPUT_IMAGE}" <<'PY'
    import base64
    import os
    import sys
    from pathlib import Path
    from urllib.parse import urlparse

    import boto3
    from botocore.config import Config

    source_b64, destination = sys.argv[1:]
    try:
        source = base64.b64decode(source_b64, validate=True).decode("utf-8")
    except (ValueError, UnicodeDecodeError) as exc:
        raise SystemExit(f"input_image_uri is not valid base64 UTF-8: {exc}") from exc
    parsed = urlparse(source)
    if parsed.scheme != "s3" or not parsed.netloc or not parsed.path.endswith(".png"):
        raise SystemExit("input_image_uri must be one private s3:// object ending in .png")
    endpoint = (os.environ.get("AWS_ENDPOINT_URL") or os.environ.get("NEBIUS_S3_ENDPOINT") or "").strip() or None
    client = boto3.client("s3", endpoint_url=endpoint, config=Config(s3={"addressing_style": "path"}), region_name=os.environ.get("AWS_DEFAULT_REGION", "us-central1"))
    client.download_file(parsed.netloc, parsed.path.lstrip("/"), destination)
    if Path(destination).stat().st_size < 256:
        raise SystemExit("input image is unexpectedly small")
    PY
    export NPA_HY_WORLD_LLM_ADDR="$(python3 - <<'PY'
    import base64
    import os
    import sys

    value = base64.b64decode(os.environ["HY_WORLD_LLM_ADDR_B64"], validate=True).decode("utf-8")
    if not value:
        raise SystemExit("private llm_addr is required; this workflow does not create a persistent vLLM service")
    sys.stdout.write(value)
    PY
    )"
    export NPA_HY_WORLD_LLM_PORT="$(python3 - <<'PY'
    import base64
    import os
    import sys

    try:
        value = base64.b64decode(os.environ["HY_WORLD_LLM_PORT_B64"], validate=True).decode("ascii")
    except (KeyError, ValueError, UnicodeDecodeError) as exc:
        raise SystemExit(f"invalid private llm_port: {exc}") from exc
    if not value.isdecimal() or not 1 <= int(value) <= 65535:
        raise SystemExit("private llm_port must be a TCP port number")
    sys.stdout.write(value)
    PY
    )"
    export NPA_HY_WORLD_LLM_NAME="$(python3 - <<'PY'
    import base64
    import os
    import sys

    try:
        value = base64.b64decode(os.environ["HY_WORLD_LLM_NAME_B64"], validate=True).decode("utf-8")
    except (KeyError, ValueError, UnicodeDecodeError) as exc:
        raise SystemExit(f"invalid private llm_name: {exc}") from exc
    if not value.strip() or "\x00" in value:
        raise SystemExit("private llm_name is empty or invalid")
    sys.stdout.write(value)
    PY
    )"
    ffmpeg -v error -i "${HY_WORLD_INPUT_IMAGE}" -frames:v 1 -f null -
    hy-world-runtime terms
    hy-world-runtime health
    hy-world-runtime payload-absence
    hy-world-runtime run-image-to-world
    test -f "${NPA_SMOKE_OUTPUT_DIR}/hy_world_image_to_world.json"
    test -f "${NPA_SMOKE_OUTPUT_DIR}/reports/hy_world_scene.rrd"
    test -f "${NPA_SMOKE_OUTPUT_DIR}/reports/hy_world_scene_rrd_manifest.json"
  solution_name: "hy-world-2.0"
  capability_name: "hy_world_2_image_conditioned_world_generation"
  smoke_artifact_name: "hy_world_image_to_world.json"
  resource_profile_yaml: "byof-solution-smoke-hy-world-b200-8gpu"
  task: "hy-world-2-image-to-world"
  iterations: 1
  num_envs: 1
  num_demos: 1
  wait_timeout: "-1"
  poll_interval: "60"
  output_root: "s3://{{config.bucket}}/oss-solutions/hy-world"
  summary_uri: "s3://{{config.bucket}}/{{config.prefix}}/npa_byof_summary.json"
  artifact_uri: "s3://{{config.bucket}}/{{config.prefix}}/hy_world_image_to_world.json"
  rrd_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/hy_world_scene.rrd"
  rrd_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/hy_world_scene_rrd_manifest.json"

resources:
  gpu:
    cloud: kubernetes
    image: "{{config.base_image}}"
    accelerators: B200:8
    cpus: 128
    memory: 1024Gi
    disk_size: 1000

initial: generate

states:
  generate:
    description: >
      Run the pinned released image-to-world path on one image, validating
      WorldStereo output, upstream cameras, trained 3DGS PLY/SPZ, a generated
      camera-render video, and a Rerun recording. Requires a private pre-existing
      vLLM endpoint and the operator's resolved Tencent terms/access record.
    toolRef: workbench.byof.repo
    resources: gpu
    inputs:
      - uri: "{{config.input_image_uri}}"
        schema: image/png
    outputs:
      - uri: "{{config.summary_uri}}"
        schema: npa.workbench.byof.summary.v1
      - uri: "{{config.artifact_uri}}"
        schema: npa.workbench.byof.hy_world_image_to_world.v1
      - uri: "{{config.rrd_uri}}"
        schema: application/vnd.rerun.rrd
      - uri: "{{config.rrd_manifest_uri}}"
        schema: npa.workbench.hy_world_2.rrd_manifest.v1
    terminal: true
