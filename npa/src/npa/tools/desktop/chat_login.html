<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Codex">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./login.css">
  <script src="./login.js" defer></script>
  <title>Sign in · Codex</title>
</head>
<body>
  <main>
    <img src="./icon-180.png" width="64" height="64" alt="">
    <h1>Your cloud workspace</h1>
    <p>Sign in to continue your Codex chats and desktop.</p>
    <form method="post" action="./login">
      <label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <input name="next" type="hidden" value="/chat/">
      <p id="error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">On iPhone, open in Safari and choose Share → Add to Home Screen. Keep Open as Web App enabled if shown.</p>
  </main>
</body>
</html>
