[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npa"
version = "0.1.0"
description = "Nebius Physical AI platform CLI/SDK"
requires-python = ">=3.10"
# A plain `pip install -e npa` ships the full workbench capability set: the
# offline CLI paths (`npa --version`, vlm-eval stub, workflow validate/plan)
# plus the dataframe/plotting, LanceDB, Rerun, and FastAPI-server deps the
# workbench tools use locally. There is intentionally no `npa` vs `npa[full]`
# split — the default install is fully capable. GPU/simulation wheels
# (`genesis`/`groot`/`sonic`) stay opt-in because they run in the remote Nebius
# images your jobs launch, not on the client, and the optional agent adapters
# (`agent-eval`/`agent-trace`) degrade gracefully when absent. Bounds are
# deliberately wide so a stale mirror does not break the install, except for
# lancedb, rerun-sdk and fastapi: those three are version-pinned because their
# APIs move between minor releases and the workbench tools are written against
# the pinned ones.
dependencies = [
    "typer>=0.24",
    # Imported directly (npa.cli.workflow_shim); typer >= 0.27 no longer
    # depends on click, so it must be declared here.
    "click>=8.0",
    "httpx>=0.27",
    "paramiko>=4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "boto3>=1.34",
    "jinja2>=3.1",
    # Official API client matched to the production Kubernetes 1.33 cluster.
    # Sim2Real uses typed Job/Pod conditions instead of parsing kubectl prose.
    "kubernetes==33.1.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pillow>=10.0",
    # MCAP writer for the lichtblick viewer's frames->MCAP export (pure-Python).
    # Upper bound is deliberate: mcap 1.4.0 trips mypy module discovery (see the
    # [tool.mypy] override) and the writer/reader pin the 1.x record API.
    "mcap>=1.3,<2",
    # Recursive legal byte scanning must inspect modern Debian data.tar.zst payloads.
    "zstandard>=0.19",
    # Wan MP4 verification must not depend on host ffmpeg/ffprobe packages.
    "av==17.1.0",
    "pydantic>=2.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # Formerly the `data` extra: dataframe/plotting helpers used by curation,
    # benchmarks, and reports.
    "pandas>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "scipy>=1.10",
    # Formerly the `lancedb` extra: LanceDB workbench tool (local server,
    # BDD100K import, materialized views).
    "lancedb==0.30.2",
    # Formerly the `viz` extra: Rerun viewer/recording integration
    # (`npa rerun`, sim-viz adapters).
    "rerun-sdk==0.31.4",
    # Formerly the `server` extra: FastAPI policy/eval + agent backend server.
    "fastapi~=0.136.1",
]

[project.optional-dependencies]
# SkyPilot is installed in an isolated venv outside NPA's package environment; see docs/orchestration/skypilot-setup.md.
orchestration = []
# Back-compat aliases. The `data`, `foxglove`, `lancedb`, `viz`, `server`, and
# `full` extras are now folded into the base install, so a plain
# `pip install -e npa` already includes them. These remain as empty extras only
# so existing `pip install -e "npa[full]"` / `npa[server]` invocations (docs,
# scripts, remote-venv bootstraps) keep working as no-ops.
data = []
foxglove = []
lancedb = []
viz = []
server = []
full = []
# Blueprint Phase J: guardrails-ai output validators for the adversarial eval.
# Injected/guarded — the pure-python validator is the default; absence degrades
# gracefully (see npa/tests/agent_eval/adversarial.py).
agent-eval = ["guardrails-ai>=0.5"]
# Blueprint Phase I: self-hostable OSS tracing adapters behind an injected
# tracer (NullTracer is the default; these back build_langfuse_tracer /
# build_otel_tracer in npa/src/npa/agent_backend/trace.py).
agent-trace = [
    "langfuse>=2.0",
    "opentelemetry-sdk>=1.20",
]
genesis = [
    "genesis-world",
    "rsl-rl-lib==2.2.4",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tensorboard>=2.14",
    "numpy>=1.24",
    "pyarrow>=14.0",
]
adapter = [
    "numpy>=1.24",
    "pyarrow>=14.0",
]
groot = [
    "nvidia-gr00t-sdk==0.1.0",
]
sonic = [
    "torch>=2.12.1",
    "onnx>=1.16",
    "onnxscript>=0.5",
    "onnxruntime>=1.18",
]
# Development and test tooling. Install with: pip install -e "npa[dev]"
# The base install already carries every non-GPU workbench dependency, so the
# standard (non-e2e) test suite collects without pulling in the GPU-heavy
# extras (genesis, groot, sonic).
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    # The suite is parallel-safe; `-n auto` takes it from ~6 min to ~2 min on 8
    # cores, which is the difference between running it every iteration and not.
    "pytest-xdist>=3.5",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "fastapi~=0.136.1",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    # The suite is parallel-safe; `-n auto` takes it from ~6 min to ~2 min on 8
    # cores, which is the difference between running it every iteration and not.
    "pytest-xdist>=3.5",
    "ruff>=0.4.0",
]

[project.scripts]
npa = "npa.cli.entry:main"

[tool.npa.supported-tools]
# Default LeRobot image release. Selectable package versions and their image tags
# live in npa/src/npa/deploy/lerobot_version_manifest.json (0.5.1 + 0.6.0).
lerobot = "cuda13-b300-0.5.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
lerobot-policy = "0.1.1"
genesis = "cuda13-b300-0.4.6-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
isaac-lab = "2.3.2.post1"
cosmos = "cu128-torch27-sm100-1.0.9-20260803T002017Z"
cosmos2-transfer = "2.5.1-skypilot-ready-20260801T053000Z"
# Additive r2 image release for cosmos-framework 1.2.2 (pinned commit) + torch
# cu130. The immutable 1.2.2-cu130 tag remains available for rollback; weights
# stay out of both images.
cosmos3 = "1.2.2-cu130-r2"
cosmos3-reason = "cuda13-b300-3.0.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
# Cosmos Curator: NVIDIA upstream checkout + GPU-free curation stage deps.
cosmos-curate = "0.1.2-skypilot-v1-20260813T164700Z"
# Cosmos Evaluator: NVIDIA upstream checkout; no model weights (CV + hosted VLM).
cosmos-evaluator = "0.1.2-skypilot-v1-20260813T164700Z"
groot = "0.1.0"
fiftyone = "1.15.0.post1"
sonic = "cuda13-b300-0.1.2-k8s-runtime-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
retargeting = "0.1.1"
envgen = "cuda13-b300-0.1.2-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
reference-policy = "cuda13-b300-0.1.2-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
lerobot-vlm-rl = "cuda13-b300-0.1.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
loop-eval = "cuda13-b300-0.1.3-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
rerun-viewer = "0.31.4"
# Tracks the pinned @foxglove/embed SDK release (npa.workbench.foxglove).
foxglove-embed = "0.58.0"
# Lichtblick (MPL-2.0): OSS, Foxglove-compatible static web viewer bundle tag.
lichtblick = "1.26.0"
lancedb = "cuda13-b300-0.30.3-sm80-sm90-sm100-sm103-sm120-20260803T031514Z"
detection-training = "bdd100k-golden-eval-smoke-20260614T210000Z"
wan2-2 = "2.2-ti2v5b-rtfetch-cu128-20260809T011658Z-r7"
nebius-cli = "0.12.254"
terraform = "~> 0.5.201"
terraform-cli = "1.13.3"

# Installed package/application versions are distinct from immutable image tags.
# Container smokes and build metadata read this table; deploy/CLI/SDK resolution
# reads supported-tools above. This keeps additive UTC-stamped image releases
# auditable without asking an installed package to report an image tag as its
# Python package version.
[tool.npa.package-versions]
lerobot = "0.5.1"
genesis = "0.4.6"
cosmos = "1.0.9"
cosmos3-reason = "3.0.1"
sonic = "0.1.2"
envgen = "0.1.2"
reference-policy = "0.1.2"
lerobot-vlm-rl = "0.1.1"
loop-eval = "0.1.3"

[tool.hatch.build.targets.wheel]
packages = ["src/npa"]

[tool.hatch.build.targets.wheel.force-include]
"src/npa/solutions/solutions.toml" = "npa/solutions/solutions.toml"
"src/npa/deploy/sonic_image_manifest.json" = "npa/deploy/sonic_image_manifest.json"
"src/npa/deploy/wan2_2_image_manifest.json" = "npa/deploy/wan2_2_image_manifest.json"
"src/npa/deploy/lerobot_version_manifest.json" = "npa/deploy/lerobot_version_manifest.json"
"src/npa/deploy/terraform/.terraform.lock.hcl" = "npa/deploy/terraform/.terraform.lock.hcl"
"src/npa/deploy/terraform/.terraform.lock.npa.json" = "npa/deploy/terraform/.terraform.lock.npa.json"
"src/npa/smoke/golden_evals.yaml" = "npa/smoke/golden_evals.yaml"
"workflows/workbench/npa-workflows/sim2real.yaml" = "npa/workflows/workbench/npa-workflows/sim2real.yaml"
"workflows/workbench/npa-workflows/physical-ai-data-factory.yaml" = "npa/workflows/workbench/npa-workflows/physical-ai-data-factory.yaml"
"src/npa/cli/agent_ui.html" = "npa/cli/agent_ui.html"
"src/npa/assets/paidf_starter_video.json" = "npa/assets/paidf_starter_video.json"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes + the default pycodestyle errors. The tree is clean under this set
# and CI enforces it (.github/workflows/lint.yml); widen deliberately, not by
# accident.
select = ["E4", "E7", "E9", "F"]

# Advisory type-check config (CI: `mypy src/npa --ignore-missing-imports`).
# mcap 1.4.0 makes mypy's module discovery report the same file under two module
# names ("mcap" and "mcap.__init__"), which aborts the whole run. The library is
# an optional, lazily imported dependency, so skip following it.
[tool.mypy]
exclude = ["(^|/)\\.venv/"]

[[tool.mypy.overrides]]
module = ["mcap", "mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests requiring real Nebius infrastructure (gated on NPA_INTEGRATION_E2E env var).",
    "e2e_serverless: serverless endpoint e2e tests requiring real Nebius Serverless AI infrastructure.",
    "e2e_skypilot: SkyPilot e2e tests requiring Nebius, MK8s, and SkyPilot-managed jobs.",
    "e2e_pipeline: pipeline composition e2e tests that submit multiple real Nebius Serverless AI Jobs.",
    "smoke: smoke tests that exercise CLI subprocess paths with local fakes.",
    "multi_gpu: BYOVM multi-GPU tests that require NPA_TEST_BYOVM_* env vars and a live multi-GPU VM.",
    "ngc_e2e: GR00T NGC credential e2e tests that require NPA_TEST_GROOT_NGC_E2E=1 and a live GR00T workbench.",
    "byovm_live: BYOVM tests that require opt-in live target environment variables.",
    "gpu: tests that provision a live GPU through SkyPilot when credentials are available.",
    "token_factory_e2e: live Nebius Token Factory API tests that require a real NEBIUS_TOKEN_FACTORY_KEY.",
    "agent_live: live NPA agent VM HTTPS tests gated on NPA_AGENT_LIVE=1 and NPA_INTEGRATION_E2E=1.",
]
