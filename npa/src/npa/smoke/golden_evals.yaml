# Container golden-eval manifest — single source of truth for the per-container
# "golden eval" / "hello world" tested rerun.
#
# Every Workbench container image (see npa.deploy.images.CONTAINER_IMAGE_NAMES)
# must have exactly one entry here. Each entry records:
#   - physical_ai: whether/why the container is useful for Physical AI work.
#   - safety:      the safety posture of the image (runtime user, network, fetches).
#   - golden_eval: the minimal test that the container ACTUALLY DOES ITS JOB.
#
# "Golden eval" means a real capability test of the container — the smallest run
# that exercises the tool's actual function and produces a real artifact/result
# (e.g. Cosmos Transfer runs a real world-transfer and emits a video; LeRobot runs
# a real train/eval step; a server answers a real request). It is NOT a wrapper or
# a bare CUDA/import probe: `torch.cuda.is_available()` alone is not a golden eval.
# A pure import/probe is only acceptable for foundation base images (build-import).
#
# Consumers:
#   - npa.smoke.manifest          loads and validates this file.
#   - npa workbench golden-eval   lists / validates / runs entries.
#   - npa/scripts/run_golden_evals.py   nightly CI driver.
#   - npa/tests/smoke/test_golden_eval_manifest.py   completeness/consistency gate.
#
# golden_eval.kind values:
#   container-smoke  real capability run inside the built image (exercises the
#                    tool's function and checks a real result, not just imports).
#   server-smoke     start the FastAPI service, poll /health, do one real op.
#   entrypoint-smoke container ENTRYPOINT mode that self-reports a result artifact.
#   workflow-smoke   workflow module entrypoint (CLI contract / help) proof.
#   build-import     import/compile proof that heavy deps resolve — foundation
#                    base images only (not a substitute for a capability test).
#
# golden_eval.gpu values: required | optional | none
# golden_eval.status values: ready | gpu-gated | blocked-on-upstream
format: npa_golden_evals_v1

containers:
  base-cuda13-b300:
    image: npa-base
    foundation: true
    dockerfile: npa/docker/workbench/base/cuda13-b300/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Shared CUDA 13 / PyTorch 2.9 foundation image for B300 (Blackwell)
        derivatives (cosmos3-reason, sim2real-*). Not a tool itself.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:13.0.1-cudnn-devel-ubuntu22.04
      network: none
      external_fetch: [pypi, pytorch-cu130, flash-attn-cute]
      notes: >-
        No runtime entrypoint or open ports; build-time only. Pinned digestless
        CUDA base tracked by the weekly Trivy base-image CVE scan.
    golden_eval:
      kind: build-import
      command: 'python -c "import torch; assert torch.cuda.is_available(); import flash_attn"'
      serverless_gpu: b300
      gpu: required
      timeout_seconds: 120
      status: blocked-on-upstream

  groot:
    image: npa-groot
    dockerfile: npa/docker/workbench/groot/Dockerfile
    physical_ai:
      useful: true
      role: >-
        NVIDIA Isaac-GR00T foundation-model deployment and inference for
        humanoid/manipulation policies.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
      network: inference + /health endpoints (internal)
      external_fetch: [github-isaac-gr00t, pypi, huggingface, "pypi.nvidia.com (Isaac paths only, first run, operator EULA)"]
      notes: >-
        Pulls Isaac-GR00T (Apache-2.0) at a pinned commit; inference server should
        stay on the internal workbench namespace, not public ingress. Bakes NO
        NVIDIA Isaac Sim or Isaac Lab: /opt/isaac-lab/venv carries only PyTorch and
        the OSS closure, and Isaac is fetched on first use of /isaac-sim/python.sh
        under the operator's own EULA acceptance. THIS golden eval is unaffected -
        GR00T inference runs in GROOT_VENV and needs no Isaac and no EULA
        acceptance, so it pays no first-run download.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_groot_functional
      env_module: npa.smoke.test_groot_env
      command: python -m npa.smoke.test_groot_functional
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  lerobot:
    image: npa-lerobot
    dockerfile: npa/docker/workbench/lerobot/Dockerfile
    # Default tag = pyproject supported-tools pin (0.5.1). Additional supported
    # tag: 0.6.0 via build.sh --version 0.6.0 / --lerobot-version 0.6.0.
    physical_ai:
      useful: true
      role: >-
        LeRobot policy training/eval/serving (ACT, pusht, libero) — core robot
        manipulation policy workflow. Supported package tags: 0.5.1 (default)
        and 0.6.0 (additional).
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.4.1-devel-ubuntu22.04
      network: FastAPI policy server on :8080
      external_fetch: [pypi, huggingface-datasets]
      notes: >-
        Build-time env smoke baked in (RUN python -m npa.smoke.test_lerobot_env).
        NPA_LEROBOT_VERSION labels the image tag for multi-version smokes.
        Telemetry disabled (HF_HUB_DISABLE_TELEMETRY, WANDB_DISABLED) in smokes.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_lerobot_functional
      env_module: npa.smoke.test_lerobot_env
      command: python -m npa.smoke.test_lerobot_functional
      serverless_gpu: h200
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  lerobot-policy:
    image: npa-lerobot-policy
    dockerfile: npa/docker/workbench/lerobot-policy/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Sim-to-real policy container (serve/train/eval/validate-checkpoint) used
        as the policy stage of the sim-to-real loop.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.4.1-devel-ubuntu22.04
      network: policy serve endpoint
      external_fetch: [pypi]
      notes: >-
        entrypoint.sh exposes check-import/serve/train/eval/validate-checkpoint;
        build asserts lerobot importability.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_lerobot_policy_functional
      command: python -m npa.smoke.test_lerobot_policy_functional
      serverless_gpu: h200
      gpu: optional
      timeout_seconds: 900
      status: gpu-gated

  lerobot-vlm-rl:
    image: npa-lerobot-vlm-rl
    dockerfile: npa/docker/workbench/lerobot-vlm-rl/Dockerfile
    physical_ai:
      useful: true
      role: >-
        VLM-reward-signal RL step for the sim-to-real loop (parses VLM eval
        batches into RL training signals).
    safety:
      runs_as: ubuntu
      base_image: npa-genesis (sm80/sm90/sm120)
      network: none
      external_fetch: [pypi]
      notes: Build asserts parse_vlm_signal_batch import; no open ports.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_lerobot_vlm_rl_functional
      command: python -m npa.smoke.test_lerobot_vlm_rl_functional
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  genesis:
    image: npa-genesis
    dockerfile: npa/docker/workbench/genesis/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Genesis physics simulation + RL teacher training + visual demo
        generation; foundation for sim2real-* images.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.4.1-devel-ubuntu22.04
      network: none (interactive bash)
      external_fetch: [pypi]
      notes: >-
        Headless EGL/DRI rendering limits documented in genesis skill; no server
        process by default. The py3.10 venv has no tomllib/tomli, so
        npa.smoke._versions is stdlib-only by design.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_genesis_functional
      env_module: npa.smoke.test_genesis_env
      command: python -m npa.smoke.test_genesis_functional
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 1200
      status: gpu-gated

  isaac-lab:
    image: npa-isaac-lab
    dockerfile: npa/docker/workbench/isaac-lab/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Isaac Lab RL simulation (headless training/eval), e.g. Isaac-Reach-Franka;
        customer custom-fork support.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
      network: none (interactive bash); first run fetches Isaac from pypi.nvidia.com
      external_fetch: [pypi, "pypi.nvidia.com (first run, operator EULA)", github-isaaclab]
      notes: >-
        Bakes NO NVIDIA Isaac Sim or Isaac Lab. On first use of
        /isaac-sim/python.sh the bootstrap downloads the pinned, sha256-verified
        isaacsim/isaaclab wheels (~4.5 GB) plus the BSD-3 Isaac Lab source tree
        into NPA_ISAAC_CACHE_DIR, and REFUSES (exit 78) unless the operator sets
        both OMNI_KIT_ACCEPT_EULA=YES and ISAACSIM_ACCEPT_EULA=YES. Measured on
        RTX PRO 6000: 111 s cold, 32 ms warm, 10.04 GiB of cache. Pre-warm per
        node/PVC with npa/docker/workbench/common/warm-isaac-cache.yaml. No NGC
        credentials are needed. RT-core/headless routing handled by the workbench.
        The image ships a standalone smoke script (it does not install the npa
        package). Its ENTRYPOINT is bash, so the eval command must be a script
        path -- `python <file>` would be re-parsed as `bash python <file>`.
    golden_eval:
      kind: container-smoke
      command: /isaac-sim/python.sh /opt/npa/docker/workbench/isaac-lab/smoke_functional.py
      # RT cores required: Isaac Lab / SONIC render paths silently produce wrong
      # results or fail on H100/H200, which have none. rtx6000 is also the only
      # RT-core platform the serverless project actually offers (gpu-h100-sxm is
      # not available there at all -- a job requesting it fails with NotFound).
      serverless_gpu: rtx6000
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  cosmos:
    image: npa-cosmos
    dockerfile: npa/docker/workbench/cosmos/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Cosmos world-model serving (text2world video generation) for synthetic
        data / world simulation; default self-hosted VLM workflow image.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.6.3-devel-ubuntu22.04
      network: FastAPI server on :8080 (/health, /infer, /jobs)
      external_fetch: [pypi, huggingface]
      notes: >-
        Ships content-safety guardrail; COSMOS_DISABLE_SAFETY must stay "0" in
        production. Smoke defaults to safety enabled.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_cosmos_functional
      env_module: npa.smoke.test_cosmos_env
      command: python /opt/npa/docker/workbench/cosmos/smoke_functional.py
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  cosmos2-transfer:
    image: npa-cosmos2-transfer
    dockerfile: npa/docker/workbench/cosmos2-transfer/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Cosmos-Transfer2 video-to-video world transfer for sim-to-real
        synthetic data augmentation.
    safety:
      runs_as: ubuntu
      base_image: cosmos transfer runtime (built outside this repo)
      network: transfer/serve endpoint
      external_fetch: [huggingface, s3]
      notes: >-
        Base transfer runtime is built outside this repo; this repo's wrapper
        Dockerfile bakes the real cosmos-transfer2.5 inference venv (Python 3.10 +
        torch cu128 + flash-attn via `uv sync`) so the container can actually run
        transfer. The golden eval runs a real video-to-video transfer on a bundled
        robot control example and asserts a generated video; the gated
        Cosmos-Transfer2.5-2B checkpoints auto-download on first use (HF_TOKEN +
        NVIDIA Open Model License).
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_cosmos2_transfer_functional
      command: bash /opt/cosmos2-transfer/smoke_functional.sh
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 1800
      status: gpu-gated

  cosmos3:
    image: npa-cosmos3
    dockerfile: npa/docker/workbench/cosmos3/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Cosmos 3 omni-model generation (text2image / image2image / text2video /
        image2video / video2video) for synthetic Physical AI data and world
        simulation.
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
      network: none (job entrypoint; npa workbench cosmos3 generate)
      external_fetch: [pypi, pytorch-cu130, github-nvidia-cosmos, huggingface]
      notes: >-
        NO model weights are baked. The image ships OpenMDW-1.1 cosmos-framework
        source at a pinned commit plus its cu130 inference venv; gated Cosmos3
        checkpoints download at runtime under the operator's own HF token (and
        NGC key when NPA_COSMOS3_REQUIRE_NGC=1), and generate refuses to run
        without them. Guardrails are on unless --no-guardrails is passed. The
        golden eval runs a real text2image generation and asserts a decodable
        image.
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_cosmos3_generate_functional
      command: bash /opt/cosmos3/smoke_functional.sh
      serverless_gpu: h100
      gpu: required
      timeout_seconds: 3600
      status: gpu-gated

  cosmos3-reason:
    image: npa-cosmos3-reason
    dockerfile: npa/docker/workbench/cosmos3-reason/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Cosmos-Reason1 VLM reasoning stage of the sim-to-real inner loop
        (rollout scoring / reasoning).
    safety:
      runs_as: ubuntu
      base_image: npa-base:cuda13-b300
      network: none (workflow entrypoint)
      external_fetch: [pypi, huggingface]
      notes: >-
        B300/CUDA13 family currently blocked-on-upstream; inherits base-image
        posture. The golden eval runs a real Cosmos-Reason VLM inference (the same
        run_cosmos_reason_vlm path the sim2real VLM-eval uses) over synthetic
        frames and asserts a structured judgment; gated Cosmos-Reason weights
        auto-download on first use (HF_TOKEN + NVIDIA license).
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_cosmos3_reason_functional
      command: python -m npa.smoke.test_cosmos3_reason_functional
      serverless_gpu: b300
      gpu: required
      timeout_seconds: 1800
      status: blocked-on-upstream

  cosmos-curate:
    image: npa-cosmos-curate
    dockerfile: npa/docker/workbench/cosmos-curate/Dockerfile
    physical_ai:
      useful: true
      role: >-
        NVIDIA Cosmos Curator video curation (clip splitting, transcoding, motion
        scoring, canonical clip metadata) over augmented physical-AI video — the
        curation stage of the Physical AI Data Factory blueprint.
    safety:
      runs_as: ubuntu
      base_image: python:3.12-slim-bookworm
      network: none (mode-based entrypoint; fetch-models mode reaches Hugging Face)
      external_fetch: [pypi, conda-forge, github, huggingface, s3]
      notes: >-
        CPU-only. Bakes a pinned upstream cosmos-curate checkout (Apache-2.0) plus
        the dependency subset its GPU-free stages import, and a conda-forge ffmpeg
        carrying libopenh264 because upstream's transcoding stage accepts only
        libopenh264 or h264_nvenc. torch is the CPU wheel: the motion stage runs
        its CPU code path when no GPU is requested. NO MODEL WEIGHTS ARE BAKED IN;
        the GPU stages' weights (TransNetV2, InternVideo2, Cosmos-Embed1, CLIP,
        Qwen) are third-party or NVIDIA models under their own licenses and are
        downloaded at run time into /config/models by the fetch-models mode using
        the operator's HF_TOKEN. A build-time check fails if any weight file is
        present in the image, and the upstream checkout is fetched with
        GIT_LFS_SKIP_SMUDGE=1.
    golden_eval:
      kind: container-smoke
      command: python /opt/npa/docker/workbench/cosmos-curate/smoke_functional.py
      serverless_gpu: h100
      gpu: none
      timeout_seconds: 900
      status: ready

  cosmos-evaluator:
    image: npa-cosmos-evaluator
    dockerfile: npa/docker/workbench/cosmos-evaluator/Dockerfile
    physical_ai:
      useful: true
      role: >-
        NVIDIA Cosmos Evaluator grading of synthetic/augmented video — the
        hallucinated-motion check and the VLM attribute-verification check that
        gate the Physical AI Data Factory blueprint's augment loop.
    safety:
      runs_as: ubuntu
      base_image: python:3.12-slim-bookworm
      network: >-
        none for the hallucination check; the attribute-verification check calls
        the configured Token Factory endpoint
      external_fetch: [pypi, github, s3]
      notes: >-
        CPU-only and weight-free by construction: the hallucination check is
        classical computer vision, and attribute verification calls a hosted VLM
        (NEBIUS_TOKEN_FACTORY_KEY) rather than loading a model. Upstream's
        objects/obstacle check would need EULA-gated Git-LFS weights, so the
        checkout is fetched with GIT_LFS_SKIP_SMUDGE=1 and that check is not wired;
        a build-time check fails if any weight file is present in the image.
    golden_eval:
      kind: container-smoke
      command: python /opt/npa/docker/workbench/cosmos-evaluator/smoke_functional.py
      serverless_gpu: h100
      gpu: none
      timeout_seconds: 600
      status: ready

  sonic:
    image: npa-sonic
    dockerfile: npa/docker/workbench/sonic/Dockerfile
    physical_ai:
      useful: true
      role: >-
        SONIC whole-body humanoid locomotion policy training/eval/export/serve
        (GR00T-WholeBodyControl).
    safety:
      runs_as: ubuntu
      base_image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04 (baked) / npa-base:cuda13-b300 (k8s)
      network: serve endpoint (when in serve mode); first run fetches Isaac from pypi.nvidia.com
      external_fetch: [github-gear-sonic, pypi, "pypi.nvidia.com (first run, operator EULA)", huggingface]
      notes: >-
        Bakes NO NVIDIA Isaac Sim or Isaac Lab, and no NVIDIA driver userspace
        (the container runtime injects the host driver + Vulkan ICD given
        NVIDIA_DRIVER_CAPABILITIES=all). gear_sonic source is Apache-2.0; its
        weights are NVIDIA Open Model License and downloaded at run time with the
        operator's own HF token. The entrypoint picks its interpreter per mode:
        smoke/eval/train/finetune/serve go through the Isaac bootstrap and so
        require OMNI_KIT_ACCEPT_EULA=YES and ISAACSIM_ACCEPT_EULA=YES, while
        mujoco-eval and the S3/GPU-proof helpers run on the baked venv and need
        neither. Self-reporting entrypoint modes; smoke mode writes
        sonic_smoke_result.json and GPU/image-pull proofs. GPU routing guardrails
        enforced.
    golden_eval:
      kind: entrypoint-smoke
      command: /entrypoint.sh smoke
      artifact: sonic_smoke_result.json
      # RT cores required: Isaac Lab / SONIC render paths silently produce wrong
      # results or fail on H100/H200, which have none. rtx6000 is also the only
      # RT-core platform the serverless project actually offers (gpu-h100-sxm is
      # not available there at all -- a job requesting it fails with NotFound).
      serverless_gpu: rtx6000
      gpu: required
      timeout_seconds: 900
      status: gpu-gated

  sonic-mujoco:
    image: npa-sonic-mujoco
    dockerfile: npa/docker/workbench/sonic/Dockerfile.mujoco
    # A build VARIANT of sonic, not a tool of its own: it is built FROM npa-sonic and
    # resolves through sonic's image manifest, so it is not a CONTAINER_IMAGE_NAMES key.
    # It is still separately built and separately published, with a capability its parent
    # does not exercise, so it gets its own golden eval rather than none at all.
    variant_of: sonic
    # Resolves as container_image_for_tool("sonic", image_variant="mujoco"); sonic's image
    # manifest maps that alias to the sonic-mujoco-h100-mvp entry.
    image_variant: mujoco
    physical_ai:
      useful: true
      role: >-
        MuJoCo evaluation of a SONIC whole-body locomotion checkpoint - the
        cross-simulator check on a policy trained in Isaac Lab, which is where a
        sim-to-sim gap shows up before a sim-to-real one does.
    safety:
      runs_as: ubuntu
      base_image: npa-sonic (inherits its runtime-fetch Isaac architecture)
      network: none (entrypoint mode); downloads a checkpoint from S3 when asked
      external_fetch: [s3]
      notes: >-
        Adds MuJoCo to npa-sonic and no Isaac of its own, so it bakes no NVIDIA
        Isaac Sim or Isaac Lab either. Notably this eval needs NEITHER the Isaac
        download NOR EULA acceptance: mujoco-eval is one of the entrypoint modes
        that runs on the baked venv (see the per-mode interpreter selection in
        sonic/entrypoint.sh), so it is fast and network-free. Its Dockerfile takes
        an explicit ARG NPA_IMAGE_PYTHON precisely so the BUILD cannot accidentally
        invoke the bootstrap shim and bake 4.5 GB of Isaac Sim into a layer.
    golden_eval:
      kind: entrypoint-smoke
      command: /entrypoint.sh mujoco-eval
      artifact: sonic_eval_results.json
      # RT cores required: Isaac Lab / SONIC render paths silently produce wrong
      # results or fail on H100/H200, which have none. rtx6000 is also the only
      # RT-core platform the serverless project actually offers (gpu-h100-sxm is
      # not available there at all -- a job requesting it fails with NotFound).
      serverless_gpu: rtx6000
      gpu: required
      timeout_seconds: 900
      status: gpu-gated

  retargeting:
    image: npa-retargeting
    dockerfile: npa/docker/workbench/retargeting/Dockerfile
    physical_ai:
      useful: true
      role: >-
        CPU motion retargeting / motion-lib conversion for SONIC whole-body
        locomotion (GR00T-WholeBodyControl data_process).
    safety:
      runs_as: ubuntu
      base_image: python:3.11-slim
      network: none (interactive bash)
      external_fetch: [github-gear-sonic, pypi]
      notes: >-
        CPU-only preprocess image; clones a pinned GR00T-WholeBodyControl ref at
        build (auto-fetch disabled at runtime).
    golden_eval:
      kind: container-smoke
      module: npa.smoke.test_retargeting_functional
      command: python -m npa.smoke.test_retargeting_functional
      serverless_gpu: h100
      gpu: none
      timeout_seconds: 120
      status: ready

  fiftyone:
    image: npa-fiftyone
    dockerfile: npa/docker/workbench/fiftyone/Dockerfile
    physical_ai:
      useful: true
      role: >-
        FiftyOne dataset curation and visualization for perception/AV datasets
        (BDD100K, LeRobot episodes).
    safety:
      runs_as: ubuntu
      base_image: python:3.11-slim-trixie
      network: FiftyOne app on :5151
      external_fetch: [pypi, huggingface, s3]
      notes: >-
        CPU-only; app should be exposed via controlled public-access path, not
        bound to 0.0.0.0 without auth. The image ships standalone smoke scripts
        (it does not install the npa package). The golden eval is the env smoke
        (import + version + CLI + app config); the functional smoke is a heavier
        integration test that needs a working MongoDB, which the slim base does
        not provision.
    golden_eval:
      kind: container-smoke
      command: python /opt/npa/docker/workbench/fiftyone/smoke_env.py
      serverless_gpu: h100
      gpu: none
      timeout_seconds: 300
      status: ready

  lancedb:
    image: npa-lancedb
    dockerfile: npa/docker/workbench/lancedb/Dockerfile
    physical_ai:
      useful: true
      role: >-
        LanceDB vector store for AV/perception data (BDD100K import, CLIP
        embeddings, materialized views) feeding curation + detection training.
    safety:
      runs_as: root
      base_image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
      network: FastAPI server on :8686 (/health, /tables, /query)
      external_fetch: [pypi, s3]
      notes: >-
        Server smoke runs entirely on a temp table; no external data required for
        the health/roundtrip golden eval. The image flattens the server modules
        into /app, so the smoke ships there as a standalone script and targets
        npa_lancedb_server:app via LANCEDB_SMOKE_APP.
    golden_eval:
      kind: server-smoke
      module: npa.smoke.test_lancedb_functional
      command: python /app/smoke_functional.py
      serverless_gpu: h100
      gpu: optional
      timeout_seconds: 600
      status: ready

  detection-training:
    image: npa-detection-training
    dockerfile: npa/docker/workbench/detection-training/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Object-detection training/eval service (torchvision + pycocotools) on
        curated AV data; BDD100K perception pipeline stage.
    safety:
      runs_as: root
      base_image: pytorch/pytorch:2.12.1-cuda13.0-cudnn9-runtime
      network: FastAPI service on :8790 (/health, /system-info, /train, /eval)
      external_fetch: [pypi, lancedb, s3]
      notes: >-
        Golden eval exercises health + system-info only; no training run, so it
        stays GPU-optional and fast. The smoke ships as a standalone script in
        /app and targets the in-image service module.
    golden_eval:
      kind: server-smoke
      module: npa.smoke.test_detection_training_functional
      command: python /app/smoke_functional.py
      serverless_gpu: h100
      gpu: optional
      timeout_seconds: 300
      status: ready

