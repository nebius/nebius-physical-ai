apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sonic-export
  description: Train a SONIC locomotion policy, then export it to ONNX.

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/sonic-export"
  sonic_runtime: local
  # See sonic-train.yaml: empty means NVIDIA's terms are NOT accepted.
  sonic_accept_nvidia_eula: ""
  train_iterations: "40"
  data_uri: "s3://{{config.bucket}}/{{config.prefix}}/data/"
  training_uri: "s3://{{config.bucket}}/{{config.prefix}}/training/"

  # Produced by the train stage and consumed by the export stage.
  checkpoint_uri: "{{config.training_uri}}checkpoint.pt"
  onnx_uri: "s3://{{config.bucket}}/{{config.prefix}}/sonic_policy.onnx"

resources:
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 8
    memory: 32Gi

initial: train

states:
  train:
    description: Train a SONIC locomotion policy in this stage's own container.
    toolRef: workbench.sonic.train
    resources: gpu
    outputs:
      - uri: "{{config.checkpoint_uri}}"
        schema: npa.workbench.sonic.checkpoint.v1
    next: export-onnx

  export-onnx:
    description: Export the trained checkpoint to deterministic-action ONNX.
    needs: [train]
    toolRef: workbench.sonic.export
    resources: gpu
    inputs:
      - uri: "{{config.checkpoint_uri}}"
        schema: npa.workbench.sonic.checkpoint.v1
    outputs:
      - uri: "{{config.onnx_uri}}"
        schema: npa.workbench.sonic.onnx.v1
    terminal: true
