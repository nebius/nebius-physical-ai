apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: byof-libero
  description: >
    Private BYOF qualification for the pinned upstream LIBERO behavior-cloning
    path. Runtime-fetches one exact official LIBERO-Spatial demonstration,
    trains the upstream BC-RNN with nonzero optimizer steps, then reloads and
    evaluates it on trajectory-disjoint held-out demonstrations on one B200.
config:
  bucket: example-bucket
  repo_url: "https://github.com/Lifelong-Robot-Learning/LIBERO.git"
  repo_ref: "8f1084e3132a39270c3a13ebe37270a43ece2a01"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: ubuntu
  base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04@sha256:ad6d59a3bbf3e82c1c849c9ac09cfc2a3e0bbb8655042fd899be6681b3fe2a85"
  source_prune_path: "libero/libero/assets"
  build_command: >
    apt-get update &&
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    python3 python3-dev python3-pip python3-venv git ca-certificates
    libgl1 libglib2.0-0 &&
    rm -rf /var/lib/apt/lists/* &&
    python3 -m venv /opt/venv &&
    /opt/venv/bin/python -m pip install --no-cache-dir --upgrade pip setuptools wheel &&
    /opt/venv/bin/python -m pip install --no-cache-dir
    torch==2.7.1 torchvision==0.22.1
    --index-url https://download.pytorch.org/whl/cu128 &&
    /opt/venv/bin/python -m pip install --no-cache-dir
    -r requirements.txt 'boto3>=1.34' &&
    /opt/venv/bin/python -m pip install --no-cache-dir -e . &&
    printf '%s\n'
    '#include <cuda_runtime.h>'
    '#include <cstdio>'
    'int main(){cudaDeviceProp p{}; if(cudaGetDeviceProperties(&p,0)!=cudaSuccess)return 2; std::printf("%s cc=%d.%d\\n",p.name,p.major,p.minor); return (p.major==10 && p.minor==0)?0:3;}'
    > /tmp/npa-libero-sm100.cu &&
    nvcc -O2 -arch=sm_100 /tmp/npa-libero-sm100.cu
    -o /usr/local/bin/npa-libero-sm100-probe &&
    rm /tmp/npa-libero-sm100.cu
  workload: solution-smoke
  smoke_command: |
    export LIBERO_DATA_CACHE="/workspace/libero-cache/${NPA_BYOF_RUN_ID}"
    mkdir -p "${LIBERO_DATA_CACHE}"
    /opt/venv/bin/python - <<'PY'
    from __future__ import annotations

    import gc
    import hashlib
    import json
    import os
    import platform
    import re
    import ssl
    import subprocess
    import urllib.request
    from pathlib import Path

    import h5py
    import numpy as np
    import torch
    from hydra import compose, initialize_config_dir
    from omegaconf import OmegaConf, open_dict
    from torch.utils.data import DataLoader

    from libero.lifelong.algos.base import Sequential
    from libero.lifelong.datasets import SequenceVLDataset, get_dataset
    from libero.lifelong.utils import control_seed, torch_load_model, torch_save_model

    SOURCE_REPOSITORY = "https://github.com/Lifelong-Robot-Learning/LIBERO"
    SOURCE_CLONE_URL = SOURCE_REPOSITORY + ".git"
    SOURCE_REF = "8f1084e3132a39270c3a13ebe37270a43ece2a01"
    SOURCE_PRUNE_PATH = "libero/libero/assets"
    DATASET_REPOSITORY = "yifengzhu-hf/LIBERO-datasets"
    DATASET_REVISION = "f13aa24a3da8c43c7225569f28c562979fa0e35a"
    SUITE = "libero_spatial"
    TASK = "pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate"
    TASK_DESCRIPTION = "pick up the black bowl between the plate and the ramekin and place it on the plate"
    DATASET_FILE = f"{TASK}_demo.hdf5"
    DATASET_URL = (
        "https://huggingface.co/datasets/yifengzhu-hf/LIBERO-datasets/resolve/"
        f"{DATASET_REVISION}/{SUITE}/{DATASET_FILE}?download=true"
    )
    DATASET_SHA256 = "ff6f26121653c77280eb40a38773a74141c11a8509f3466058cb56dd2cc60ead"
    DATASET_SIZE = 508779600
    BDDL_RELATIVE = f"libero/libero/bddl_files/{SUITE}/{TASK}.bddl"
    BDDL_SHA256 = "9b59eb1287802868ad9bc78d58e6d36d4ba31134e679cfdbdf4b0feb660c959b"
    INIT_RELATIVE = f"libero/libero/init_files/{SUITE}/{TASK}.init"
    INIT_SHA256 = "c3a6a01fdc53ae1914fe24c8935088d723baee8f6ee3cd5f8d68e86aea3e2f1c"
    BUILD_COMMAND_SHA256 = "b26108d20e6f91ea2627339895dc453f1e4eecab9bfc7524c43c920bff94b32f"
    CAPABILITY = "libero_spatial_bc_rnn_train_reload_heldout"
    CAPABILITIES = {
        "libero_official_demo_sha256",
        "libero_trajectory_disjoint_heldout_split",
        CAPABILITY,
    }
    TRAIN_STEPS = 8
    SPLIT_SEED = 20260910

    output_dir = Path(os.environ["NPA_SMOKE_OUTPUT_DIR"])
    output_dir.mkdir(parents=True, exist_ok=True)
    artifact = output_dir / "libero-smoke.json"
    result = {
        "schema": "npa.workbench.libero.bc-smoke.v1",
        "status": "failed",
        "exit_status": 1,
        "solution": "libero",
        "capability": CAPABILITY,
        "capabilities_exercised": sorted(CAPABILITIES),
        "source": {
            "repository": SOURCE_REPOSITORY,
            "revision": SOURCE_REF,
            "license": "MIT",
        },
        "dataset": {
            "repository": DATASET_REPOSITORY,
            "revision": DATASET_REVISION,
            "suite": SUITE,
            "task": TASK,
            "task_description": TASK_DESCRIPTION,
            "url": DATASET_URL,
            "expected_sha256": DATASET_SHA256,
            "expected_size_bytes": DATASET_SIZE,
            "license": "CC-BY-4.0",
            "attribution": "LIBERO, Lifelong Robot Learning",
        },
    }


    def sha256_path(path: Path) -> str:
        digest = hashlib.sha256()
        with path.open("rb") as stream:
            for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                digest.update(chunk)
        return digest.hexdigest()


    def canonical_ids_sha256(values: list[str]) -> str:
        return hashlib.sha256(("\n".join(values) + "\n").encode()).hexdigest()


    def download_verified(path: Path) -> tuple[str, bool]:
        if path.exists() and path.stat().st_size == DATASET_SIZE:
            observed = sha256_path(path)
            if observed == DATASET_SHA256:
                return observed, False
        partial = path.with_suffix(path.suffix + ".partial")
        partial.unlink(missing_ok=True)
        digest = hashlib.sha256()
        size = 0
        with urllib.request.urlopen(DATASET_URL) as response, partial.open("wb") as stream:
            while True:
                chunk = response.read(1024 * 1024)
                if not chunk:
                    break
                stream.write(chunk)
                digest.update(chunk)
                size += len(chunk)
        observed = digest.hexdigest()
        if size != DATASET_SIZE or observed != DATASET_SHA256:
            partial.unlink(missing_ok=True)
            raise RuntimeError(
                f"LIBERO dataset identity mismatch: size={size}, sha256={observed}"
            )
        partial.replace(path)
        return observed, True


    def observe_own_pod_image(expected_digest: str) -> dict[str, str]:
        service_account = Path("/var/run/secrets/kubernetes.io/serviceaccount")
        token_path = service_account / "token"
        namespace_path = service_account / "namespace"
        ca_path = service_account / "ca.crt"
        pod_name = os.environ.get("HOSTNAME", "").strip()
        if not token_path.is_file() or not namespace_path.is_file() or not pod_name:
            raise RuntimeError("Kubernetes pod identity is unavailable inside the workload")
        namespace = namespace_path.read_text(encoding="utf-8").strip()
        token = token_path.read_text(encoding="utf-8").strip()
        request = urllib.request.Request(
            f"https://kubernetes.default.svc/api/v1/namespaces/{namespace}/pods/{pod_name}",
            headers={"Authorization": f"Bearer {token}"},
        )
        context = ssl.create_default_context(cafile=str(ca_path))
        try:
            with urllib.request.urlopen(request, context=context) as response:
                pod = json.load(response)
        except Exception as exc:
            raise RuntimeError("Kubernetes API did not permit observation of the workload pod") from exc
        statuses = pod.get("status", {}).get("containerStatuses", [])
        image_ids = [str(item.get("imageID", "")) for item in statuses]
        matching = [image_id for image_id in image_ids if expected_digest in image_id]
        if len(matching) != 1:
            raise RuntimeError(
                f"expected one pod container with image digest {expected_digest}, got {len(matching)}"
            )
        observed_digests = re.findall(r"sha256:[0-9a-f]{64}", matching[0])
        if observed_digests != [expected_digest]:
            raise RuntimeError(
                f"pod imageID did not contain exactly the requested digest: {matching[0]!r}"
            )
        return {
            "pod_observed_image_digest": observed_digests[0],
            "observation_method": "kubernetes_status_containerStatuses_imageID",
            "pod_name_sha256": hashlib.sha256(pod_name.encode()).hexdigest(),
            "namespace_sha256": hashlib.sha256(namespace.encode()).hexdigest(),
        }


    def write_result() -> None:
        artifact.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        print(json.dumps(result, sort_keys=True), flush=True)


    try:
        runtime_image = os.environ.get("BYOF_IMAGE", "")
        if not re.fullmatch(r".+@sha256:[0-9a-f]{64}", runtime_image):
            raise RuntimeError("LIBERO workload image must be an immutable repository@sha256 reference")
        expected_image_digest = runtime_image.rsplit("@", 1)[1]

        repo_root = Path(os.environ["BYOF_REPO_ROOT"])
        source_metadata = json.loads(
            (repo_root / "npa_source_metadata.json").read_text(encoding="utf-8")
        )
        if source_metadata != {
            "source": "oss-byof",
            "repo": SOURCE_CLONE_URL,
            "ref": SOURCE_REF,
            "commit": SOURCE_REF,
            "source_prune_path": SOURCE_PRUNE_PATH,
            "git_objects_removed": True,
        }:
            raise RuntimeError(f"unexpected built source metadata: {source_metadata}")
        observed_source_revision = str(source_metadata["commit"])
        if observed_source_revision != SOURCE_REF:
            raise RuntimeError("built LIBERO checkout does not match the pinned source revision")
        build_metadata = json.loads(
            (repo_root / "npa_build_metadata.json").read_text(encoding="utf-8")
        )
        if (
            build_metadata.get("schema") != "npa.byof.build.v1"
            or build_metadata.get("build_command_executed") is not True
            or build_metadata.get("build_command_sha256") != BUILD_COMMAND_SHA256
        ):
            raise RuntimeError(f"build command execution metadata is invalid: {build_metadata}")

        bddl_path = repo_root / BDDL_RELATIVE
        init_path = repo_root / INIT_RELATIVE
        observed_bddl_sha256 = sha256_path(bddl_path)
        observed_init_sha256 = sha256_path(init_path)
        if observed_bddl_sha256 != BDDL_SHA256 or observed_init_sha256 != INIT_SHA256:
            raise RuntimeError("pinned LIBERO task assets do not match their reviewed hashes")

        if torch.cuda.device_count() != 1:
            raise RuntimeError(f"expected exactly one visible GPU, got {torch.cuda.device_count()}")
        gpu_name = torch.cuda.get_device_name(0)
        compute_capability = tuple(torch.cuda.get_device_capability(0))
        if "B200" not in gpu_name.upper() or compute_capability != (10, 0):
            raise RuntimeError(
                f"expected one B200 with sm_100, got {gpu_name!r} cc={compute_capability}"
            )
        torch_arches = torch.cuda.get_arch_list()
        if "sm_100" not in torch_arches:
            raise RuntimeError(f"PyTorch does not contain sm_100 support: {torch_arches}")
        sm100_probe = subprocess.run(
            ["/usr/local/bin/npa-libero-sm100-probe"],
            check=True,
            capture_output=True,
            text=True,
        ).stdout.strip()
        cuobjdump = subprocess.run(
            ["cuobjdump", "--list-elf", "/usr/local/bin/npa-libero-sm100-probe"],
            check=True,
            capture_output=True,
            text=True,
        )
        cuda_elf = "\n".join((cuobjdump.stdout, cuobjdump.stderr)).strip()
        if "sm_100" not in cuda_elf.lower():
            raise RuntimeError(f"compiled CUDA probe lacks sm_100 ELF: {cuda_elf!r}")
        smi_rows = subprocess.run(
            ["nvidia-smi", "--query-gpu=index,name,driver_version", "--format=csv,noheader"],
            check=True,
            capture_output=True,
            text=True,
        ).stdout.strip().splitlines()
        if len(smi_rows) != 1 or "B200" not in smi_rows[0].upper():
            raise RuntimeError(f"nvidia-smi did not prove exactly one B200: {smi_rows!r}")
        image_observation = observe_own_pod_image(expected_image_digest)

        cache_dir = Path(os.environ["LIBERO_DATA_CACHE"]) / DATASET_REVISION
        cache_dir.mkdir(parents=True, exist_ok=True)
        dataset_path = cache_dir / DATASET_FILE
        if output_dir == cache_dir or output_dir in cache_dir.parents or cache_dir in output_dir.parents:
            raise RuntimeError("LIBERO cache and smoke output boundaries overlap")
        observed_dataset_sha256, downloaded = download_verified(dataset_path)

        with h5py.File(dataset_path, "r") as hdf5:
            data_group = hdf5["data"]
            demo_ids = sorted(data_group.keys(), key=lambda value: int(value[5:]))
            sample_count = sum(int(data_group[demo].attrs["num_samples"]) for demo in demo_ids)
            dataset_bddl = str(data_group.attrs.get("bddl_file_name", ""))
            problem_info = json.loads(str(data_group.attrs.get("problem_info", "{}")))
            if len(demo_ids) != 50 or sample_count != 5068:
                raise RuntimeError(
                    f"unexpected official demo inventory: demos={len(demo_ids)}, samples={sample_count}"
                )
            if dataset_bddl != BDDL_RELATIVE or problem_info.get("language_instruction") != TASK_DESCRIPTION:
                raise RuntimeError("downloaded demonstration is not bound to the selected LIBERO task")

        heldout_ranked = sorted(
            demo_ids,
            key=lambda demo: hashlib.sha256(f"{SPLIT_SEED}:{demo}".encode()).hexdigest(),
        )
        heldout_demo_ids = sorted(heldout_ranked[:10], key=lambda value: int(value[5:]))
        train_demo_ids = sorted(set(demo_ids) - set(heldout_demo_ids), key=lambda value: int(value[5:]))
        if set(train_demo_ids) & set(heldout_demo_ids):
            raise RuntimeError("LIBERO train and held-out trajectory ids overlap")

        observation_modalities = {
            "rgb": ["agentview_rgb"],
            "depth": [],
            "low_dim": ["gripper_states", "joint_states"],
        }
        train_sequence, shape_meta = get_dataset(
            str(dataset_path),
            observation_modalities,
            seq_len=4,
            frame_stack=1,
            hdf5_cache_mode="low_dim",
        )
        train_sequence.load_demo_info(demos=train_demo_ids)
        heldout_sequence, heldout_shape_meta = get_dataset(
            str(dataset_path),
            observation_modalities,
            seq_len=4,
            frame_stack=1,
            hdf5_cache_mode="low_dim",
        )
        heldout_sequence.load_demo_info(demos=heldout_demo_ids)
        if shape_meta != heldout_shape_meta:
            raise RuntimeError("train and held-out LIBERO shape metadata differ")

        embedding_bytes = hashlib.sha256(TASK_DESCRIPTION.encode()).digest()
        task_embedding = torch.tensor(
            np.resize(np.frombuffer(embedding_bytes, dtype=np.uint8), 768) / 127.5 - 1.0,
            dtype=torch.float32,
        )
        train_dataset = SequenceVLDataset(train_sequence, task_embedding)
        heldout_dataset = SequenceVLDataset(heldout_sequence, task_embedding)
        if len(train_dataset) <= 0 or len(heldout_dataset) <= 0:
            raise RuntimeError("trajectory-disjoint split produced an empty partition")

        config_dir = repo_root / "libero" / "configs"
        with initialize_config_dir(config_dir=str(config_dir), version_base=None):
            cfg = compose(config_name="config", overrides=["policy=bc_rnn_policy"])
        with open_dict(cfg):
            cfg.device = "cuda"
            cfg.experiment_dir = str(output_dir / "experiment")
            cfg.train.use_augmentation = False
            cfg.train.batch_size = 8
            cfg.train.num_workers = 0
            cfg.train.scheduler = None
            cfg.policy.image_embed_size = 32
            cfg.policy.text_embed_size = 16
            cfg.policy.rnn_hidden_size = 128
            cfg.policy.rnn_num_layers = 1
            cfg.policy.policy_head.network_kwargs.hidden_size = 128
            cfg.policy.policy_head.network_kwargs.num_layers = 1
            cfg.policy.policy_head.network_kwargs.num_modes = 3
            cfg.policy.language_encoder.network_kwargs.input_size = 768
            cfg.shape_meta = OmegaConf.create(
                {
                    "ac_dim": int(shape_meta["ac_dim"]),
                    "all_obs_keys": list(shape_meta["all_obs_keys"]),
                    "all_shapes": {
                        key: [int(item) for item in value]
                        for key, value in shape_meta["all_shapes"].items()
                    },
                }
            )

        control_seed(SPLIT_SEED)
        algorithm = Sequential(n_tasks=1, cfg=cfg).to("cuda")
        algorithm.start_task(0)
        first_parameter = next(parameter for parameter in algorithm.policy.parameters() if parameter.requires_grad)
        parameter_before = first_parameter.detach().clone()
        train_loader = DataLoader(
            train_dataset,
            batch_size=cfg.train.batch_size,
            shuffle=True,
            num_workers=0,
            generator=torch.Generator().manual_seed(SPLIT_SEED),
        )
        train_iterator = iter(train_loader)
        train_losses = []
        for _ in range(TRAIN_STEPS):
            try:
                batch = next(train_iterator)
            except StopIteration:
                train_iterator = iter(train_loader)
                batch = next(train_iterator)
            train_losses.append(float(algorithm.observe(batch)))
        parameter_delta = float((first_parameter.detach() - parameter_before).abs().max().cpu())
        optimizer_steps = [
            int(state["step"].item())
            for state in algorithm.optimizer.state.values()
            if "step" in state
        ]
        observed_optimizer_steps = max(optimizer_steps, default=0)
        training_losses_finite = bool(np.isfinite(train_losses).all())
        if (
            observed_optimizer_steps != TRAIN_STEPS
            or not np.isfinite(parameter_delta)
            or parameter_delta <= 0
            or not training_losses_finite
        ):
            raise RuntimeError(
                f"optimizer proof failed: steps={observed_optimizer_steps}, delta={parameter_delta}"
            )

        checkpoint_path = output_dir / "libero-bc-rnn-smoke.pth"
        torch_save_model(algorithm.policy, checkpoint_path, cfg=None)
        checkpoint_sha256 = sha256_path(checkpoint_path)
        del algorithm, parameter_before
        gc.collect()
        torch.cuda.empty_cache()

        reloaded = Sequential(n_tasks=1, cfg=cfg).to("cuda")
        state_dict, saved_cfg, previous_masks = torch_load_model(
            checkpoint_path, map_location="cuda"
        )
        if saved_cfg is not None or previous_masks is not None:
            raise RuntimeError("smoke checkpoint unexpectedly persisted external training state")
        reloaded.policy.load_state_dict(state_dict, strict=True)
        reloaded.policy.eval()

        heldout_loader = DataLoader(
            heldout_dataset,
            batch_size=16,
            shuffle=False,
            num_workers=0,
        )
        heldout_loss_sum = 0.0
        heldout_evaluated_samples = 0
        action_prediction_digest = hashlib.sha256()
        action_shape = None
        action_dtype = None
        action_value_min = float("inf")
        action_value_max = float("-inf")
        all_actions_finite = True
        with torch.no_grad():
            for batch in heldout_loader:
                batch_size = int(batch["actions"].shape[0])
                batch = reloaded.map_tensor_to_device(batch)
                loss = reloaded.policy.compute_loss(batch)
                distribution = reloaded.policy.forward(batch)
                actions = distribution.mean
                heldout_loss_sum += float(loss.item()) * batch_size
                heldout_evaluated_samples += batch_size
                if action_shape is None:
                    action_shape = list(actions.shape)
                    action_dtype = str(actions.dtype).removeprefix("torch.")
                actions_cpu = actions.detach().cpu().contiguous()
                action_prediction_digest.update(actions_cpu.numpy().tobytes())
                action_value_min = min(action_value_min, float(actions_cpu.min().item()))
                action_value_max = max(action_value_max, float(actions_cpu.max().item()))
                all_actions_finite = all_actions_finite and bool(torch.isfinite(actions).all().item())
        heldout_loss = heldout_loss_sum / heldout_evaluated_samples
        if not np.isfinite(heldout_loss) or not all_actions_finite or not action_shape:
            raise RuntimeError("reloaded held-out evaluation produced invalid loss or actions")
        if action_shape[-1] != int(shape_meta["ac_dim"]):
            raise RuntimeError(f"unexpected reloaded action shape: {action_shape}")

        result.update(
            {
                "status": "passed",
                "exit_status": 0,
                "sample_count": sample_count,
                "dataset": {
                    **result["dataset"],
                    "observed_sha256": observed_dataset_sha256,
                    "observed_size_bytes": dataset_path.stat().st_size,
                    "downloaded_this_run": downloaded,
                    "demo_count": len(demo_ids),
                    "sample_count": sample_count,
                    "dataset_bddl_path": dataset_bddl,
                },
                "source": {
                    **result["source"],
                    "observed_revision": observed_source_revision,
                },
                "task_assets": {
                    "bddl_path": BDDL_RELATIVE,
                    "bddl_sha256": observed_bddl_sha256,
                    "initial_states_path": INIT_RELATIVE,
                    "initial_states_sha256": observed_init_sha256,
                    "source_license": "MIT",
                },
                "split": {
                    "strategy": "deterministic_trajectory_disjoint_sha256_rank",
                    "seed": SPLIT_SEED,
                    "disjoint": True,
                    "train_demo_count": len(train_demo_ids),
                    "heldout_demo_count": len(heldout_demo_ids),
                    "train_demo_ids_sha256": canonical_ids_sha256(train_demo_ids),
                    "heldout_demo_ids_sha256": canonical_ids_sha256(heldout_demo_ids),
                    "train_sample_count": len(train_dataset),
                    "heldout_sample_count": len(heldout_dataset),
                },
                "training": {
                    "algorithm": "upstream_libero_Sequential.observe_BCRNNPolicy.compute_loss",
                    "optimizer": str(cfg.train.optimizer.name),
                    "optimizer_steps": observed_optimizer_steps,
                    "requested_optimizer_steps": TRAIN_STEPS,
                    "parameter_max_abs_delta": parameter_delta,
                    "first_loss": train_losses[0],
                    "final_loss": train_losses[-1],
                    "all_losses_finite": training_losses_finite,
                    "sequence_length": 4,
                    "task_embedding": "deterministic_single_task_768d_sha256",
                },
                "heldout_metrics": {
                    "negative_log_likelihood": heldout_loss,
                    "evaluated_sample_count": heldout_evaluated_samples,
                    "partition": "heldout_trajectories_only",
                },
                "checkpoint": {
                    "file": checkpoint_path.name,
                    "sha256": checkpoint_sha256,
                    "saved_with": "libero.lifelong.utils.torch_save_model",
                    "reloaded_with": "libero.lifelong.utils.torch_load_model",
                    "strict_state_dict_load": True,
                },
                "reloaded_action": {
                    "shape": action_shape,
                    "dtype": action_dtype,
                    "finite": all_actions_finite,
                    "prediction_sha256": action_prediction_digest.hexdigest(),
                    "value_min": action_value_min,
                    "value_max": action_value_max,
                    "evaluated_sample_count": heldout_evaluated_samples,
                },
                "runtime": {
                    "gpu_model": gpu_name,
                    "gpu_architecture": "sm_100",
                    "compute_capability": list(compute_capability),
                    "gpu_count": torch.cuda.device_count(),
