name: Image Security Scan

on:
  pull_request:
    paths:
      - "npa/docker/workbench/**"
      - "npa/scripts/scan_image_omniverse_payload.py"
      - "**/Dockerfile*"
      - ".trivyignore"
      - "trivy.yaml"
      - ".github/workflows/image-security-scan.yml"
  push:
    branches:
      - main
  schedule:
    # Weekly scan catches newly-disclosed CVEs in existing pinned bases.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      omniverse_payload_scan_image:
        description: >-
          Image reference to scan for a baked NVIDIA Omniverse Kit payload, e.g.
          cr.eu-north1.nebius.cloud/<registry-id>/npa-isaac-lab:2.3.2.post1. Needs pull
          access to that registry. Leave blank to skip.
        required: false
        default: ""

permissions:
  contents: read
  security-events: write

jobs:
  tag-strategy-check:
    name: Two-tag strategy consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Run tag consistency check
        run: python npa/docker/workbench/check_tag_consistency.py

  # The four Isaac images are publicly redistributable only because they contain no
  # NVIDIA Omniverse Kit payload. That claim is about bytes in layers, so the classifier
  # is unit-tested on every PR (below) and the live scan can be dispatched against a
  # pushed image, which needs registry credentials and multi-GB pulls.
  omniverse-payload-classifier:
    name: Omniverse payload classifier (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # npa/tests/conftest.py imports httpx and several npa modules, so the
      # package itself has to be installed -- pytest + PyYAML alone abort
      # collection. Mirrors the install in test.yml.
      - name: Install npa with test deps
        run: cd npa && pip install -e ".[dev]"

      - name: Payload-scanner classifier and packaging-guard mutation tests
        run: |
          python -m pytest \
            npa/tests/docker/test_image_payload_scan.py \
            npa/tests/docker/test_packaging_contract.py \
            npa/tests/docker/test_isaac_bootstrap.py \
            -q

  omniverse-payload-scan:
    name: Omniverse payload scan (built image)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.omniverse_payload_scan_image != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Scan the built image for a baked Omniverse Kit payload
        run: |
          python npa/scripts/scan_image_omniverse_payload.py \
            "${{ inputs.omniverse_payload_scan_image }}" \
            --json omniverse-payload-report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniverse-payload-report
          path: omniverse-payload-report.json

  dockerfile-static-scan:
    name: Static Dockerfile scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy config scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif

      - name: Upload config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  base-image-cve-scan:
    name: Base image CVE scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvidia-cuda-12-4-1-devel-ubuntu22-04
            image: nvidia/cuda:12.4.1-devel-ubuntu22.04@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5
            purge_linux_libc_dev: true
          - name: nvidia-cuda-12-6-3-devel-ubuntu22-04
            image: nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
            purge_linux_libc_dev: true
          - name: nvidia-cuda-12-8-1-cudnn-devel-ubuntu22-04
            image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04@sha256:ad6d59a3bbf3e82c1c849c9ac09cfc2a3e0bbb8655042fd899be6681b3fe2a85
            purge_linux_libc_dev: true
          - name: nvidia-cuda-13-0-2-cudnn-devel-ubuntu24-04
            image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04@sha256:e071e85c52ad91fc9ea24158ff5330876b2d1a5c4ac83ccc6066976835873c01
            purge_linux_libc_dev: true
          - name: python-3-11-slim-trixie
            image: python:3.11-slim-trixie@sha256:a3ab0b966bc4e91546a033e22093cb840908979487a9fc0e6e38295747e49ac0
            purge_linux_libc_dev: false
    steps:
      - name: Resolve scan target
        id: scan-target
        shell: bash
        run: |
          if [ "${{ matrix.purge_linux_libc_dev }}" = "true" ]; then
            patched_image="npa-base-scan:${{ matrix.name }}"
            docker build \
              --build-arg BASE_IMAGE="${{ matrix.image }}" \
              -t "${patched_image}" \
              -f - . <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          USER root
          RUN dpkg --purge --force-depends linux-libc-dev \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
            echo "image=${patched_image}" >> "${GITHUB_OUTPUT}"
          else
            echo "image=${{ matrix.image }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          format: table

      - name: Trivy image scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
