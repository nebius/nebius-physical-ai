name: Test

on:
  workflow_call:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The parent PR gate cancels a superseded candidate atomically. Scheduled and
  # manual compatibility audits retain their complete results for diagnosis.
  group: test-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: test-scope
    runs-on: ubuntu-latest
    outputs:
      prose_only: ${{ steps.scope.outputs.prose_only }}
      full_suite: ${{ steps.scope.outputs.full_suite }}
      browser: ${{ steps.scope.outputs.browser }}
      test_paths: ${{ steps.scope.outputs.test_paths }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check CI dependency pins
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python npa/scripts/ci_requirements.py --check
      - name: Select tests using the trusted base policy
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python -m venv npa/.venv
          policy=npa/scripts/ci_test_scope.py
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            git rev-parse --verify "${BASE_SHA}^{commit}"
            if git cat-file -e "${BASE_SHA}:${policy}"; then
              git show "${BASE_SHA}:${policy}" > "${RUNNER_TEMP}/ci_test_scope.py"
              npa/.venv/bin/python "${RUNNER_TEMP}/ci_test_scope.py" \
                --base "$BASE_SHA" --head "$GITHUB_SHA" --event "$EVENT_NAME" \
                --github-output "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Missing base policy and periodic audits both retain all coverage.
          {
            echo 'prose_only=false'
            echo 'full_suite=true'
            echo 'browser=true'
            echo 'test_paths=[]'
          } >> "$GITHUB_OUTPUT"

  browser-mocked:
    name: browser-and-compatibility
    needs: scope
    if: needs.scope.outputs.browser != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up cached uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: browser
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npa/tests/browser/package-lock.json
      - name: Install browser test dependencies
        run: npm ci --prefix npa/tests/browser
      - name: Set up Python for the production UI renderer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the production UI renderer
        run: |
          python -m venv npa/.venv
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e npa
      - name: Run mocked agent Cypress coverage
        run: npm run --prefix npa/tests/browser cy:mock

      - name: Set up Python 3.10 compatibility
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Python 3.10 compatibility environment
        if: github.event_name != 'pull_request'
        run: |
          python -m venv npa/.venv-3.10
          uv pip install --python npa/.venv-3.10/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"

      - name: Run Python 3.10 compatibility regressions
        if: github.event_name != 'pull_request'
        run: |
          npa/.venv-3.10/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

      - name: Set up Python 3.14 compatibility
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Python 3.14 compatibility environment
        if: github.event_name != 'pull_request'
        run: |
          python -m venv npa/.venv-3.14
          uv pip install --python npa/.venv-3.14/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"

      - name: Run Python 3.14 compatibility regressions
        if: github.event_name != 'pull_request'
        run: |
          npa/.venv-3.14/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

  pr-smoke:
    name: pr-smoke
    needs: scope
    if: github.event_name == 'pull_request' || needs.scope.outputs.prose_only == 'true'
    runs-on: ubuntu-latest
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up cached uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: python-3.12
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the fast validation environment
        run: |
          python -m venv npa/.venv
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"
          echo "${GITHUB_WORKSPACE}/npa/.venv/bin" >> "$GITHUB_PATH"

      - name: Run smoke and CI contract regressions
        run: |
          npa/.venv/bin/python -m pytest \
            npa/tests/smoke \
            npa/tests/test_ci_sharding.py \
            npa/tests/test_ci_requirements.py \
            npa/tests/test_ci_timing_report.py \
            npa/tests/test_ci_test_scope.py \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

      - name: Run CLI install test
        run: cd npa && bash tests/integration/test_cli_install.sh

      - name: Warn on source drift
        if: always()
        run: ./scripts/check-source-drift.sh

  test:
    name: pytest-${{ matrix.python-version }}-shard-${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.full_suite != 'false'
    runs-on: ubuntu-latest
    strategy:
      # A merge candidate releases the remaining runners after a hard failure.
      # Scheduled/manual audits keep every compatibility result for diagnosis.
      fail-fast: ${{ github.event_name == 'merge_group' || github.event_name == 'pull_request' }}
      matrix:
        # Candidates needing the full suite use the primary interpreter.
        # Scheduled/manual audits keep all supported versions.
        python-version: ${{ fromJSON(contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && '["3.12"]' || '["3.10", "3.12", "3.14"]') }}
        # Candidates use one extra shard to keep feedback prompt.
        # The periodic three-version audit retains four per interpreter.
        shard: ${{ fromJSON(contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && '[1, 2, 3, 4, 5]' || '[1, 2, 3, 4]') }}
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
      NPA_E2E_PROJECT_ID: project-test-00000000
      NPA_E2E_GROOT_BUCKET: test-bucket-00000000
      NPA_CI_SHARD_INDEX: ${{ matrix.shard }}
      NPA_CI_TOTAL_SHARDS: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 5 || 4 }}
      COVERAGE_FILE: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
      NPA_CI_TIMING_OUTPUT: ci-timings-${{ matrix.python-version }}-${{ matrix.shard }}.json
      # The LTX-2.5 output validator decides whether a GPU run produced anything
      # worth keeping, and its tests skip themselves when ffmpeg is absent. On a
      # runner without ffmpeg that decision would go untested while the suite
      # still reported green, so require it here and fail loudly instead.
      NPA_REQUIRE_FFMPEG: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up cached uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in

      - name: Install ffmpeg
        # Runner vendor repositories (such as Chrome) can publish inconsistent
        # indexes. Media-validator prerequisites come from Ubuntu's signed sources.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install npa
        run: |
          python -m venv npa/.venv
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"
          echo "${GITHUB_WORKSPACE}/npa/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Python compatibility and image scan regressions
        if: matrix.shard == 1
        env:
          NPA_CI_SHARD_INDEX: 1
          NPA_CI_TOTAL_SHARDS: 1
        run: |
          npa/.venv/bin/python -m pytest \
            npa/tests/guardrails/test_ci_workflows.py \
            npa/tests/docker/test_base_image_scan.py \
            npa/tests/orchestration/skypilot/test_workflow_logs.py \
            npa/tests/workbench/test_cosmos3_nano_video_server.py \
            -q

      - name: Install CPU checkpoint and export test runtime
        # Detector contract regressions exercise real tensor serialization and
        # Lance dataloaders. Installing torch also activates SONIC ONNX export
        # tests, so install their supported extra after selecting CPU wheels.
        run: |
          uv pip install --python npa/.venv/bin/python --torch-backend cpu \
            -c npa/ci/requirements.txt -e "npa[sonic]"
          npa/.venv/bin/python -c "import torch, onnx, onnxscript, onnxruntime; assert torch.version.cuda is None"

      - name: Verify checked-out CLI flags
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: |
          cd npa
          git rev-parse HEAD
          .venv/bin/python - <<'PY'
          from pathlib import Path

          from click.utils import strip_ansi
          import npa
          from npa.cli.main import app
          from typer.testing import CliRunner

          module_path = Path(npa.__file__).resolve()
          print(f"npa module: {module_path}")

          runner = CliRunner()
          checks = [
              (["workbench", "fiftyone", "load-dataset", "--help"], "--format"),
              (["workbench", "lerobot", "deploy", "--help"], "--disk-size"),
              (["workbench", "genesis", "deploy", "--help"], "--disk-size"),
              (["workbench", "isaac-lab", "deploy", "--help"], "--disk-size"),
              (["workbench", "cosmos", "deploy", "--help"], "--disk-size"),
              (["workbench", "fiftyone", "deploy", "--help"], "--disk-size"),
          ]
          for args, flag in checks:
              result = runner.invoke(app, args)
              output = strip_ansi(result.output)
              if result.exit_code != 0:
                  raise SystemExit(
                      f"{' '.join(args)} failed with exit code {result.exit_code}\n{output}"
                  )
              if flag not in output:
                  raise SystemExit(
                      f"{flag} missing from {' '.join(args)} help output\n{output}"
                  )
          PY

      - name: Run pytest coverage shard
        run: |
          cd npa
          .venv/bin/python -m pytest tests/ -n auto --dist worksteal \
            --cov=src/npa --cov-report=

      - name: Upload coverage shard
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: npa/.coverage.${{ matrix.python-version }}.${{ matrix.shard }}
          include-hidden-files: true

      - name: Upload Python 3.12 timing shard
        if: always() && matrix.python-version == '3.12' && hashFiles('npa/ci-timings-*.json') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-timings-${{ matrix.shard }}
          path: npa/ci-timings-${{ matrix.python-version }}-${{ matrix.shard }}.json

      - name: Run CLI install test
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: cd npa && bash tests/integration/test_cli_install.sh

      - name: Check e2e shell scripts
        if: matrix.python-version == '3.12' && matrix.shard == 1
        run: |
          cd npa
          bash -n tests/e2e/test_lerobot_e2e.sh
          bash -n tests/e2e/test_genesis_e2e.sh
          bash -n tests/e2e/test_groot_e2e.sh
          bash -n tests/e2e/test_groot_composition_e2e.sh

      - name: Warn on source drift
        if: always() && matrix.python-version == '3.12' && matrix.shard == 1
        run: ./scripts/check-source-drift.sh

  affected-tests:
    name: affected-tests
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_suite == 'false' && needs.scope.outputs.test_paths != '[]'
    runs-on: ubuntu-latest
    env:
      NPA_PROJECT_ID: project-test-00000000
      NPA_S3_BUCKET: test-bucket-00000000
      NPA_REQUIRE_FFMPEG: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up cached uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-suffix: python-3.12
          cache-dependency-glob: |
            npa/pyproject.toml
            npa/ci/requirements.txt
            npa/ci/constraints.in
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install affected test dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          python -m venv npa/.venv
          uv pip install --python npa/.venv/bin/python -c npa/ci/requirements.txt -e "npa[dev,adapter]"
          uv pip install --python npa/.venv/bin/python --torch-backend cpu \
            -c npa/ci/requirements.txt -e "npa[sonic]"
          npa/.venv/bin/python -c "import torch, onnx, onnxscript, onnxruntime; assert torch.version.cuda is None"
          echo "${GITHUB_WORKSPACE}/npa/.venv/bin" >> "$GITHUB_PATH"
      - name: Run affected subsystem tests
        env:
          TEST_PATHS: ${{ needs.scope.outputs.test_paths }}
        run: |
          npa/.venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          paths = json.loads(os.environ["TEST_PATHS"])
          if not paths:
              raise SystemExit("Affected tests require a non-empty selection")
          subprocess.run(
              [sys.executable, "-m", "pytest", *paths, "-n", "auto", "--dist", "worksteal", "-q"],
              check=True,
          )
          PY

  coverage:
    name: coverage
    needs: [scope, test]
    if: ${{ always() && needs.scope.outputs.full_suite != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful pytest shards
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: npa/pyproject.toml

      - name: Install coverage reporter
        run: |
          python -m venv npa/.venv
          npa/.venv/bin/python -m pip install "coverage[toml]==7.16.0"

      - name: Download coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: coverage-*
          path: npa/coverage-data
          merge-multiple: true

      - name: Enforce merged coverage floor
        # The floor sits below the current ~66% so version-dependent skips
        # don't flake the gate; raise it as coverage grows, never lower it.
        run: |
          cd npa
          .venv/bin/python -m coverage combine coverage-data
          .venv/bin/python -m coverage report --show-missing --fail-under=60

      - name: Download Python 3.12 timing shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ci-timings-*
          path: npa/ci-timing-data
          merge-multiple: true

      - name: Merge Python 3.12 duration profile
        run: |
          npa/.venv/bin/python npa/scripts/merge_ci_test_timings.py \
            --input-directory npa/ci-timing-data \
            --output npa/ci-test-durations.json

      - name: Upload Python 3.12 duration profile
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-test-durations-${{ github.sha }}
          path: npa/ci-test-durations.json
