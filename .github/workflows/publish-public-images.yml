name: Publish public images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: paidf-cosmos3-20260815T235004Z-71255bb2-b8579bd3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: b8579bd3c01000bbda934a104cb1bebbfec7ac31
      IMAGE: ghcr.io/nebius/nebius-physical-ai/npa-cosmos3:paidf-cosmos3-20260815T235004Z-71255bb2-b8579bd3
    steps:
      - name: Check out the trusted implementation
        uses: actions/checkout@v6
        with:
          ref: b8579bd3c01000bbda934a104cb1bebbfec7ac31
          persist-credentials: false

      - name: Log in to GHCR with the built-in token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the unique candidate
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "NPA_SOURCE_SHA=${SOURCE_SHA}" \
            --file npa/docker/workbench/cosmos3/Dockerfile \
            --tag "${IMAGE}" \
            --push \
            npa
