        export DEBIAN_FRONTEND=noninteractive\nif ! command -v ffmpeg >/dev/null 2>&1; then\n  apt-get\
        \ update -qq || true\n  apt-get install -y -qq --no-install-recommends ffmpeg || true\nfi\nnpa_pip()\
        \ {\n  python3 -m pip install -q \"$@\" || python3 -m pip install -q \"$@\" --break-system-packages\
        \ || python3 -m pip install -q \"$@\" --user\n}\nnpa_pip \"boto3>=1.34\" \"awscli>=1.32\" \"huggingface_hub>=0.30\"\
        \ \"nvidia-ncore\" \"rerun-sdk\" \"pillow>=10.0\" \"pyyaml>=6.0\"\ncommand -v npa >/dev/null 2>&1\
        \ || { echo \"npa not found; set NPA_SRC_S3_URI\" >&2; exit 1; }\n\n# ---- objective per-shard\
        \ GPU / scheduler identity ---------------------------\n# Captured once at the top of the shard\
        \ so the manifest carries real, per-GPU\n# provenance (UUID + model + node + pod + wave), not\
        \ just a model-name count.\n# HOSTNAME inside a Kubernetes pod is the pod name; NODE_NAME comes\
        \ from the\n# downward-API env the workflow's pod_config injects.\nGPU_UUID=$(nvidia-smi --query-gpu=uuid\
        \ --format=csv,noheader | head -1 || echo unknown)\nGPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader\
        \ | head -1 || echo unknown)\nPOD_NAME=\"${HOSTNAME:-unknown}\"\nNODE_NAME=\"${NODE_NAME:-unknown}\"\
        \nSTART=$(date +%s)\nexport ZONE RUN_URI DATASET_ID SCENE VARIANT ZU NC RC NV INPUT RRD FINAL\
        \ MF\nexport GPU_UUID GPU_NAME POD_NAME NODE_NAME START\n\necho \"=== zone $ZONE: check (container\
        \ + dataset rights + RT-core GPU) ===\"\nnpa workbench nurec check --require-gpu --output json\n\
        \necho \"=== zone $ZONE: fetch real NCore V4 shards + derived rig pose edge ===\"\nnpa workbench\
        \ nurec fetch --dataset \"${DATASET_ID}\" --scene \"${SCENE}\" --variant \"${VARIANT}\" --output-uri\
        \ \"${NC}\" --output json >/tmp/nurec-fetch.json\n\n# ---- fail-closed provenance gate -------------------------------------------\n\
        # Provenance is validated against the *independently observed* unpacked content,\n# not merely\
        \ the echoed request arguments: the fetch result carries\n# observed_scene/observed_variant derived\
        \ from the scene directory that actually\n# landed in the extracted archive. A shard must never\
        \ reconstruct a capture it\n# did not ask for; if the observed content disagrees with the requested\
        \ scene or\n# variant, or the fetch did not record observed content at all, fail the shard\n#\
        \ (and therefore the join).\npython3 - \"$SCENE\" \"$VARIANT\" <<'PY'\nimport json, os, sys\n\
        requested = {\"scene\": sys.argv[1], \"variant\": sys.argv[2]}\nwith open(os.environ.get(\"NUREC_FETCH_JSON\"\
        , \"/tmp/nurec-fetch.json\")) as fh:\n    fetched = json.load(fh)\n# Observed content is authoritative.\
        \ When a fetch does not record it (older\n# output), fall back only for diagnostics -- the gate\
        \ then fails closed because\n# observed content is missing.\nobserved_scene = str(fetched.get(\"\
        observed_scene\") or \"\")\nobserved_variant = str(fetched.get(\"observed_variant\") or \"\")\n\
        if not observed_scene and not observed_variant:\n    print(\"PROVENANCE MISMATCH for zone\", os.environ[\"\
        ZONE\"], \":\",\n          \"fetch result carries no observed unpacked content\", file=sys.stderr)\n\
        \    sys.exit(1)\nmismatch = {\n    k: (v, requested[k])\n    for k, v in ((\"scene\", observed_scene),\
        \ (\"variant\", observed_variant))\n    if v != requested[k]\n}\nif mismatch:\n    print(\"PROVENANCE\
        \ MISMATCH for zone\", os.environ[\"ZONE\"], \":\",\n          json.dumps({\"observed\": mismatch,\
        \ \"requested\": requested}), file=sys.stderr)\n    sys.exit(1)\nif str(fetched.get(\"dataset_id\"\
        ) or \"\") != os.environ.get(\"DATASET_ID\", \"\"):\n    print(\"PROVENANCE MISMATCH for zone\"\
        , os.environ[\"ZONE\"], \": dataset_id\",\n          file=sys.stderr)\n    sys.exit(1)\nprint(\"\
        provenance-ok\", json.dumps({\"scene\": observed_scene, \"variant\": observed_variant}))\nPY\n\
        test \"$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['status'] or\
        \ '')\")\" = \"ok\"\n\nNCORE_JSON=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['ncore_json'])\"\
        )\nPOSES_GROUP=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['poses_component_group'])\"\
        )\nCAMERA=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['reference_camera'])\"\
        )\ntest -n \"${NCORE_JSON}\" && test -n \"${POSES_GROUP}\" && test -n \"${CAMERA}\"\nexport NCORE_JSON\
        \ POSES_GROUP CAMERA\n\n# ---- reconstruct + real, non-missing quality metrics ------------------------\n\
        # The reconstruct stage writes NRE's val metrics.yaml. metrics_path preserves\n# where the numbers\
        \ came from; metrics are recorded only when actually measured.\n# A missing/unparseable metrics\
        \ payload makes the shard (and the join) FAIL\n# rather than substituting a numeric zero.\necho\
        \ \"=== zone $ZONE: reconstruct (3DGUT Gaussians -> renderable USDZ) ===\"\nnpa workbench nurec\
        \ reconstruct --ncore-json \"${NCORE_JSON}\" --poses-component-group \"${POSES_GROUP}\" --camera-id\
        \ \"${CAMERA}\" --world-size 1 --export-gt --output-uri \"${RC}\" --input-uri \"${INPUT}\" --output\
        \ json >/tmp/nurec-reconstruct.json\nUSDZ=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-reconstruct.json'))['usdz_path'])\"\
        )\nMETRICS_PATH=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-reconstruct.json')).get('metrics_path')\
        \ or '')\")\nexport USDZ METRICS_PATH\ntest -n \"${USDZ}\"\n\necho \"=== zone $ZONE: render novel\
        \ views (rig-offset, not training views) ===\"\nnpa workbench nurec render --artifact-path \"\
        ${USDZ}\" --output-dir /tmp/render-out --camera-id \"${CAMERA}\" --renderer default --rig-translation-offset\
        \ \"{{config.rig_translation_offset}}\" --rig-rotation-offset \"{{config.rig_rotation_offset}}\"\
        \ --no-replicate-training-views --output-uri \"${NV}\" --output json >/tmp/nurec-render.json\n\
        \necho \"=== zone $ZONE: visualize (reports/sim2real.rrd for the agent panel) ===\"\nnpa workbench\
        \ nurec visualize --input-uri \"${ZU}\" --output-uri \"${RRD}\" --output json >/tmp/nurec-viz.json\n\
        \necho \"=== zone $ZONE: finalize (reports/final.json) ===\"\nnpa workbench nurec finalize --input-uri\
        \ \"${ZU}\" --output-uri \"${FINAL}\" --run-id \"${ZONE}\" --output json >/tmp/nurec-final.json\n\
        \nEND=$(date +%s)\nexport END\n\npython3 - <<'PY'\nimport json, os\ndef _load_json(path, default=None):\n\
        \    default = default if default is not None else {}\n    try:\n        with open(path) as fh:\n\
        \            return json.load(fh)\n    except Exception:\n        return default\nrecon = _load_json(\"\
        /tmp/nurec-reconstruct.json\")\nfinal = _load_json(\"/tmp/nurec-final.json\")\nraw_metrics = recon.get(\"\
        metrics\") or {}\nmetrics_path = os.environ.get(\"METRICS_PATH\", \"\")\n# Keep an unavailable\
        \ metric distinct from a measured value: None means no\n# value was produced, never substitute\
        \ 0.0.\ndef _m(key):\n    val = raw_metrics.get(key)\n    if val is None or val == \"\":\n   \
        \     return None\n    try:\n        return float(val)\n    except (TypeError, ValueError):\n\
        \        return None\nmetrics = {\"test/psnr\": _m(\"test/psnr\"), \"test/ssim\": _m(\"test/ssim\"\
        ), \"test/lpips\": _m(\"test/lpips\")}\nmetrics_present = bool(metrics_path) and all(metrics[k]\
        \ is not None for k in metrics)\nif not metrics_present:\n    print(\"zone\", os.environ[\"ZONE\"\
        ], \": NRE validation metrics missing/unparseable (metrics_path=%r); failing shard\" % metrics_path,\
        \ flush=True)\n    raise SystemExit(1)\npayload = {\n  \"schema\": \"npa.living_lab.zone_manifest.v1\"\
        ,\n  \"zone_name\": os.environ[\"ZONE\"],\n  \"status\": \"ok\",\n  \"provenance\": {\n    \"\
        dataset_id\": os.environ[\"DATASET_ID\"],\n    \"scene\": os.environ[\"SCENE\"],\n    \"variant\"\
        : os.environ[\"VARIANT\"],\n    \"requested\": {k: os.environ[k] for k in (\"DATASET_ID\", \"\
        SCENE\", \"VARIANT\")},\n  },\n  \"gpu\": {\n    \"gpu_uuid\": os.environ.get(\"GPU_UUID\", \"\
        \"),\n    \"gpu_name\": os.environ.get(\"GPU_NAME\", \"\"),\n    \"node_name\": os.environ.get(\"\
        NODE_NAME\", \"\"),\n    \"pod_name\": os.environ.get(\"POD_NAME\", \"\"),\n    \"wave_id\": os.environ.get(\"\
        RUN_URI\", \"\"),\n  },\n  \"gpu_uuid\": os.environ.get(\"GPU_UUID\", \"\"),\n  \"gpu_name\":\
        \ os.environ.get(\"GPU_NAME\", \"\"),\n  \"node_name\": os.environ.get(\"NODE_NAME\", \"\"),\n\
        \  \"pod_name\": os.environ.get(\"POD_NAME\", \"\"),\n  \"wave_id\": os.environ.get(\"RUN_URI\"\
        , \"\"),\n  \"usdz_path\": os.environ.get(\"USDZ\", \"\"),\n  \"reconstruction_uri\": os.environ.get(\"\
        RC\", \"\"),\n  \"novel_views_uri\": os.environ.get(\"NV\", \"\"),\n  \"rrd_uri\": os.environ.get(\"\
        RRD\", \"\"),\n  \"final_report_uri\": os.environ.get(\"FINAL\", \"\"),\n  \"started_epoch\":\
        \ int(os.environ.get(\"START\", 0)),\n  \"ended_epoch\": int(os.environ.get(\"END\", 0)),\n  \"\
        elapsed_seconds\": int(os.environ.get(\"END\", 0)) - int(os.environ.get(\"START\", 0)),\n  \"\
        metrics_path\": metrics_path,\n  \"metrics\": metrics,\n  \"finalize\": {\n    \"status\": final.get(\"\
        status\", \"\"),\n    \"has_usdz\": bool(final.get(\"has_usdz\", False)),\n    \"has_rrd\": bool(final.get(\"\
        has_rrd\", False)),\n    \"artifact_count\": final.get(\"artifact_count\", 0),\n  },\n}\njson.dump(payload,\
        \ open(\"/tmp/zone_manifest.json\", \"w\"))\nfrom npa.clients.storage import StorageClient\nStorageClient.from_environment().upload_file(\"\
        /tmp/zone_manifest.json\", os.environ[\"MF\"])\nprint(json.dumps(payload))\nPY\n"
    outputs:
    - uri: '{{config.zones_uri}}{{config.zone_name}}/zone_manifest.json'
      schema: npa.living_lab.zone_manifest.v1
  join:
    description: 'Barrier: read every expected zone manifest, require every zone present with a real GPU
      identity and a real USDZ, aggregate objective metrics and GPU participation, publish the composite
      digital-twin report plus a contact-sheet panorama, and fail closed unless the proof demonstrates
      exactly the required number of distinct non-empty GPU UUIDs with material all-required-device temporal
      overlap.'
    needs:
    - living-lab-zones
    resources: cpu
    run:
      shell: python3 -c "from npa.workflows.living_lab import join_living_lab_zones; join_living_lab_zones(zones_uri='{{config.zones_uri}}',
        report_uri='{{config.report_uri}}', panorama_uri='{{config.panorama_uri}}', shards='{{config.zones}}',
        run_id='{{run.id}}')"
    outputs:
    - uri: '{{config.report_uri}}'
      schema: npa.living_lab.digital_twin.v1
    - uri: '{{config.panorama_uri}}'
      schema: npa.living_lab.panorama.v1
    terminal: true
