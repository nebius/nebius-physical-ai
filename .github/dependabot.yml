# Review coupled dependency changes together and validate one combined candidate.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily
updates:
  - package-ecosystem: pip
    directories:
      - /npa
      - /scripts
    # /npa includes nested manifests; CI pins must use ci_requirements.py.
    exclude-paths:
      - ci/**
    ignore:
      # Upgrades need the CPU runtime assertion and wheel checks updated together.
      - dependency-name: torch
      # Gymnasium Robotics requires the tested engine pinned in pyproject.toml.
      - dependency-name: mujoco
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /npa/tests/browser
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
