apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: robocasa-data-policy
  description: >
    RoboCasa kitchen simulation -> LeRobotDataset -> LeRobot policy training ->
    held-out evaluation -> insights lineage. Real catalog toolRefs and real
    components throughout: the RoboCasa service exports real trajectories, the
    npa adapter materializes them into LeRobotDataset v3, LeRobot trains a real
    ACT policy on reserved GPU capacity, the produced checkpoint is compared
    with a matched-seed random-action baseline using quantitative metrics and
    video evidence, and insights records lineage.

config:
  bucket: example-bucket
  prefix: "robocasa-data-policy/{{run.id}}"
  source_overlay: true

  robocasa_endpoint: http://npa-robocasa.workbench.svc.cluster.local:8791
  robocasa_token_env: ROBOCASA_TOKEN
  train_env_ids: >-
    robocasa/PickPlaceCounterToCabinet,robocasa/PickPlaceCabinetToCounter,robocasa/PickPlaceCounterToSink
  heldout_env_ids: >-
    robocasa/PickPlaceSinkToCounter,robocasa/PickPlaceCounterToMicrowave
  env_id: "{{config.train_env_ids}}"
  seed: "42"
  iterations: "100"
  num_envs: "12"
  poll_seconds: "30"
  timeout_seconds: "7200"

  dataset_fps: "20"
  dataset_robot: panda_omron
  dataset_task: "RoboCasa task (resolved per episode from export metadata)"

  lerobot_dataset: "s3://{{config.bucket}}/{{config.prefix}}/dataset/"
  lerobot_output_dir: /tmp/lerobot_output
  train_steps: "200"
  policy_type: act
  train_batch_size: "8"
  policy_device: cuda

  rollout_output_dir: /tmp/lerobot_rollout
  eval_iterations: "100"
  rollout_episodes: "6"

  output_uri: "s3://{{config.bucket}}/{{config.prefix}}/trajectories/"
  artifacts_uri: "s3://{{config.bucket}}/{{config.prefix}}/artifacts/"
  rollouts_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval/"
  run_prefix_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  workflow_name: robocasa-data-policy
  insights_store_uri: "s3://{{config.bucket}}/{{config.prefix}}/insights/"
  insights_uri: "s3://{{config.bucket}}/{{config.prefix}}/insights/"

resources:
  sim-gpu:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
    cpus: 8
    memory: 32Gi
  convert-cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: tool://lerobot
  insights-cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
    image: tool://lancedb
  train-gpu:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
    cpus: 16
    memory: 64Gi

initial: trajectory-export

states:
  trajectory-export:
    description: Run seeded random-action RoboCasa baselines with causally aligned trajectories.
    toolRef: workbench.robocasa.trajectory_export
    resources: sim-gpu
    outputs:
      - uri: "{{config.output_uri}}"
        schema: npa.robocasa.trajectory_export.v1
    next: lerobot-convert

  lerobot-convert:
    description: Materialize RoboCasa trajectories into LeRobotDataset v3.
    resources: convert-cpu
    needs: [trajectory-export]
    run:
      argv:
        - npa
        - adapter
        - convert
        - --input-path
        - "{{config.output_uri}}"
        - --output-path
        - "{{config.lerobot_dataset}}"
        - --fps
        - "{{config.dataset_fps}}"
        - --robot
        - "{{config.dataset_robot}}"
        - --task
        - "{{config.dataset_task}}"
        - --task-from-metadata
    inputs:
      - uri: "{{config.output_uri}}"
        schema: npa.robocasa.trajectory_export.v1
    outputs:
      - uri: "{{config.lerobot_dataset}}"
        schema: npa.lerobot.dataset.v3
    next: policy-train

  policy-train:
    description: Train a real LeRobot ACT behavior-cloning baseline on the random-action dataset.
    toolRef: workbench.lerobot.policy_train
    resources: train-gpu
    needs: [lerobot-convert]
    outputs:
      - uri: "{{config.artifacts_uri}}"
        schema: npa.lerobot.training_run.v1
    next: policy-eval

  policy-eval:
    description: Compare the exact checkpoint with random actions on matched held-out tasks and seeds.
    toolRef: workbench.robocasa.policy_eval
    resources: sim-gpu
    needs: [policy-train]
    inputs:
      - uri: "{{config.artifacts_uri}}"
        schema: npa.lerobot.training_run.v1
    outputs:
      - uri: "{{config.rollouts_uri}}"
        schema: npa.robocasa.policy_eval.v1
    next: insights

  insights:
    description: Record lineage and metrics into the insights store.
    toolRef: workbench.insights.ingest_run
    resources: insights-cpu
    needs: [policy-eval]
    inputs:
      - uri: "{{config.run_prefix_uri}}"
    outputs:
      - uri: "{{config.insights_uri}}"
        schema: npa.insights.store.v1
    terminal: true
