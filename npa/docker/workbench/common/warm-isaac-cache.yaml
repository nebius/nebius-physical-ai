# Pre-populate the pinned Isaac runtime cache before submitting workload pods.
#
# WHY YOU WANT THIS
#   The Isaac workbench images ship no NVIDIA Isaac bytes; the pinned Isaac Sim and
#   Isaac Lab closure is downloaded on first run. Its size and install time depend on
#   the selected version, network, and filesystem. Older 111-second / 10-GiB estimates
#   do not describe the current Isaac Sim 6 runtime; measure the selected closure.
#
#   Warm a shared volume once so every node can reuse the verified, atomically published
#   tree. NPA_ISAAC_CACHE_READONLY=1 keeps ordinary workload pods from modifying it.
#   The warm job disables pip bytecode compilation: precompiling the SDK's many Python
#   modules adds avoidable metadata writes on shared filesystems. Python can execute
#   the source modules from a read-only cache without writing bytecode there.
#
# EULA POLICY
#   NPA defaults acceptance on for non-interactive Isaac workflows. The image never
#   bakes this runtime state; set an empty or recognized negative value to opt out.
#
# USAGE
#   1. Pick a volume (see the two options below) and set NPA_ISAAC_CACHE_DIR to its mount.
#   2. Replace the image digest with the exact validated GHCR release digest.
#      Tags are not accepted as runtime provenance.
#   3. kubectl apply -f warm-isaac-cache.yaml
#      kubectl wait --for=condition=complete job/npa-warm-isaac-cache --timeout=-1s
#      kubectl logs job/npa-warm-isaac-cache
#   4. Run your workload pods against the same volume with
#      NPA_ISAAC_CACHE_READONLY=1 (and optionally NPA_ISAAC_BOOTSTRAP_OFFLINE=1).
#
#   Re-run it after changing the bootstrap, OSS lock, Isaac pins, or wheel manifest.
#   The full-SHA cache stamp selects a new tree; the old one stays immutable for Pods
#   already using it.
#
# VOLUME OPTIONS
#   a) Shared filesystem PVC (recommended): one download serves every pod on every node.
#      On Nebius mk8s use the `csi-mounted-fs-path-sc` StorageClass. This is what the
#      PersistentVolumeClaim below creates.
#   b) Per-node emptyDir: no PVC to manage, but one download per pod. Only sensible for a
#      single-pod smoke; GPU nodes have ~890 GiB of ephemeral storage, so it fits, but you
#      repeat the complete SDK download and installation every time.
#
# SIZING
#   Measure the selected installed tree and reserve space for two complete versions
#   plus download/install headroom. The current Isaac Sim 6 closure occupies about 18 GiB;
#   the 64-GiB PVC below allows a new version beside the existing immutable tree.
#   A per-pod cache also needs a matching ephemeral-storage request to avoid eviction.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npa-isaac-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: csi-mounted-fs-path-sc
  resources:
    requests:
      storage: 64Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: npa-warm-isaac-cache
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: npa-warm-isaac-cache
    spec:
      restartPolicy: Never
      # The CSI driver applies this fsGroup to the mounted cache, so the image's
      # unprivileged ubuntu user can atomically publish a versioned tree. Workload pods
      # subsequently mount the same tree read-only; root is neither needed nor allowed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warm
          # The job's only legitimate writes are into the mounted cache volume, so the
          # root filesystem is immutable and /tmp is a separate scratch volume (pip needs
          # a writable TMPDIR). Flagged by Trivy KSV-0014 on the first draft of this file
          # — this job downloads and unpacks third-party code and should not be able to
          # modify the image root.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # Any of the Isaac images works; they share the bootstrap.
          image: ghcr.io/nebius/nebius-physical-ai/npa-isaac-lab@sha256:<64-hex-digest>
          command: ["/opt/npa/bin/isaac-bootstrap", "warm"]
          env:
            # Explicitly documents the default; set empty/N/NO/0/FALSE to opt out.
            - name: ACCEPT_EULA
              value: "Y"
            # The bootstrap enforces both upstream license gates explicitly. Keep the
            # compatibility flag above for callers that still consume ACCEPT_EULA.
            - name: OMNI_KIT_ACCEPT_EULA
              value: "YES"
            - name: ISAACSIM_ACCEPT_EULA
              value: "YES"
            - name: NPA_ISAAC_CACHE_DIR
              value: /opt/isaac-cache
            # Avoid precompiling the SDK into thousands of shared-filesystem writes.
            - name: PIP_COMPILE
              value: "0"
            # Point this at an internal mirror if egress to pypi.nvidia.com is restricted;
            # the wheels are sha256-pinned, so a mirror is verifiable.
            # - name: NPA_ISAAC_INDEX_URL
            #   value: https://pypi.example.internal/nvidia
          volumeMounts:
            - name: isaac-cache
              mountPath: /opt/isaac-cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
              ephemeral-storage: 16Gi
      volumes:
        - name: isaac-cache
          persistentVolumeClaim:
            claimName: npa-isaac-cache
        # Writable scratch, because the root filesystem is read-only. pip unpacks wheels
        # here, so size it for the selected wheel closure and installation headroom.
        - name: tmp
          emptyDir:
            sizeLimit: 12Gi
        # Option (b): swap the block above for a per-pod scratch volume. Size it for the
        # cache plus headroom, or the pod is evicted part-way through the bootstrap.
        # - name: isaac-cache
        #   emptyDir:
        #     sizeLimit: 64Gi
