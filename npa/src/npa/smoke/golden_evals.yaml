    image: npa-lichtblick
    dockerfile: npa/docker/workbench/lichtblick/Dockerfile
    physical_ai:
      useful: true
      role: >-
        Lichtblick — an open-source (MPL-2.0), Foxglove-compatible web viewer for
        MCAP / ROS-bag / robotics log artifacts; the browser-based analog of the
        Rerun viewer for inspecting Physical AI recordings staged from S3.
    safety:
      runs_as: nobody
      base_image: caddy:2.11.4-alpine
      network: internal (static viewer port 8080)
      external_fetch: [github, npm]
      notes: >-
        Static web bundle built from the pinned Lichtblick OSS tag and served by
        caddy; no account, proprietary component, persistent storage, or runtime
        outbound calls beyond the viewer bind. Source fetch happens at build time.
    golden_eval:
      kind: build-import
      command: 'sh -c "test -s /srv/index.html && grep -qx 1.26.0 /opt/npa/lichtblick/VERSION"'
      gpu: none
      timeout_seconds: 60
      status: ready
