apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: encord-labeling-demo
  description: Import real video prelabels into Encord, export and verify them, and
    render annotated MP4s.
config:
  bucket: example-bucket
  prefix: encord-labeling/{{run.id}}
  encord_media_uri: s3://{{config.bucket}}/{{config.prefix}}/fixture/
  encord_integration: ''
  encord_folder: npa-encord-{{run.id}}
  encord_dataset: npa-encord-{{run.id}}
  encord_media_filter: videos-images
  encord_transfer: upload
  encord_poll_timeout_seconds: '1800'
  encord_identity_sidecar_uri: ''
  encord_receipt_uri: s3://{{config.bucket}}/{{config.prefix}}/push/push_receipt.json
  encord_source: project
  encord_source_id: '{{config.encord_project}}'
  encord_label_export: initialize
  encord_pull_uri: s3://{{config.bucket}}/{{config.prefix}}/pull
  encord_manifest_uri: s3://{{config.bucket}}/{{config.prefix}}/pull/manifest.json
  encord_roundtrip_report_uri: s3://{{config.bucket}}/{{config.prefix}}/verify/roundtrip_report.json
  encord_project: npa-encord-labeling-{{run.id}}
  encord_label_plan_uri: s3://{{config.bucket}}/{{config.prefix}}/input/label-plan.json
  encord_label_receipt_uri: s3://{{config.bucket}}/{{config.prefix}}/labels/receipt.json
  encord_demo_uri: s3://{{config.bucket}}/{{config.prefix}}/demo
resources:
  cpu:
    cloud: kubernetes
    cpus: 2
    memory: 8Gi
initial: push
states:
  push:
    description: Upload source videos and record their exact SHA-256 and Encord item
      identities.
    toolRef: workbench.encord.push
    resources: cpu
    outputs:
    - uri: '{{config.encord_receipt_uri}}'
      schema: npa.encord.push_receipt.v1
    next: import_labels
  import_labels:
    description: Create an isolated ontology and project; save programmatic prelabels
      awaiting human review.
    toolRef: workbench.encord.import_labels
    resources: cpu
    needs:
    - push
    inputs:
    - uri: '{{config.encord_receipt_uri}}'
      schema: npa.encord.push_receipt.v1
    - uri: '{{config.encord_label_plan_uri}}'
    outputs:
    - uri: '{{config.encord_label_receipt_uri}}'
    next: pull
  pull:
    description: Read back the new project media and persisted labels from Encord.
    needs:
    - import_labels
    toolRef: workbench.encord.pull
    resources: cpu
    outputs:
    - uri: '{{config.encord_manifest_uri}}'
      schema: npa.encord.pull_manifest.v1
    next: verify
  verify:
    description: Verify exact identity, destination existence, size, and checksum.
    needs:
    - pull
    toolRef: workbench.encord.verify_roundtrip
    resources: cpu
    inputs:
    - uri: '{{config.encord_receipt_uri}}'
      schema: npa.encord.push_receipt.v1
    - uri: '{{config.encord_manifest_uri}}'
      schema: npa.encord.pull_manifest.v1
    outputs:
    - uri: '{{config.encord_roundtrip_report_uri}}'
      schema: npa.encord.roundtrip_report.v1
    next: render_labels
  render_labels:
    description: Require exact exported label equality and verified video bytes, then
      render every frame.
    toolRef: workbench.encord.render_labels
    resources: cpu
    needs:
    - verify
    inputs:
    - uri: '{{config.encord_manifest_uri}}'
    - uri: '{{config.encord_label_receipt_uri}}'
    - uri: '{{config.encord_roundtrip_report_uri}}'
    outputs:
    - uri: '{{config.encord_demo_uri}}/demo.json'
    terminal: true
