apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sonic-train
  description: Train or smoke-validate a SONIC locomotion policy.

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/sonic-train"
  # `local` trains inside this GPU stage's own container. The vm / container /
  # serverless runtimes each provision MORE infrastructure, which a stage that
  # already holds a GPU cannot do (serverless additionally needs a project id).
  sonic_runtime: local
  # NVIDIA's Omniverse / Isaac Sim / Software licence terms. `--runtime local` runs the SONIC
  # image's own trainer when present, and that trainer refuses to download Isaac Sim / Isaac Lab
  # until this is given — without it the run falls back to the reference trainer.
  # Empty means NOT accepted; set it to `yes` to accept.
  train_iterations: "40"
  checkpoint_uri: "nvidia/GEAR-SONIC"
  data_uri: "s3://{{config.bucket}}/{{config.prefix}}/data/"
  training_uri: "s3://{{config.bucket}}/{{config.prefix}}/training/"

resources:
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 16
    memory: 80Gi

initial: train

states:
  train:
    description: Run SONIC Isaac Lab training or smoke validation.
    toolRef: workbench.sonic.train
    resources: gpu
    outputs:
      - uri: "{{config.training_uri}}checkpoint.json"
        schema: npa.workbench.sonic.checkpoint.v1
    terminal: true
