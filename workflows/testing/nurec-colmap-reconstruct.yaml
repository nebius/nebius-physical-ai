apiVersion: npa.workflow/v0.0.1
kind: Workflow

# Not yet live validated. See docs/workbench/guides/nurec-colmap-reconstruct.md.
# Apache-2.0 NCore converts source COLMAP photographs, cameras, poses and sparse
# SfM points on CPU. Proprietary NRE reconstruction/rendering remain separately
# licensed NGC stages on RTX PRO 6000. Data and weights are never baked.
# Select an immutable development image with:
# --image-override workbench.nurec.convert_colmap=<registry>/npa-ncore@sha256:<digest>
# Each state has a separate pod. The exact conversion output prefix is the NRE
# input; no fetch of an already converted NCore dataset occurs here.

metadata:
  name: nurec-colmap-reconstruct
  description: >
    Full struktur28 COLMAP capture -> official NVIDIA NCore V4 conversion and
    rig adaptation -> existing NRE full-default 3DGUT reconstruction -> novel
    views -> Rerun -> final report. Conversion is Apache-2.0; NRE is proprietary.
    Not yet live validated.

config:
  bucket: example-bucket
  prefix: "neural-reconstruction-colmap/{{run.id}}"

  # The source archive contains struktur28 AND struktur28_auto. Select the full
  # 518-image / 3-camera capture explicitly; do not auto-discover or truncate it.
  dataset_id: "nvidia/PhysicalAI-NuRec-PPISP"
  dataset_revision: "2521064a3af6ab1c1caa2ba1b01ddde7eecded69"
  dataset_root: "struktur28"
  colmap_dir: "sparse/0"
  images_dir: "images"
  masks_dir: ""
  rig_mode: "derive"
  reference_camera: ""

  nurec_image: "nvcr.io/nvidia/nre/nre-ga:26.04"
  config_name: "configs/experimental/3dgut/3dgut_colmap.yaml"
  mode: trainval
  # Zero preserves the native full recipe; it does not disable training.
  max_epochs: "0"
  world_size: "1"
  poses_component_group: "npa_rig"
  rig_translation_offset: "0,0.25,0"
  rig_rotation_offset: "0,0,0"
  render_image_scale: "0.5"
  renderer: "default"

  cache_dir: "/tmp/npa-nurec-cache"
  scratch_dir: "/tmp/npa-ncore-scratch"
  out_dir: "/tmp/npa-nurec-out"
  render_dir: "/tmp/npa-nurec-out/novel_views"

  run_root_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  colmap_input_uri: "s3://{{config.bucket}}/{{config.prefix}}/source/struktur28_colmap.zip"
  ncore_sequence_uri: "s3://{{config.bucket}}/{{config.prefix}}/ncore/sequence/"
  input_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/"
  reconstruction_uri: "s3://{{config.bucket}}/{{config.prefix}}/reconstruction/"
  novel_views_uri: "s3://{{config.bucket}}/{{config.prefix}}/novel_views/"
  rrd_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/sim2real.rrd"
  final_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/final.json"

resources:
  ncore:
    cloud: kubernetes
    cpus: 8
    memory: 32Gi
  gpu:
    cloud: kubernetes
    # RT cores required. Operators on a cluster that advertises a different
    # product name override with NPA_WORKFLOW_GPU_ACCELERATOR at submit time.
    accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
    cpus: 8
    memory: 64Gi
    image: "nvcr.io/nvidia/nre/nre-ga:26.04"
    kubernetes:
      pod_config:
        spec:
          # Appended to the cluster-wide list, so the registry secret stays.
          imagePullSecrets:
            - name: ngc-nvcr-imagepullsecret
          initContainers:
            # SkyPilot's runtime setup calls bare `sudo` when it writes the nofile
            # limits and /etc/fuse.conf (templates/kubernetes-ray.yml.j2). The NRE
            # image has no sudo, so that step exits 127 and the cluster never
            # becomes usable even though provisioning otherwise succeeds. The pod
            # already runs as root, so a shim that execs its arguments is exactly
            # equivalent to SkyPilot's own `alias sudo=""` root path.
            # /usr/local/sbin is on the image's PATH and empty.
            - name: npa-sudo-shim
              image: "nvcr.io/nvidia/nre/nre-ga:26.04"
              command:
                - /bin/sh
                - -c
                - |
                  printf '#!/bin/sh\nexec "$@"\n' > /shim/sudo
                  chmod 0755 /shim/sudo
              volumeMounts:
                - name: npa-sudo-shim
                  mountPath: /shim
          containers:
            - name: ray-node
              volumeMounts:
                - name: npa-sudo-shim
                  mountPath: /usr/local/sbin
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: npa-sudo-shim
              emptyDir: {}
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 64Gi
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi

initial: convert

states:
  convert:
    description: >
      Run the pinned Apache-2.0 NVIDIA converter on all source images, cameras,
      poses and sparse points. Derive the NRE rig edge, independently decode the
      complete sequence, compare source geometry/counts, then publish all shards
      and SHA256 provenance. Timestamps are virtual 1 FPS; points are SfM, not LiDAR.
    toolRef: workbench.nurec.convert_colmap
    resources: ncore
    inputs:
      - uri: "{{config.colmap_input_uri}}"
    outputs:
      - uri: "{{config.ncore_sequence_uri}}sequence.json"
      - uri: "{{config.ncore_sequence_uri}}conversion.json"
    next: reconstruct

  reconstruct:
    description: >
      Use the existing separately licensed NRE engine and full native 3DGUT
      recipe to publish USDZ, metrics, resolved config and ground-truth frames.
    needs: [convert]
    toolRef: workbench.nurec.reconstruct
    resources: gpu
    inputs:
      - uri: "{{config.ncore_sequence_uri}}"
    outputs:
      - uri: "{{config.reconstruction_uri}}metrics.yaml"
        schema: npa.nurec.reconstruction.v1
    next: render

  render:
    description: Render novel views using the existing NRE engine with a nonzero rig offset.
    needs: [reconstruct]
    toolRef: workbench.nurec.render
    resources: gpu
    inputs:
      - uri: "{{config.reconstruction_uri}}"
        schema: npa.nurec.reconstruction.v1
    outputs:
      - uri: "{{config.novel_views_uri}}"
        schema: npa.nurec.novel_views.v1
    next: visualize

  visualize:
    description: Build a factual Rerun recording from this run's capture, reconstruction and novel views.
    needs: [render]
    toolRef: workbench.nurec.visualize
    resources: cpu
    inputs:
      - uri: "{{config.run_root_uri}}"
    outputs:
      - uri: "{{config.rrd_uri}}"
        schema: npa.sim2real.rerun.v1
    next: finalize

  finalize:
    description: Aggregate the existing NuRec artifact accounting into the final report.
    needs: [visualize]
    toolRef: workbench.nurec.finalize
    resources: cpu
    outputs:
      - uri: "{{config.final_report_uri}}"
        schema: npa.sim2real.e2e_report.v1
    terminal: true
