apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: byof-robotwin
  description: >
    Private registry-candidate BYOF workflow for RoboTwin 2.0. On one RTX PRO
    6000 Blackwell it fetches the exact official asset revision at run time,
    searches for a successful beat_block_hammer seed, replays that seed through
    SAPIEN's Vulkan renderer, and writes native HDF5 plus MP4 evidence.
config:
  bucket: example-bucket
  repo_url: "https://github.com/RoboTwin-Platform/RoboTwin.git"
  repo_ref: "96c1feab536306b50c26af200044fcdf126e8904"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: ubuntu
  # linux/amd64 manifest for the public CUDA 12.8.1 development image. CUDA
  # 12.8 and a cu128 PyTorch wheel are required to compile CuRobo for sm_120.
  base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04@sha256:61f6c08f2b59036cb935e56d1e31a6b64e3ae2c7ddb86d33fa0b044c7917b719"
  # This image is private/restricted: CuRobo v0.7.8 permits research or
  # evaluation use only. Assets and generated episodes are fetched/written at
  # run time and are never baked into or published with the image.
  build_command: >
    apt-get update &&
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
    build-essential ffmpeg git libdbus-1-3 libegl1 libgl1 libglib2.0-0
    libglvnd0 libsm6 libvulkan1 libx11-6 libxcb1 libxext6 libxkbcommon0
    ninja-build python3-dev unzip vulkan-tools &&
    python3 -m pip install --no-cache-dir --upgrade
    pip==25.2 &&
    printf '%s'
    'YWRkaWN0PT0yLjQuMAphbm5vdGF0ZWQtdHlwZXM9PTAuOC4wCmFueWlvPT00LjE1LjEKYXN0dG9rZW5zPT0zLjAuMgphdHRy'
    'cz09MjYuMS4wCmJsaW5rZXI9PTEuOS4wCmJvdG8zPT0xLjQzLjkxCmJvdG9jb3JlPT0xLjQzLjkyCmNlcnRpZmk9PTIwMjYu'
    'Ny4yMgpjaGFyZGV0PT03LjYuMApjaGFyc2V0LW5vcm1hbGl6ZXI9PTMuNS4xCmNsaWNrPT04LjUuMApjbG91ZHBpY2tsZT09'
