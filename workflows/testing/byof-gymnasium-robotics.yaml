apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: byof-gymnasium-robotics
  description: >
    Phase A pre-registration workflow for the Farama Foundation
    Gymnasium-Robotics Shadow Hand capability. The placeholder image is
    intentionally non-resolving; a future authorized gate must inject a
    reviewed immutable candidate digest and skip all build behavior.
config:
  bucket: example-bucket
  repo_url: "https://github.com/Farama-Foundation/Gymnasium-Robotics.git"
  repo_ref: "4d1ebecbc6436806cfbc0e42ebc36f594d05844e"
  repo_auth: none
  repo_token_env: GH_TOKEN
  base_profile: prebuilt
  base_image: "registry.example.invalid/gymnasium-robotics:phase-a-unbuilt"
  build_command: ""
  workload: solution-smoke
  smoke_command: |
    export MUJOCO_GL=egl
    export PYOPENGL_PLATFORM=egl
    export NVIDIA_DRIVER_CAPABILITIES=graphics,utility
    exec /opt/venv/bin/python -I -B /opt/npa/gymnasium-robotics/capability_smoke.py
  solution_name: "gymnasium-robotics"
  capability_name: "HandManipulateBlockRotateXYZ_ContinuousTouchSensors-v1"
  smoke_artifact_name: "gymnasium-robotics-smoke.json"
  resource_profile_yaml: "byof-solution-smoke-gymnasium-robotics-rtxpro-gpu"
  task: "HandManipulateBlockRotateXYZ_ContinuousTouchSensors-v1"
  iterations: 1
  num_envs: 1
  num_demos: 1
  wait_timeout: -1
  poll_interval: 30
  output_root: s3://{{config.bucket}}/oss-solutions/gymnasium-robotics
  summary_uri: "{{config.output_root}}/{{run.id}}/npa_byof_summary.json"
resources:
  gpu:
    cloud: kubernetes
    image: "{{config.base_image}}"
    accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
initial: byof-run
states:
  byof-run:
    description: >
      Run the fixed in-image registered Shadow Hand smoke from a separately
      authorized exact candidate digest on one RTX PRO 6000 Blackwell. Phase A
      has no runnable image and does not authorize submission.
    toolRef: workbench.byof.repo
    resources: gpu
    outputs:
      - uri: "{{config.summary_uri}}"
        schema: npa.workbench.byof.summary.v1
    terminal: true
