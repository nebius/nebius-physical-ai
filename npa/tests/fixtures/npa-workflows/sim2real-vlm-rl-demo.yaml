# TEST FIXTURE ONLY. This intentionally contains obsolete stub toolRefs so the
# generic workflow DSL's nested-loop and decision semantics retain coverage.
# It is not discovered as an operator workflow. The only canonical executable
# Sim2Real spec is npa/workflows/workbench/npa-workflows/sim2real.yaml.
apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sim2real-vlm-rl-demo-fixture
  description: Test-only nested-loop and decision fixture.

config:
  bucket: example-bucket
  prefix: "sim2real-demo/{{run.id}}"
  inner_iterations: 3
  outer_iterations: 2
  default_decision: loop_back
  env_count: "10000"
  vlm_backend: self-hosted
  trigger_uri: "s3://{{config.bucket}}/sim2real-triggers/{{run.id}}/lerobot-pusht/"
  augment_uri: "s3://{{config.bucket}}/{{config.prefix}}/augment/"
  augment_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/augment/manifest.json"
  raw_envs_uri: "s3://{{config.bucket}}/{{config.prefix}}/envs/raw/"
  envgen_root_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  shard_index: "0"
  shard_count: "1"
  train_fraction: "0.8"
  envgen_seed: "42"
  augmented_frames_uri: "{{config.augment_manifest_uri}}"
  rollouts_uri: "s3://{{config.bucket}}/{{config.prefix}}/actions/train/"
  scores_uri: "s3://{{config.bucket}}/{{config.prefix}}/vlm_eval/train/"
  heldout_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/eval/heldout/report.json"
  decision_uri: "s3://{{config.bucket}}/{{config.prefix}}/outer_loop/decision.json"
  finalize_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/sim2real-report.json"

resources:
  gpu:
    cloud: kubernetes
    accelerators: RTXPRO6000:1
  cpu:
    cloud: kubernetes
    cpus: 8

initial: augment

states:
  augment:
    toolRef: workbench.cosmos2.transfer_conditioned_execute
    resources: gpu
    inputs:
      - {uri: "{{config.trigger_uri}}", schema: npa.lerobot.dataset.v1}
    outputs:
      - {uri: "{{config.augment_manifest_uri}}", schema: npa.cosmos2.transfer.v1}
    next: envgen
  envgen:
    needs: [augment]
    toolRef: workbench.sim2real_envgen.raw_shard
    resources: gpu
    inputs:
      - {uri: "{{config.augment_manifest_uri}}", schema: npa.cosmos2.transfer.v1}
    outputs:
      - {uri: "{{config.raw_envs_uri}}raw-shard-00-summary.json", schema: npa.sim2real.raw_env_shard_summary.v1}
    next: outer
  outer:
    needs: [envgen]
    loop:
      max: "{{config.outer_iterations}}"
      until: promote_checkpoint
    sequence: [inner, heldout, decide]
    next: finalize
  inner:
    loop:
      max: "{{config.inner_iterations}}"
    sequence: [rollouts, vlm-score]
  rollouts:
    run:
      shell: echo test-only-rollout
    resources: gpu
    outputs:
      - {uri: "{{config.rollouts_uri}}", schema: npa.sim2real.action_rollout.v1}
  vlm-score:
    needs: [rollouts]
    toolRef: workbench.vlm_eval.run
    resources: gpu
    outputs:
      - {uri: "{{config.scores_uri}}vlm_eval_stub.json", schema: npa.workbench.vlm_eval.report.v1}
  heldout:
    run:
      shell: echo test-only-heldout
    resources: gpu
    outputs:
      - {uri: "{{config.heldout_report_uri}}", schema: npa.sim2real.heldout_eval.v1}
  decide:
    writesDecision: true
    needs: [heldout]
    toolRef: workbench.sim2real.write_decision
    outputs:
      - {uri: "{{config.decision_uri}}", schema: npa.sim2real.threshold_decision.v1}
    transitions:
      - {when: promote_checkpoint, goto: finalize}
      - {when: loop_back, goto: outer}
  finalize:
    needs: [outer]
    run:
      shell: echo test-only-finalize
    outputs:
      - {uri: "{{config.finalize_report_uri}}", schema: npa.sim2real.e2e_report.v1}
    terminal: true
