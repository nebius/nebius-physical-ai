# Canonical Sim2Real VLM-to-RL 14-stage workflow.
#
# This is the only YAML that drives the staged engine. `npa workbench workflow
# submit` detects this exact file, materializes its task as a direct Kubernetes
# Job, stages the current checkout for the pre-push run, and lets the engine fan
# out its real `s2r-*` sibling Jobs. The similarly named npa.workflow files are
# explicitly non-production DSL demos; they never route to this engine.
#
# ---------------------------------------------------------------------------
# Trigger bucket & S3-compatible storage (operator checklist)
# ---------------------------------------------------------------------------
# Stage 1 reads a task-aligned Isaac trajectory seed from a trigger prefix.
# The same bucket also holds run artifacts (sim2real-b/<run-id>/…).
#
# | What | Runbook env (materialized) | Operator shell | npa configure / ~/.npa |
# | --- | --- | --- | --- |
# | Artifact + trigger parent bucket | NPA_SIM2REAL_BUCKET | S3_BUCKET (alias) | storage.bucket in ~/.npa/config.yaml |
# | S3-compatible endpoint | AWS_ENDPOINT_URL, S3_ENDPOINT_URL | AWS_ENDPOINT_URL | storage.endpoint_url in config.yaml |
# | Task seed trigger prefix (required) | NPA_SIM2REAL_TRIGGER_DATASET_URI | TRIGGER_DATASET_URI (alias) | storage.sim2real_stock_trigger_uri (seed path) |
# | Source dataset id | NPA_SIM2REAL_TRIGGER_DATASET_ID | TRIGGER_DATASET_ID (alias) | — |
# | S3 access keys (cluster Jobs) | via secretRef npa-storage-credentials | AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY | ~/.npa/credentials.yaml storage.aws_* |
#
# Trigger path shape (no s3:// on bucket-only vars):
#   s3://<your-bucket>/sim2real-triggers/<batch-id>/isaac-lift-cube-franka/
# It must contain task-dataset-manifest.json plus the referenced real Isaac
# rollout manifest/actions/camera frames. PushT data fails the task contract.
#
# External object-store bucket (GCS S3-compatible API):
#   storage.bucket: <your-object-store-bucket>
#   storage.endpoint_url: https://storage.googleapis.com
#     (or regional, e.g. https://storage.us-central1.rep.googleapis.com)
#   credentials.yaml: GCS HMAC keys as storage.aws_access_key_id / aws_secret_access_key
#   operator env: NPA_SIM2REAL_TRIGGER_DATASET_URI=s3://<your-object-store-bucket>/sim2real-triggers/<batch>/isaac-lift-cube-franka/
#
# Where to set values:
#   1. Persistent defaults — `npa configure` writes ~/.npa/config.yaml + credentials.yaml
#   2. Per-machine operator shell — ~/.npa/sim2real-operator.env (source before submit)
#   3. One-off overrides — `npa workbench workflow submit … --var KEY=VALUE`, or
#      source an env overlay (e.g. quickstart.env) into the shell before submit
#   4. Direct K8s submit — `npa workbench workflow submit` resolves config,
#      stages current source, materializes this task, and applies the Job.
#
# Seed a valid task-aligned trigger prefix before first submit, set
# storage.sim2real_stock_trigger_uri to it, and ensure the cluster's
# npa-storage-credentials secret carries AWS_ENDPOINT_URL plus HMAC keys.
#
# ---------------------------------------------------------------------------
# Configuration reference (operator env, runbook, config.yaml)
# ---------------------------------------------------------------------------
# | Concern | Where to set | Example vars |
# | --- | --- | --- |
# | Sim assets (scene/robot/cameras) | BYO URIs, stage 2 assets, operator env | ASSETS_URI, SCENE_SPEC_URI, CAMERAS_URI, NPA_SIM2REAL_CAMERAS_URI, ROBOT_SPEC_URI, NPA_SIM2REAL_ROBOT_SPEC_URI, ROBOT_PRESET, NPA_SIM2REAL_ROBOT_PRESET |
# | Artifact bucket vs trigger bucket | config.yaml, operator env, runbook NPA_SIM2REAL_* | NPA_SIM2REAL_BUCKET (alias S3_BUCKET), NPA_SIM2REAL_TRIGGER_DATASET_URI (alias TRIGGER_DATASET_URI), storage.bucket, storage.sim2real_stock_trigger_uri |
# | External object-store bucket | endpoint + HMAC keys | AWS_ENDPOINT_URL, S3_ENDPOINT_URL, storage.endpoint_url, ~/.npa/credentials.yaml storage.aws_* |
# | Task seed dataset | trigger URI, dataset id | NPA_SIM2REAL_TRIGGER_DATASET_URI, NPA_SIM2REAL_TRIGGER_DATASET_ID (alias TRIGGER_DATASET_ID), default npa/isaac-lift-cube-franka-seed-v1 |
# | Custom container images | operator env before submit | AUGMENT_IMAGE, ENVGEN_IMAGE, POLICY_IMAGE, TRAINER_IMAGE, VLM_IMAGE, VLM_REASON2_IMAGE, VLM_REASON3_IMAGE, EVAL_IMAGE, ISAAC_IMAGE, NPA_RERUN_VIEWER_IMAGE (alias NPA_SIM2REAL_RERUN_IMAGE) |
#
# Sim assets: Stage 2 reads ASSETS_URI and/or SCENE_SPEC_URI (and optional
# CAMERAS_URI / ROBOT_SPEC_URI). Leave empty for stock Franka/tabletop smoke.
# Trigger prefix may differ from artifact prefix on S3-compatible object stores — same bucket or not.
#
# Custom images: pass registry-qualified refs to workflow submit. Direct-K8s
# submit rejects unresolved real-component images rather than allowing a SEAM
# fallback. Reason2/Reason3 overrides are independently qualified; overriding
# VLM_IMAGE supplies both when their specific values are omitted. Set
# NPA_RERUN_VIEWER_IMAGE (or its legacy alias) to override the pinned viewer.
# The viewer is required only when both `NPA_SIM2REAL_RERUN` recording and
# `NPA_SIM2REAL_RERUN_SERVE` auto-serve are enabled.
#
# Every value below is a materialized literal and the `run` block expands env
# vars at container runtime. Operators override literals with repeated
# `workflow submit --var KEY=VALUE`; the direct-K8s submitter resolves the
# registry-qualified orchestrator and real-component images from NPA config.
#
# GPU-reaching path:
#   npa workbench workflow submit npa/workflows/sim2real.yaml \
#     --run-id <id> --var NPA_SIM2REAL_TRIGGER_DATASET_URI=s3://.../
#
# Service account, pull secrets, and env secrets are materialized below; do not
# bypass this route with a raw `sky jobs launch`.
#
# Timeout contract: NPA_SIM2REAL_K8S_JOB_TIMEOUT_S=0 is intentionally uncapped
# for full production loops. It omits Kubernetes activeDeadlineSeconds and keeps
# polling. Concrete compatible-GPU capacity failures are recorded and the
# ordered products are rechecked without a retry limit, preventing exact-size
# parallel batches from failing on a transient final-slot scheduling race.
# Failed Job counters, Job deletion, kubectl errors, image/runtime failures, and
# non-zero component exits still terminate the run. To impose a deadline, pass a
# positive number of seconds, for example
# `--var NPA_SIM2REAL_K8S_JOB_TIMEOUT_S=14400`.
name: sim2real-staged-loop
resources:
  cloud: kubernetes
  # The driver is control-plane only. Real GPU work is dispatched to `s2r-*`
  # sibling Jobs, so reserving a GPU here would reduce usable sibling capacity
  # and make a 16-GPU cluster able to run only 15 parallel evaluations.
  cpus: 16+
  memory: 64+
  image_id: "docker:example.invalid/npa-lerobot-vlm-rl:cuda13-b300-0.1.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z"
envs:
  # Headline env block (operator-facing knobs)
  NPA_SIM2REAL_RUN_ID: ""
  NPA_SIM2REAL_BUCKET: "example-bucket"
  NPA_SIM2REAL_PREFIX: "sim2real-b"
  NPA_SIM2REAL_TRIGGER_DATASET_URI: ""
  NPA_SIM2REAL_TRIGGER_DATASET_ID: "npa/isaac-lift-cube-franka-seed-v1"
  AWS_ENDPOINT_URL: ""
  S3_ENDPOINT_URL: ""
  ACTION_ROLLOUTS_URI: ""
  TRAIN_ENVS_URI: ""
  VALIDATION_ENVS_URI: ""
  HELDOUT_ENVS_URI: ""
  GOLD_HELDOUT_ENVS_URI: ""
  ASSETS_URI: ""
  SCENE_SPEC_URI: ""
  AUGMENT_IMAGE: ""
  ENVGEN_IMAGE: ""
  POLICY_IMAGE: ""
  TRAINER_IMAGE: ""
  VLM_IMAGE: ""
  VLM_REASON2_IMAGE: ""
  VLM_REASON3_IMAGE: ""
  EVAL_IMAGE: ""
  ISAAC_IMAGE: ""
  NPA_RERUN_VIEWER_IMAGE: ""
  NPA_REGISTRY: ""
  NPA_SIM2REAL_SIM_BACKEND: "isaac"
  NPA_SIM2REAL_ISAAC_TASK: "Isaac-Lift-Cube-Franka-v0"
  # Gated HF weights: accept Cosmos-Reason2-8B, Cosmos-Reason2-2B, and
  # Cosmos-Transfer2.5-2B on huggingface.co; mount HF_TOKEN via hf-ngc-tokens.
  VLM_MODEL: "nvidia/Cosmos-Reason2-8B"
  VLM_REASON2_MODEL: "nvidia/Cosmos-Reason2-8B"
  VLM_REASON3_MODEL: "nvidia/Cosmos-Reason2-2B"
  NPA_SIM2REAL_VLM_DUAL_REASON: "1"
  SUCCESS_THRESHOLD: "0.50"
  # Record the Stage 11 promotion decision, but run every configured outer pass.
  NPA_SIM2REAL_EARLY_EXIT: "0"
  INNER_ITERATIONS: "3"
  OUTER_ITERATIONS: "3"
  NPA_ENV_COUNT: "10000"
  NPA_TRAIN_FRACTION: "0.8"
  INITIAL_QUALITY: "0.0"
  LOOP_OF_LOOPS_ITERATIONS: "1"
  ROLLOUT_COUNT: "64"
  STEPS_PER_ROLLOUT: "32"
  # Execute a task-length trajectory and sample 32 evenly spaced decision/event
  # points for temporal credit; this is not a 32-simulation-step micro-rollout.
  NPA_SIM2REAL_ROLLOUT_HORIZON_STEPS: "300"
  # Cosmos sees every sampled decision/event frame and has enough output budget
  # for one compact, indexed critique per event. Real-tier validation rejects a
  # smaller frame window or a token budget below 64 tokens per event.
  NPA_COSMOS_REASON_MAX_FRAMES: "32"
  NPA_COSMOS_REASON_MAX_NEW_TOKENS: "4096"
  VALIDATION_ENV_COUNT: "64"
  HELDOUT_ENV_COUNT: "64"
  # Per-episode Isaac metric in metres. This is intentionally separate from
  # SUCCESS_THRESHOLD, which gates the aggregate held-out success rate.
  NPA_BYO_ISAAC_SUCCESS_DIST_M: "0.05"
  # Genuine RSL-RL PPO workload: 1024 envs × 500 iterations × 24 steps/env.
  # Allowed ranges are validated before submit: envs 1..65536, iterations
  # 1..1000000, and steps/env 1..16384.
  NPA_BYO_ISAAC_NUM_ENVS: "1024"
  NPA_BYO_ISAAC_ITERATIONS: "500"
  NPA_BYO_ISAAC_STEPS_PER_ENV: "24"
  # Validate durable numbered checkpoints every 100 PPO iterations and always
  # include the final checkpoint; selection uses validation, never gold-heldout.
  NPA_BYO_ISAAC_VALIDATION_INTERVAL: "100"
  # Native PPO optimizer initial LR (adaptive task schedule). Independent from
  # LEARNING_RATE, which applies only to the signal adapter/control attribution.
  NPA_BYO_ISAAC_PPO_LEARNING_RATE: "0.001"
  NPA_ENVGEN_SHARD_COUNT: "16"
  NPA_SIM2REAL_K8S_MAX_PARALLEL_GPUS: "16"
  # Advanced defaults (leave unless tuning specific infra/runtime behavior).
  # LEARNING_RATE is the VLM signal-adapter/no-signal-control step size. The
  # Isaac RSL-RL PPO optimizer remains owned by the selected task/agent config.
  SIGNAL_LOSS_WEIGHT: "1.0"
  LEARNING_RATE: "0.08"
  NO_GUARDRAILS: "0"
  # BYO_SIGNAL_CONVERTER: shell command run once per rollout instead of the
  # in-process critique->reward converter. Contract: it reads the VLM evaluation
  # JSON from $NPA_SIM2REAL_EVALUATION_JSON and writes an
  # npa.sim2real.rl_signal.v1 document to $NPA_SIM2REAL_OUTPUT_JSON (object with a
  # non-empty per_step list of {step, reward, advantage?, target?, error_tags?}).
  # A failing/empty/non-conforming command fails the run; it never falls back.
  BYO_SIGNAL_CONVERTER: ""
  # BYO_TRAINER_COMMAND: shell command run once per inner iteration instead of the
  # in-process reference trainer. Contract: it reads the parsed signal batch from
  # $NPA_SIM2REAL_SIGNAL_JSON and writes an update JSON to
  # $NPA_SIM2REAL_OUTPUT_JSON containing at least reward_head_after,
  # policy_output_after (list), and policy_delta_l2 (optional loss_before/after).
  # The no-signal control always uses the in-process reference trainer so policy-
  # delta attribution stays honest. A failing/empty/non-conforming command fails
  # the run; it never falls back.
  BYO_TRAINER_COMMAND: "python3 -m npa.workflows.sim2real.byo_isaac_trainer"
  # BYO_POLICY_COMMAND and BYO_EVAL_COMMAND are the real Isaac rollout/eval
  # twins used with the PPO trainer. They follow the same fail-closed command
  # contract: non-zero, missing, or malformed output fails the run.
  BYO_POLICY_COMMAND: "python3 -m npa.workflows.sim2real.byo_isaac_policy_rollout"
  BYO_VLM_COMMAND: ""
  BYO_EVAL_COMMAND: "python3 -m npa.workflows.sim2real.byo_isaac_eval"
  # Fail closed if any advertised real component or deployable checkpoint cannot
  # prove its registry/Kubernetes/byte-level artifact contract.
  NPA_SIM2REAL_REQUIRE_REAL_COMPONENTS: "1"
  # Comma-separated real Isaac camera views. The primary stream preserves the
  # established VLM/eval contract; side and overhead are captured in sync and
  # their depth clouds are fused in world coordinates for an orbitable Rerun 3D
  # view. Supported names: primary, side, overhead (aliases: front, left, top).
  NPA_SIM2REAL_CAMERA_VIEWS: "primary,side,overhead"
  # Real Isaac RGB/depth capture. Width 320..4096 px, height 240..2160 px;
  # strides are simulation steps between frames; PNG level is lossless 0..9;
  # FPS supplies truthful synthetic timeline timestamps for artifacts/viewers.
  NPA_SIM2REAL_CAPTURE_WIDTH: "640"
  NPA_SIM2REAL_CAPTURE_HEIGHT: "480"
  NPA_SIM2REAL_ROLLOUT_CAPTURE_STRIDE: "1"
  NPA_SIM2REAL_HELDOUT_CAPTURE_STRIDE: "20"
  NPA_SIM2REAL_PNG_COMPRESS_LEVEL: "3"
  NPA_SIM2REAL_CAPTURE_FPS: "10"
  # BYO_RERUN_COMMAND: optional shell command run instead of the in-process Rerun
  # emitter. Contract: reads the run dir from $NPA_SIM2REAL_RUN_DIR and report from
  # $NPA_SIM2REAL_REPORT_JSON, writes a non-empty .rrd to $NPA_SIM2REAL_OUTPUT_RRD.
  BYO_RERUN_COMMAND: ""
  # NPA_SIM2REAL_RERUN: "1" (default) emits reports/sim2real.rrd after the loop;
  # "0" disables it. Degrades to a WARN if rerun-sdk is not installed locally.
  NPA_SIM2REAL_RERUN: "1"
  NPA_SIM2REAL_MCAP: "1"
  # Fail Stage 14 if either enabled recording cannot be written. Keep this on
  # for operator/evidence runs; set 0 only for explicit degraded development.
  NPA_SIM2REAL_REQUIRE_VISUALIZATION: "1"
  # NPA_SIM2REAL_RERUN_SERVE: "1" (default) deploys hosted Rerun on mk8s after
  # successful S3 upload when NPA_SIM2REAL_RERUN=1; "0" skips auto-serve (manual
  # npa workbench sim2real rerun serve still available). One shared LB per cluster.
  NPA_SIM2REAL_RERUN_SERVE: "1"
  NPA_SIM2REAL_K8S_NAMESPACE: "default"
  NPA_SIM2REAL_K8S_SERVICE_ACCOUNT: "agent-sa"
  NPA_SIM2REAL_K8S_IMAGE_PULL_SECRETS: "agent-sa,ngc-nvcr-imagepullsecret,npa-nebius-registry"
  NPA_SIM2REAL_K8S_ENV_SECRET_NAMES: "hf-ngc-tokens,npa-storage-credentials"
  NPA_SIM2REAL_K8S_GPU_RESOURCE: "nvidia.com/gpu"
  NPA_SIM2REAL_K8S_GPU_PRODUCT: "NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition"
  # Optional ordered aliases/labels. Actual candidates are normalized against
  # nvidia.com/gpu.product labels in the target cluster. Isaac stages always
  # filter this list to RT-core L40S / RTX PRO 6000 products. Retries require
  # concrete GPU Unschedulable/capacity evidence; runtime/image/credential
  # failures remain failures on the selected product.
  # Taints, cordons, and NotReady nodes alone do NOT switch products. That
  # placement state fails closed unless the scheduler also reports insufficient
  # nvidia.com/gpu or a concrete product-selector/affinity mismatch. Inspect
  # `kubectl describe node`, Job/Pod events, readiness, and tolerations; remediate
  # the cluster state, then resubmit. Do not broaden this into a generic retry.
  # If an image tag advertises CUDA architecture markers, RTX PRO 6000 requires
  # sm120/compute120. L40S accepts proven same-major sm80/sm89 (or compute80/89),
  # never incompatible sm90 SASS. Isaac still excludes H100/H200/B200/B300.
  NPA_SIM2REAL_K8S_GPU_CANDIDATES: "RTX PRO 6000,L40S"
  # Explicit operator acceptance is required by the Isaac image bootstrap.
  # Never hardcode YES here; pass both with --var after accepting the licenses.
  OMNI_KIT_ACCEPT_EULA: ""
  ISAACSIM_ACCEPT_EULA: ""
  # Optional stricter per-model floor; incompatible products are filtered before submit.
  NPA_SIM2REAL_MIN_GPU_VRAM_GB: ""
  # 0 means no workflow/sibling Job deadline. Failed counters, deleted Jobs,
  # kubectl errors, and component failures still terminate. Set a positive
  # number of seconds only when intentionally opting into a deadline.
  NPA_SIM2REAL_K8S_JOB_TIMEOUT_S: "0"
  NPA_BYO_ISAAC_JOB_TIMEOUT_S: "0"
  NPA_SIM2REAL_HELDOUT_EVAL_LIMIT: "0"
  NPA_SOURCE_REPO: ""
  NPA_SOURCE_REF: ""
  # Direct-K8s submit uploads the current checkout here so the real run proves
  # the unpushed implementation under test instead of whatever an image baked.
  NPA_SIM2REAL_SOURCE_TARBALL_URI: ""
setup: |
  set -euo pipefail
  if [ -n "${NPA_SIM2REAL_SOURCE_TARBALL_URI:-}" ]; then
    python3 -c "import boto3" 2>/dev/null || python3 -m pip install --quiet boto3 botocore
    rm -rf /tmp/npa-orchestrator-source ./npa
    mkdir -p /tmp/npa-orchestrator-source
    python3 - "${NPA_SIM2REAL_SOURCE_TARBALL_URI}" <<'PY'
  import os
  import sys
  import tarfile
  import urllib.parse

  import boto3

  uri = urllib.parse.urlparse(sys.argv[1])
  endpoint = os.environ.get("AWS_ENDPOINT_URL") or os.environ.get("S3_ENDPOINT_URL") or None
  archive = "/tmp/npa-orchestrator-source.tgz"
  boto3.client("s3", endpoint_url=endpoint).download_file(uri.netloc, uri.path.lstrip("/"), archive)
  with tarfile.open(archive) as source:
      source.extractall("/tmp/npa-orchestrator-source")
  PY
    ln -s /tmp/npa-orchestrator-source/npa ./npa
  fi
  if [ ! -f ./npa/pyproject.toml ]; then
    if [ -z "${NPA_SOURCE_REPO:-}" ]; then
      echo "ERROR: NPA_SOURCE_REPO is required when the source tree is not mounted." >&2
      exit 2
    fi
    rm -rf ./npa-source ./npa
    git clone --depth 1 --branch "${NPA_SOURCE_REF:-main}" "${NPA_SOURCE_REPO}" ./npa-source
    ln -s ./npa-source/npa ./npa
  fi
  export PYTHONPATH="$(pwd)/npa/src:${PYTHONPATH:-}"
  # The orchestration image may already run inside a read-only virtualenv.
  # Put the bootstrap executable in scratch space so neither user-site nor
  # base-environment permissions affect a fresh canonical run.
  rm -rf /tmp/npa-bootstrap-uv
  python3 -m pip install --quiet --target /tmp/npa-bootstrap-uv "uv>=0.9,<1"
  export PATH="/tmp/npa-bootstrap-uv/bin:${PATH}"
  uv python install 3.11
  uv venv --python 3.11 --seed ./npa/.venv
  ./npa/.venv/bin/python -m pip install --upgrade pip setuptools wheel
  # Stage 14 is required evidence, not an optional WARN in the canonical run:
  # install the pinned Rerun SDK through the repository's viz extra.
  ./npa/.venv/bin/python -m pip install -e './npa[viz]'
  if ! command -v kubectl >/dev/null 2>&1; then
    curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.33.7/bin/linux/amd64/kubectl"
    chmod +x /tmp/kubectl
  fi
run: |
  set -euo pipefail
  export PATH="/tmp:$(pwd)/npa/.venv/bin:${PATH}"
  export PYTHONPATH="$(pwd)/npa/src:${PYTHONPATH:-}"

  bucket="${NPA_SIM2REAL_BUCKET:-${S3_BUCKET:-}}"
  if [ -z "${bucket}" ] || [ "${bucket}" = "example-bucket" ]; then
    echo "ERROR: set NPA_SIM2REAL_BUCKET to a real bucket (override the example literal)." >&2
    exit 2
  fi

  run_id="${NPA_SIM2REAL_RUN_ID:-sim2real-$(date -u +%Y%m%dT%H%M%SZ)}"
  output_dir="/tmp/npa-sim2real-${run_id}"
  mkdir -p "${output_dir}"
  common_args=(
    --run-id "${run_id}"
    --output-dir "${output_dir}"
    --s3-bucket "${bucket}"
    --s3-prefix "${NPA_SIM2REAL_PREFIX:-sim2real-b}"
    --s3-endpoint "${AWS_ENDPOINT_URL:-${S3_ENDPOINT_URL:-}}"
    --trigger-dataset-uri "${NPA_SIM2REAL_TRIGGER_DATASET_URI:-}"
    --trigger-dataset-id "${NPA_SIM2REAL_TRIGGER_DATASET_ID:-npa/isaac-lift-cube-franka-seed-v1}"
    --action-rollouts-uri "${ACTION_ROLLOUTS_URI:-}"
    --train-envs-uri "${TRAIN_ENVS_URI:-}"
    --validation-envs-uri "${VALIDATION_ENVS_URI:-}"
    --heldout-envs-uri "${HELDOUT_ENVS_URI:-}"
    --gold-heldout-envs-uri "${GOLD_HELDOUT_ENVS_URI:-}"
    --assets-uri "${ASSETS_URI:-}"
    --scene-spec-uri "${SCENE_SPEC_URI:-}"
    --augment-image "${AUGMENT_IMAGE:-}"
    --envgen-image "${ENVGEN_IMAGE:-}"
    --policy-image "${POLICY_IMAGE:-}"
    --trainer-image "${TRAINER_IMAGE:-npa-lerobot-vlm-rl:cuda13-b300-0.1.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z}"
    --vlm-image "${VLM_IMAGE:-npa-cosmos3-reason:cuda13-b300-3.0.1-sm80-sm90-sm100-sm103-sm120-20260803T034152Z}"
    --eval-image "${EVAL_IMAGE:-npa-loop-eval:cuda13-b300-0.1.3-sm80-sm90-sm100-sm103-sm120-20260803T034152Z}"
    --isaac-image "${ISAAC_IMAGE:-npa-isaac-lab:2.3.2.post1}"
    --sim-backend "${NPA_SIM2REAL_SIM_BACKEND:-isaac}"
    --isaac-task "${NPA_SIM2REAL_ISAAC_TASK:-Isaac-Lift-Cube-Franka-v0}"
    --vlm-model "${VLM_MODEL:-nvidia/Cosmos-Reason2-8B}"
    --vlm-reason2-model "${VLM_REASON2_MODEL:-nvidia/Cosmos-Reason2-8B}"
    --vlm-reason3-model "${VLM_REASON3_MODEL:-nvidia/Cosmos-Reason2-2B}"
    --vlm-reason2-image "${VLM_REASON2_IMAGE:-${VLM_IMAGE:-}}"
    --vlm-reason3-image "${VLM_REASON3_IMAGE:-${VLM_IMAGE:-}}"
    --vlm-dual-reason
    --threshold "${SUCCESS_THRESHOLD:-0.50}"
    --inner-iterations "${INNER_ITERATIONS:-3}"
    --outer-iterations "${OUTER_ITERATIONS:-3}"
    --env-count "${NPA_ENV_COUNT:-10000}"
    --train-fraction "${NPA_TRAIN_FRACTION:-0.8}"
    --loop-of-loops-iterations "${LOOP_OF_LOOPS_ITERATIONS:-1}"
    --rollout-count "${ROLLOUT_COUNT:-64}"
    --steps-per-rollout "${STEPS_PER_ROLLOUT:-32}"
    --validation-env-count "${VALIDATION_ENV_COUNT:-64}"
    --heldout-env-count "${HELDOUT_ENV_COUNT:-64}"
    --signal-loss-weight "${SIGNAL_LOSS_WEIGHT:-1.0}"
    --learning-rate "${LEARNING_RATE:-0.08}"
    --byo-signal-converter "${BYO_SIGNAL_CONVERTER:-}"
    --byo-trainer-command "${BYO_TRAINER_COMMAND:-}"
    --byo-policy-command "${BYO_POLICY_COMMAND:-}"
    --byo-vlm-command "${BYO_VLM_COMMAND:-}"
    --byo-eval-command "${BYO_EVAL_COMMAND:-}"
    --byo-rerun-command "${BYO_RERUN_COMMAND:-}"
    --k8s-namespace "${NPA_SIM2REAL_K8S_NAMESPACE:-default}"
    --k8s-service-account "${NPA_SIM2REAL_K8S_SERVICE_ACCOUNT:-agent-sa}"
    --k8s-image-pull-secrets "${NPA_SIM2REAL_K8S_IMAGE_PULL_SECRETS:-agent-sa,ngc-nvcr-imagepullsecret,npa-nebius-registry}"
    --k8s-env-secret-names "${NPA_SIM2REAL_K8S_ENV_SECRET_NAMES:-hf-ngc-tokens,npa-storage-credentials}"
    --k8s-gpu-resource "${NPA_SIM2REAL_K8S_GPU_RESOURCE:-nvidia.com/gpu}"
    --k8s-gpu-product "${NPA_SIM2REAL_K8S_GPU_PRODUCT:-NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition}"
    --k8s-gpu-candidates "${NPA_SIM2REAL_K8S_GPU_CANDIDATES:-RTX PRO 6000,L40S}"
    --k8s-job-timeout-s "${NPA_SIM2REAL_K8S_JOB_TIMEOUT_S:-0}"
    --envgen-shard-count "${NPA_ENVGEN_SHARD_COUNT:-16}"
    --k8s-max-parallel-gpus "${NPA_SIM2REAL_K8S_MAX_PARALLEL_GPUS:-16}"
    --source-repo "${NPA_SOURCE_REPO:-}"
    --source-ref "${NPA_SOURCE_REF:-}"
    --heldout-eval-limit "${NPA_SIM2REAL_HELDOUT_EVAL_LIMIT:-0}"
  )

  case "${NPA_SIM2REAL_EARLY_EXIT:-0}" in
    1|true|TRUE|yes|YES|on|ON) common_args+=(--early-exit) ;;
    0|false|FALSE|no|NO|off|OFF|"") common_args+=(--no-early-exit) ;;
    *) echo "ERROR: NPA_SIM2REAL_EARLY_EXIT must be boolean" >&2; exit 2 ;;
  esac

  ./npa/.venv/bin/python -m npa.workflows.sim2real run \
    "${common_args[@]}" \
    --initial-quality "${INITIAL_QUALITY:-0.0}" \
    --upload-artifacts
