# Habitat-Sim headless EGL + Bullet smoke on exactly one RTX PRO 6000
# Blackwell. The cluster itself must be backed by an operator-verified STRICT
# capacity reservation; this profile pins the pod shape and prevents a B200
# renderer placement.
name: byof-solution-smoke-habitat-sim-rtxpro-gpu
execution: serial
---
name: byof-solution-smoke-habitat-sim-rtxpro
resources:
  cloud: kubernetes
  accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
  cpus: 8+
  memory: 32+
  disk_size: 100
  image_id: "docker:<your-registry>/<namespace>/npa-byof:<your-run-id>"
envs:
  NPA_BYOF_RUN_ID: "<your-run-id>"
  BYOF_REPO_ROOT: "/opt/byof"
  BYOF_SMOKE_COMMAND: ""
  BYOF_SOLUTION_NAME: ""
  BYOF_CAPABILITY_NAME: ""
  BYOF_SMOKE_ARTIFACT_NAME: ""
  BYOF_IMAGE: ""
  NVIDIA_DRIVER_CAPABILITIES: "compute,graphics,utility"
  S3_OUTPUT_PREFIX: "s3://${NPA_S3_BUCKET}/byof/${NPA_BYOF_RUN_ID}/"
  AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
setup: |
  set -euo pipefail
  test -d "${BYOF_REPO_ROOT}"
  test -f "${BYOF_REPO_ROOT}/npa_source_metadata.json"
  python3 - <<'PY'
  import boto3
  import botocore
  PY
run: |
  set -euo pipefail
  OUTPUT_DIR="/workspace/byof-runs/${NPA_BYOF_RUN_ID}"
  mkdir -p "${OUTPUT_DIR}"
  export NPA_SMOKE_OUTPUT_DIR="${OUTPUT_DIR}"
  cp "${BYOF_REPO_ROOT}/npa_source_metadata.json" "${OUTPUT_DIR}/npa_source_metadata.json"
  cp "${BYOF_REPO_ROOT}/npa_habitat_requirements.lock" "${OUTPUT_DIR}/npa_habitat_requirements.lock"
  cp "${BYOF_REPO_ROOT}/npa_python_packages.txt" "${OUTPUT_DIR}/npa_python_packages.txt"
  cp "${BYOF_REPO_ROOT}/npa_debian_packages.txt" "${OUTPUT_DIR}/npa_debian_packages.txt"
  nvidia-smi > "${OUTPUT_DIR}/nvidia_smi.txt" 2>&1 || true
  nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader,nounits \
    > "${OUTPUT_DIR}/nvidia_smi_gpu_identity.txt" 2>&1 || true
  ldconfig -p 2>/dev/null | grep -E 'libEGL|libGLX_nvidia' \
    > "${OUTPUT_DIR}/egl_libraries.txt" 2>&1 || true
  ls -la /usr/share/glvnd/egl_vendor.d /etc/glvnd/egl_vendor.d \
    > "${OUTPUT_DIR}/egl_vendor_listing.txt" 2>&1 || true
  SMOKE_EXIT_CODE=0
  if [ -n "${BYOF_SMOKE_COMMAND}" ]; then
    set +e
    (
      cd "${BYOF_REPO_ROOT}"
      /bin/bash -lc "${BYOF_SMOKE_COMMAND}"
    ) > "${OUTPUT_DIR}/solution_smoke_stdout.log" 2> "${OUTPUT_DIR}/solution_smoke_stderr.log"
    SMOKE_EXIT_CODE=$?
    set -e
  fi
  if [ -n "${BYOF_SMOKE_COMMAND}" ] && [ -n "${BYOF_SMOKE_ARTIFACT_NAME}" ] && [ "${SMOKE_EXIT_CODE}" -eq 0 ]; then
    test -f "${OUTPUT_DIR}/${BYOF_SMOKE_ARTIFACT_NAME}"
  fi
  export SMOKE_EXIT_CODE
  python3 <<'PY'
  import json
  import os
  import time
  from pathlib import Path
  from urllib.parse import urlparse

  import boto3
  from botocore.config import Config

  run_id = os.environ["NPA_BYOF_RUN_ID"]
  root = Path(f"/workspace/byof-runs/{run_id}")
  metadata = json.loads(
      (Path(os.environ["BYOF_REPO_ROOT"]) / "npa_source_metadata.json").read_text(
          encoding="utf-8"
      )
  )
  smoke_exit_code = int(os.environ.get("SMOKE_EXIT_CODE", "0"))
  summary = {
      "status": "success" if smoke_exit_code == 0 else "failed",
      "tool": "byof",
      "workload": "solution-smoke-habitat-sim-rtxpro",
      "run_id": run_id,
      "image": os.environ.get("BYOF_IMAGE", ""),
      "repo_root": os.environ["BYOF_REPO_ROOT"],
      "metadata": metadata,
      "solution_name": os.environ.get("BYOF_SOLUTION_NAME", ""),
      "capability_name": os.environ.get("BYOF_CAPABILITY_NAME", ""),
      "smoke_command": os.environ.get("BYOF_SMOKE_COMMAND", ""),
      "smoke_artifact_name": os.environ.get("BYOF_SMOKE_ARTIFACT_NAME", ""),
      "smoke_exit_code": smoke_exit_code,
      "created_unix": round(time.time(), 3),
  }
  (root / "npa_byof_summary.json").write_text(
      json.dumps(summary, indent=2), encoding="utf-8"
  )
  print(json.dumps(summary, indent=2), flush=True)

  output = os.environ["S3_OUTPUT_PREFIX"].rstrip("/") + "/"
  parsed = urlparse(output)
  if parsed.scheme == "s3" and parsed.netloc:
      endpoint = (
          os.environ.get("AWS_ENDPOINT_URL")
          or os.environ.get("NEBIUS_S3_ENDPOINT")
          or ""
      ).strip() or None
      kwargs = {
          "endpoint_url": endpoint,
          "config": Config(s3={"addressing_style": "path"}),
          "region_name": os.environ.get("AWS_DEFAULT_REGION", "us-central1"),
      }
      access_key = (os.environ.get("AWS_ACCESS_KEY_ID") or "").strip()
      secret_key = (os.environ.get("AWS_SECRET_ACCESS_KEY") or "").strip()
      session_token = (os.environ.get("AWS_SESSION_TOKEN") or "").strip()
      if access_key and secret_key:
          kwargs["aws_access_key_id"] = access_key
          kwargs["aws_secret_access_key"] = secret_key
          if session_token:
              kwargs["aws_session_token"] = session_token
      s3 = boto3.client("s3", **kwargs)
      prefix = parsed.path.lstrip("/")
      uploaded = 0
      for path in root.rglob("*"):
          if path.is_file():
              key = prefix + str(path.relative_to(root))
              s3.put_object(
                  Bucket=parsed.netloc,
                  Key=key,
                  Body=path.read_bytes(),
                  IfNoneMatch="*",
              )
              uploaded += 1
      summary_key = prefix + "npa_byof_summary.json"
      s3.head_object(Bucket=parsed.netloc, Key=summary_key)
      if smoke_exit_code == 0:
          proof_path = root / os.environ["BYOF_SMOKE_ARTIFACT_NAME"]
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          required_paths = [
              proof_path,
              root / "npa_habitat_requirements.lock",
              root / "npa_python_packages.txt",
              root / "npa_debian_packages.txt",
          ]
          for frame in proof["rendered_observations"]["frames"]:
              required_paths.extend(
                  root / frame[key]
                  for key in (
                      "rgb_png_path",
                      "depth_npy_path",
                      "depth_preview_png_path",
                  )
              )
          for path in required_paths:
              key = prefix + str(path.relative_to(root))
              head = s3.head_object(Bucket=parsed.netloc, Key=key)
              if int(head.get("ContentLength", -1)) != path.stat().st_size:
                  raise RuntimeError(f"uploaded artifact size mismatch: {path.name}")
      print(f"uploaded_file_count={uploaded}", flush=True)
  PY
  if [ "${SMOKE_EXIT_CODE}" -ne 0 ]; then
    exit "${SMOKE_EXIT_CODE}"
  fi
