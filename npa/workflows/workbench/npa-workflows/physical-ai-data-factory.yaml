apiVersion: npa.workflow/v0.0.1
kind: Workflow

# Reference blueprint: the NVIDIA Physical AI Data Factory, implemented natively
# on Nebius + SkyPilot with NO OSMO orchestrator and NO new workbench tool -- it
# is pure composition of existing NPA workbench tools.
#
# NVIDIA blueprint (OSMO-orchestrated) -> NPA mapping:
#
#   Stage 1  Config Generation      -> generate-configs   (sample appearance-only
#                                       augmentation variables -> configs manifest)
#   Stage 2a Understand & Annotate   -> annotate-original  (Token Factory VLM dense
#                                       captioning of source video frames)
#   Stage 2b Augment & Multiply      -> augment            (Cosmos Transfer 2.5,
#                                       appearance-only re-render; GPU tier)
#            Evaluate & Validate      -> grade loop         (NVIDIA Cosmos Evaluator
#                                       checks + NPA source-relative temporal
#                                       consistency + appearance fidelity, then
#                                       a fail-closed gate)
#   Stage 3  Pseudo-Label Augmented  -> annotate-augmented (re-caption the augmented
#                                       clips so the amplified set ships labeled)
#   Stage 4  Curation                -> cosmos-curate      (NVIDIA Cosmos Curator:
#                                       split / transcode / motion-score / catalog)
#                                    -> curate             (real FiftyOne Brain review
#                                       over the curated set)
#            Finalize                 -> finalize          (graded-dataset report)
#
# The three NVIDIA components the blueprint names are all the real open-source
# projects, not stand-ins: Cosmos Transfer 2.5 augments, Cosmos Evaluator
# (https://github.com/nvidia-cosmos/cosmos-evaluator) grades, and Cosmos Curator
# (https://github.com/nvidia-cosmos/cosmos-curate) curates. Both evaluator and
# curator are Apache-2.0; see skills/NOTICE-NVIDIA-COSMOS-OSS.
#
# Runtime placement (see docs/workbench/guides/physical-ai-data-factory.md):
#   Token Factory (zero-GPU, hosted): captioning, and the Cosmos Evaluator
#     attribute-verification check's LLM + VLM calls. Verified models:
#     Qwen/Qwen2.5-VL-72B-Instruct (VLM), nvidia/Cosmos3-Super-Reasoner
#     (Cosmos-family critic), meta-llama/Llama-3.3-70B-Instruct (LLM).
#   GPU (Nebius Managed K8s): Cosmos Transfer 2.5 augmentation only.
#   CPU: config sampling, the evaluator's hallucination check, Cosmos Curator
#     curation, FiftyOne review, finalize.
#
# Orchestration is SkyPilot (npa workbench workflow submit); every stage hands off
# through S3 under a single run prefix so input / intermediate / output artifacts
# are all discoverable in the NPA agent artifact browser
# (GET /api/artifacts/runs?prefix=physical-ai-data-factory).
#
# ─────────────────────────────────────────────────────────────────────────────
# STARTER INPUT -- PREPARED AND VERIFIED BEFORE GPU PROVISIONING
# ─────────────────────────────────────────────────────────────────────────────
# The operator-side submit command prepares input/ before image preflight or
# provisioning. With no selector it fetches the pinned RoboPro physical capture;
# --input-video and --input-uri replace it. The verified source is normalized to
# a 93-frame H.264 conditioning clip and eight captionable frames under:
#
#     s3://{{config.bucket}}/physical-ai-data-factory/<run-id>/input/
#
# --seed-fixture is the only path that generates geometric frames. It is explicit
# synthetic developer/test data and never a production default or fallback.
#
# Every augment is input-conditioned by input/conditioning.mp4 through the
# catalog's mandatory --condition-on-input flag (equivalent to
# NPA_COSMOS_CONDITION_ON_INPUT=1). No decorative fixed control or fallback media
# is used.
#
# Copy-paste default/local/S3/fixture selectors and provenance details:
#   docs/workbench/guides/physical-ai-data-factory-deploy.md  ("Select the starter input")
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  name: physical-ai-data-factory
  description: >
    NVIDIA Physical AI Data Factory implemented on Nebius + SkyPilot without OSMO:
    config-gen -> annotate (Token Factory VLM) -> augment (Cosmos Transfer 2.5, GPU)
    -> evaluate/validate gate loop (Cosmos Evaluator + source-relative fidelity) ->
    fail-closed quality disposition -> re-label augmented ->
    Cosmos Curator curation -> FiftyOne review -> finalize. Pure composition of
    existing workbench tools; artifacts land under one S3 run prefix for NPA-agent
    artifact viewing.

config:
  bucket: example-bucket
  prefix: "physical-ai-data-factory/{{run.id}}"

  # --- Augmentation + grading knobs (Stage 1 + Evaluate loop) ---
  # Synthetic geometry is an explicit developer/test opt-in via --seed-fixture.
  # The old spelling remains false for already-explicit compatibility automation.
  seed_fixture: "false"
  seed_default_input: "false"
  n_augmentations: "2"            # augmented variants sampled per source video
  augment_subject: "the input robot clips"  # included in sampled Cosmos prompts
  refinement_iterations: "2"      # max evaluate/validate passes before reject
  grade_threshold: "0.75"         # min aggregate score to promote (else loop_back)
  # NPA temporal residual is advisory until a deployment calibrates its fixed
  # noise floor. Set mode=required only with representative encoded clips.
  temporal_consistency_mode: advisory
  temporal_consistency_threshold: "0.8"
  temporal_noise_floor: "0.25"
  temporal_blur_ksize: "7"
  # Optional JSON normalized rectangles. Empty uses full frame + a 2x2 grid so
  # localized instability cannot hide inside a clean frame-wide average.
  temporal_regions_json: ""
  # Source-relative protected-appearance fidelity separates intended bounded
  # exposure/white-balance changes from excessive global colour cast, localized
  # material recolouring, and frame-to-frame chroma drift. Keep it advisory for
  # generic workflows that intentionally recolour arbitrary scene regions. Set
  # mode=required and, when appropriate, provide normalized protected rectangles
  # for deployments whose prompts promise stable base colours/material identity.
  appearance_fidelity_mode: advisory
  appearance_fidelity_threshold: "0.8"
  appearance_luminance_tolerance: "18.0"
  appearance_global_chroma_tolerance: "8.0"
  appearance_local_chroma_tolerance: "6.0"
  appearance_chroma_instability_tolerance: "4.0"
  appearance_blur_ksize: "7"
  appearance_max_dimension: "256"
  # Empty uses full frame + a 2x2 grid. A deployment can instead name normalized
  # rectangles, e.g. [{"id":"protected-0","bounds":[0.1,0.1,0.4,0.5]}].
  appearance_regions_json: ""
  default_decision: loop_back

  # --- Cosmos Curator knobs (Stage 4) ---
  # Fixed-stride clip length the curator segments each augmented variant into, and
  # the floor below which a trailing segment is dropped. motion_filter=score-only
  # records upstream's motion scores without discarding low-motion clips.
  curator_clip_len_s: "3"
  curator_min_clip_len_s: "1"
  curator_motion_filter: score-only
  fiftyone_dedup_threshold: "0.10"

  # --- Models (verified available on Nebius Token Factory) ---
  caption_model: "Qwen/Qwen2.5-VL-72B-Instruct"
  vlm_backend: api
  max_images: "8"
  max_tokens: "512"

  # --- S3 artifact layout: input / intermediate / output under one run prefix ---
  # input_uri / images_uri must contain PNG/JPEG frames for captioning. The
  # managed transfer path prefers a supported video when present, otherwise it
  # assembles those frames into a temporary conditioning clip. Missing inputs
  # fail before their respective caption/inference work starts.
  input_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/"
  images_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/"
  configs_uri: "s3://{{config.bucket}}/{{config.prefix}}/configs/"
  captions_uri: "s3://{{config.bucket}}/{{config.prefix}}/labeled_original/"
  trigger_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/"
  augment_uri: "s3://{{config.bucket}}/{{config.prefix}}/cosmos_augmented/"
  augment_manifest_uri: "s3://{{config.bucket}}/{{config.prefix}}/cosmos_augmented/manifest.json"
  rollouts_uri: "s3://{{config.bucket}}/{{config.prefix}}/cosmos_augmented/"
  scores_uri: "s3://{{config.bucket}}/{{config.prefix}}/grade/"
  decision_uri: "s3://{{config.bucket}}/{{config.prefix}}/grade/decision.json"
  quality_disposition_uri: "s3://{{config.bucket}}/{{config.prefix}}/grade/quality_disposition.json"
  augmented_frames_uri: "s3://{{config.bucket}}/{{config.prefix}}/cosmos_augmented/"
  labeled_augmented_uri: "s3://{{config.bucket}}/{{config.prefix}}/labeled_augmented/"
  # lance_uri = the dataset the curate stage declares as its input (its `inputs:`
  # block references {{config.lance_uri}}). The "lance" name is a LanceDB-era
  # carryover from the AV/BDD100K curation pipelines; this video blueprint has no
  # LanceDB table, so it simply points at the augmented set (same prefix as
  # augment_uri) -- i.e. "the data to curate". The curate stage itself runs a
  # real FiftyOne Brain review over augment_uri.
  lance_uri: "s3://{{config.bucket}}/{{config.prefix}}/cosmos_augmented/"
  # Cosmos Curator writes its own canonical tree (clips/ metas/v0/ processed_videos/)
  # under curated_clips_uri, and its summary under curator_report_uri; the FiftyOne
  # review stage reads that summary and merges it into the curation report.
  curated_clips_uri: "s3://{{config.bucket}}/{{config.prefix}}/curation/cosmos_curator/"
  curator_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/curation/cosmos_curator.json"
  curation_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/curation/report.json"
  # run_root_uri = the run prefix (holds input/ + cosmos_augmented/ + labeled_*/);
  # the visualize stage reads it to build a Rerun recording.
  run_root_uri: "s3://{{config.bucket}}/{{config.prefix}}/"
  rrd_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/sim2real.rrd"
  finalize_report_uri: "s3://{{config.bucket}}/{{config.prefix}}/reports/final.json"
  input_provenance_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/provenance.json"
  input_source_kind: ""
  input_origin: ""
  input_origin_label: ""
  input_sha256: ""
  input_license: ""
  input_staged_uri: "s3://{{config.bucket}}/{{config.prefix}}/input/"
  input_authoritative_url: ""
  input_immutable_revision: ""
  input_attribution: ""

resources:
  gpu:
    cloud: kubernetes
    # Canonical SkyPilot name. Clusters that advertise a different product name
    # (e.g. RTXPRO-6000-BLACKWELL-SERVER-EDITION) can override at submit time with
    # NPA_WORKFLOW_GPU_ACCELERATOR=<name>:1 (see skypilot_render.normalize_resources).
    #
    # MULTI-GPU FAN-OUT: request N GPUs (e.g. RTXPRO6000:4) and the augment stage
    # fans the N scenario-variant diffusions across them, one variant per GPU
    # (auto-detected, or set NPA_COSMOS_VARIANT_PARALLELISM). N variants then run
    # in ~one variant's wall-clock instead of N x. Keep :1 for a single-GPU run.
    accelerators: RTXPRO6000:1
    # Host-side model loading/checkpoint materialization scales with the
    # multi-GPU variant fan-out. Keep enough CPU/RAM headroom for a 4-GPU
    # override instead of OOM-killing four concurrent Cosmos workers.
    cpus: 16
    memory: 128Gi
    # Provision the cluster through npa before submit if its context is absent,
    # so one `npa workbench workflow submit ...` covers the whole
    # path (prerequisite check -> provision -> stage source -> launch) without a
    # blueprint-specific command. `npa provision-if-absent` beforehand is still
    # fine, and `--no-deploy-if-absent` opts out. The GPU quota gate in
    # `npa cluster up` refuses before spending anything when quota is short.
    deployIfAbsent: true
  cpu:
    cloud: kubernetes
    # The same cluster serves both profiles, so only the GPU one declares
    # deployIfAbsent; these requests must fit its CPU node (see
    # tests/guardrails/test_default_cluster_fits_quickstart.py).
    cpus: 4
    memory: 16Gi

initial: generate-configs

states:
  generate-configs:
    description: >
      Stage 1 - Config Generation. Sample appearance-only augmentation variable
      combinations (lighting / background / color_grade / surface_finish) and write a
      per-run config manifest that drives the augment stage.
    resources: cpu
    run:
      argv:
        - python3
        - -c
        - >-
          import sys; from npa.workflows.data_factory_stages import generate_configs;
          generate_configs(*sys.argv[1:])
        - "{{config.configs_uri}}"
        - "{{config.n_augmentations}}"
        - "{{run.id}}"
        - "{{config.images_uri}}"
        - "{{config.seed_default_input}}"
        - "{{config.seed_fixture}}"
        - "{{config.augment_subject}}"
    outputs:
      - uri: "{{config.configs_uri}}manifest.json"
        schema: npa.data_factory.configs.v1
      - uri: "{{config.input_provenance_uri}}"
        schema: npa.paidf.input-provenance.v1
    next: annotate-original

  annotate-original:
    description: >
      Stage 2a - Understand & Annotate. Dense-caption the derived conditioning
      frames with a hosted Token Factory VLM (zero-GPU). The operator-side prepare
      step extracts these from the verified source; fixture mode creates explicitly
      synthetic frames. Missing input fails before provisioning or stage execution.
    needs: [generate-configs]
    toolRef: workbench.token_factory.caption
    resources: cpu
    inputs:
      - uri: "{{config.images_uri}}"
        schema: npa.data_factory.frames.v1
    outputs:
      - uri: "{{config.captions_uri}}captions.json"
        schema: npa.token_factory.captions.v1
    next: grade

  augment:
    description: >
      Stage 2b - Augment & Multiply. Cosmos Transfer 2.5 runs ONE inference per
      sampled appearance combo (config.n_augmentations), so N combos -> N scenario
      variants, each published as its own cosmos_augmented/<clip>/ dir (GPU tier).
      Appearance-only: lighting, background, color grade, surface finish -- never scene
      geometry.
      Every managed variant conditions on the prepared 93-frame
      input/conditioning.mp4 selected from trigger_uri, preserving geometry/motion
      while changing appearance. The mandatory --condition-on-input catalog flag
      prevents the staged source from being decorative. Missing or inaccessible
      input fails closed; no bundled or geometric fallback is available.
      This is a member of the `grade`
      refinement loop: on a loop_back decision the loop re-runs augment (re-render),
      re-verify, and re-gate, so a failed batch is actually re-augmented.
    needs: [annotate-original]
    toolRef: workbench.cosmos2.transfer_execute
    resources: gpu
    inputs:
      - uri: "{{config.trigger_uri}}"
        schema: npa.data_factory.frames.v1
    outputs:
      - uri: "{{config.augment_manifest_uri}}"
        schema: npa.cosmos2.transfer.v1

  grade:
    description: >
      Augment & Evaluate refinement loop. Each iteration: augment (Cosmos Transfer
      2.5, GPU) -> evaluate (Cosmos Evaluator) -> quality-gate. Loops back to
      RE-AUGMENT on failure, up to refinement_iterations, and breaks as soon as the
      gate promotes. augment lives INSIDE the loop so loop_back genuinely re-renders
      (the gate's loop_back decision drives another augment pass via loop.until).
    needs: [annotate-original]
    loop:
      max: "{{config.refinement_iterations}}"
      until: promote_checkpoint
    sequence:
      - augment
      - evaluate
      - quality-gate
    next: quality-disposition

  evaluate:
    description: >
      Evaluate & Validate — the REAL NVIDIA Cosmos Evaluator
      (https://github.com/nvidia-cosmos/cosmos-evaluator, Apache-2.0) grades every
      augmented variant with two of its checks:
        * attribute verification — an LLM writes one multiple-choice question per
          sampled appearance attribute and a VLM answers it from a frame of the
          variant, so a variant that ignored its prompt fails. Both calls run on
          Token Factory (zero GPU).
        * hallucination — compares per-frame dynamic masks of the source clip and
          the variant and scores hallucinated motion (CPU pixel work). It only
          contributes to the score for input-conditioned variants, where the two
          clips really are the same scene.
      NPA also reports a source-relative temporal consistency companion diagnostic
      over the full frame and localized regions. Its filtered, two-sided residual
      exposes both added instability and collapsed source motion without dividing
      by source motion. It is advisory by default; deployments may make it a hard
      check only after calibrating the fixed noise floor on representative encoded
      clips. The NVIDIA attribute and hallucination checks remain hard checks.
      A separate source-relative protected-appearance check reports p95 CIELAB
      luminance/chroma drift, localized chroma residual after the scene-wide shift,
      and frame-to-frame chroma-shift instability. It is advisory by default so
      workflows that intentionally recolour materials are not silently blocked;
      deployments that promise stable base colours may set it to required and
      optionally restrict it to normalized protected regions.
    toolRef: workbench.cosmos_evaluator.evaluate
    resources: cpu
    inputs:
      - uri: "{{config.rollouts_uri}}"
        schema: npa.cosmos2.transfer.v1
    outputs:
      - uri: "{{config.scores_uri}}cosmos_evaluator.json"
        schema: npa.cosmos_evaluator.report.v1

  quality-gate:
    description: >
      Real quality gate — read the Cosmos Evaluator score and write a
      promote_checkpoint / loop_back decision. The enclosing `grade` loop reads this
      decision (loop.until: promote_checkpoint): promote breaks the loop and proceeds
      to annotate-augmented; loop_back re-runs the loop body (augment -> evaluate ->
      gate). No explicit transitions here -- the loop drives control flow, and
      transitions on a loop-sequence member are not evaluated at runtime.
    writesDecision: true
    needs: [evaluate]
    resources: cpu
    run:
      shell: >
        python3 -c "from npa.workflows.data_factory_stages import grade_gate;
        grade_gate('{{config.scores_uri}}', '{{config.decision_uri}}', '{{config.grade_threshold}}')"
    outputs:
      - uri: "{{config.decision_uri}}"
        schema: npa.sim2real.threshold_decision.v1

  quality-disposition:
    description: >
      Fail-closed post-loop disposition. A refinement loop may stop after promotion
      or after exhausting its iterations, so re-read the final evaluator report and
      require completed status, the aggregate threshold, and every hard check. Write
      an auditable accepted/rejected artifact before rejecting the workflow.
    needs: [grade]
    resources: cpu
    run:
      shell: >
        python3 -c "from npa.workflows.data_factory_stages import enforce_quality_disposition;
        enforce_quality_disposition('{{config.scores_uri}}',
        '{{config.quality_disposition_uri}}', '{{config.grade_threshold}}')"
    outputs:
      - uri: "{{config.quality_disposition_uri}}"
        schema: npa.data_factory.quality_disposition.v1
    next: annotate-augmented

  annotate-augmented:
    description: >
      Stage 3 - Pseudo-Label Augmented. Re-caption the promoted augmented clips with
      the same hosted VLM so the amplified dataset ships fully labeled.
    needs: [quality-disposition]
    resources: cpu
    run:
      shell: >
        npa workbench token-factory caption
        --input-path "{{config.augmented_frames_uri}}"
        --output-path "{{config.labeled_augmented_uri}}"
        --model "{{config.caption_model}}"
        --max-images "{{config.max_images}}"
        --max-tokens "{{config.max_tokens}}"
        --output json
    outputs:
      - uri: "{{config.labeled_augmented_uri}}captions.json"
        schema: npa.token_factory.captions.v1
    next: cosmos-curate

  cosmos-curate:
    description: >
      Stage 4a - Curation with the REAL NVIDIA Cosmos Curator
      (https://github.com/nvidia-cosmos/cosmos-curate, Apache-2.0). Upstream's own
      stages run over the promoted variants: VideoDownloader ->
      FixedStrideExtractorStage -> ClipTranscodingStage -> MotionVectorDecodeStage +
      MotionFilterStage -> ClipWriterStage. The result is upstream's canonical
      output tree (clips/, metas/v0/, processed_videos/) under curated_clips_uri
      plus a summary at curator_report_uri, which the FiftyOne review stage merges.
      Runs in the npa-cosmos-curate image, which bakes the pinned upstream checkout
      and an ffmpeg carrying libopenh264. Without that image the stage records
      `engine: unavailable` with the reason instead of pretending to curate.
    needs: [annotate-augmented]
    toolRef: workbench.cosmos_curate.curate
    resources: cpu
    inputs:
      - uri: "{{config.augment_uri}}"
        schema: npa.cosmos2.transfer.v1
    outputs:
      - uri: "{{config.curator_report_uri}}"
        schema: npa.cosmos_curate.curation.v1
    next: curate

  curate:
    description: >
      Stage 4b - Curation review. Run REAL FiftyOne Brain
      curation over the augmented + graded scenario variants: build a
      fiftyone.Dataset, compute per-variant uniqueness, detect near-duplicates, and
      record which variants are kept vs dropped, plus clip/frame counts and per-clip
      coverage. The Cosmos Curator summary from the previous stage is merged in, so
      one report carries both the curator's clip catalog and the review decisions.
      This toolRef routes the stage into the npa-fiftyone image and requires the
      report's curation_engine to be "fiftyone-brain". If the real component is
      unavailable the stage fails closed; it never markets counts-only output as
      FiftyOne review.
    needs: [cosmos-curate]
    toolRef: workbench.fiftyone.curate_augmented
    resources: cpu
    inputs:
      - uri: "{{config.lance_uri}}"
        schema: npa.cosmos2.transfer.v1
    outputs:
      - uri: "{{config.curation_report_uri}}"
        schema: npa.fiftyone.curation.v1
    next: visualize

  visualize:
    description: >
      Build a Rerun recording (reports/sim2real.rrd) from the run's input +
      augmented frames and captions so the run renders in the NPA agent's
      embedded Rerun viewer (the agent prefers reports/sim2real.rrd).
      The renderer routes this toolRef to the prebuilt, version-pinned
      npa-rerun-viewer image, so restricted-egress execution performs no runtime
      package installation.
    needs: [curate]
    resources: cpu
    toolRef: workbench.nurec.visualize
    outputs:
      - uri: "{{config.rrd_uri}}"
        schema: npa.sim2real.rerun.v1
    next: finalize

  finalize:
    description: >
      Aggregate the run's stage artifacts into a real final augmented-and-graded
      dataset report.
    needs: [visualize]
    resources: cpu
    run:
      shell: >
        python3 -c "from npa.workflows.data_factory_stages import finalize;
        finalize('{{config.run_root_uri}}', '{{config.finalize_report_uri}}')"
    outputs:
      - uri: "{{config.finalize_report_uri}}"
        schema: npa.sim2real.e2e_report.v1
    terminal: true
